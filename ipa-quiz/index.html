<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10182b"><title>IPA QUEST | どっちの音？</title><style>
:root{color-scheme:dark;--bg:#0a1221;--panel:#17233a;--border:#344563;--text:#f3f7ff;--mute:#adbad2;--mint:#a5f3d0;--blue:#a9c5ff;--red:#ff9ca7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#20395b,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,sans-serif;min-height:100dvh;touch-action:manipulation}main{max-width:560px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:800;color:var(--mint)}h1{font-size:27px;line-height:1.25;margin:5px 0}h2{margin:0;font-size:22px}p{color:var(--mute);margin:8px 0}button{font:inherit;font-size:16px;color:inherit;background:#202e48;border:1px solid var(--border);border-radius:13px;padding:11px 12px;min-height:48px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}button:disabled{cursor:default}button.primary{background:var(--mint);color:#12362e;font-weight:800;width:100%;margin-top:14px}button.selected{border-color:var(--mint);background:#21433f}.panel{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:18px;margin-top:15px}.hidden{display:none!important}.levels,.choices,.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px}.stat{background:#17243a;border:1px solid var(--border);border-radius:12px;padding:8px;text-align:center}.stat small,.label{font-size:12px;color:var(--mute);font-weight:700}.stat b{display:block;font-size:23px}.bar{height:6px;background:var(--border);border-radius:10px;overflow:hidden;margin:12px 0}.bar i{height:100%;display:block;background:var(--mint);width:0;transition:width .2s}.question{text-align:center}.ipa{font-family:system-ui,'Arial Unicode MS',sans-serif;font-size:clamp(60px,17vw,94px);font-weight:750;line-height:1.2;margin:10px 0;color:var(--mint)}.audio-card{min-width:0;background:#101b2e;border:1px solid var(--border);border-radius:16px;padding:11px;text-align:center;display:flex;flex-direction:column;gap:9px}.audio-card .letter{font-size:13px;font-weight:800;letter-spacing:2px;color:var(--mute)}.play{color:var(--blue);font-size:19px;min-height:64px;background:#253957;font-weight:750}.play.playing{border-color:var(--blue);background:#314b72}.pick{min-height:48px;font-weight:750}.audio-card.right{border-color:#6ce0b4;background:#183c33}.audio-card.wrong{border-color:var(--red);background:#422a38}.revealed{font-size:17px;font-weight:700;overflow-wrap:anywhere}.revealed small{display:block;font-size:14px;color:var(--mute)}.feedback{border-top:1px solid var(--border);padding-top:13px;margin-top:16px}.verdict{font-size:22px;font-weight:800;color:var(--mint)}.verdict.bad{color:var(--red)}.note{font-size:12px;color:var(--mute)}.scorebig{font-size:56px;font-weight:850;color:var(--mint);text-align:center}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding:10px 0}.row small{display:block;color:var(--mute)}.tiny{font-size:13px;min-height:40px}.status{font-size:13px;color:var(--red);min-height:1.4em;text-align:center;margin:8px 0 0}#resultText{text-align:center}button, .audio-card{-webkit-tap-highlight-color:transparent}@media(max-width:350px){main{padding-left:10px;padding-right:10px}.panel{padding:12px}.audio-card{padding:8px}}
</style></head><body><main><header><div><div class="eyebrow">IPA QUEST / LISTEN &amp; CHOOSE</div><h1>どっちの発音？</h1></div><button id="home" class="tiny hidden">ホーム</button></header>
<section id="setup" class="panel"><h2>発音記号を耳で覚えよう</h2><p>画面に1つの発音記号が出ます。A・Bの音声を聞いて、その記号の音が入っている方を選んでください。</p><div class="label">難易度</div><div class="levels" id="levels"><button data-level="0" class="selected" aria-pressed="true">初級・基本の音</button><button data-level="1" aria-pressed="false">中級・似た子音</button><button data-level="2" aria-pressed="false">上級・紛らわしい音</button><button data-level="3" aria-pressed="false">全レベル</button></div><button class="primary" id="start">10問チャレンジ開始</button><p id="best" class="note"></p><p class="note">米国英語の発音です。音声は端末の英語読み上げを利用し、記号単体ではなく似た単語の中で音を比較します。回答後に単語と発音のコツが表示されます。</p></section>
<section id="game" class="hidden"><div class="stats"><div class="stat"><small>問題</small><b id="count">1/10</b></div><div class="stat"><small>正解</small><b id="score">0</b></div><div class="stat"><small>連続正解</small><b id="streak">0</b></div></div><div class="bar"><i id="progress"></i></div><div class="panel"><div class="question"><p>この記号の発音はどっち？</p><div class="ipa" id="symbol"></div><p id="position" class="note"></p></div><div class="choices" id="choices"></div><p class="note" id="listenHint" style="text-align:center">A・Bの音声は何度でも再生できます</p><div id="audioStatus" class="status" role="status"></div><div id="feedback" class="feedback hidden" aria-live="polite"><div id="verdict" class="verdict"></div><p id="tip"></p><button id="next" class="primary">次の問題 →</button></div></div></section>
<section id="result" class="panel hidden"><h2>結果発表</h2><div class="scorebig" id="finalScore"></div><p id="resultText"></p><div id="review" class="hidden"><h3>間違えた音</h3><div id="reviewList"></div><button id="retry" class="primary">間違えた問題だけ復習</button></div><button id="again" class="primary">もう一度チャレンジ</button><button id="back" style="width:100%;margin-top:10px">難易度を選ぶ</button></section></main>
<script>
const $=id=>document.getElementById(id);
// Each row: level, position, symbol A, word A, IPA A, symbol B, word B, IPA B.
const pairs=[
[0,'真ん中','æ','cap','kæp','ʌ','cup','kʌp'],
[0,'真ん中','i','sheep','ʃip','ɪ','ship','ʃɪp'],
[0,'真ん中','ɛ','bed','bɛd','æ','bad','bæd'],
[0,'真ん中','ʊ','full','fʊl','u','fool','ful'],
[0,'真ん中','ɪ','sit','sɪt','ɛ','set','sɛt'],
[0,'真ん中','eɪ','late','leɪt','ɛ','let','lɛt'],
[0,'真ん中','aɪ','bite','baɪt','ɪ','bit','bɪt'],
[0,'真ん中','oʊ','coat','koʊt','ɑ','cot','kɑt'],
[0,'母音','aʊ','now','naʊ','oʊ','no','noʊ'],
[0,'最初','p','pat','pæt','b','bat','bæt'],
[0,'最初','t','ten','tɛn','d','den','dɛn'],
[0,'最初','k','coat','koʊt','ɡ','goat','ɡoʊt'],
[1,'最初','θ','thin','θɪn','s','sin','sɪn'],
[1,'最初','θ','three','θɹi','f','free','fɹi'],
[1,'最初','ð','then','ðɛn','d','den','dɛn'],
[1,'最初','l','light','laɪt','ɹ','right','ɹaɪt'],
[1,'最初','v','vest','vɛst','b','best','bɛst'],
[1,'最初','f','fan','fæn','v','van','væn'],
[1,'最初','ʃ','ship','ʃɪp','s','sip','sɪp'],
[1,'最初','tʃ','chip','tʃɪp','ʃ','ship','ʃɪp'],
[1,'最初','dʒ','jeep','dʒip','tʃ','cheap','tʃip'],
[1,'最後','n','sin','sɪn','ŋ','sing','sɪŋ'],
[1,'最初','z','zip','zɪp','s','sip','sɪp'],
[1,'最初','h','heat','hit','f','feet','fit'],
[2,'真ん中','ʌ','cut','kʌt','ɑ','cot','kɑt'],
[2,'母音','ɔɪ','boy','bɔɪ','aɪ','buy','baɪ'],
[2,'真ん中','ɝ','bird','bɝd','ɛ','bed','bɛd'],
[2,'真ん中','ɝ','word','wɝd','ɑ','wad','wɑd'],
[2,'真ん中の摩擦音','ʃ','pressure','ˈpɹɛʃɚ','ʒ','pleasure','ˈplɛʒɚ'],
[2,'最後','s','rice','ɹaɪs','z','rise','ɹaɪz'],
[2,'最後','tʃ','rich','ɹɪtʃ','dʒ','ridge','ɹɪdʒ'],
[2,'最後','f','leaf','lif','v','leave','liv'],
[2,'子音','w','wet','wɛt','v','vet','vɛt'],
[2,'真ん中','ʊ','look','lʊk','ʌ','luck','lʌk'],
[2,'真ん中','eɪ','sail','seɪl','ɛ','sell','sɛl'],
[2,'最初','m','mat','mæt','n','gnat','næt'],
[2,'最後','θ','teeth','tiθ','ð','teethe','tið'],
[2,'真ん中','aʊ','town','taʊn','oʊ','tone','toʊn']
].map(([level,pos,a,aw,ai,b,bw,bi],id)=>({id,level,pos,options:[{sound:a,word:aw,ipa:ai},{sound:b,word:bw,ipa:bi}]}));
const tips={'æ':'口を大きく開け、舌を前寄りに。「ア」と「エ」の中間に近い音。','ʌ':'口を軽く開き、舌を中央に置く。','i':'舌を前の高い位置に上げる「イー」に近い音。','ɪ':'舌を少し下げ、力を抜いたイに近い音。','ɛ':'口をやや開け、エに近い音。','ʊ':'唇を軽く丸め、力を抜いたウに近い音。','u':'唇を丸め、舌を高くするウの音。','eɪ':'エからイへ滑らせる。','aɪ':'アからイへ滑らせる。','oʊ':'オからウへ滑らせる。','ɑ':'口を大きく開け、舌を低く後方寄りに。','aʊ':'アからウへ滑らせる。','ɔɪ':'オからイへ滑らせる。','p':'両唇を閉じてから、声を伴わず空気を出す。','b':'両唇を閉じてから、声を伴って開く。','t':'舌先を歯ぐきに当て、声を伴わず離す。','d':'舌先を歯ぐきに当て、声を伴って離す。','k':'舌の奥を上あごに当て、声を伴わず離す。','ɡ':'舌の奥を上あごに当て、声を伴って離す。','θ':'舌先を歯の間付近に置き、声を出さず息を通す。','ð':'舌先を歯の間付近に置き、声を出しながら息を通す。','s':'舌先付近の狭い隙間から、声なしで息を通す。','z':'s と同じ位置で声を出す。','f':'上の前歯を下唇に軽く当て、息を出す。','v':'上の前歯を下唇に軽く当て、声を出す。','l':'舌先を上の前歯の後ろにつける。','ɹ':'舌先を上あごにつけない英語のRの音。','ʃ':'唇を軽く丸め、シーに近い摩擦音。','ʒ':'ʃ と同じ位置で声を出す。','tʃ':'チに近い無声の破擦音。','dʒ':'ジに近い有声の破擦音。','n':'舌先を歯ぐきにつけ、鼻から声を出す。','ŋ':'舌の奥を上げ、鼻から声を出す。','h':'のどを開き、息を出す。','ɝ':'強勢のあるRの響きを伴う母音。','w':'唇を丸めてから次の母音へ移る。','m':'両唇を閉じて鼻から声を出す。'};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let level=0,questions=[],miss=[],idx=0,score=0,streak=0,locked=false,current=null,playing=null,audioToken=0,reviewing=false;let records={};try{records=JSON.parse(localStorage.getItem('ipaQuestListenBestV2')||'{}')||{}}catch(e){}
function stop(){audioToken++;if('speechSynthesis'in window)speechSynthesis.cancel();if(playing)playing.classList.remove('playing');playing=null}
function speak(word,button){stop();const token=audioToken;const status=$('audioStatus');status.textContent='';if(!('speechSynthesis'in window)){status.textContent='このブラウザーは音声再生に対応していません。';return}try{const utter=new SpeechSynthesisUtterance(word);utter.lang='en-US';utter.rate=.85;const voices=speechSynthesis.getVoices();const voice=voices.find(v=>v.lang==='en-US'&&v.localService)||voices.find(v=>v.lang==='en-US');if(voice)utter.voice=voice;playing=button;button.classList.add('playing');utter.onend=()=>{if(token===audioToken){button.classList.remove('playing');playing=null}};utter.onerror=e=>{if(token===audioToken){button.classList.remove('playing');playing=null;status.textContent='音声を再生できませんでした。英語音声の設定を確認してください。'}};speechSynthesis.speak(utter)}catch(e){status.textContent='音声を再生できませんでした。'}}
function best(){$('best').textContent='自己ベスト：'+(records[level]===undefined?'まだ記録なし':records[level]+' / 10')}best();document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=Number(b.dataset.level);document.querySelectorAll('[data-level]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});best()});
function show(id){stop();['setup','game','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('home').classList.toggle('hidden',id==='setup');window.scrollTo(0,0)}
function start(retry){reviewing=retry;questions=retry?shuffle(miss.map(x=>({pair:x.pair,target:x.target}))):shuffle(pairs.filter(p=>level===3||p.level===level)).slice(0,10).map(pair=>({pair,target:pair.options[Math.floor(Math.random()*2)].sound}));miss=[];idx=score=streak=0;show('game');draw()}
function draw(){stop();locked=false;const q=questions[idx];current={...q,options:shuffle(q.pair.options)};$('count').textContent=(idx+1)+'/'+questions.length;$('score').textContent=score;$('streak').textContent=streak;$('progress').style.width=idx/questions.length*100+'%';$('symbol').textContent='/'+q.target+'/';$('position').textContent='単語の'+q.pair.pos+'の音に注目';$('feedback').classList.add('hidden');$('audioStatus').textContent='';$('listenHint').textContent='A・Bの音声は何度でも再生できます';$('choices').replaceChildren();current.options.forEach((o,i)=>{const letter=i?'B':'A',card=document.createElement('div');card.className='audio-card';const lab=document.createElement('div');lab.className='letter';lab.textContent='音声 '+letter;const play=document.createElement('button');play.className='play';play.textContent='▶ '+letter+'を聞く';play.setAttribute('aria-label','音声'+letter+'を再生');play.onclick=()=>speak(o.word,play);const reveal=document.createElement('div');reveal.className='revealed hidden';const w=document.createElement('span'),ipa=document.createElement('small');w.textContent=o.word;ipa.textContent='/'+o.ipa+'/';reveal.append(w,ipa);const pick=document.createElement('button');pick.className='pick';pick.textContent=letter+'を選ぶ';pick.onclick=()=>choose(i);card.append(lab,play,reveal,pick);$('choices').append(card)});$('next').textContent=idx===questions.length-1?'結果を見る →':'次の問題 →'}
function choose(i){if(locked)return;locked=true;const chosen=current.options[i],correct=chosen.sound===current.target;stop();if(correct){score++;streak++}else{streak=0;miss.push({pair:current.pair,target:current.target,chosen})}$('score').textContent=score;$('streak').textContent=streak;$('progress').style.width=(idx+1)/questions.length*100+'%';[...$('choices').children].forEach((card,j)=>{const o=current.options[j];card.querySelector('.revealed').classList.remove('hidden');const pick=card.querySelector('.pick');pick.disabled=true;if(o.sound===current.target){card.classList.add('right');pick.textContent='✓ 正解'}else if(j===i){card.classList.add('wrong');pick.textContent='× 不正解'}else pick.textContent='もう一方'});$('verdict').className='verdict'+(correct?'':' bad');$('verdict').textContent=correct?'正解！':'残念！ 正解は '+(current.options[0].sound===current.target?'A':'B');$('tip').textContent='/'+current.target+'/ ：'+tips[current.target];$('listenHint').textContent='答え合わせ後も音声を聞き比べられます';$('feedback').classList.remove('hidden')}
function finish(){show('result');$('finalScore').textContent=score+' / '+questions.length;$('resultText').textContent=score===questions.length?'PERFECT! 全問正解！':'正答率 '+Math.round(score/questions.length*100)+'%';if(!reviewing&&questions.length===10){records[level]=Math.max(records[level]||0,score);try{localStorage.setItem('ipaQuestListenBestV2',JSON.stringify(records))}catch(e){}best()}$('review').classList.toggle('hidden',!miss.length);$('reviewList').replaceChildren();miss.forEach(q=>{const o=q.pair.options.find(x=>x.sound===q.target),row=document.createElement('div');row.className='row';const text=document.createElement('div'),b=document.createElement('b'),s=document.createElement('small');b.textContent='/'+q.target+'/　'+o.word;s.textContent='/'+o.ipa+'/　選んだ音 /'+q.chosen.sound+'/';text.append(b,s);const play=document.createElement('button');play.className='tiny';play.textContent='▶ 聞く';play.onclick=()=>speak(o.word,play);row.append(text,play);$('reviewList').append(row)})}
$('start').onclick=$('again').onclick=()=>start(false);$('retry').onclick=()=>start(true);$('home').onclick=$('back').onclick=()=>show('setup');$('next').onclick=()=>{if(!locked)return;idx++;if(idx<questions.length)draw();else finish()};window.addEventListener('pagehide',stop);
</script></body></html>

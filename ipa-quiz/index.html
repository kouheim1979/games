let records={};try{records=JSON.parse(localStorage.getItem('ipaIdentificationV3')||'{}')||{}}catch(e){}
const course=$('course');[['all','全種類（ランダム）'],['sample','例題5問：where / ear / chair / hear / clear'],...groups.map((g,i)=>[String(i),'/'+g[0]+'/ vs /'+g[1]+'/ — '+g[2]])].forEach(([v,t])=>{let o=document.createElement('option');o.value=v;o.textContent=t;course.append(o)});
function selectButtons(attr,b){document.querySelectorAll('['+attr+']').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))})}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;selectButtons('data-mode',b);$('quizSetup').classList.toggle('hidden',mode!=='quiz');$('studySetup').classList.toggle('hidden',mode!=='study')});
document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{format=b.dataset.format;selectButtons('data-format',b);best()});
document.querySelectorAll('[data-length]').forEach(b=>b.onclick=()=>{length=+b.dataset.length;selectButtons('data-length',b);best()});course.onchange=()=>{syncLength();best()};function syncLength(){const sample=course.value==='sample',all=course.value==='all';document.querySelectorAll('[data-length]').forEach(b=>{b.disabled=sample?b.dataset.length!=='5':!all&&b.dataset.length==='20'});if(sample||(!all&&length===20)){length=sample?5:10;selectButtons('data-length',document.querySelector('[data-length="'+length+'"]'))}}syncLength();
function best(){const r=records[course.value+'-'+format+'-'+length];$('best').textContent=r===undefined?'自己ベスト：まだ記録なし':'自己ベスト：'+r+'%'}best();
function stop(){audioToken++;if('speechSynthesis'in window)speechSynthesis.cancel()}
function speak(word,statusId){stop();const token=audioToken,status=$(statusId);status.textContent='';if(!('speechSynthesis'in window)){status.textContent='音声再生に対応していません。';return}try{const u=new SpeechSynthesisUtterance(word);u.lang='en-GB';u.rate=.82;const vs=speechSynthesis.getVoices(),v=vs.find(v=>v.lang.toLowerCase()==='en-gb'&&v.localService)||vs.find(v=>v.lang.toLowerCase()==='en-gb');if(v)u.voice=v;u.onerror=()=>{if(token===audioToken)status.textContent='再生できません。端末の英語（英国）音声設定を確認してください。'};speechSynthesis.speak(u)}catch(e){status.textContent='音声再生に失敗しました。'}}
function show(id){stop();['setup','game','result','study'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('home').classList.toggle('hidden',id==='setup');window.scrollTo(0,0)}
function makeWord(q){const span=document.createElement('span'),u=document.createElement('u');u.textContent=q.focus;span.append(q.pre,u,q.post);return span}
function start(retry){retrying=retry;activeCourse=retry?activeCourse:course.value;const sampleWords=['where','ear','chair','hear','clear'];const pool=activeCourse==='sample'?sampleWords.map(w=>questions.find(q=>q.gi===0&&q.word===w)):questions.filter(q=>activeCourse==='all'||String(q.gi)===activeCourse);round=retry?shuffle(miss.map(m=>m.q)):activeCourse==='sample'?pool:shuffle(pool.filter((q,i,a)=>a.findIndex(x=>x.gi===q.gi&&x.word===q.word&&x.target===q.target)===i)).slice(0,length);miss=[];idx=score=streak=0;show('game');draw()}
function draw(){stop();locked=false;current=round[idx];$('count').textContent=(idx+1)+'/'+round.length;$('score').textContent=score;$('streak').textContent=streak;$('progress').style.width=idx/round.length*100+'%';$('pairLabel').textContent=groups[current.gi][2].split('：')[0];$('word').replaceChildren(format==='word'?makeWord(current):document.createTextNode('♪'));$('instruction').textContent=format==='word'?'下線部分の発音記号はどっち？':'この単語に含まれる音はどっち？';$('feedback').classList.add('hidden');$('audioStatus').textContent='';$('choices').replaceChildren();current.choices.forEach(s=>{let b=document.createElement('button');b.className='ipaChoice';b.textContent='/'+s+'/';b.dataset.sound=s;b.onclick=()=>choose(s);$('choices').append(b)});$('next').textContent=idx===round.length-1?'結果を見る':'次の問題 →'}
$('listen').onclick=()=>speak(current.word,'audioStatus');
function choose(s){if(locked)return;locked=true;const ok=s===current.target;if(ok){score++;streak++}else{streak=0;miss.push({q:current,chosen:s})}$('score').textContent=score;$('streak').textContent=streak;$('progress').style.width=(idx+1)/round.length*100+'%';[...$('choices').children].forEach(b=>{b.disabled=true;b.classList.toggle('right',b.dataset.sound===current.target);b.classList.toggle('wrong',!ok&&b.dataset.sound===s)});$('word').replaceChildren(makeWord(current));$('verdict').textContent=ok?'✓ 正解！':'× 正解は /'+current.target+'/';$('verdict').className='verdict'+(ok?'':' bad');$('answer').textContent=current.word+' → /'+current.target+'/';$('miniGuide').replaceChildren(guide(current.target,false));$('feedback').classList.remove('hidden')}
$('next').onclick=()=>{if(!locked)return;idx++;if(idx<round.length)draw();else finish()};
function finish(){show('result');const pct=Math.round(score/round.length*100);$('finalScore').textContent=score+' / '+round.length;$('resultText').textContent=pct===100?'PERFECT! 全問正解！':'正答率 '+pct+'%';if(!retrying){const key=activeCourse+'-'+format+'-'+length;records[key]=Math.max(records[key]||0,pct);try{localStorage.setItem('ipaIdentificationV3',JSON.stringify(records))}catch(e){}best()}$('review').classList.toggle('hidden',!miss.length);$('reviewList').replaceChildren();miss.forEach(({q,chosen})=>{const row=document.createElement('div');row.className='row';const left=document.createElement('div');left.append(makeWord(q));const small=document.createElement('small');small.textContent='正解 /'+q.target+'/ ・回答 /'+chosen+'/';left.append(small);const b=document.createElement('button');b.className='tiny';b.textContent='▶ 聞く';const status=document.createElement('div');status.id='review-audio-'+$('reviewList').children.length;status.className='note';left.append(status);b.onclick=()=>speak(q.word,status.id);row.append(left,b);$('reviewList').append(row)})}
function mouth(shape){const dimensions={spread:[49,13],neutral:[34,17],open:[41,32],round:[22,22],roundopen:[28,30],closed:[36,3],teeth:[36,13],lipteeth:[36,11]},d=dimensions[shape]||dimensions.neutral;return '<svg viewBox="0 0 180 130" aria-label="唇の形の模式図"><ellipse cx="90" cy="66" rx="67" ry="57" fill="#eebba0"/><path d="M86 28 Q79 48 85 51 Q90 54 96 51" fill="none" stroke="#bd806c" stroke-width="2"/><ellipse cx="90" cy="80" rx="'+(d[0]+7)+'" ry="'+(d[1]+6)+'" fill="#b85b6b"/><ellipse cx="90" cy="80" rx="'+d[0]+'" ry="'+d[1]+'" fill="#421e2b"/>'+(shape==='closed'?'':'<path d="M'+(90-d[0]*.72)+' '+(80-d[1]*.55)+' Q90 '+(80-d[1]*1.1)+' '+(90+d[0]*.72)+' '+(80-d[1]*.55)+' L'+(90+d[0]*.65)+' '+(80-d[1]*.12)+' Q90 '+(80-d[1]*.33)+' '+(90-d[0]*.65)+' '+(80-d[1]*.12)+'Z" fill="#fff4e9"/>')+(shape==='teeth'?'<ellipse cx="90" cy="80" rx="17" ry="6" fill="#f18a94"/>':'')+'</svg>'}
function tongue(i){const x={front:51,center:94,back:137},y={high:33,mid:67,low:101};if(!i[4])return '';let a=x[i[4]],b=y[i[5]],c=x[i[6]],d=y[i[7]];return '<svg viewBox="0 0 180 130" aria-label="母音の舌位置の模式図"><path d="M30 20 H154 L154 110 H91 Z" stroke="#94a9c5" stroke-width="1.5" fill="#203651"/><path d="M30 49H154M59 77H154M92 20V110" stroke="#526582" stroke-dasharray="4 4" fill="none"/><text x="30" y="14" fill="#c6d5ed" font-size="10">前</text><text x="145" y="14" fill="#c6d5ed" font-size="10">後</text><text x="4" y="34" fill="#c6d5ed" font-size="10">高</text><text x="4" y="106" fill="#c6d5ed" font-size="10">低</text>'+(c!==undefined?'<defs><marker id="arrowTip" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#a5f3d0"/></marker></defs><line x1="'+a+'" y1="'+b+'" x2="'+c+'" y2="'+d+'" stroke="#a5f3d0" stroke-width="3" marker-end="url(#arrowTip)"/><circle cx="'+c+'" cy="'+d+'" r="4" fill="#a5f3d0"/>':'')+'<circle cx="'+a+'" cy="'+b+'" r="6" fill="#a5f3d0"/></svg>'}
function guide(s,full){const i=info[s],wrap=document.createElement('div');wrap.className='guide';const art=document.createElement('div');art.className='art';art.innerHTML='<div>'+mouth(i[3])+'<small>唇の形（模式図）</small></div>'+(i[4]?'<div>'+tongue(i)+'<small>舌の位置・動き（模式図）</small></div>':'');wrap.append(art);const p=document.createElement('p');p.textContent='唇：'+i[1];const t=document.createElement('p');t.textContent='舌・息：'+i[2];wrap.append(p,t);if(full){const b=document.createElement('button');b.className='play listen';b.textContent='▶ '+i[0]+' を聞く';b.onclick=()=>speak(i[0],'studyAudioStatus');wrap.append(b);if(s==='ʊə'){const n=document.createElement('p');n.className='note';n.textContent='伝統的な英国英語表記。tour などは現代英語で /ɔː/ などになる話者もいるため、採点対象外です。';wrap.append(n)}else if(s==='ɪə'||s==='eə'){const n=document.createElement('p');n.className='note';n.textContent='伝統的な表記です。現代の英国英語では一つの長母音に近い発音もあります。';wrap.append(n)}}return wrap}
function studyAt(n){studyi=(n+symbols.length)%symbols.length;const s=symbols[studyi];show('study');$('studyCount').textContent=(studyi+1)+' / '+symbols.length;$('studyAudioStatus').textContent='';const title=document.createElement('div');title.className='ipa center';title.textContent='/'+s+'/';$('studyContent').replaceChildren(title,guide(s,true));$('practiceSymbol').disabled=!groups.some(g=>g.slice(0,2).includes(s))}
symbols.forEach((s,i)=>{const b=document.createElement('button');b.textContent='/'+s+'/';b.onclick=()=>studyAt(i);$('symbolGrid').append(b)});
$('prevSymbol').onclick=()=>studyAt(studyi-1);$('nextSymbol').onclick=()=>studyAt(studyi+1);$('studyBack').onclick=()=>show('setup');$('practiceSymbol').onclick=()=>{const g=groups.findIndex(g=>g.slice(0,2).includes(symbols[studyi]));if(g<0)return;course.value=String(g);syncLength();document.querySelector('[data-mode="quiz"]').click();start(false)};$('start').onclick=$('again').onclick=()=>start(false);$('retry').onclick=()=>start(true);$('home').onclick=$('back').onclick=()=>show('setup');window.addEventListener('pagehide',stop);
</script></body></html>

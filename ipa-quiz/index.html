<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10182b"><title>IPA QUEST — 発音記号当てゲーム</title><style>
:root{color-scheme:dark;--bg:#0c1322;--panel:#151f33;--line:#2b3852;--text:#f1f5ff;--muted:#a5b2cc;--accent:#a5f3d0;--blue:#9ab9ff;--bad:#ff9ca7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#203156 0,transparent 45%),var(--bg);font-family:system-ui,-apple-system,'Noto Sans',sans-serif;color:var(--text);min-height:100dvh;touch-action:manipulation}button{font:inherit;font-size:16px;touch-action:manipulation;cursor:pointer;color:inherit;border:1px solid var(--line);border-radius:14px;background:#1a2740;min-height:48px;padding:10px 14px}button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}button:disabled{cursor:default}button:hover:not(:disabled){border-color:var(--blue)}.wrap{max-width:680px;margin:auto;padding:22px 16px 30px;padding-top:max(22px,env(safe-area-inset-top))}.brand{font-size:12px;font-weight:800;letter-spacing:.23em;color:var(--accent)}h1{font-size:clamp(26px,6vw,38px);line-height:1.2;margin:8px 0}h2{margin:0 0 12px;font-size:22px}p{line-height:1.55;margin:8px 0;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:19px;box-shadow:0 15px 40px #0002}.label{font-size:13px;font-weight:700;color:var(--muted);margin:17px 0 9px}.modes{display:grid;gap:9px}.mode{text-align:left;display:flex;align-items:center;gap:12px}.mode span{font-size:21px;width:50px;text-align:center;color:var(--blue)}.mode b{display:block;font-size:16px}.mode small{display:block;color:var(--muted);margin-top:3px}.sel{border-color:var(--accent);background:#193a3c}.levels,.actions{display:flex;gap:8px;flex-wrap:wrap}.levels button,.actions button{flex:1}.primary{background:var(--accent);color:#112b27;border-color:var(--accent);font-weight:800;width:100%;margin-top:17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px 8px;border:1px solid var(--line);border-radius:14px;background:#142038;text-align:center}.stat b{display:block;font-size:25px;font-variant-numeric:tabular-nums}.stat small{font-size:11px;color:var(--muted)}.bar{height:6px;border-radius:10px;background:var(--line);overflow:hidden;margin-top:14px}.bar i{height:100%;display:block;background:var(--accent);transition:width .2s}.question{text-align:center;padding:18px 0}.question .prompt{font-family:system-ui,'Arial Unicode MS',sans-serif;font-size:clamp(30px,8vw,54px);font-weight:700;line-height:1.25;overflow-wrap:anywhere;margin:13px 0;color:var(--text)}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{min-height:66px;font-size:clamp(18px,4.3vw,24px);overflow-wrap:anywhere;padding:12px 7px;font-weight:650}.option.correct{background:#184738;border-color:#67dcb1;color:#c5ffe6}.option.wrong{background:#502b38;border-color:#ff9ca7;color:#ffd3db}.option.dim{opacity:.55}.feedback{margin-top:16px;padding:15px;background:#111a2a;border:1px solid var(--line);border-radius:14px}.feedback strong{font-size:19px}.good{color:var(--accent)}.bad{color:var(--bad)}.wordline{font-size:23px;font-weight:700;margin:7px 0}.wordline small{font-size:17px;color:var(--blue)}.hidden{display:none!important}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.tiny{min-height:40px;font-size:14px}.muted{color:var(--muted);font-size:12px}.resultnum{font-size:58px;font-weight:800;color:var(--accent);text-align:center;line-height:1.3}.reviewrow{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.reviewrow b{display:block}.reviewrow small{color:var(--muted)}.note{font-size:12px;text-align:center;margin-top:16px}button:active:not(:disabled){transform:translateY(1px)}@media(max-height:480px) and (orientation:landscape){.wrap{padding:10px 16px}.panel{margin-top:10px;padding:12px}.question{padding:4px 0}.question .prompt{font-size:31px;margin:4px 0}.options{gap:6px}.option{min-height:46px}.stat{padding:5px}.stat b{font-size:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="wrap"><header class="toprow"><div><div class="brand">IPA QUEST</div><h1>発音記号当てゲーム</h1></div><button id="home" class="tiny hidden">ホーム</button></header>
<section id="setup" class="panel"><p>英語の「音を読む力」を鍛える10問チャレンジ。</p><div class="label">ゲームモード</div><div class="modes" id="modes"><button class="mode sel" data-mode="ipa"><span>/æ/</span><div><b>発音記号 → 英単語</b><small>記号を読んで、正しい単語を選ぶ</small></div></button><button class="mode" data-mode="word"><span>ABC</span><div><b>英単語 → 発音記号</b><small>単語に合う発音記号を選ぶ</small></div></button><button class="mode" data-mode="sound"><span>θ</span><div><b>音素ハンター</b><small>指定された音を含む単語を探す</small></div></button></div><div class="label">難易度</div><div id="levels" class="levels"><button class="sel" data-level="0">初級</button><button data-level="1">中級</button><button data-level="2">上級</button><button data-level="3">全レベル</button></div><button id="start" class="primary">ゲームスタート</button><p id="best" class="note"></p><p class="note">米国英語の代表的なIPA表記を使用。辞書・地域によって表記や発音が異なることがあります。</p></section>
<section id="game" class="hidden"><div class="stats"><div class="stat"><small>QUESTION</small><b id="count">1/10</b></div><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>STREAK</small><b id="streak">0</b></div></div><div class="bar"><i id="progress"></i></div><div class="panel"><div class="question"><div id="instruction" class="muted"></div><div id="prompt" class="prompt"></div></div><div id="options" class="options"></div><div id="feedback" class="feedback hidden" aria-live="polite"><strong id="verdict"></strong><div id="answer" class="wordline"></div><p id="explain"></p><div class="actions"><button id="listen">🔊 発音を聞く</button><button id="next">次の問題 →</button></div><p id="audioHint" class="muted hidden"></p></div></div></section>
<section id="result" class="panel hidden"><h2>チャレンジ終了！</h2><div class="resultnum" id="finalScore"></div><p id="resultText" style="text-align:center"></p><div class="bar"><i id="finalBar"></i></div><div id="review" class="hidden"><div class="label">間違えた問題</div><div id="reviewlist"></div><button id="retry" class="primary">間違えた問題だけ復習</button></div><button id="again" class="primary">もう一度チャレンジ</button><button id="back" style="width:100%;margin-top:10px">モード選択へ</button></section></main>
<script>
const raw=[
['cat','kæt','猫',0,'æ'],['cut','kʌt','切る',0,'ʌ'],['cot','kɑt','簡易ベッド',0,'ɑ'],['kit','kɪt','道具一式',0,'ɪ'],['cap','kæp','帽子',0,'æ'],['cup','kʌp','カップ',0,'ʌ'],['bed','bɛd','ベッド',0,'ɛ'],['bad','bæd','悪い',0,'æ'],['bid','bɪd','入札する',0,'ɪ'],['ship','ʃɪp','船',0,'ʃ'],['sheep','ʃip','羊',0,'i'],['shop','ʃɑp','店',0,'ɑ'],['sit','sɪt','座る',0,'ɪ'],['seat','sit','座席',0,'i'],['set','sɛt','置く・セット',0,'ɛ'],['hot','hɑt','熱い',0,'ɑ'],['hat','hæt','帽子',0,'æ'],['hut','hʌt','小屋',0,'ʌ'],['book','bʊk','本',0,'ʊ'],['boot','but','ブーツ',0,'u'],['boat','boʊt','ボート',0,'oʊ'],['bat','bæt','コウモリ・バット',0,'æ'],['bite','baɪt','かむ',0,'aɪ'],['bait','beɪt','餌',0,'eɪ'],
['think','θɪŋk','考える',1,'θ'],['sink','sɪŋk','沈む',1,'s'],['thing','θɪŋ','物・こと',1,'ŋ'],['thin','θɪn','薄い',1,'θ'],['then','ðɛn','その時',1,'ð'],['den','dɛn','巣穴',1,'d'],['three','θri','3',1,'θ'],['tree','tri','木',1,'r'],['free','fri','自由な',1,'f'],['fly','flaɪ','飛ぶ',1,'aɪ'],['fry','fraɪ','揚げる',1,'r'],['light','laɪt','光・軽い',1,'l'],['right','raɪt','右・正しい',1,'r'],['rice','raɪs','米',1,'s'],['lice','laɪs','シラミ（複数）',1,'l'],['vest','vɛst','ベスト',1,'v'],['best','bɛst','最高の',1,'b'],['west','wɛst','西',1,'w'],['cheap','tʃip','安い',1,'tʃ'],['jeep','dʒip','ジープ',1,'dʒ'],['vision','ˈvɪʒən','視覚・展望',1,'ʒ'],['fish','fɪʃ','魚',1,'ʃ'],['sing','sɪŋ','歌う',1,'ŋ'],['sun','sʌn','太陽',1,'ʌ'],['full','fʊl','いっぱいの',1,'ʊ'],['fool','ful','愚か者',1,'u'],['feel','fil','感じる',1,'i'],['fill','fɪl','満たす',1,'ɪ'],
['about','əˈbaʊt','〜について',2,'ə'],['above','əˈbʌv','〜の上に',2,'ə'],['allow','əˈlaʊ','許す',2,'aʊ'],['around','əˈraʊnd','周りに',2,'aʊ'],['enough','ɪˈnʌf','十分な',2,'ʌ'],['though','ðoʊ','〜だけれども',2,'ð'],['through','θru','〜を通って',2,'θ'],['tough','tʌf','頑丈な・厳しい',2,'ʌ'],['thought','θɔt','考え・thinkの過去形',2,'ɔ'],['daughter','ˈdɔtɚ','娘',2,'ɚ'],['water','ˈwɔtɚ','水',2,'ɚ'],['world','wɝld','世界',2,'ɝ'],['work','wɝk','仕事・働く',2,'ɝ'],['word','wɝd','単語',2,'ɝ'],['bird','bɝd','鳥',2,'ɝ'],['early','ˈɝli','早い',2,'ɝ'],['culture','ˈkʌltʃɚ','文化',2,'tʃ'],['measure','ˈmɛʒɚ','測る・対策',2,'ʒ'],['pleasure','ˈplɛʒɚ','喜び',2,'ʒ'],['judge','dʒʌdʒ','判断する・裁判官',2,'dʒ'],['choice','tʃɔɪs','選択',2,'ɔɪ'],['voice','vɔɪs','声',2,'ɔɪ'],['ocean','ˈoʊʃən','海洋',2,'oʊ'],['machine','məˈʃin','機械',2,'ʃ'],['question','ˈkwɛstʃən','質問',2,'tʃ'],['beautiful','ˈbjutəfəl','美しい',2,'ə'],['photograph','ˈfoʊtəɡræf','写真',2,'æ'],['photography','fəˈtɑɡrəfi','写真撮影',2,'ɑ'],['important','ɪmˈpɔrtənt','重要な',2,'ə'],['comfortable','ˈkʌmfɚtəbəl','快適な',2,'ɚ'],['pronunciation','prəˌnʌnsiˈeɪʃən','発音',2,'eɪ']];
const words=raw.map(([word,ipa,meaning,level,focus],id)=>({word,ipa,meaning,level,focus,id}));
const tips={'æ':'口を大きく開け、舌を前方に置く母音。','ʌ':'口を軽く開き、舌を中央付近に置く母音。','ɑ':'舌を低くし、口を大きく開く母音。','ɪ':'舌をやや下げ、力を抜いた短めの母音。','i':'舌を高く前に置く、はっきりしたイーの音。','ɛ':'口をやや開き、舌を前方に置くエに近い音。','ʊ':'唇を軽く丸め、力を抜いたウに近い音。','u':'唇を丸め、舌を高くするウの音。','oʊ':'オからウへ滑る二重母音。','aɪ':'アからイへ滑る二重母音。','eɪ':'エからイへ滑る二重母音。','aʊ':'アからウへ滑る二重母音。','ɔɪ':'オからイへ滑る二重母音。','θ':'舌先を上下の歯の間付近に置き、声を出さず息を通す。','ð':'舌先を歯の間付近に置き、声を出しながら息を通す。','ʃ':'唇を軽く丸めて、シーに近い摩擦音。','ʒ':'/ʃ/ と同じ位置で声を出す摩擦音。','ŋ':'舌の奥を上げ、鼻から声を出す。','r':'舌先を上あごにつけずに出す英語のRの音。','l':'舌先を上の前歯のすぐ後ろにつける。','v':'上の前歯を下唇に軽く当て、声を出す。','f':'上の前歯を下唇に軽く当て、息を出す。','b':'両唇を閉じてから声を伴って開く。','d':'舌先を上の歯ぐきにつけ、声を伴って離す。','s':'舌先付近で狭い隙間を作り、声を出さず息を通す。','w':'唇を丸めてから次の母音へ移る。','tʃ':'チに近い、無声の破擦音。','dʒ':'ジに近い、有声の破擦音。','ə':'力を抜いたあいまいな弱い母音（シュワ）。','ɝ':'強勢のある、Rの響きを伴う母音。','ɚ':'強勢のない、Rの響きを伴う母音。','ɔ':'唇を丸め、口をやや開く母音。米国では /ɑ/ と区別しない話者も多い。'};
const $=id=>document.getElementById(id);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const tokenize=s=>s.match(/aɪ|aʊ|eɪ|oʊ|ɔɪ|tʃ|dʒ|[^ˈˌ]/gu)||[];const contains=(w,s)=>tokenize(w.ipa).includes(s);function distance(a,b){a=tokenize(a);b=tokenize(b);const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]));return d[a.length][b.length]}
let mode='ipa',level=0,questions=[],idx=0,score=0,streak=0,miss=[],locked=false,current=null;let record={};try{record=JSON.parse(localStorage.getItem('ipaQuestBest')||'{}')||{}}catch(e){}const levelNames=['初級','中級','上級','全レベル'];function renderBest(){let best=record[mode+'-'+level];$('best').textContent=best===undefined?'自己ベスト：まだ記録なし':'自己ベスト：'+best+' / 10'}renderBest();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>{x.classList.toggle('sel',x===b);x.setAttribute('aria-pressed',x===b)});renderBest()});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=Number(b.dataset.level);document.querySelectorAll('[data-level]').forEach(x=>{x.classList.toggle('sel',x===b);x.setAttribute('aria-pressed',x===b)});renderBest()});document.querySelectorAll('[data-mode],[data-level]').forEach(b=>b.setAttribute('aria-pressed',b.classList.contains('sel')));
function show(which){['setup','game','result'].forEach(id=>$(id).classList.toggle('hidden',id!==which));$('home').classList.toggle('hidden',which==='setup');window.scrollTo(0,0)}function pool(){return words.filter(w=>level===3||w.level===level)}function start(retry){questions=retry?shuffle(miss.map(x=>x.w)):shuffle(pool()).slice(0,10);idx=score=streak=0;miss=[];show('game');draw()}
function draw(){locked=false;let w=questions[idx];let candidates=pool().filter(x=>x.id!==w.id&&x.ipa!==w.ipa);if(mode==='sound')candidates=candidates.filter(x=>!contains(x,w.focus));let distract=shuffle(candidates).sort((a,b)=>distance(w.ipa,a.ipa)-distance(w.ipa,b.ipa)).slice(0,7);let opts=shuffle([w,...shuffle(distract).slice(0,3)]);current={w,opts};$('count').textContent=(idx+1)+'/'+questions.length;$('score').textContent=score;$('streak').textContent=streak;$('progress').style.width=(idx/questions.length*100)+'%';$('instruction').textContent=mode==='ipa'?'この発音記号はどの英単語？':mode==='word'?'この英単語の発音記号はどれ？':'この音を含む単語はどれ？';$('prompt').textContent=mode==='ipa'?'/'+w.ipa+'/':mode==='word'?w.word:'/'+w.focus+'/';$('feedback').classList.add('hidden');$('audioHint').classList.add('hidden');$('options').replaceChildren();opts.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=mode==='word'?'/'+o.ipa+'/':o.word;b.onclick=()=>choose(o);$('options').append(b)});$('next').textContent=idx===questions.length-1?'結果を見る →':'次の問題 →'}
function choose(o){if(locked)return;locked=true;let w=current.w,correct=o.id===w.id;if(correct){score++;streak++}else{streak=0;miss.push({w,chosen:o})}$('score').textContent=score;$('streak').textContent=streak;$('progress').style.width=((idx+1)/questions.length*100)+'%';[...$('options').children].forEach((b,i)=>{let opt=current.opts[i];b.disabled=true;b.classList.add(opt.id===w.id?'correct':opt.id===o.id?'wrong':'dim')});let v=$('verdict');v.textContent=correct?'✓ 正解！':'× 不正解';v.className=correct?'good':'bad';$('answer').replaceChildren(document.createTextNode(w.word+' '));let s=document.createElement('small');s.textContent='/'+w.ipa+'/';$('answer').append(s);$('explain').textContent=w.meaning+'。 /'+w.focus+'/：'+(tips[w.focus]||'音の違いを確認しましょう。');$('feedback').classList.remove('hidden')}
function speak(w){if(!('speechSynthesis'in window)){return false}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w.word);u.lang='en-US';u.rate=.82;const vs=speechSynthesis.getVoices();let voice=vs.find(v=>v.lang==='en-US'&&v.localService)||vs.find(v=>v.lang==='en-US');if(voice)u.voice=voice;u.onerror=()=>{$('audioHint').textContent='音声を再生できません。端末の英語読み上げ設定をご確認ください。';$('audioHint').classList.remove('hidden')};speechSynthesis.speak(u);return true}catch(e){return false}}
$('listen').onclick=()=>{if(!speak(current.w)){$('audioHint').textContent='このブラウザは読み上げに対応していません。';$('audioHint').classList.remove('hidden')}};$('next').onclick=()=>{if(!locked)return;idx++;if(idx<questions.length)draw();else finish()};function finish(){show('result');let pct=Math.round(score/questions.length*100);$('finalScore').textContent=score+' / '+questions.length;$('finalBar').style.width=pct+'%';$('resultText').textContent=(pct===100?'PERFECT! 全問正解！':pct>=80?'GREAT! よくできました。':pct>=50?'GOOD! 復習してさらにレベルアップ。':'もう一度、音の違いに挑戦！')+'（'+levelNames[level]+'・正答率 '+pct+'%）';if(questions.length===10){let key=mode+'-'+level;record[key]=Math.max(record[key]||0,score);try{localStorage.setItem('ipaQuestBest',JSON.stringify(record))}catch(e){}renderBest()}$('review').classList.toggle('hidden',miss.length===0);$('reviewlist').replaceChildren();miss.forEach(({w,chosen})=>{let row=document.createElement('div');row.className='reviewrow';let left=document.createElement('div'),b=document.createElement('b'),s=document.createElement('small');b.textContent=w.word+' /'+w.ipa+'/';s.textContent=w.meaning+' · 選択：'+(mode==='word'?'/'+chosen.ipa+'/':chosen.word);left.append(b,s);let audio=document.createElement('button');audio.className='tiny';audio.textContent='🔊';audio.setAttribute('aria-label',w.word+' の発音');audio.onclick=()=>{if(!speak(w))audio.textContent='再生不可'};row.append(left,audio);$('reviewlist').append(row)})}$('start').onclick=()=>start(false);$('again').onclick=()=>start(false);$('retry').onclick=()=>start(true);$('back').onclick=$('home').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();show('setup')};
</script></body></html>

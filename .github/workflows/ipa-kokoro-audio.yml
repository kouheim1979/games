name: Generate IPA Kokoro audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ipa-quiz/audio-words.json'
      - 'ipa-quiz/generate_audio.py'
      - '.github/workflows/ipa-kokoro-audio.yml'
permissions:
  contents: write
concurrency:
  group: ipa-kokoro-audio
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'kokoro==0.9.4' soundfile
      - name: Generate contextual natural-speed WAV clips and audit safe boundaries
        run: python ipa-quiz/generate_audio.py
      - name: Commit generated audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ipa-quiz/audio-natural ipa-quiz/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Publish natural-speed contextual pronunciation audio and audit"
          git pull --rebase origin main
          git push origin HEAD:main

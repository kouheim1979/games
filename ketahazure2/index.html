function drawBuildTray() {

const HELP1 = ['釘は自分で置く。盤面にふれると指の少し上に釘が出るので、場所を決めて指をはなす。',
  '玉は釘やちょうちんに当たるたびに値がふえ、下の桝に入ると得点になる。白い線は玉の通り道の予想。',
  'ノルマをこえると、札を1枚と釘を2本もらえる。「うごかす」で置きなおしも自由。同じものは重ねてLvを上げられる。',

function render() {

// ───────── 入力 ─────────
function evPos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function regAt(x, y) { for (let i = UI.regs.length - 1; i >= 0; i--) if (inside(x, y, UI.regs[i])) return UI.regs[i]; return null; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); auInit(); auResume();
  const [x, y] = evPos(e); UI.px = x; UI.py = y; UI.pdown = true;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 古いブラウザー */ }
  const r = regAt(x, y); UI.down = r; if (r || G.paused || G.help) return;
  if (G.phase === 'play') { G.aim.on = true; G.aim.x = aimSnap(BX(x)); }
  else if (G.phase === 'build') buildDown(x, y, e.pointerType !== 'mouse');
  else if (G.phase === 'clear' && G.clearT > 0.7) afterClear();
});
cv.addEventListener('pointermove', e => {
  const [x, y] = evPos(e); UI.px = x; UI.py = y;
  if (G.paused || G.help || UI.down) return;

});
function pointerEnd(e, cancel) {
  auInit(); auResume();                 // 指をはなした時点で音を出せるようになる端末がある
  const [x, y] = evPos(e), r = UI.down; UI.down = null; UI.pdown = false; UI.px = x; UI.py = y;
  if (r) { if (!cancel && inside(x, y, r)) { S.ui(); r.fn(); } return; }
  if (G.paused || G.help) return;

  else if (G.phase === 'build' && G.drag) { if (!cancel) dragUpdate(); buildUp(cancel); }
}
cv.addEventListener('pointerup', e => pointerEnd(e, false));
cv.addEventListener('pointercancel', e => pointerEnd(e, true));
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const k = e.key, go = k === ' ' || k === 'Enter';

// ───────── 起動 ─────────
function resize() {
  const vw = Math.max(240, window.innerWidth || 360), vh = Math.max(320, window.innerHeight || 640);

  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  const ex = H - 960; L.hud = Math.round(ex * 0.3); L.boardTop = L.hud + 156; L.trayY = L.boardTop + AVH + 2; L.trayH = H - L.trayY;
  camUpdate(); SS = clamp(scale * dpr * CAM.z, 1, 4); SPR = {}; BG = null;
}
let lastTs = 0, slow = 0, dprCap = 2.5;
function frame(ts) {
  requestAnimationFrame(frame);

  updateFx(rdt);

}
// 動作確認と調整のための窓口（ゲームの進行には使わない）
const KETA = window.KETA2 = { G, BAL, SAVE, B, L, PT, CARDS, UI, CAM, QT, BOARDS, freeze: false,

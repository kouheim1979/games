り前。"],"g6":["1956年：日ソ国交回復、国連加盟。","1964年：東京五輪と新幹線開業。高度成長の象徴。","1972年：沖縄返還と日中国交正常化。","1989年：ベルリンの壁崩壊。冷戦終結の象徴。"],"g7":["急速な工業化で環境被害が深刻化し、公害対策・環境行政が強化された。","江戸時代の対外政策。戦後の公害対策とは無関係。","敗戦後の民主化政策。公害対策強化の原因ではない。","戦時・戦後の物資不足への対応。公害対策とは異なる。"],"g8":["1872年：明治の近代化の一環として初の鉄道開業。","1950〜1960年代：所得増加と大量生産でテレビが普及。","1990年代以降：情報通信技術の発展で携帯電話が普及。"]};

function render(){if(pos>=queue.length){finish();return}current=queue[pos];locked=false;selected=[];chosen=null;$("detail").hidden=true;$("detail").replaceChildren();$("next").hidden=true;$("verdict").textContent="";$("explain").textContent="";$("source").textContent="";$("timeline").hidden=true;$("bosslist").hidden=false;$("bosslist").innerHTML="";$("incoming").className="incoming";$("incoming").textContent=current.prompt.replace(/\\n/g,"\n");$("prompt").textContent=(retrySet.has(current.id)&&queue.indexOf(current)<pos?"リベンジ！ / ":"")+(current.priority===1?"重要":"実戦")+" / "+({order:"並べ替え",pair:"正誤の組合せ",mc:"用語・理解",data:"資料読み取り"}[current.type]);if(current.type==="order") {for(const i of shuffle(current.options.map((_,i)=>i)))addButton(current.options[i],b=>orderTap(i,b));}else if(current.type==="pair"){ $("incoming").textContent=current.prompt+"\nX："+current.options[0]+"\nY："+current.options[1];for(const a of [[true,true],[true,false],[false,true],[false,false]])addButton("X "+(a[0]?"○":"×")+" ／ Y "+(a[1]?"○":"×"),b=>{chosen=[...a];answer(a.every((v,i)=>v===current.answer[i]),b)}).dataset.correct=String(a.every((v,i)=>v===current.answer[i]));}else for(const i of shuffle(current.options.map((_,i)=>i)))addButton(current.options[i],b=>{chosen=i;answer(i===current.answer,b)}).dataset.correct=String(i===current.answer);hud()}
function orderTap(i,b){if(locked||b.disabled)return;selected.push(i);b.disabled=true;b.classList.add("picked");b.textContent=selected.length+"｜"+current.options[i];if(selected.length===current.options.length){chosen=[...selected];answer(selected.every((x,j)=>x===j),null)}else tone(true)}
function effect(big){$("board").classList.remove("flash");void $("board").offsetWidth;$("board").classList.add("flash");const el=$("burst");for(let i=0;i<(big?30:9);i++){const p=document.createElement("i");p.className="particle";p.style.left="50%";p.style.top="43%";p.style.setProperty("--x",(Math.random()-.5)*520+"px");p.style.setProperty("--y",(Math.random()-.5)*560+"px");p.style.background=["#ffcc00","#ff3b1f","#14121a"][i%3];el.append(p);setTimeout(()=>p.remove(),750)}if(big){const b=document.createElement("div");b.className="blast";b.textContent="ドカン！";el.append(b);setTimeout(()=>b.remove(),800)}}
function appendText(parent,cls,label,value){const p=document.createElement("div");p.className=cls;const h=document.createElement("b");h.textContent=label;p.append(h);const t=document.createElement("div");t.textContent=value;p.append(t);parent.append(p)}
function formatChoice(q,pick){if(q.type==="order")return Array.isArray(pick)?pick.map(i=>q.options[i]).join(" → "):"記録なし";if(q.type==="pair")return Array.isArray(pick)?"X "+(pick[0]?"○":"×")+" ／ Y "+(pick[1]?"○":"×"):"記録なし";return q.options[pick]??"記録なし"}
function buildDetail(parent,q,pick){const section=document.createElement("div");section.className="detail-card";appendText(section,"detail-heading","問題",q.prompt.replace(/\\n/g,"\n"));appendText(section,"detail-chosen","あなたの答え",formatChoice(q,pick));const solution=q.type==="order"?q.options.map((_,i)=>i):q.answer;appendText(section,"detail-correct","正解",formatChoice(q,solution));const header=document.createElement("h3");header.textContent=q.type==="order"?"出来事の流れ":q.type==="pair"?"X・Yの正誤と理由":"全選択肢の意味・違い";section.append(header);q.options.forEach((v,i)=>{let wrong=q.type==="pair"?Array.isArray(pick)&&pick[i]!==q.answer[i]:q.type==="order"?Array.isArray(pick)&&pick[i]!==i:pick===i&&i!==q.answer;let label=q.type==="order"?(i+1)+"｜"+v+(wrong?"（順番を確認）":""):q.type==="pair"?["X","Y"][i]+" "+(q.answer[i]?"○":"×")+"｜"+v+(wrong?"（ここを間違えた）":""):(i===q.answer?"○ 正解":"× 不正解")+"｜"+v+(wrong?"（選んだ答え）":"");appendText(section,"detail-option"+(wrong?" wrong-focus":""),label,detailBank[q.id][i])});appendText(section,"detail-key","入試で覚えるポイント",q.why);appendText(section,"detail-source","関連出題",q.source);parent.append(section)}
function answer(ok,b){if(locked)return;locked=true;let s=stats[current.id]||{streak:0,wrong:0};if(ok){s.streak=Math.min(2,s.streak+1);correct++;chain++;maxchain=Math.max(chain,maxchain);const fever=dp===5,gain=(current.type==="order"||current.type==="pair"?200:100)*Math.min(1+Math.floor(chain/2),6)*(fever?3:1);score+=gain;dp=fever?0:Math.min(5,dp+1);$("verdict").textContent=(fever?"大爆発！ ":chain%5===0?"大連鎖！ ":"正解！ ")+"+"+gain;effect(fever||chain%5===0);tone(true,fever)}else{s.streak=0;s.wrong++;misses.add(current.id);const recordChoice=Array.isArray(chosen)?[...chosen]:chosen;missLog.set(current.id,recordChoice);$("detail").hidden=false;buildDetail($("detail"),current,recordChoice);chain=0;$("verdict").textContent="ここを覚えよう！";tone(false);if(!retrySet.has(current.id)&&retrySet.size<4){retrySet.add(current.id);queue.push(current)}}stats[current.id]=s;save("stats",stats);for(const btn of $("bosslist").querySelectorAll("button")){btn.disabled=true;if(btn.dataset.correct==="true")btn.classList.add("good");else if(btn===b&&!ok)btn.classList.add("bad")}let solution=current.type==="order"?current.options.join(" → "):current.type==="pair"?"X "+(current.answer[0]?"○":"×")+" ／ Y "+(current.answer[1]?"○":"×"):current.options[current.answer];$("explain").textContent=ok?solution+"\n"+current.why:"";$("source").textContent=current.source+"｜オリジナル練習問題";$("next").hidden=false;$("next").textContent=pos+1===queue.length?"結果へ":"次へ";hud()}
function finish(){let key="best."+mode,old=load(key,0),record=!reviewMode&&score>old;if(record)save(key,score);$("finalScore").textContent=score.toLocaleString();$("rank").textContent=correct===queue.length?"歴史の覇者":correct/queue.length>=.75?"時代マスター":"歴史の挑戦者";$("finalStats").textContent=correct+"/"+queue.length+" 正解 ｜ 最大 "+maxchain+"連鎖";$("record").textContent=record?"NEW RECORD！":"";$("mistake").hidden=!misses.size;$("review").hidden=!misses.size;$("review").replaceChildren();const heading=document.createElement("b");heading.textContent="今日の復習（"+misses.size+"問）";$("review").append(heading);for(const id of misses){const q=bank.find(q=>q.id===id);const d=document.createElement("details");const summary=document.createElement("summary");summary.textContent=q.prompt.replace(/\\n/g," ");d.append(summary);buildDetail(d,q,missLog.get(id));$("review").append(d);}display("result")}
$("easy").onclick=()=>setMode("easy");$("exam").onclick=()=>setMode("exam");$("start").onclick=()=>start();$("reviewStart").onclick=()=>start(true);$("next").onclick=()=>{if(locked){pos++;render()}};$("again").onclick=()=>start();$("mistake").onclick=()=>start(true,[...misses]);$("homebtn").onclick=home;$("quit").onclick=home;$("mute").onclick=()=>{sound=!sound;save("sound",sound);$("mute").textContent=sound?"♪":"×"};home();
</script></body></html>

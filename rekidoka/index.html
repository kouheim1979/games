function effect(big){$("board").classList.remove("flash");void $("board").offsetWidth;$("board").classList.add("flash");const el=$("burst");for(let i=0;i<(big?30:9);i++){const p=document.createElement("i");p.className="particle";p.style.left="50%";p.style.top="43%";p.style.setProperty("--x",(Math.random()-.5)*520+"px");p.style.setProperty("--y",(Math.random()-.5)*560+"px");p.style.background=["#ffcc00","#ff3b1f","#14121a"][i%3];el.append(p);setTimeout(()=>p.remove(),750)}if(big){const b=document.createElement("div");b.className="blast";b.textContent="ドカン！";el.append(b);setTimeout(()=>b.remove(),800)}}
function answer(ok,b){if(locked)return;locked=true;let s=stats[current.id]||{streak:0,wrong:0};if(ok){s.streak=Math.min(2,s.streak+1);correct++;chain++;maxchain=Math.max(chain,maxchain);const fever=dp===5,gain=(current.type==="order"||current.type==="pair"?200:100)*Math.min(1+Math.floor(chain/2),6)*(fever?3:1);score+=gain;dp=fever?0:Math.min(5,dp+1);$("verdict").textContent=(fever?"大爆発！ ":chain%5===0?"大連鎖！ ":"正解！ ")+"+"+gain;effect(fever||chain%5===0);tone(true,fever)}else{s.streak=0;s.wrong++;misses.add(current.id);chain=0;$("verdict").textContent="ここを覚えよう！";tone(false);if(!retrySet.has(current.id)&&retrySet.size<4){retrySet.add(current.id);queue.push(current)}}stats[current.id]=s;save("stats",stats);for(const btn of $("bosslist").querySelectorAll("button")){btn.disabled=true;if(btn.dataset.correct==="true")btn.classList.add("good");else if(btn===b&&!ok)btn.classList.add("bad")}let solution=current.type==="order"?current.options.join(" → "):current.type==="pair"?"X "+(current.answer[0]?"○":"×")+" ／ Y "+(current.answer[1]?"○":"×"):current.options[current.answer];$("explain").textContent=solution+"\n"+current.why;$("source").textContent=current.source+"｜オリジナル練習問題";$("next").hidden=false;$("next").textContent=pos+1===queue.length?"結果へ":"次へ";hud()}
function finish(){let key="best."+mode,old=load(key,0),record=!reviewMode&&score>old;if(record)save(key,score);$("finalScore").textContent=score.toLocaleString();$("rank").textContent=correct===queue.length?"歴史の覇者":correct/queue.length>=.75?"時代マスター":"歴史の挑戦者";$("finalStats").textContent=correct+"/"+queue.length+" 正解 ｜ 最大 "+maxchain+"連鎖";$("record").textContent=record?"NEW RECORD！":"";$("mistake").hidden=!misses.size;$("review").hidden=!misses.size;$("review").innerHTML="<b>今日の復習</b>"+[...misses].map(id=>bank.find(q=>q.id===id)).map(q=>"<p><strong>"+q.topic+"</strong><br>"+q.why+"</p>").join("");display("result")}
$("easy").onclick=()=>setMode("easy");$("exam").onclick=()=>setMode("exam");$("start").onclick=()=>start();$("reviewStart").onclick=()=>start(true);$("next").onclick=()=>{if(locked){pos++;render()}};$("again").onclick=()=>start();$("mistake").onclick=()=>start(true,[...misses]);$("homebtn").onclick=home;$("quit").onclick=home;$("mute").onclick=()=>{sound=!sound;save("sound",sound);$("mute").textContent=sound?"♪":"×"};home();
</script></body></html>

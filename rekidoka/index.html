const events=raw.map(([year,name,why,group],id)=>({year,name,why,group,id})), names=["明治維新・政治改革","外交・産業革命","大正デモクラシー","戦争への道","戦後の民主化","高度成長・現代"], $=id=>document.getElementById(id), shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}, load=(k,d)=>{try{return JSON.parse(localStorage.getItem("rekidoka."+k))??d}catch{return d}},save=(k,v)=>{try{localStorage.setItem("rekidoka."+k,JSON.stringify(v))}catch{}};
let mode="easy",sound=load("sound",true),weak=load("weak",{}),score=0,chain=0,maxchain=0,dp=0,correct=0,total=0,stageIndex=0,round=0,groups=[],targets=[],current,anchors=[],locked=false,boss=false,bossOrder=[],bossTap=[],misses=new Set(),reviewMode=false,ctx;

function reward(ok,base){total++;let fever=dp===5;if(ok){correct++;chain++;maxchain=Math.max(chain,maxchain);const mult=Math.min(1+Math.floor(chain/2),6)*(fever?3:1);let gain=base*mult;score+=gain;dp=fever?0:Math.min(5,dp+1);$("verdict").textContent=(fever?"大爆発！ ":chain%5===0?"大連鎖！ ":"正解！ ")+"+"+gain.toLocaleString();effect(fever||chain%5===0);tone(true,fever)}else{chain=0;$("verdict").textContent="時代がズレた！";tone(false)}hud()}
function effect(big){$("board").classList.remove("flash");void $("board").offsetWidth;$("board").classList.add("flash");const el=$("burst");for(let i=0;i<(big?35:10);i++){const p=document.createElement("i");p.className="particle";p.style.left="50%";p.style.top="43%";p.style.setProperty("--x",(Math.random()-.5)*520+"px");p.style.setProperty("--y",(Math.random()-.5)*560+"px");p.style.background=i%3===0?"#ffcc00":i%3===1?"#ff3b1f":"#14121a";el.append(p);setTimeout(()=>p.remove(),750)}if(big){const b=document.createElement("div");b.className="blast";b.textContent="ドカン！";el.append(b);setTimeout(()=>b.remove(),800)}}
function answer(i){if(locked)return;locked=true;let right=anchors.filter(x=>x.year<current.year).length;[...$("timeline").querySelectorAll("button")].forEach((b,j)=>{b.disabled=true;if(j===right){b.classList.add("good");b.textContent=current.year+"年 "+current.name}else if(j===i){b.classList.add("bad");b.textContent="×"}});let ok=i===right;track(current,ok);reward(ok,100);$("explain").textContent=current.year+"年｜"+current.why+" （"+anchors.map(a=>a.year+"年 "+a.name).join(" ／ ")+"）";$("next").hidden=false}
function renderBoss(){boss=true;$("prompt").textContent="BOSS：古い順に4枚タップ";$("incoming").textContent="時代をつなげ！";$("incoming").classList.add("boss");$("timeline").hidden=true;$("bosslist").hidden=false;const distinct=[];for(const e of shuffle(events.filter(e=>e.group===groups[stageIndex])))if(!distinct.some(x=>x.year===e.year))distinct.push(e);bossOrder=distinct.slice(0,4).sort((a,b)=>a.year-b.year);bossTap=[];for(const e of shuffle(bossOrder)){const b=document.createElement("button");b.textContent=e.name;b.onclick=()=>bossAnswer(e,b);$("bosslist").append(b)}hud()}
function bossAnswer(e,b){if(locked||b.disabled)return;bossTap.push(e);b.disabled=true;b.textContent=bossTap.length+"｜"+e.name;if(bossTap.length<4){tone(true);return}locked=true;const ok=bossTap.every((x,i)=>x.id===bossOrder[i].id);bossOrder.forEach((x,i)=>track(x,bossTap[i].id===x.id));reward(ok,400);$("explain").textContent=bossOrder.map(x=>x.year+"年 "+x.name).join(" → ");$("next").hidden=false}
function finish(){let key="best."+mode,old=load(key,0),record=!reviewMode&&score>old;if(record)save(key,score);$("finalScore").textContent=score.toLocaleString();$("rank").textContent=total&&correct===total?"歴史の覇者":correct/Math.max(total,1)>=.75?"時代マスター":"歴史の挑戦者";$("finalStats").textContent=correct+"/"+total+" 正解 ｜ 最大 "+maxchain+"連鎖";$("record").textContent=record?"NEW RECORD！":"";$("mistake").hidden=!misses.size;$("review").hidden=!misses.size;$("review").innerHTML="<b>復習カード</b>"+[...misses].map(i=>events[i]).sort((a,b)=>a.year-b.year).map(e=>"<p><strong>"+e.year+"年</strong> "+e.name+"<br>"+e.why+"</p>").join("");display("result")}
$("easy").onclick=()=>setMode("easy");$("exam").onclick=()=>setMode("exam");$("start").onclick=()=>start();$("reviewStart").onclick=()=>start(true);$("next").onclick=()=>{if(!locked)return;round++;nextRound()};$("again").onclick=()=>start();$("mistake").onclick=()=>start(true,[...misses]);$("homebtn").onclick=home;$("quit").onclick=home;$("mute").onclick=()=>{sound=!sound;save("sound",sound);$("mute").textContent=sound?"♪":"×"};home();
</script></body></html>

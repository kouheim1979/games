<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12060c">
<title>宇宙食べ放題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Potta+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE   occasion: a loud, happy family arcade game with a deadpan restaurant joke
   IDEA    a 食べ放題 shop's own printed things: のぼり旗 out front, the table timer, the 伝票 at the register, the お品書き
   PICTURE the live world itself: emoji food, towns and planets spiralling into a glowing black hole
   COLOUR  noren red #e8162c, sale-tag yellow #ffd23f, ink #1c0f14, paper #fffaf0; the ground changes every 皿
   TYPE    Potta One (brush-pop shop lettering) + Zen Maru Gothic (HUD, body) + DotGothic16 (receipt printer)
   LAYOUT  one screen: canvas full-bleed, HUD band across the top, fever gauge at the bottom; title = flags over a menu card */
:root{--ol:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),1.6px 1.6px 0 var(--ink),-1.6px 1.6px 0 var(--ink),1.6px -1.6px 0 var(--ink),-1.6px -1.6px 0 var(--ink),0 4px 0 var(--ink);--red:#e8162c;--red-d:#a80b1c;--yellow:#ffd23f;--ink:#1c0f14;--paper:#fffaf0;--pop:"Potta One","Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;--ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;--dot:"DotGothic16",ui-monospace,"Osaka-Mono",monospace;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;overflow:hidden;background:#12060c;color:#fff;font:16px/1.55 var(--ui);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.ee{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ei{display:inline-block;vertical-align:middle}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));display:grid;grid-template-columns:auto minmax(0,340px) minmax(0,1fr) auto;gap:8px;align-items:start}
.top .timer{grid-column:4}
.pill{background:rgba(22,8,16,.8);border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.28)}
#pauseBtn{pointer-events:auto;width:46px;height:46px;border:0;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
#pauseBtn::before{content:"";width:14px;height:16px;border-left:5px solid #fff;border-right:5px solid #fff}
.stage{padding:7px 12px 9px}
.stage span{display:block;font:700 11px/1.2 var(--ui);color:var(--yellow)}
.stage b{display:block;font:400 18px/1.2 var(--pop);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:block;height:5px;margin-top:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--yellow),#ff7a3d)}
.timer{padding:6px 12px 8px;text-align:center;background:var(--red);min-width:78px}
.timer small{display:block;font:700 11px/1.2 var(--ui)}
.timer b{display:block;font:900 26px/1.05 var(--ui);font-variant-numeric:tabular-nums}
.timer.warn{background:var(--yellow);color:var(--ink);animation:warn .5s steps(2) infinite}
@keyframes warn{50%{transform:scale(1.08)}}
.size{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 74px);text-align:center;white-space:nowrap;text-shadow:var(--ol);color:#fff}
.size small{font:700 14px var(--ui);margin-right:4px}
.size b{font:900 clamp(32px,9vw,46px)/1 var(--ui);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.size span{font:400 clamp(22px,6vw,30px)/1 var(--pop);margin-left:3px;color:var(--yellow)}
.size.bump{animation:bump .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.35)}100%{transform:scale(1)}}
.tplus{position:absolute;right:max(14px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 64px);width:90px;height:0}
.tp{position:absolute;right:0;top:0;font:400 20px/1 var(--pop);color:var(--yellow);text-shadow:var(--ol);white-space:nowrap;animation:tp 1.1s ease-out forwards}
@keyframes tp{0%{transform:translateY(8px) scale(.6);opacity:0}20%{transform:translateY(0) scale(1.15);opacity:1}100%{transform:translateY(26px) scale(1);opacity:0}}
.lastorder{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;top:calc(env(safe-area-inset-top) + 128px);background:var(--yellow);color:var(--ink);font:400 13px/1 var(--pop);padding:7px 10px;border-radius:999px;border:2px solid var(--ink);animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.fever{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);width:min(66vw,300px);height:18px;border-radius:10px;background:rgba(22,8,16,.78);overflow:hidden;border:2px solid rgba(255,255,255,.55)}
.fever i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5ab1,var(--yellow));transition:width .15s}
.fever span{position:absolute;inset:0;display:grid;place-items:center;font:400 11px/1 var(--pop);letter-spacing:.08em}
.fever.on{border-color:var(--yellow);box-shadow:0 0 18px rgba(255,210,63,.8)}
.fever.on i{background:linear-gradient(90deg,var(--yellow),#fff6c8,var(--yellow));background-size:200% 100%;animation:shine .6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 46px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font:700 14px/1.5 var(--ui);text-align:center;box-shadow:4px 4px 0 var(--ink)}
.toast b{color:var(--red)}
.toast small{font-size:12px;opacity:.75}
.toast .ee{font-size:21px;line-height:1;vertical-align:-3px}
.toast .ei{width:24px;height:24px;vertical-align:-6px}
.toast.go{animation:toastIn .32s cubic-bezier(.2,1.6,.4,1)}
@keyframes toastIn{from{transform:translateX(-50%) translateY(16px) scale(.85);opacity:0}}
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 110px);display:flex;flex-direction:column;align-items:center;gap:14px;font:700 16px/1.45 var(--ui);text-align:center;text-shadow:var(--ol)}
.finger{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 9px rgba(255,255,255,.25);animation:drag 1.6s ease-in-out infinite}
@keyframes drag{0%,100%{transform:translateX(-54px)}50%{transform:translateX(54px)}}

/* ---- 帯 ---- */
.banner{position:fixed;inset:0;z-index:7;pointer-events:none;display:grid;place-items:center}
.bn{width:100%;background:var(--red);color:#fff;text-align:center;padding:12px 16px 16px;border-top:5px solid #fff;border-bottom:5px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.25);transform:translateX(110%)}
.banner.go .bn{animation:bn 1.9s cubic-bezier(.2,.9,.2,1) forwards}
.banner.fever.go .bn{animation-duration:1.5s}
.banner.timeup.go .bn{animation-duration:2.4s}
.banner.bang.go .bn{animation-duration:3s}
@keyframes bn{0%{transform:translateX(110%) skewX(-14deg)}14%{transform:translateX(0) skewX(-4deg)}22%{transform:translateX(0) skewX(0)}84%{transform:translateX(0)}100%{transform:translateX(-110%) skewX(14deg)}}
.bn small{display:block;font:700 15px/1.3 var(--ui);color:var(--yellow)}
.bn b{display:block;font:400 clamp(40px,12vw,68px)/1.1 var(--pop)}
.bn em{display:block;font:700 15px/1.4 var(--ui);font-style:normal}
.bn i{display:inline-block;margin-top:8px;background:var(--yellow);color:var(--ink);font:400 19px/1 var(--pop);font-style:normal;padding:7px 14px;border-radius:6px;transform:rotate(-3deg)}
.banner.fever .bn{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.banner.timeup .bn{background:var(--ink)}
.banner.bang .bn{background:transparent;border-color:transparent;box-shadow:none;--ink:#2a0a3a;text-shadow:var(--ol),0 0 24px rgba(120,40,200,.8)}

/* ---- 共通の板 ---- */
.ov{position:fixed;inset:0;z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(env(safe-area-inset-top) + 18px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 22px) max(16px,env(safe-area-inset-left));-webkit-user-select:none;user-select:none}
.btn{appearance:none;-webkit-appearance:none;border:3px solid var(--ink);border-radius:14px;font:400 18px/1.1 var(--pop);padding:13px 16px;min-height:48px;cursor:pointer;touch-action:manipulation;color:var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.main{display:block;width:100%;background:var(--red);color:#fff;font-size:27px;padding:17px 16px}
.btn.main:disabled{opacity:.65;cursor:progress}
.row{display:flex;gap:10px;margin-top:14px}
.row .btn{flex:1 1 0;font-size:17px}

/* ---- タイトル ---- */
.title{display:flex;background:linear-gradient(180deg,rgba(18,6,12,0) 0%,rgba(18,6,12,.1) 38%,rgba(18,6,12,.7) 100%)}
.t-col{margin:auto;width:min(100%,400px);display:flex;flex-direction:column;align-items:center;gap:12px}
.flags{display:flex;gap:22px;align-items:flex-start;padding:14px 0 22px 14px}
.nobori{position:relative;writing-mode:vertical-rl;text-orientation:upright;margin:0;background:var(--red);color:#fff;font:400 clamp(30px,min(11vw,5.3vh),58px)/1 var(--pop);letter-spacing:.05em;padding:.42em .3em .5em;box-shadow:inset 0 0 0 6px var(--red),inset 0 0 0 9px rgba(255,255,255,.9),7px 7px 0 rgba(0,0,0,.3);transform-origin:0 0;animation:flutter 3.4s ease-in-out infinite}
.nobori::before{content:"";position:absolute;left:-11px;top:-16px;bottom:-30px;width:7px;border-radius:4px;background:linear-gradient(90deg,#f1f1f1,#9b9b9b)}
.nobori::after{content:"";position:absolute;left:-13px;right:-5px;top:-16px;height:7px;border-radius:4px;background:linear-gradient(#f1f1f1,#9b9b9b)}
.nobori.y{background:var(--yellow);color:var(--red);font-size:clamp(20px,min(6.6vw,3.3vh),34px);margin-top:24px;box-shadow:inset 0 0 0 5px var(--yellow),inset 0 0 0 8px var(--red),6px 6px 0 rgba(0,0,0,.3);animation-delay:-1.3s}
@keyframes flutter{0%,100%{transform:skewY(0)}50%{transform:skewY(-1.8deg) scaleX(.98)}}
.menu{width:100%;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:14px 16px 14px;box-shadow:0 9px 0 rgba(0,0,0,.28)}
.menu h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lead{margin:0 0 8px;font:700 16px/1.5 var(--ui);text-wrap:balance;text-align:center}
.rules{list-style:none;margin:0 0 14px;padding:8px 12px;display:grid;gap:3px;background:#fff;border-radius:12px;border:2px dashed rgba(28,15,20,.28)}
.rules li{position:relative;padding-left:14px;font:700 14px/1.5 var(--ui)}
.rules li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--red)}
.rules b{color:var(--red)}
.best{margin:10px 0 0;font:700 13px/1.5 var(--ui);text-align:center;color:rgba(28,15,20,.75)}
.best b{color:var(--red)}

/* ---- 一時停止 ---- */
.pause{display:grid;place-items:center;background:rgba(10,4,8,.62)}
.card{width:min(100%,340px);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:20px 18px;box-shadow:0 9px 0 rgba(0,0,0,.3);text-align:center}
.card h2{margin:0 0 16px;font:400 32px/1.1 var(--pop)}
.toggles{display:flex;gap:8px;margin-top:16px}
.tg{flex:1 1 0;min-height:46px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font:700 14px/1.2 var(--ui);cursor:pointer;touch-action:manipulation}
.tg[aria-pressed="false"]{opacity:.45;text-decoration:line-through}

/* ---- 伝票 ---- */
.result{display:flex;flex-direction:column;align-items:center;gap:20px;background:rgba(10,4,8,.5)}
.receipt{position:relative;width:min(100%,350px);margin-top:auto;background:#fffdf6;color:#2b2329;font:400 14px/1.55 var(--dot);padding:18px 18px 24px;box-shadow:0 14px 30px rgba(0,0,0,.45);transform:rotate(-1deg);animation:print .7s cubic-bezier(.2,.9,.3,1) both}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(-45deg,transparent 7px,#fffdf6 0) 0 0/14px 10px repeat-x,linear-gradient(45deg,transparent 7px,#fffdf6 0) 0 0/14px 10px repeat-x}
@keyframes print{from{transform:translateY(40px) rotate(-1deg);opacity:0}}
.receipt header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:2px dashed #2b2329}
.receipt header b{font:400 23px/1.1 var(--pop);color:var(--red)}
.receipt header small{font-size:12px;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;margin:6px 0 4px;font-size:12px}
.big{margin:6px 0 10px;padding-right:96px}
.big small{display:block;font-size:13px}
.big b{display:block;font:400 26px/1.15 var(--pop);color:var(--ink);white-space:nowrap}
.big i{font-style:normal;font-size:18px;margin-left:2px}
.items{list-style:none;margin:0;padding:8px 0;border-top:2px dashed #2b2329;border-bottom:2px dashed #2b2329;display:grid;gap:2px}
.items li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px}
.items .ee{font-size:20px;line-height:1.2;text-align:center}
.items .ei{width:26px;height:26px}
.items .more{grid-template-columns:28px minmax(0,1fr)}
.items .more .rn{grid-column:2}
.rq{text-align:right;white-space:nowrap}
.receipt dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;margin:8px 0}
.receipt dt,.receipt dd{margin:0}
.receipt dd{text-align:right;white-space:nowrap}
.new{border-top:2px dashed #2b2329;padding-top:8px}
.new b{font-weight:400}
.new span{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.new .ee{font-size:21px;line-height:1.1}
.new .ei{width:24px;height:24px}
.bill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;border-top:2px dashed #2b2329;padding-top:8px;margin-top:8px}
.bill span:nth-child(even){text-align:right;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 0;padding-top:6px;border-top:4px double #2b2329}
.total b{font:400 26px/1.1 var(--pop);white-space:nowrap}
.thanks{margin:12px 0 0;text-align:center;font-size:12px;opacity:.75}
.stamp{position:absolute;right:14px;top:80px;width:92px;height:92px;border-radius:50%;border:4px solid var(--red);box-shadow:inset 0 0 0 3px #fffdf6,inset 0 0 0 5px var(--red);color:var(--red);display:grid;place-items:center;text-align:center;font:400 30px/1 var(--pop);transform:rotate(-16deg);opacity:.88;animation:stamp .45s .55s cubic-bezier(.3,1.7,.5,1) both}
.stamp.s2{font-size:17px;line-height:1.15}
@keyframes stamp{from{transform:rotate(-16deg) scale(2.4);opacity:0}}
.sticker{position:absolute;left:-12px;top:-14px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font:400 16px/1 var(--pop);padding:7px 12px;transform:rotate(-8deg)}
.r-btns{position:sticky;bottom:calc(-1 * (env(safe-area-inset-bottom) + 22px));width:calc(100% + 32px);max-width:420px;margin:0 -16px auto;padding:22px 16px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(rgba(10,4,8,0),rgba(10,4,8,.88) 34%)}

/* ---- お品書き ---- */
.dex{background:var(--paper);color:var(--ink);padding-top:0}
.dex-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;margin:0 calc(-1 * max(16px,env(safe-area-inset-right))) 0 calc(-1 * max(16px,env(safe-area-inset-left)));padding:calc(env(safe-area-inset-top) + 12px) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));background:var(--red);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.dex-head h2{margin:0;font:400 30px/1 var(--pop)}
.dex-head p{flex:1;margin:0;font:700 14px/1.3 var(--ui)}
.dex-head .btn{padding:10px 14px;min-height:44px;font-size:16px;box-shadow:0 3px 0 var(--ink)}
.dex section{max-width:880px;margin:0 auto}
.dex h3{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;padding:20px 0 6px;border-bottom:3px solid var(--ink);font:400 23px/1.2 var(--pop)}
.dex h3 small{font:700 13px var(--ui);color:var(--red)}
.dex h3 span{margin-left:auto;font:700 13px var(--ui)}
.dex ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.dex li{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 6px 8px;text-align:center;background:#fff;border:2px solid rgba(28,15,20,.14);border-radius:12px}
.dex li .ee{font-size:36px;line-height:1.15}
.dex li .ei{width:44px;height:44px}
.dex li b{font:700 13px/1.3 var(--ui);overflow-wrap:anywhere}
.dex li small{font:500 12px/1.3 var(--ui);opacity:.7}
.dex li em{position:absolute;top:4px;right:7px;font:700 11px var(--ui);font-style:normal;color:var(--red)}
.dex li.unk .ee,.dex li.unk .ei{filter:brightness(0);opacity:.2}
.dex li.unk b{opacity:.45}
.dex li.main{border-color:var(--red);background:#fff3ef}
.dex li.main::before{content:"メイン";position:absolute;top:-9px;left:6px;padding:3px 7px;border-radius:6px;background:var(--red);color:#fff;font:400 11px/1 var(--pop)}
.dex .foot{max-width:880px;margin:22px auto 0;font:500 13px/1.6 var(--ui);opacity:.7;text-align:center}
@media (max-height:680px){.lead{display:none}.flags{padding-bottom:16px}}
@media (prefers-reduced-motion:reduce){.nobori,.finger,.timer.warn,.lastorder,.fever.on i{animation:none}.banner.go .bn{animation-duration:2.2s}}
</style>
</head>
<body>
<canvas id="cv" aria-label="ゲーム画面。ブラックホールを動かして、自分より小さいものを食べます。"></canvas>

<div id="hud" hidden>
  <div class="top">
    <button id="pauseBtn" class="pill" type="button" aria-label="ひと休み"></button>
    <div class="pill stage"><span id="stNo">1皿目</span><b id="stName">おぼん</b><i class="bar"><i id="stBar"></i></i></div>
    <div class="pill timer" id="timerBox"><small>のこり</small><b id="timer">0:35</b></div>
  </div>
  <div class="size" id="sizeBox"><small>直径</small><b id="sizeNum">5.00</b><span id="sizeUnit">mm</span></div>
  <div class="tplus" id="tplus"></div>
  <div class="lastorder" id="lastorder" hidden>ラストオーダー</div>
  <div class="hint" id="hint" hidden><i class="finger"></i><span>画面のどこでも<br>ドラッグして動かそう</span></div>
  <div class="toast" id="toast" hidden></div>
  <div class="fever" id="feverBox"><i id="feverBar"></i><span>フィーバー</span></div>
</div>
<div id="banner" class="banner" hidden></div>

<section id="title" class="ov title" aria-label="タイトル">
  <div class="t-col">
    <div class="flags" aria-hidden="true">
      <p class="nobori">宇宙食べ放題</p>
      <p class="nobori y">延長あり</p>
    </div>
    <div class="menu">
      <h1>宇宙食べ放題</h1>
      <p class="lead">ブラックホールになって、テーブルの上から宇宙のはてまで食べつくせ。</p>
      <ul class="rules">
        <li>画面のどこでも<b>ドラッグ</b>して動く</li>
        <li>自分より<b>小さいもの</b>を食べて大きくなる</li>
        <li>次の皿に進むと<b>時間が延長</b>される</li>
      </ul>

function closeDex() { Sound.fx.ui(); show(dexFrom); if (dexFrom === 'title') titleHud(); }

// ---------- 一時停止 ----------
function pause() { if (state !== 'play') return; store(); state = 'pause'; joy.on = false; Sound.music.stop(); show('pause'); syncToggles(); }
function resume() { if (state !== 'pause') return; Sound.init(); state = 'play'; show(''); Sound.music.start(); last = performance.now(); }
function quit() { Sound.music.stop(); state = 'title'; el.hud.hidden = true; game = null; clearFX(); show('title'); titleHud(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) { pause(); Sound.suspend(true); } else Sound.suspend(false); });
function syncToggles() {
  document.querySelectorAll('.tg').forEach(b => b.setAttribute('aria-pressed', save.opt[b.dataset.k] ? 'true' : 'false'));
  const on = save.opt.se || save.opt.bgm; el.sndBtn.setAttribute('aria-pressed', on ? 'true' : 'false'); el.sndBtn.textContent = on ? '音あり' : '音なし';
}
document.querySelectorAll('.tg').forEach(b => b.addEventListener('click', () => { const k = b.dataset.k; save.opt[k] = !save.opt[k]; if (k !== 'vib') Sound.set(k, save.opt[k]); store(); syncToggles(); Sound.init(); Sound.fx.ui(); }));
el.sndBtn.addEventListener('click', () => { const on = !(save.opt.se || save.opt.bgm); save.opt.se = save.opt.bgm = on; Sound.set('se', on); Sound.set('bgm', on); store(); syncToggles(); Sound.init(); Sound.fx.ui(); });

function titleHud() {
  const b = save.best;
  el.bestLine.innerHTML = b ? `最高記録　<b>${b.clear ? `宇宙完食 ${mmss(b.t)}` : `${b.stage + 1}皿目 ${STAGES[b.stage].name}`}</b>　直径 ${fmtLenS(b.realD)}` : 'はじめてのご来店です';
}

// ---------- ボタン ----------
el.startBtn.addEventListener('click', startGame);
el.againBtn.addEventListener('click', startGame);
el.retryBtn.addEventListener('click', () => { Sound.music.stop(); startGame(); });
el.dexBtn.addEventListener('click', () => openDex('title'));
el.rDexBtn.addEventListener('click', () => openDex('result'));
el.dexClose.addEventListener('click', closeDex);
el.homeBtn.addEventListener('click', () => { Sound.fx.ui(); quit(); });
el.quitBtn.addEventListener('click', () => { Sound.fx.ui(); quit(); });
el.resumeBtn.addEventListener('click', resume);
el.pauseBtn.addEventListener('click', () => { Sound.fx.ui(); pause(); });

// ---------- HUD ----------
function hud() {
  const w = game; if (!w) return;
  const [num, unit] = fmtLen(Core.g2r(Math.min(w.hole.D, Core.D_END)));
  if (num !== hudC.num) { el.sizeNum.textContent = num; hudC.num = num; }
  if (unit !== hudC.unit) { if (hudC.unit) { el.sizeBox.classList.remove('bump'); void el.sizeBox.offsetWidth; el.sizeBox.classList.add('bump'); } el.sizeUnit.textContent = unit; hudC.unit = unit; }
  const p = Math.round(w.progress() * 200) / 2; if (p !== hudC.p) { el.stBar.style.width = p + '%'; hudC.p = p; }
  const ts = Math.ceil(w.time);
  if (ts !== hudC.ts) { el.timer.textContent = mmss(ts); hudC.ts = ts; el.timerBox.classList.toggle('warn', w.time < 10); if (w.time < 10 && w.time > 0 && w.started && state === 'play') Sound.fx.tick(); if (w.time > 10.5) el.lastorder.hidden = true; }
  const fv = w.feverT > 0 ? w.feverT / P.feverTime : Math.min(1, w.fever / 100), fp = Math.round(fv * 100);
  if (fp !== hudC.fp) { el.feverBar.style.width = fp + '%'; hudC.fp = fp; }
  const on = w.feverT > 0; if (on !== hudC.fon) { el.feverBox.classList.toggle('on', on); hudC.fon = on; }
}

// ---------- ループ ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  R.t += dt;
  let w = null, opt = {};
  if (state === 'title' || (state === 'dex' && dexFrom === 'title')) {
    if (!attract) newAttract();
    attract.update(dt, bot(attract, abot, dt)); handle(attract, true);
    if (attract.stage >= 6) newAttract();
    w = attract; opt.noHud = true;
  } else if (game) {
    if (state === 'play') {
      game.update(dt, input()); handle(game, false);
      if (Math.random() < dt * 26) R.fx.dust.push({ r: P.pullK * (game.feverT > 0 ? 1.75 : 1) * (0.9 + Math.random() * 0.12), a: Math.random() * TAU, v: 1.1 + Math.random() * 0.9, l: 3, m: 0 });
      if (joy.on) { const L = Math.hypot(joy.kx, joy.ky), k = L > 50 ? 50 / L : 1; opt.joy = { ox: joy.ox, oy: joy.oy, kx: joy.kx * k, ky: joy.ky * k }; }
      hud();
    } else if (state === 'ending') { ending(dt); if (state === 'ending') hud(); }
    w = game;
    if (state === 'ending' && endKind === 'clear') {
      opt.noHud = true;
      if (endT < 2.6) { const t = endT / 2.6; opt.grow = t * t * t; }
      else if (reborn) w = reborn;
      else opt.cover = 1;
    }
    if (state === 'result' || (state === 'dex' && dexFrom === 'result')) { if (reborn) { reborn.update(dt, null); reborn.events.length = 0; w = reborn; } opt.noHud = true; }
  }
  if (state !== 'pause' || !w) R.fx.update(dt);
  if (w) {
    if (opt.cover) { R.x.setTransform(R.dpr, 0, 0, R.dpr, 0, 0); R.x.fillStyle = '#000'; R.x.fillRect(0, 0, W, H); }
    else R.frame(w, opt);
  }
  requestAnimationFrame(frame);
}

// ---------- 起動 ----------
resize(); newAttract(); titleHud(); syncToggles();
el.startBtn.disabled = true; el.startBtn.textContent = '準備中…';
Render.buildAll(ITEMS, () => { el.startBtn.disabled = false; el.startBtn.textContent = 'いただきます！'; });
if (document.fonts && document.fonts.load) { try { document.fonts.load(`30px "Potta One"`, 'ゴクン！パクッげぷっコンボ食べられるメイン料理NEW0123456789秒+'); } catch (e) { } }
requestAnimationFrame(t => { last = t; frame(t); });
};
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

}
</script>
</body>

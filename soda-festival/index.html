"use strict";
const $=id=>document.getElementById(id),cv=$("scene"),g=cv.getContext("2d"),bg=document.createElement("canvas");bg.width=256;bg.height=224;const b=bg.getContext("2d");g.imageSmoothingEnabled=false;
let seed=312;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}const pick=a=>a[Math.floor(rand()*a.length)];
function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x|0,y|0,w|0,h|0)}

function stone(x,y,w,h){rect(b,x,y,w,h,"#554a3d");rect(b,x+1,y+1,w-2,h-2,pick(["#90806c","#9e8e76","#877764","#a59780","#8a7d6b"]));rect(b,x+2,y+1,w-4,1,"#b2a28a");rect(b,x+1,y+2,1,h-4,"#a29a82");rect(b,x+2,y+h-2,w-3,1,"#6d6050");for(let k=0;k<5;k++)rect(b,x+2+rand()*(w-4),y+2+rand()*(h-4),1+rand()*2,1,pick(["#b3a18a","#7e6d5c","#958572","#786a59"]))}
rect(b,0,0,256,224,"#716351");for(let y=-4;y<224;y+=8){let x=(y%16===4?-8:-2);while(x<256){let w=9+(rand()*8|0);stone(x,y,w,8);x+=w}}

function rug(x,y,w,h){rect(b,x+2,y+3,w,h,"#554938");rect(b,x,y,w,h,"#453526");rect(b,x+1,y+1,w-2,h-2,"#d3b583");rect(b,x+3,y+3,w-6,h-6,"#49382c");for(let yy=y+4;yy<y+h-6;yy+=8)for(let xx=x+4;xx<x+w-6;xx+=8){poly(b,[[xx+3,yy],[xx+7,yy+3],[xx+3,yy+7],[xx,yy+3]],"#c4a47a");poly(b,[[xx+3,yy+2],[xx+5,yy+3],[xx+3,yy+5],[xx+2,yy+3]],"#564333")}}

function stall(x,y,col){rug(x-5,y+15,53,44);wood(x,y+21,43,31);rect(b,x+3,y+4,3,49,"#5e402a");rect(b,x+37,y+4,3,49,"#5e402a");for(let yy=0;yy<24;yy++){for(let xx=0;xx<45;xx++){let stripe=(Math.floor((xx+Math.sin(yy/6)*2)/8)%2===0);let pal=stripe?col:["#8c8777","#d6d4bb","#f2e7c9"];let shade=yy>20?0:((yy%9<2||xx%8===1)?2:1);rect(b,x-1+xx,y+yy+(xx%9===0?1:0),1,1,pal[shade])}}for(let i=0;i<5;i++){let xx=x+5+(i%3)*11,yy=y+29+(i/3|0)*10;rect(b,xx,yy,8,6,"#5c412b");rect(b,xx+1,yy-1,6,6,pick(["#ad3a65","#426696","#637936","#d78b32"]));rect(b,xx+2,yy,2,2,"#e5d6a0")}}

function flag(x,y){rect(b,x+8,y+4,2,45,"#443a2b");rect(b,x+9,y+4,1,43,"#ede0c2");rect(b,x+5,y+48,8,2,"#665b48");poly(b,[[x+10,y+7],[x+25,y+12],[x+22,y+22],[x+28,y+30],[x+10,y+25]],"#832840");poly(b,[[x+11,y+8],[x+24,y+13],[x+20,y+21],[x+26,y+28],[x+11,y+23]],"#ce3d59");poly(b,[[x+15,y+11],[x+19,y+13],[x+16,y+17],[x+20,y+24],[x+16,y+22]],"#f1c56b")}
flag(91,25);flag(102,155);flag(225,126);

const hero=[
"........HHH.........","......HHhHHH..H....","...HHHHhhhHHHHH....","....HhhhhhhHHhH....","..HHhhhhhHhHhhH....","...HhhHhhhHhhhH....","....HhhhhHHHhH.....","....HHhhHssHH......",".....HhsslsSO......",".....HsslsseO......","......OsSSssO......",".......OsssO.......",".....OOrrrOO.......","....ObbrrrbBO......","...ObbbbbbbBO......","...OblbbBbSSO......","...OSObbBbSO.......","....OObbbBO........",".....ObbBBO........",".....OwwwwO........","....ObbOObBO.......","....ObbO.ObBO......","....OrrO..OrrO.....","...OrrrO..OrrrO....","...OOOOO..OOOOO...."];

"......OOOOOOO......",".....OHHHHHHHO.....","....OHhhhhHHHHO....","....OHhssssHHHO....","....OHsslsseHO.....",".....OssSSssO......",".....OOsssssO......","....OwwOsssOwwO....","...OwwwwOOwwwwO....","..OwwwwwwwwwwwWO...","..OSOwwwwwwwwOSO...","..OSOwwWwwwWwOSO...","...OOwWwwwwWwOO....",".....OwwwWwWO......",".....OwwwWwWO......",".....OBBBBBBO......",".....ObbOBBBO......",".....ObbO.BBO......",".....OrrO.OrO......","....OrrrO.OrrO.....","....OOOOO.OOOO....."];
const palette={O:"#302820",H:"#73291e",h:"#e37032",s:"#e8ae78",l:"#ffe0a1",S:"#ba7954",e:"#352a27",b:"#319ca1",B:"#25556c",r:"#b84b36",w:"#d0b15f",W:"#706638"};
function person(x,y,rows,pal=palette,flip=false){g.fillStyle="#30291e66";g.fillRect(x+3,y+rows.length-2,16,4);for(let yy=0;yy<rows.length;yy++)for(let xx=0;xx<rows[yy].length;xx++){let k=rows[yy][xx];if(k!==".")rect(g,x+(flip?rows[yy].length-1-xx:xx),y+yy,1,1,pal[k]||"#fff")}}
function can(x,y,empty=false){rect(g,x+1,y+1,7,12,"#4a3726");rect(g,x,y,6,10,empty?"#a9a495":"#ad4535");rect(g,x+1,y+1,1,8,empty?"#ddd5bc":"#f48e57");rect(g,x+2,y+3,4,4,"#eee0ab");rect(g,x,y,6,2,"#e5dbbe");rect(g,x+1,y,4,1,"#fcf2d7");rect(g,x+1,y+9,5,1,"#bfb59e")}
let state="idle",n=0,deadline=0,startAt=0,lastHit=-1000,lastBottle=-1000,remaining=8000,raf=0,points=0,best=0,bestT=Infinity,sound=true,ac;
try{let s=JSON.parse(localStorage.getItem("festival-record-v2")||"{}");points=s.points||0;best=s.best||0;bestT=s.bestT||Infinity;sound=s.sound!==false}catch{}
function save(){try{localStorage.setItem("festival-record-v2",JSON.stringify({points,best,bestT:Number.isFinite(bestT)?bestT:null,sound}))}catch{}}
function audio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume().catch(()=>{})}catch{}}
function beep(f,d=.07,type="triangle",delay=0){if(!sound||!ac)return;try{let o=ac.createOscillator(),a=ac.createGain(),t=ac.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);a.gain.setValueAtTime(.045,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(ac.destination);o.start(t);o.stop(t+d)}catch{}}
function draw(t){g.drawImage(bg,0,0);let phase=Math.sin(t/310);person(81,71+(phase>0?1:0),vendor,{...palette,H:"#57433a",h:"#b6a077",w:"#6e4b83",W:"#422b59",b:"#546178",B:"#333c53"});person(122,44+(phase<0?1:0),hero,{...palette,H:"#67472a",h:"#d1a749",b:"#91a95d",B:"#536b39",r:"#66503f"},true);person(157,76,vendor);let active=state==="run"&&t-lastHit<130;person(156+(active?1:0),119-(active?1:0),hero);
for(let i=0;i<Math.floor(n/8);i++)can(190+(i%2)*14,80+Math.floor(i/2)*19,true);
if(state==="run"){can(active?176:183,active?126:136);if(active){rect(g,173,130,5,2,"#efb77e");rect(g,175,131,2,3,"#cf8659")}if(t-lastBottle<320){let yy=111-(t-lastBottle)/22;rect(g,171,yy,2,5,"#ffed9e");rect(g,169,yy+2,6,1,"#fff9cf");rect(g,181,yy+5,2,2,"#fff3bd")}}

}
function update(t){$("time").textContent=(Math.max(0,remaining)/1000).toFixed(2);$("count").textContent=Math.floor(n/8)+" / 8";$("taps").textContent=n;$("bar").style.width=(Math.max(0,remaining)/80)+"%";$("bar").style.background=remaining<2000?"#dd614b":"";$("best").textContent="最高記録 "+best+" 本"+(best===8&&Number.isFinite(bestT)?" / "+(bestT/1000).toFixed(2)+"秒":"")+" ／ 銀 "+points+" pt";$("sound").textContent=sound?"♪ ON":"♪ OFF"}
function begin(){if(!["idle","win","lose"].includes(state))return;$("start").disabled=true;$("hit").disabled=true;audio();n=0;remaining=8000;state="ready";startAt=performance.now()+3000;lastHit=-1000;lastBottle=-1000;$("hit").textContent="準備…";$("dialog").textContent="よーい……";update()}
function finish(win,t){state=win?"win":"lose";let bottles=Math.floor(n/8);best=Math.max(best,bottles);if(win){points+=5;bestT=Math.min(bestT,8000-remaining);$("dialog").textContent="お見事！ 8本飲みきった！\nシルバーポイント 5点 獲得！";[523,659,784,1047].forEach((f,i)=>beep(f,.17,"triangle",i*.11));if(navigator.vibrate)navigator.vibrate([35,50,35])}else{$("dialog").textContent=bottles+"本か！ おしかったな。\nもう一度やってみるか？";beep(196,.2)}$("hit").classList.remove("down");$("hit").disabled=true;$("hit").textContent="終了";$("start").textContent="もう一度挑戦";$("start").disabled=false;save();update()}
function hit(){let t=performance.now();if(state!=="run")return;if(t>=deadline){remaining=0;finish(false,t);return}n++;lastHit=t;remaining=deadline-t;beep(200+(n%8)*34,.035,"triangle");if(n%8===0){lastBottle=t;beep(540+n*5,.11);if(n<64)$("dialog").textContent="ゴクゴク……！  "+Math.floor(n/8)+"本！"}if(n===64){finish(true,t)}update(t)}
let lastNum=0;function loop(t){if(state==="ready"){let num=Math.ceil((startAt-t)/1000);if(num>0){if(num!==lastNum){beep(350,.08);lastNum=num}$("dialog").textContent="よーい…… "+num;$("hit").textContent="準備 "+num}else{state="run";$("hit").disabled=false;deadline=startAt+8000;lastNum=0;$("hit").textContent="A  連打！";$("dialog").textContent="スタート！ Aを連打だ！";beep(780,.14)}}if(state==="run"){remaining=Math.max(0,deadline-t);if(remaining===0)finish(false,t);update(t)}draw(t);raf=requestAnimationFrame(loop)}
$("start").addEventListener("click",e=>{if(e.detail===0)return;begin()});$("start").addEventListener("keydown",e=>{if((e.code==="Enter"||e.code==="Space")&&!e.repeat){e.preventDefault();if(e.code==="Enter")begin()}});$("hit").addEventListener("pointerdown",e=>{e.preventDefault();if(state!=="run")return;$("hit").classList.add("down");hit()});for(let type of ["pointerup","pointercancel","pointerleave"])$("hit").addEventListener(type,()=>{$("hit").classList.remove("down")});window.addEventListener("keydown",e=>{if(["KeyA","Space","KeyZ"].includes(e.code)&&e.target.id!=="sound"){e.preventDefault();if(!e.repeat)hit()}});$("sound").onclick=()=>{sound=!sound;audio();save();update()};update();requestAnimationFrame(loop);

    g.save();g.translate(cupX,cupY);g.rotate(tilt);can(0,0,false,Math.max(.08,1-progress/8));g.restore();
    if(phase===2){
      rect(g,x+6,y-17-bob,2,2,"#faedb0");
      if(pulse)rect(g,x+7,y-19-bob,1,2,"#dff4e2");
    }
  }
  if(state==="run"&&t-lastBottle<310){
    let d=(t-lastBottle)/310;
    rect(g,x+18+d*10,y-21-d*7,3,3,"#f6d78b");
    rect(g,x+22+d*11,y-16-d*12,2,2,"#f1f0c0");
  }
}
function draw(t){
  const target=(state==="run"||state==="ready"||t<focusUntil)?1.62:1;
  cameraZoom+=(target-cameraZoom)*0.082;
  const targetX=(target>1)?219:160,targetY=(target>1)?105:90;
  cameraX+=(targetX-cameraX)*0.082;cameraY+=(targetY-cameraY)*0.082;
  g.clearRect(0,0,320,180);g.save();g.translate(160,90);g.scale(cameraZoom,cameraZoom);g.translate(-cameraX,-cameraY);
  g.drawImage(bg,0,0);
  const phase=Math.sin(t/310),palGirl={...palette,H:"#8a6223",h:"#edc66c",l:"#fff2bf",r:"#bf6871",b:"#8fbf94",B:"#487f70",w:"#efe3c9"};
  person(153,64+(phase>0?1:0),vendor,{...palette,H:"#76502a",h:"#ce8743",w:"#619391",W:"#365a59",b:"#566878",B:"#3c4857"});
  person(217,77,vendor,{...palette,H:"#7e4626",h:"#d98a55",w:"#7b994a",W:"#3b5a2a",B:"#4b5365"},true);
  person(198,102+(phase<0?1:0),hero,palGirl,true);
  for(let i=0;i<8;i++){
    const done=i<Math.floor(n/8),current=i===Math.floor(n/8)&&state==="run";
    if(current)continue;
    can(240+(i%2)*14,84+Math.floor(i/2)*14,done);
  }
  drinker(t);
  // Small blue-and-cream splash pixels emphasize every gulp.
  if(state==="run"&&t-lastHit<155){
    const age=(t-lastHit)/155;
    rect(g,232+age*4,86-age*6,2,3,"#ebf9c4");
    rect(g,235+age*6,88-age*8,1,2,"#92d6d1");
  }
  g.restore();
  if(state==="win"){
    for(let i=0;i<27;i++){
      let xx=(i*47+t/70*(i%3+1))%320,yy=(i*31+t/17)%180;
      rect(g,xx,yy,2,3,["#f1d16c","#d65764","#c5e5aa","#c5d9ed"][i%4])
    }
  }
}
function update(t){$("time").textContent=(Math.max(0,remaining)/1000).toFixed(2);$("count").textContent=Math.floor(n/8)+" / 8";$("taps").textContent=n;$("bar").style.width=(Math.max(0,remaining)/80)+"%";$("bar").style.background=remaining<2000?"#dd614b":"";$("best").textContent="最高記録 "+best+" 本"+(best===8&&Number.isFinite(bestT)?" / "+(bestT/1000).toFixed(2)+"秒":"")+" ／ 銀 "+points+" pt";$("sound").textContent=sound?"♪ ON":"♪ OFF"}
function begin(){if(!["idle","win","lose"].includes(state))return;$("start").disabled=true;$("hit").disabled=true;audio();n=0;remaining=8000;state="ready";startAt=performance.now()+3000;lastHit=-1000;lastBottle=-1000;focusUntil=0;$("hit").textContent="準備…";$("dialog").textContent="よーい……";update()}
function finish(win,t){state=win?"win":"lose";focusUntil=t+1100;let bottles=Math.floor(n/8);best=Math.max(best,bottles);if(win){points+=5;bestT=Math.min(bestT,8000-remaining);$("dialog").textContent="お見事！ 8本飲みきった！\nシルバーポイント 5点 獲得！";[523,659,784,1047].forEach((f,i)=>beep(f,.17,"triangle",i*.11));if(navigator.vibrate)navigator.vibrate([35,50,35])}else{$("dialog").textContent=bottles+"本か！ おしかったな。\nもう一度やってみるか？";beep(196,.2)}$("hit").classList.remove("down");$("hit").disabled=true;$("hit").textContent="終了";$("start").textContent="もう一度挑戦";$("start").disabled=false;save();update()}
function hit(){let t=performance.now();if(state!=="run")return;if(t>=deadline){remaining=0;finish(false,t);return}n++;lastHit=t;remaining=deadline-t;beep(200+(n%8)*34,.035,"triangle");if(n%8===0){lastBottle=t;beep(540+n*5,.11);if(n<64)$("dialog").textContent=Math.floor(n/8)+"本 飲んだ！"}if(n===64){finish(true,t)}update(t)}
let lastNum=0;function loop(t){if(state==="ready"){let num=Math.ceil((startAt-t)/1000);if(num>0){if(num!==lastNum){beep(350,.08);lastNum=num}$("dialog").textContent="よーい…… "+num;$("hit").textContent="準備 "+num}else{state="run";$("hit").disabled=false;deadline=startAt+8000;lastNum=0;$("hit").textContent="A  連打！";$("dialog").textContent="スタート！ Aを連打だ！";beep(780,.14)}}if(state==="run"){remaining=Math.max(0,deadline-t);if(remaining===0)finish(false,t);update(t)}draw(t);raf=requestAnimationFrame(loop)}
$("start").addEventListener("click",()=>begin());cv.style.touchAction="none";cv.addEventListener("pointerdown",e=>{e.preventDefault();hit()});$("hit").addEventListener("pointerdown",e=>{e.preventDefault();if(state!=="run")return;$("hit").classList.add("down");hit()});for(let type of ["pointerup","pointercancel","pointerleave"])$("hit").addEventListener(type,()=>{$("hit").classList.remove("down")});window.addEventListener("keydown",e=>{if(["KeyA","Space","KeyZ"].includes(e.code)&&e.target.id!=="sound"){e.preventDefault();if(!e.repeat)hit()}});$("sound").onclick=()=>{sound=!sound;audio();save();update()};update();requestAnimationFrame(loop);
</script></body></html>

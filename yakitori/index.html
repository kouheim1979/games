<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="焼き台の串を入れかえて同じ串を3本そろえ、焼いてお客さんの注文に届けるパズルゲーム。">
<meta name="theme-color" content="#f7f3e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="やきとり ならべ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" as="font" type="font/woff2" href="fonts/menu-round.woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script src="../i18n/dict/yakitori.js"></script>
<script src="../i18n/i18n.js"></script>
<title>やきとり ならべ</title>
</head>
<body>
<svg id="art-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" width="0" height="0"></svg>
<main class="home" id="home">
  <div class="home-card">
    <section class="cover" aria-labelledby="cover-title">
      <img class="cover-mark" src="../portal/logos/yakitori.webp" width="256" height="256" alt="" fetchpriority="high">
      <h1 id="cover-title">やきとり ならべ</h1>
      <p class="intro">同じ串を3本そろえて、焼きたてをお客さんへ。</p>
      <button type="button" class="btn primary open-shop" id="openShop"><span data-icon="shop"></span>開店する</button>
      <button type="button" class="text-button" id="homeHelp"><span data-icon="book"></span>遊び方</button>
      <p id="homeBest" class="best" hidden></p>
    </section>
    <section class="menu-page" aria-labelledby="menu-title">
      <div class="menu-heading"><h2 id="menu-title">お品書き</h2><span>一皿3本</span></div>
      <ul class="menu" id="menu"></ul>
    </section>
  </div>
</main>

<main class="game" id="game" hidden>
  <header class="game-header">
    <h1 class="brand"><img src="../portal/logos/yakitori.webp" width="56" height="56" alt=""><span>やきとり ならべ</span></h1>
    <div class="hud">
      <div class="stat"><small>レベル</small><b id="lv">1</b></div>
      <div class="stat"><small>売上</small><b id="money">¥0</b></div>
      <div class="stat"><small>残りのハート</small><span class="hearts" id="hearts" role="img"></span></div>
    </div>
    <div class="game-actions">
      <button type="button" class="iconbtn" id="mute" aria-label="音のオンオフ" title="音のオンオフ"></button>
      <button type="button" class="iconbtn" id="pause" aria-label="ひと休み" title="ひと休み"><span data-icon="pause"></span></button>
    </div>
  </header>

  <div class="worktop">
    <section class="orders-panel" aria-labelledby="orders-title">
      <div class="section-heading"><h2 id="orders-title"><span data-icon="tray"></span>ご注文</h2><span class="queue" id="queue"></span></div>
      <div class="counter" id="counter"></div>
      <div class="tray" id="tray" aria-live="polite"></div>
    </section>
    <section class="grills-panel" aria-labelledby="grills-title">
      <div class="section-heading"><h2 id="grills-title"><span data-icon="grill"></span>焼き台</h2><p class="tip" id="tip"></p></div>
      <div class="board" id="board" role="group" aria-labelledby="grills-title"></div>
    </section>
    <div class="controls">
      <button type="button" class="tool" id="shuffle"><span data-icon="shuffle"></span><span>まぜる<small id="shuffleLeft"></small></span></button>
      <button type="button" class="tool" id="extra"><span data-icon="extra"></span><span>台をふやす<small id="extraLeft"></small></span></button>
      <button type="button" class="tool" id="retry"><span data-icon="retry"></span><span>やりなおす</span></button>
    </div>
  </div>
</main>

<dialog class="modal" id="modal" aria-labelledby="sheet-title"><div class="sheet" id="sheet"></div></dialog>
<script src="art.js"></script>
<script>
"use strict";
const SLOTS = 3;
const SEATS = 3;

const store = {
  get(k, d) { try { const v = localStorage.getItem("yakitori:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("yakitori:" + k, JSON.stringify(v)); } catch {} },
};

// ---- 音 ----
let actx = null, muted = store.get("muted", false);
function ac() { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function tone(freq, dur = .08, type = "triangle", vol = .12, when = 0) {
  if (muted) return;
  try {
    const a = ac(), t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
  } catch {}
}
function sizzle() {
  if (muted) return;
  try {
    const a = ac(), len = a.sampleRate * .9, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < .3 ? 1 : .3) * (1 - i / len);
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; f.type = "highpass"; f.frequency.value = 2500; g.gain.value = .07;
    src.connect(f).connect(g).connect(a.destination); src.start();
  } catch {}
}
const sfx = {
  pick: () => tone(520, .06),
  drop: () => tone(330, .08),
  no: () => tone(140, .12, "square", .06),
  pop: () => tone(700, .07, "sine", .1),
  coin: () => { tone(988, .09, "square", .06); tone(1319, .18, "square", .06, .08); },
  angry: () => { tone(220, .15, "sawtooth", .06); tone(180, .2, "sawtooth", .06, .12); },
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

// ---- 状態 ----
let S, L, uid = 0;
const $ = id => document.getElementById(id);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const clone = x => JSON.parse(JSON.stringify(x));

function levelSpec(n) {
  const grills = Math.min(6 + 3 * Math.floor((n - 1) / 2), 12);   // 6,6,9,9,12...
  const kinds = Math.min(3 + n, KIND_ORDER.length);                 // 4,5,6,...9
  const sets = Math.min(1 + Math.floor(n / 2), 4);                  // 1種類あたり何皿（3本で1皿）
  const empty = grills >= 9 ? 5 : 4;                                // 最初の空きスロット
  const patience = Math.max(40, 80 - n * 4);
  return { grills, kinds, sets, empty, patience };
}

function makeLayout(spec) {
  const kinds = shuffle(KIND_ORDER.slice()).slice(0, spec.kinds);
  const orders = kinds.flatMap(k => Array(spec.sets).fill(k));
  for (let tries = 0; tries < 300; tries++) {
    const items = shuffle(orders.flatMap(k => [k, k, k]));
    const cap = spec.grills * SLOTS;
    const vis = Math.min(items.length, cap - spec.empty);
    const slots = shuffle(items.slice(0, vis).concat(Array(cap - vis).fill(null)));
    const grills = [];
    for (let g = 0; g < spec.grills; g++) grills.push({ slots: slots.slice(g * 3, g * 3 + 3), layers: [] });
    if (grills.some(g => g.slots[0] && g.slots.every(s => s === g.slots[0]))) continue;
    // 残りは各焼き台の補充分として順に配る。
    let rest = items.slice(vis), gi = 0;
    const order = shuffle(grills.slice());
    while (rest.length) {
      const n = Math.min(rest.length, Math.random() < .6 ? 3 : 2);
      const layer = shuffle(rest.splice(0, n).concat(Array(3 - n).fill(null)));
      order[gi % order.length].layers.push(layer); gi++;
    }
    return { grills, orders };
  }
}

function startGame() { S = { level: 1, money: 0, misses: 0 }; startLevel(); }

function startLevel(retry = false) {
  const spec = levelSpec(S.level), prev = L;
  if (retry && prev) { L = { spec, layout: prev.layout, retryMoney: prev.retryMoney }; S.money = prev.retryMoney; }
  else L = { spec, layout: makeLayout(spec), retryMoney: S.money };
  const lay = clone(L.layout);
  Object.assign(L, {
    gen: ++uid,
    grills: lay.grills.map(g => ({ id: ++uid, slots: g.slots, layers: g.layers, busy: false })),
    pool: lay.orders.slice(), lines: Array(SEATS).fill(null), tray: [], seats: Array(SEATS).fill(null),
    nextArrive: [0.3, 1.8, 3.6], earned: 0, done: false, sel: null,
    shuffleLeft: 2, extraLeft: 1, elapsed: 0, pending: [],
  });
  L.tip = S.level === 1
    ? "同じ串を3本そろえよう"
    : `左皿から補充・${spec.kinds}種類・${lay.orders.length}皿`;
  $("board").innerHTML = ""; gEls.clear(); popIn.clear();
  renderSeats(true); render(); fillQueue();
}

// ---- ルール ----
const isFull3 = g => g.slots[0] && g.slots.every(s => s === g.slots[0]);
const hasSpace = g => !g.busy && g.slots.includes(null);

function moveSk(fromG, fromS, toG, toS) {
  const A = L.grills[fromG], B = L.grills[toG];
  if (!A || !B || A.busy || B.busy || !A.slots[fromS]) return false;
  if (toS == null || B.slots[toS]) toS = B.slots.indexOf(null);
  if (toS < 0 || (fromG === toG && fromS === toS)) return false;
  B.slots[toS] = A.slots[fromS]; A.slots[fromS] = null;
  L.sel = null; sfx.drop();
  popIn.add(B.id + ":" + toS);
  if (isFull3(B)) cookGrill(B);
  if (fromG !== toG) refill(A);
  render(); checkStuck();
  return true;
}

function refill(g) {
  if (g.busy || g.slots.some(Boolean) || !g.layers.length) return;
  g.slots = g.layers.shift();
  g.slots.forEach((s, i) => s && popIn.add(g.id + ":" + i));
  sfx.pop();
  if (isFull3(g)) cookGrill(g);
}

function cookGrill(g) {
  g.busy = true; sizzle(); buzz(30);
  const kind = g.slots[0], gen = L.gen;
  afterInLevel(() => {
    if (L.gen !== gen) return;
    g.slots = [null, null, null]; g.busy = false;
    deliver(kind); refill(g); render(); checkStuck(); checkClear();
  }, 1050);
}

function checkStuck() {
  if (L.done || L.grills.some(g => g.busy)) return;
  if (L.grills.some(hasSpace)) return;
  if (!L.grills.some(g => g.slots.some(Boolean))) return;
  afterInLevel(() => { if (!L.done && !L.grills.some(hasSpace) && !L.grills.some(g => g.busy)) showModal("stuck"); }, 400);
}

function doShuffle() {
  if (L.shuffleLeft <= 0 || L.done || L.grills.some(g => g.busy)) return;
  L.shuffleLeft--;
  const all = L.grills.flatMap(g => g.slots);
  for (let t = 0; t < 50; t++) {
    shuffle(all);
    const ok = L.grills.every((g, i) => { const s = all.slice(i * 3, i * 3 + 3); return !(s[0] && s.every(x => x === s[0])); });
    if (ok || t === 49) break;
  }
  L.grills.forEach((g, i) => { g.slots = all.slice(i * 3, i * 3 + 3); g.slots.forEach((s, j) => s && popIn.add(g.id + ":" + j)); });
  L.sel = null; sfx.pop(); render();
}
function addGrill() {
  if (L.extraLeft <= 0 || L.done) return;
  L.extraLeft--; L.grills.push({ id: ++uid, slots: [null, null, null], layers: [], busy: false }); sfx.pop(); render();
}

// ---- お客さん ----
function deliver(kind) {
  let best = -1;
  L.seats.forEach((c, i) => { if (c && !c.leaving && c.kind === kind && (best < 0 || c.left < L.seats[best].left)) best = i; });
  if (best >= 0) serve(best); else { L.tray.push(kind); renderTray(); }
}
function serve(i) {
  const c = L.seats[i], price = KINDS[c.kind].price;
  const tip = Math.round(price * 0.5 * (c.left / c.max) / 10) * 10;
  S.money += price + tip; L.earned += price + tip;
  sfx.coin(); buzz(20);
  c.leaving = "happy"; c.msg = tip > 0 ? `+¥${price} チップ¥${tip}` : `+¥${price}`;
  renderSeats(); renderHud();
  const gen = L.gen;
  afterInLevel(() => { if (L.gen !== gen) return; L.seats[i] = null; L.nextArrive[i] = .8 + Math.random(); renderSeats(); checkClear(); }, 1100);
}
// 各席のうしろに、つぎに座るお客さんが1人ずつ並ぶ
function pickKind() {
  let kind = L.tray.find(k => L.pool.includes(k) && !L.lines.some(q => q && q.kind === k));
  if (kind) return kind;
  // 焼き台に見えてる本数が多い串ほど注文されやすい
  const vis = {};
  L.grills.forEach(g => g.slots.forEach(s => s && (vis[s] = (vis[s] || 0) + 1)));
  L.seats.forEach(c => c && !c.leaving && (vis[c.kind] = (vis[c.kind] || 0) - 3));
  L.lines.forEach(q => q && (vis[q.kind] = (vis[q.kind] || 0) - 3));
  const w = L.pool.map(k => .3 + Math.max(0, vis[k] || 0) ** 2);
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  return L.pool[w.findIndex(x => (r -= x) < 0)] || pick(L.pool);
}
function fillQueue() {
  for (let i = 0; i < SEATS; i++) {
    if (L.lines[i] || !L.pool.length) continue;
    const kind = pickKind();
    L.pool.splice(L.pool.indexOf(kind), 1);
    L.lines[i] = { kind, face: pick(FACES) };
  }
  renderSeats(); renderQueue();
}
function arrive(i) {
  if (!L.lines[i]) fillQueue();
  let from = i;
  if (!L.lines[i]) from = L.lines.findIndex(Boolean); // 自分の列が空なら、ほかの列の人が座る
  if (from < 0) return;
  const q = L.lines[from]; L.lines[from] = null;
  const max = L.spec.patience * (.85 + Math.random() * .3);
  L.seats[i] = { kind: q.kind, max, left: max, face: q.face, fresh: true };
  fillQueue();
  const t = L.tray.indexOf(q.kind);
  if (t >= 0) { L.tray.splice(t, 1); renderTray(); const gen = L.gen; afterInLevel(() => L.gen === gen && L.seats[i] && !L.seats[i].leaving && serve(i), 500); }
}
function timeout(i) {
  const c = L.seats[i];
  c.leaving = "angry"; c.msg = "おそい！"; L.pool.push(c.kind); fillQueue();
  S.misses++; sfx.angry(); buzz([60, 40, 60]);
  renderSeats(); renderHud(); renderQueue();
  const gen = L.gen;
  afterInLevel(() => {
    if (L.gen !== gen) return;
    L.seats[i] = null; L.nextArrive[i] = 1.5 + Math.random(); renderSeats();
    if (S.misses >= 3) gameOver();
  }, 1100);
}
function checkClear() {
  if (L.done) return;
  const left = L.grills.some(g => g.slots.some(Boolean) || g.layers.length || g.busy);
  if (!left && !L.pool.length && L.lines.every(q => !q) && !L.tray.length && L.seats.every(s => !s)) {
    L.done = true; saveBest(S.level);
    afterInLevel(() => showModal("clear"), 300);
  }
}
function saveBest(level) {
  const best = store.get("best", { level: 0, money: 0 });
  store.set("best", { level: Math.max(best.level, level), money: Math.max(best.money, S.money) });
}
function gameOver() { if (L.done) return; L.done = true; saveBest(S.level - 1); showModal("over"); }

// ---- 描画 ----
const gEls = new Map(), popIn = new Set();

function prepPlate(layer, side) {
  const contents = layer.filter(Boolean).map(k => KINDS[k].name).join("、") || "空皿";
  const label = side === 0 ? `左皿（つぎ）：${contents}` : `右皿（そのつぎ）：${contents}`;
  const skewers = layer.map((k, i) => k
    ? `<use href="#skewer-${k}" transform="translate(${29 + 30 * i} 29) rotate(18) scale(.47) translate(-30 -60)"/>`
    : "").join("");
  return `<svg class="prep-plate" viewBox="0 0 120 65" role="img" aria-label="${label}" focusable="false"><use href="#prep-dish"/>${skewers}</svg>`;
}
function renderPrepPlates(row, layers) {
  const sig = JSON.stringify([layers[0], layers[1], layers.length]);
  if (row.dataset.sig === sig) return;
  row.dataset.sig = sig;
  const more = layers.length - 2;
  row.innerHTML = prepPlate(layers[0] || [], 0) + prepPlate(layers[1] || [], 1)
    + (more > 0 ? `<span class="reserve-count" role="img" aria-label="さらに${more}段">+${more}</span>` : "");
}
function slotMarkup(g, k, si) {
  const key = g.id + ":" + si, pop = popIn.delete(key);
  const label = k ? KINDS[k].name : "空き場所";
  const skewer = k ? `<span class="sk${pop ? " pop" : ""}${g.busy ? " cook" : ""}" data-s="${si}">${skSVG(k)}</span>` : "";
  const smoke = g.busy && si === 1 ? '<span class="smoke"></span>' : "";
  return `<button type="button" class="slot ${k ? "filled" : "empty"}" data-s="${si}" aria-label="${label}" ${k ? 'aria-pressed="false"' : ""}>${skewer}${smoke}</button>`;
}
function render() {
  const board = $("board");
  board.classList.toggle("deep", L.grills.length > 9);
  const focused = document.activeElement.closest(".slot");
  const focusGrill = focused && focused.closest(".grill");
  L.grills.forEach((g, gi) => {
    let el = gEls.get(g.id);
    if (!el) {
      const station = document.createElement("div"); station.className = "grill-station";
      station.setAttribute("role", "group"); station.setAttribute("aria-label", `焼き台${gi + 1}`);
      el = document.createElement("div"); el.className = "grill"; el.dataset.id = g.id;
      const plates = document.createElement("div"); plates.className = "prep-plates";
      station.append(el, plates); board.appendChild(station);
      gEls.set(g.id, el);
    }
    renderPrepPlates(el.nextElementSibling, g.layers);
    const sig = g.slots.join(",") + "|" + g.busy;
    if (el.dataset.sig !== sig || [...popIn].some(k => k.startsWith(g.id + ":"))) {
      el.innerHTML = g.slots.map((k, si) => slotMarkup(g, k, si)).join("");
      el.dataset.sig = sig;
      el.classList.toggle("done", g.busy);
      el.setAttribute("aria-busy", String(g.busy));
    }
    const selHere = L.sel && L.sel.g === gi;
    el.querySelectorAll(".sk").forEach(sk => {
      const selected = !!selHere && +sk.dataset.s === L.sel.s;
      sk.classList.toggle("sel", selected);
      sk.closest(".slot").setAttribute("aria-pressed", String(selected));
    });
    el.classList.toggle("can", !!L.sel && !selHere && hasSpace(g));
  });
  if (focused && !focused.isConnected && focusGrill.isConnected)
    focusGrill.querySelector(`.slot[data-s="${focused.dataset.s}"]`)?.focus({ preventScroll: true });

  $("tip").textContent = L.sel ? "移動先の焼き台をタップ" : L.tip;
  $("shuffle").disabled = L.shuffleLeft <= 0 || L.grills.some(g => g.busy);
  $("shuffleLeft").textContent = `のこり${L.shuffleLeft}`;
  $("extra").disabled = L.extraLeft <= 0;
  $("extraLeft").textContent = `のこり${L.extraLeft}`;
  renderHud(); renderTray(); renderQueue();
}
function renderHud() {
  $("lv").textContent = S.level;
  $("money").textContent = "¥" + S.money.toLocaleString();
  const left = Math.max(0, 3 - S.misses);
  const hearts = $("hearts");
  if (hearts.dataset.left === String(left)) return;
  hearts.dataset.left = left;
  hearts.setAttribute("aria-label", `ハート残り${left}個`);
  hearts.innerHTML = [0, 1, 2].map(i => `<span class="${i < left ? "" : "lost"}">${ui("heart")}</span>`).join("");
}
function renderTray() {
  const tray = $("tray"), signature = L.tray.join(",");
  if (tray.dataset.items === signature) return;
  tray.dataset.items = signature;
  tray.innerHTML = L.tray.length ? `<span class="tray-label">${ui("tray")}焼き上がり</span>` +
    L.tray.map(k => `<span class="dish">${icon(k)}<span>${KINDS[k].name}</span><span>×3</span></span>`).join("") : "";
}
function renderQueue() {
  $("queue").textContent = L.pool.length ? `待ち${L.pool.length}人` : "";
}
const seatEls = [];
function renderSeats(init) {
  const counter = $("counter");
  if (init || !seatEls.length) {
    counter.innerHTML = ""; seatEls.length = 0;
    for (let i = 0; i < SEATS; i++) {
      const d = document.createElement("div");
      counter.appendChild(d); seatEls.push(d);
    }
  }
  L.seats.forEach((c, i) => {
    const d = seatEls[i], q = L.lines[i];
    const sig = (c ? c.face + c.kind + (c.leaving || "") : "empty") + "/" + (q ? q.face + q.kind : "");
    if (d.dataset.sig === sig) return;
    d.dataset.sig = sig;
    d.className = "seat " + (!c ? "vacant" : c.leaving || (c.fresh ? "arrive" : ""));
    const back = q ? `<div class="behind"><span class="tag">つぎ</span>${icon(q.kind)}<span>${KINDS[q.kind].name}</span></div>` : "";
    if (!c) {
      d.innerHTML = `<div class="order-main"><span class="face stool">${ui("stool")}</span><span class="order-text empty-seat">空席</span></div><div class="pbar"></div>${back}`;
      return;
    }
    c.fresh = false;
    d.innerHTML = `<div class="order-main"><span class="face">${portrait(c.face, c.leaving)}</span>
      <span class="order-food">${skSVG(c.kind)}</span><span class="order-text"><strong>${KINDS[c.kind].name}</strong><small>×3本</small></span></div>
      <div class="pbar"><i></i></div>${back}${c.msg ? `<div class="msg ${c.leaving === "happy" ? "good" : "bad"}">${c.msg}</div>` : ""}`;
    c.bar = d.querySelector(".pbar i"); updateBar(c);
  });
}
function updateBar(c) {
  if (!c.bar) return;
  const r = Math.max(0, c.left / c.max);
  c.bar.style.transform = `scaleX(${r})`;
  c.bar.style.background = r > .5 ? "var(--ok)" : r > .25 ? "#E0A020" : "var(--bad)";
}

// ---- 操作（タップ／ドラッグ） ----
let drag = null;
const gIndexOf = el => L.grills.findIndex(g => g.id === +el.dataset.id);
function grillAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el && el.closest(".grill");
}
$("board").addEventListener("pointerdown", e => {
  if (!L || L.done || paused) return;
  const gEl = e.target.closest(".grill"); if (!gEl) return;
  const gi = gIndexOf(gEl), g = L.grills[gi];
  const slotEl = e.target.closest(".slot");
  const skEl = slotEl && slotEl.querySelector(".sk");
  drag = { x: e.clientX, y: e.clientY, gi, si: skEl ? +skEl.dataset.s : null, slot: slotEl ? +slotEl.dataset.s : null, moved: false, ghost: null, skEl, id: e.pointerId };
  if (skEl && !g.busy) { try { $("board").setPointerCapture(e.pointerId); } catch {} }
});
$("board").addEventListener("pointermove", e => {
  if (!drag || drag.si == null || drag.id !== e.pointerId) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
    if (L.grills[drag.gi].busy) return;
    drag.moved = true; L.sel = { g: drag.gi, s: drag.si }; sfx.pick();
    const k = L.grills[drag.gi].slots[drag.si];
    drag.ghost = document.createElement("div"); drag.ghost.className = "ghost";
    const size = drag.skEl.getBoundingClientRect();
    drag.ghost.style.width = size.width + "px"; drag.ghost.style.height = size.height + "px";
    drag.ghost.innerHTML = skSVG(k); document.body.appendChild(drag.ghost);
    render(); const sk = gEls.get(L.grills[drag.gi].id).querySelector(`.sk[data-s="${drag.si}"]`); sk && sk.classList.add("dragging");
  }
  if (drag.moved) {
    drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
    const t = grillAt(e.clientX, e.clientY);
    const ti = t ? gIndexOf(t) : -1;
    const destination = ti >= 0 && ti !== drag.gi && hasSpace(L.grills[ti]) ? t : null;
    gEls.forEach(el => el.classList.toggle("hover", el === destination));
  }
});
function endDrag(e) {
  if (!drag || drag.id !== e.pointerId) return;
  const d = drag; drag = null;
  gEls.forEach(el => el.classList.remove("hover"));
  if (d.moved) {
    d.ghost.remove(); d.skEl?.classList.remove("dragging");
    const t = grillAt(e.clientX, e.clientY);
    const ti = t ? gIndexOf(t) : -1;
    let slot = null;
    if (t) { const s = document.elementFromPoint(e.clientX, e.clientY)?.closest(".slot"); if (s) slot = +s.dataset.s; }
    if (paused || L.done || ti < 0 || ti === d.gi || !moveSk(d.gi, d.si, ti, slot)) {
      if (ti >= 0 && ti !== d.gi) { sfx.no(); shakeEl(t); }
      L.sel = null; render();
    }
    return;
  }
  if (!paused && !L.done) tap(d.gi, d.si, d.slot);
}
$("board").addEventListener("pointerup", endDrag);
function cancelDrag() {
  if (!drag) return;
  drag.ghost?.remove();
  drag.skEl?.classList.remove("dragging");
  gEls.forEach(el => el.classList.remove("hover"));
  drag = null; L.sel = null; render();
}
$("board").addEventListener("pointercancel", cancelDrag);
// Keyboard and assistive clicks have no preceding pointerup.
$("board").addEventListener("click", e => {
  if (e.detail !== 0 || paused || !L || L.done) return;
  const slot = e.target.closest(".slot");
  if (slot) tap(gIndexOf(slot.closest(".grill")), slot.classList.contains("filled") ? +slot.dataset.s : null, +slot.dataset.s);
});

function tap(gi, si, slot) {
  const g = L.grills[gi];
  if (L.sel) {
    const { g: fg, s: fs } = L.sel;
    if (fg === gi && fs === si) { L.sel = null; render(); return; }
    if (fg !== gi) {
      if (hasSpace(g)) { moveSk(fg, fs, gi, si == null ? slot : null); return; }
      if (si != null && !g.busy) { L.sel = { g: gi, s: si }; sfx.pick(); render(); return; }
      sfx.no(); shakeEl(gEls.get(g.id)); L.sel = null; render(); return;
    }
    if (si != null) { L.sel = { g: gi, s: si }; sfx.pick(); render(); return; }
    // 同じ焼き台の空きに動かす
    moveSk(fg, fs, gi, slot); return;
  }
  if (si != null && !g.busy) { L.sel = { g: gi, s: si }; sfx.pick(); render(); }
}
function shakeEl(el) { if (!el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

// ---- ループ ----
let last = performance.now(), paused = true;
// Cooking, seating and the patience meters all stop while a sheet is open.
function afterInLevel(callback, delay) {
  L.pending.push({ at: L.elapsed + delay, callback });
  L.pending.sort((a, b) => a.at - b.at);
}
function loop(now) {
  const dt = Math.max(0, (now - last) / 1000); last = now;
  if (!paused && L) {
    L.elapsed += dt * 1000;
    while (!paused && L.pending.length && L.pending[0].at <= L.elapsed) L.pending.shift().callback();
  }
  if (!paused && L && !L.done) {
    L.seats.forEach((c, i) => {
      if (!c) { L.nextArrive[i] -= dt; if (L.nextArrive[i] <= 0 && (L.lines.some(Boolean) || L.pool.length)) arrive(i); return; }
      if (c.leaving) return;
      c.left -= dt; updateBar(c);
      if (c.left <= 0) timeout(i);
    });
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener("visibilitychange", () => { if (document.hidden && !paused && L && !L.done) showModal("pause"); });

// ---- 表紙・遊び方・営業中のダイアログ ----
const modal = $("modal");
const resultMark = '<img class="sheet-mark" src="../portal/logos/yakitori.webp" width="65" height="65" alt="">';
function showTitle() {
  if (modal.open) modal.close();
  paused = true;
  $("game").hidden = true; $("home").hidden = false;
  const best = store.get("best", { level: 0, money: 0 });
  $("homeBest").hidden = !best.money && !best.level;
  $("homeBest").textContent = `さいこう記録：LEVEL ${best.level} ／ ¥${best.money.toLocaleString()}`;
  window.scrollTo(0, 0);
}
function hideModal() {
  if (modal.open) modal.close();
  paused = $("game").hidden; last = performance.now();
}
function showModal(type) {
  paused = true;
  if (drag) cancelDrag();
  const sheet = $("sheet");
  modal.dataset.panel = type;
  if (type === "help") {
    sheet.innerHTML = `<h2 id="sheet-title">遊び方</h2><ul class="rules">
      <li>${ui("move")}<span>串を選んで、移動先の焼き台をタップ。ドラッグでも動かせます。</span></li>
      <li>${ui("grill")}<span>ひとつの焼き台に同じ串を3本そろえると焼けて、注文したお客さんに届く</span></li>
      <li>${ui("clock")}<span>早く届けるほどチップが多い。3人おこらせると閉店…</span></li></ul>
      <div class="next-help"><p>焼き台が空くと、手前の左皿の串が焼き台に移ります。右皿の串はその次です。</p>
      <p>注文票の下の「つぎ」は、次にその席に座る人の注文です。</p></div>
      <button class="btn primary" id="go">もどる</button>`;
    $("go").onclick = returnFromHelp;
  } else if (type === "clear") {
    sheet.innerHTML = `${resultMark}<h2 id="sheet-title">まいど！</h2><p>LEVEL ${S.level} クリア</p>
      <p class="big">+¥${L.earned.toLocaleString()}</p><p>売上 ¥${S.money.toLocaleString()}</p>
      <button class="btn primary" id="go">つぎのお客さんへ</button>`;
    $("go").onclick = () => { hideModal(); S.level++; startLevel(); };
  } else if (type === "over") {
    sheet.innerHTML = `${resultMark}<h2 id="sheet-title">本日閉店…</h2><p>お客さんを3人おこらせちゃった</p>
      <p class="big">LEVEL ${S.level}</p><p>売上 ¥${S.money.toLocaleString()}</p>
      <button class="btn primary" id="go">このレベルからやりなおす</button><button class="btn" id="title">さいしょから</button>`;
    $("go").onclick = () => { hideModal(); S.misses = 0; startLevel(true); };
    $("title").onclick = () => { showTitle(); $("openShop").focus({ preventScroll: true }); };
  } else if (type === "stuck") {
    const canShuffle = L.shuffleLeft > 0, canExtra = L.extraLeft > 0;
    sheet.innerHTML = `<h2 id="sheet-title">焼き台がいっぱい！</h2><p>空いてる場所がなくなっちゃった</p>
      ${canExtra ? `<button class="btn primary" id="a1">${ui("extra")}台をふやす</button>` : ""}
      ${canShuffle ? `<button class="btn ${canExtra ? "" : "primary"}" id="a2">${ui("shuffle")}まぜる</button>` : ""}
      <button class="btn" id="a3">やりなおす</button>`;
    if (canExtra) $("a1").onclick = () => { hideModal(); addGrill(); };
    if (canShuffle) $("a2").onclick = () => { hideModal(); doShuffle(); checkStuck(); };
    $("a3").onclick = () => { hideModal(); startLevel(true); };
  } else if (type === "pause") {
    sheet.innerHTML = `${resultMark}<h2 id="sheet-title">ひと休み</h2><p>お客さんは待っててくれてるよ</p>
      <button class="btn primary" id="go">再開</button><button class="btn" id="help">${ui("book")}遊び方</button>`;
    $("go").onclick = hideModal;
    $("help").onclick = () => showModal("help");
  } else if (type === "retry") {
    sheet.innerHTML = `<h2 id="sheet-title">やりなおす？</h2><p>このレベルを最初の並びからやりなおすよ（売上もレベル開始時にもどる）</p>
      <button class="btn primary" id="go">やりなおす</button><button class="btn" id="no">つづける</button>`;
    $("go").onclick = () => { hideModal(); startLevel(true); };
    $("no").onclick = hideModal;
  }
  if (!modal.open) modal.showModal();
  (sheet.querySelector("#no") || sheet.querySelector("button")).focus({ preventScroll: true });
}
function returnFromHelp() {
  if ($("home").hidden) showModal("pause"); else hideModal();
}
modal.addEventListener("cancel", e => {
  e.preventDefault();
  if (modal.dataset.panel === "help") returnFromHelp();
  else if (["pause", "retry"].includes(modal.dataset.panel)) hideModal();
});

document.querySelectorAll("[data-icon]").forEach(el => { el.innerHTML = ui(el.dataset.icon); });
$("menu").innerHTML = KIND_ORDER.map(k => `<li>${skSVG(k)}<span class="kind-name">${KINDS[k].name}</span><span class="price">¥${KINDS[k].price}</span></li>`).join("");
$("openShop").onclick = () => {
  $("home").hidden = true; $("game").hidden = false;
  window.scrollTo(0, 0);
  paused = false; last = performance.now(); startGame();
};
$("homeHelp").onclick = () => showModal("help");
$("shuffle").onclick = doShuffle;
$("extra").onclick = addGrill;
$("retry").onclick = () => L && !L.done && showModal("retry");
$("pause").onclick = () => L && !L.done && showModal("pause");
function renderSound() {
  $("mute").innerHTML = ui(muted ? "mute" : "sound");
  $("mute").setAttribute("aria-pressed", String(!muted));
}
$("mute").onclick = () => { muted = !muted; store.set("muted", muted); renderSound(); };
renderSound();
showTitle();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eafaf4">
<meta name="description" content="1問だけで答えられる心理テスト20本。直感で選ぶと、あなたの意外な一面がわかるかも。登録なし・無料でブラウザーですぐ遊べる診断パークのアプリです。">
<title>1問心理テスト｜診断パーク</title>
<style>
:root{--ink:#1f2140;--muted:#5a5f7d;--paper:#fff;--accent:#14a37f;--accent2:#c6f2e3;--pop:#ffe05c;--bg:#eafaf4;--shadow:5px 6px 0 var(--ink)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;color:var(--ink);line-height:1.65;background:var(--bg);
  background-image:radial-gradient(rgba(31,33,64,.13) 1.3px,transparent 1.3px);background-size:24px 24px;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:4px solid #3f6bff;outline-offset:3px}
.shell{width:min(100% - 32px,680px);margin:0 auto;padding:18px 0 max(40px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.back{font-size:13px;font-weight:800;color:var(--ink);text-decoration:none;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:6px 12px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.chip{font-size:11px;font-weight:900;background:var(--accent2);border:2px solid var(--ink);border-radius:999px;padding:5px 10px;white-space:nowrap}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:22px 20px}
.head{position:relative;overflow:hidden;margin-bottom:18px}
.head::after{content:"🧠";position:absolute;right:-4px;top:-12px;font-size:90px;opacity:.15;transform:rotate(12deg)}
.kick{display:inline-block;font-size:11px;font-weight:900;background:var(--pop);border:2px solid var(--ink);border-radius:999px;padding:4px 10px}
h1{font-size:clamp(26px,7vw,34px);margin:8px 0 6px;line-height:1.25}
.head p{margin:0 0 14px;color:var(--muted)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800}
.bar{flex:1;height:12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.btn{display:block;width:100%;border:3px solid var(--ink);border-radius:16px;background:var(--accent);color:#fff;font-weight:900;font-size:17px;padding:14px;box-shadow:4px 4px 0 var(--ink);text-align:center;text-decoration:none}
.btn.sub{background:var(--paper);color:var(--ink);font-size:15px;padding:12px}
.btn:active,.opt:active,.tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:18px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:12px 12px 11px;box-shadow:3px 3px 0 var(--ink);display:grid;gap:4px;align-content:start;min-height:108px}
.tile .em{font-size:28px;line-height:1}
.tile .no{font-size:10.5px;font-weight:900;color:var(--muted)}
.tile strong{font-size:14px;line-height:1.35}
.tile.done{background:#f3fbf8}
.tile.done::after{content:"済";position:absolute;right:8px;top:8px;font-size:11px;font-weight:900;color:#fff;background:var(--accent);border:2px solid var(--ink);border-radius:999px;width:24px;height:24px;display:grid;place-items:center}
@media(hover:hover){.tile:hover,.opt:hover{background:#fffbe8}}
.qno{font-size:12px;font-weight:900;color:var(--muted);margin:0}
.qem{font-size:56px;line-height:1.1;display:inline-grid;place-items:center;width:92px;height:92px;border-radius:26px;background:var(--accent2);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transform:rotate(-5deg);margin:10px 0 14px}
.qcenter{text-align:center}
.scene{font-size:15px;color:var(--muted);margin:0 0 6px;text-align:left}
.q{font-size:clamp(19px,5vw,23px);line-height:1.45;margin:0 0 6px;text-align:left}
.hint{font-size:12.5px;font-weight:800;color:var(--accent);margin:0 0 16px;text-align:left}
.opts{display:grid;gap:11px}
.opt{text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:15px;padding:13px 14px;font-size:16px;font-weight:700;box-shadow:3px 3px 0 var(--ink);display:flex;gap:11px;align-items:center}
.opt b{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent2);border:2px solid var(--ink);font-size:14px}
.reveal{background:var(--pop);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;margin:0 0 16px;font-weight:800;text-align:left}
.reveal small{display:block;font-size:12px;color:var(--muted)}
.pick{font-size:13px;font-weight:800;color:var(--muted);margin:0 0 4px}
.rname{font-size:clamp(23px,6.4vw,30px);line-height:1.3;margin:0 0 12px}
.desc{text-align:left;margin:0 0 14px}
.others{text-align:left;border:2.5px solid var(--ink);border-radius:14px;padding:4px 14px;background:#fffdf6;margin-top:6px}
.others summary{font-weight:900;font-size:14px;padding:8px 0;cursor:pointer}
.others dl{margin:0 0 10px}
.others dt{font-weight:900;font-size:14px;margin-top:8px}
.others dd{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.note{font-size:12px;color:var(--muted);text-align:center;margin:18px 4px 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><a class="back" href="../">← 診断パーク</a><span class="chip">1問だけ</span></div>

  <section id="list">
    <div class="card head">
      <span class="kick">SHINDAN PARK / 心理テスト</span>
      <h1>1問心理テスト</h1>
      <p>答えるのは1問だけ。深く考えず、パッと浮かんだものを選んでね。何がわかるテストなのかは、答えたあとのおたのしみ。</p>
      <div class="prog"><span id="done"></span><div class="bar"><i id="donebar"></i></div></div>
      <div class="row"><button class="btn" id="random" type="button">🎲 ランダムで1問</button><button class="btn sub" id="reset" type="button">記録をリセット</button></div>
    </div>
    <nav class="grid" id="grid" aria-label="心理テストの一覧"></nav>
  </section>

  <section id="test" class="card qcenter" hidden>
    <p class="qno" id="qno"></p>
    <div class="qem" id="qem" aria-hidden="true"></div>
    <p class="scene" id="scene"></p>
    <h2 class="q" id="q"></h2>
    <p class="hint">直感で選んでください</p>
    <div class="opts" id="opts"></div>
    <div class="row"><button class="btn sub" id="back1" type="button">一覧へ</button><button class="btn sub" id="skip" type="button">別の問題 →</button></div>
  </section>

  <section id="result" class="card qcenter" hidden aria-live="polite">
    <div class="reveal" id="reveal"></div>
    <p class="pick" id="pick"></p>
    <h2 class="rname" id="rname"></h2>
    <p class="desc" id="rdesc"></p>
    <details class="others"><summary>ほかの選択肢の結果も見る</summary><dl id="others"></dl></details>
    <div class="row">
      <button class="btn" id="next" type="button">次のテスト →</button>
      <button class="btn sub" id="share" type="button">結果をシェア</button>
    </div>
    <div class="row"><button class="btn sub" id="back2" type="button">一覧へ</button><a class="btn sub" href="../">診断パーク</a></div>
  </section>

  <p class="note">※ 遊びの心理テストです。結果は性格や心の状態を判定するものではありません。答えはこの端末の中だけで使い、送信しません。</p>
</div>
<div class="toast" id="toast" role="status"></div>

(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const KEY = 'shindan:shinri1';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } };
  const save = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} };
  let done = load(), cur = null, order = [], last = null;
  const byId = Object.fromEntries(TESTS.map((t, i) => [t[0], i]));

  function show(id){ for (const s of ['list','test','result']) $(s).hidden = s !== id; window.scrollTo(0, 0); }
  function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function renderList(){
    const n = Object.keys(done).filter(k => k in byId).length;
    $('done').textContent = n + ' / ' + TESTS.length + ' 問クリア';
    $('donebar').style.width = (n / TESTS.length * 100) + '%';
    const g = $('grid'); g.textContent = '';
    TESTS.forEach((t, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tile' + (t[0] in done ? ' done' : '');
      const em = document.createElement('span'); em.className = 'em'; em.textContent = t[1]; em.setAttribute('aria-hidden', 'true');
      const no = document.createElement('span'); no.className = 'no'; no.textContent = 'Q' + String(i + 1).padStart(2, '0');
      const s = document.createElement('strong'); s.textContent = t[2];
      b.append(em, no, s);
      if (t[0] in done) b.setAttribute('aria-label', t[2] + '（回答済み）');
      b.addEventListener('click', () => open(i));
      g.append(b);
    });
  }
  function pickNext(){
    const left = TESTS.map((_, i) => i).filter(i => !(TESTS[i][0] in done) && i !== cur);
    const pool = left.length ? left : TESTS.map((_, i) => i).filter(i => i !== cur);
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function open(i){
    cur = i; const t = TESTS[i];
    $('qno').textContent = 'Q' + String(i + 1).padStart(2, '0') + '　' + t[2];
    $('qem').textContent = t[1]; $('scene').textContent = t[3]; $('q').textContent = t[4];
    const box = $('opts'); box.textContent = '';
    order = shuffle([0, 1, 2, 3]);
    order.forEach((oi, k) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'opt';
      const tag = document.createElement('b'); tag.textContent = 'ABCD'[k]; tag.setAttribute('aria-hidden', 'true');
      const sp = document.createElement('span'); sp.textContent = t[6][oi][0];
      b.append(tag, sp); b.addEventListener('click', () => answer(oi)); box.append(b);
    });
    show('test');
    const c = $('test'); c.classList.remove('fade'); void c.offsetWidth; c.classList.add('fade');
  }
  function answer(oi){
    const t = TESTS[cur], o = t[6][oi];
    done[t[0]] = oi; save(done); last = { t, o };
    $('reveal').textContent = '';
    const sm = document.createElement('small'); sm.textContent = 'このテストでわかるのは…';
    $('reveal').append(sm, document.createTextNode(t[5]));
    $('pick').textContent = '「' + o[0] + '」を選んだあなたは';
    $('rname').textContent = o[1]; $('rdesc').textContent = o[2];
    const dl = $('others'); dl.textContent = '';
    t[6].forEach((x, k) => {
      if (k === oi) return;
      const dt = document.createElement('dt'); dt.textContent = x[0] + ' → ' + x[1];
      const dd = document.createElement('dd'); dd.textContent = x[2];
      dl.append(dt, dd);
    });
    $('result').querySelector('details').open = false;
    show('result');
    const c = $('result'); c.classList.remove('fade'); void c.offsetWidth; c.classList.add('fade');
  }
  function toast(msg){ const el = $('toast'); el.textContent = msg; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800); }

  $('random').addEventListener('click', () => open(pickNext()));
  $('skip').addEventListener('click', () => open(pickNext()));
  $('next').addEventListener('click', () => open(pickNext()));
  for (const id of ['back1', 'back2']) $(id).addEventListener('click', () => { renderList(); show('list'); });
  $('reset').addEventListener('click', () => {
    if (!Object.keys(done).length) { toast('まだ記録はありません'); return; }
    if (confirm('回答済みの記録をリセットしますか？')) { done = {}; save(done); renderList(); toast('リセットしました'); }
  });
  $('share').addEventListener('click', async () => {
    if (!last) return;
    const text = '【診断パーク／1問心理テスト「' + last.t[2] + '」】' + last.t[5] + 'は…「' + last.o[1] + '」でした！';
    const url = location.href.split('#')[0].split('?')[0];
    if (navigator.share) { try { await navigator.share({ title: '1問心理テスト', text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(text + ' ' + url); toast('結果をコピーしました'); }
    catch (e) { prompt('コピーしてシェアしてください', text + ' ' + url); }
  });
  renderList();
})();
</script>

const sound=(ok)=>{if(!state.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),osc=ctx.createOscillator(),g=ctx.createGain();osc.connect(g);g.connect(ctx.destination);osc.type=ok?'sine':'triangle';osc.frequency.setValueAtTime(ok?550:260,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(ok?850:180,ctx.currentTime+.15);g.gain.setValueAtTime(.055,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.2);osc.start();osc.stop(ctx.currentTime+.22);osc.onended=()=>ctx.close()}catch(e){}};
function confetti(){const host=document.getElementById('particles');if(!host||matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<25;i++){const p=document.createElement('div');p.className='particle';p.style.left=(Math.random()*100)+'%';p.style.background=['#ff947d','#70c6a4','#9386eb','#f7c66c'][i%4];p.style.setProperty('--drift',((Math.random()-.5)*120)+'px');p.style.animationDelay=(Math.random()*.18)+'s';host.appendChild(p);setTimeout(()=>p.remove(),1400)}}
function best(){try{return Number(localStorage.getItem('tg_quiz_best')||0)}catch(e){return 0}}
function setBest(s){try{if(s>best())localStorage.setItem('tg_quiz_best',String(s))}catch(e){}}
function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}}
function startScreen(){stopTimer();state.screen='start';app.innerHTML=`<div class="eyebrow">JAPAN PREFECTURE QUIZ</div><h1 class="title">どっち県!?<br>栃木 <span style="color:#aaa;font-size:.7em">vs</span> 群馬</h1><p class="intro muted">世界遺産も、温泉も、グルメも。<br>名前を見て、どっちの県か直感でタップ！</p><div class="duel"><div class="pref t"><div class="emoji">🍓</div><strong>栃木</strong></div><div class="vs">VS</div><div class="pref g"><div class="emoji">♨️</div><strong>群馬</strong></div></div><section class="panel"><div class="section-title">難易度を選ぶ</div><div class="options" id="diffs"><button class="opt ${state.difficulty===1?'active':''}" data-diff="1">やさしい<small>有名どころ</small></button><button class="opt ${state.difficulty===2?'active':''}" data-diff="2">ふつう<small>ちょい難</small></button><button class="opt ${state.difficulty===3?'active':''}" data-diff="3">鬼むず<small>通も唸る</small></button></div><div class="section-title">何問チャレンジする？</div><div class="options" id="counts"><button class="opt ${state.count===10?'active':''}" data-count="10">10問</button><button class="opt ${state.count===20?'active':''}" data-count="20">20問</button><button class="opt ${state.count===30?'active':''}" data-count="30">30問</button></div><div class="settings-line"><strong>制限時間</strong><div class="switch" id="timerchoice"><button data-timed="false" class="${!state.timed?'active':''}">なし</button><button data-timed="true" class="${state.timed?'active':''}">15秒</button></div></div><div class="settings-line"><strong>効果音</strong><div class="switch" id="sounds"><button data-sound="false" class="${!state.sound?'active':''}">OFF</button><button data-sound="true" class="${state.sound?'active':''}">ON</button></div></div><button class="primary" id="start">チャレンジ開始 🚀</button><div class="best">🏆 ベストスコア <b>${best().toLocaleString('ja-JP')}</b> 点</div></section><div class="footer">全${entries.length}ネタ収録・答えと豆知識つき<br>栃木県・群馬県の観光情報などをもとに作成</div>`;app.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{state.difficulty=Number(b.dataset.diff);startScreen()});app.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{state.count=Number(b.dataset.count);startScreen()});app.querySelectorAll('[data-timed]').forEach(b=>b.onclick=()=>{state.timed=b.dataset.timed==='true';startScreen()});app.querySelectorAll('[data-sound]').forEach(b=>b.onclick=()=>{state.sound=b.dataset.sound==='true';startScreen()});document.getElementById('start').onclick=()=>newGame()}
function selectQuestions(){let pool=entries.filter(e=>state.difficulty===3?e[3]>=2:e[3]<=state.difficulty);let t=shuffle(pool.filter(e=>e[1]==='T')),g=shuffle(pool.filter(e=>e[1]==='G'));let n=Math.min(state.count,t.length+g.length);let chosen=[],needT=Math.floor(n/2),needG=n-needT;chosen.push(...t.slice(0,needT),...g.slice(0,needG));return shuffle(chosen)}
function newGame(list){stopTimer();state.round=list?shuffle(list):selectQuestions();state.index=0;state.score=0;state.correct=0;state.streak=0;state.bestStreak=0;state.missed=[];state.screen='play';showQuestion()}
function showQuestion(){stopTimer();if(state.index>=state.round.length){showEnd();return}state.answered=false;state.choice=null;state.remaining=15;const q=state.round[state.index],progress=(state.index/state.round.length)*100;app.innerHTML=`<div class="topbar"><button class="back" id="home">← 設定へ</button><strong>第 ${state.index+1} 問 / ${state.round.length} 問</strong><button class="back" id="mute">${state.sound?'🔊':'🔇'}</button></div><div class="meter"><span style="width:${progress}%"></span></div><div class="stats"><div class="stat"><b id="score">${state.score.toLocaleString('ja-JP')}</b><small>スコア</small></div><div class="stat"><b id="streak">${state.streak} 🔥</b><small>連続正解</small></div><div class="stat"><b id="accuracy">${state.index?Math.round(state.correct/state.index*100):0}%</b><small>正解率</small></div></div><div class="question-card"><div class="qtags"><span class="pill">${esc(q[2])}</span><span class="pill">${'★'.repeat(q[3])}${'☆'.repeat(3-q[3])}</span></div><div class="qicon">${CATEGORY_ICONS[q[2]]}</div><div class="qname">${esc(q[0])}</div><div class="qcaption">これはどっちの県？</div>${state.timed?'<div class="timer"><div id="timerbar"></div></div><div class="tiny" id="timertext">残り 15 秒</div>':''}</div><div class="answers"><button class="answer t" id="tAnswer" data-answer="T">🍓 栃木県<span>TOCHIGI</span></button><button class="answer g" id="gAnswer" data-answer="G">♨️ 群馬県<span>GUNMA</span></button></div><div id="feedback"></div><div class="micro">${state.timed?'15秒以内にタップ！':'じっくり考えてOK！'} ${state.difficulty===3?'激ムズ編':''}</div>`;app.querySelector('#home').onclick=()=>startScreen();app.querySelector('#mute').onclick=()=>{state.sound=!state.sound;app.querySelector('#mute').textContent=state.sound?'🔊':'🔇'};app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));if(state.timed){state.startedAt=performance.now();state.timer=setInterval(()=>{if(state.answered)return;state.remaining=Math.max(0,15-(performance.now()-state.startedAt)/1000);const bar=document.getElementById('timerbar'),lbl=document.getElementById('timertext');if(bar)bar.style.width=(state.remaining/15*100)+'%';if(lbl)lbl.textContent='残り '+Math.ceil(state.remaining)+' 秒';if(state.remaining<=0)answer(null)},100)}}
function answer(choice){if(state.answered)return;state.answered=true;stopTimer();const q=state.round[state.index],ok=choice===q[1];if(ok){state.correct++;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);let gain=100*q[3]+Math.min(100,(state.streak-1)*20)+(state.timed?Math.round(state.remaining*5):0);state.score+=gain;sound(true);if(state.streak%3===0)confetti()}else{state.streak=0;state.missed.push(q);sound(false)}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(b.dataset.answer===q[1])b.classList.add('correct');else if(b.dataset.answer===choice)b.classList.add('wrong')});document.getElementById('score').textContent=state.score.toLocaleString('ja-JP');document.getElementById('streak').textContent=state.streak+' 🔥';document.getElementById('accuracy').textContent=Math.round(state.correct/(state.index+1)*100)+'%';document.querySelector('.meter span').style.width=((state.index+1)/state.round.length*100)+'%';const pref=q[1]==='T'?'栃木県':'群馬県';document.getElementById('feedback').innerHTML=`<div class="feedback" role="status"><div class="result ${ok?'good':'bad'}">${ok?(state.streak>=3?'🔥 '+state.streak+'連続正解！':'✨ 正解！'):(choice===null?'⌛ 時間切れ！':'✕ おしい！')}</div><p>正解は <strong>${pref}</strong>。${esc(q[4])}</p><button class="next" id="next">${state.index===state.round.length-1?'結果を見る 🏆':'次の問題へ →'}</button></div>`;document.getElementById('next').onclick=()=>{state.index++;showQuestion()}}
function showEnd(){stopTimer();state.screen='end';setBest(state.score);const total=state.round.length,acc=Math.round(state.correct/total*100);const rank=acc===100?'完全制覇！':acc>=90?'県境マスター':acc>=70?'北関東エキスパート':acc>=50?'もうひと息！':'ここから逆転！';const medal=acc===100?'🏆':acc>=90?'🥇':acc>=70?'🥈':acc>=50?'🥉':'🎯';app.innerHTML=`<div class="eyebrow">QUIZ COMPLETE</div><section class="panel"><div class="end-hero"><div class="medal">${medal}</div><h1 class="result-title">${rank}</h1><div class="muted">${total}問チャレンジ 終了！</div><div class="score">${state.score.toLocaleString('ja-JP')} <small>点</small></div></div><div class="gridstats"><div class="sbox"><strong>${state.correct}/${total}</strong><small>正解数</small></div><div class="sbox"><strong>${acc}%</strong><small>正解率</small></div><div class="sbox"><strong>${state.bestStreak}</strong><small>最大連続正解</small></div></div><button class="primary" id="again">もう一度挑戦 🚀</button>${state.missed.length?'<button class="secondary" id="retry">🔄 間違えた'+state.missed.length+'問だけ復習</button>':''}<button class="secondary" id="share">📋 結果をコピー</button><button class="secondary" id="home">設定に戻る</button>${state.missed.length?'<div class="missed"><h3>📝 間違えた問題</h3>'+state.missed.map(q=>`<div class="miss-item"><strong>${esc(q[0])} → ${q[1]==='T'?'栃木県':'群馬県'}</strong><p>${esc(q[4])}</p></div>`).join('')+'</div>':''}</section><div class="footer">ヒント：間違いを復習すると次の正解率がぐんと上がるかも！</div>`;document.getElementById('again').onclick=()=>newGame();document.getElementById('home').onclick=()=>startScreen();if(state.missed.length)document.getElementById('retry').onclick=()=>newGame(state.missed);document.getElementById('share').onclick=async()=>{let text=`「どっち県!? 栃木 vs 群馬」で${total}問中${state.correct}問正解！ 正解率${acc}%・${state.score}点 ${medal}`;let btn=document.getElementById('share');try{await navigator.clipboard.writeText(text);btn.textContent='✅ コピーしました！'}catch(e){let el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();const copied=document.execCommand('copy');el.remove();btn.textContent=copied?'✅ コピーしました！':'結果：'+text}}}
window.addEventListener('keydown',e=>{if(state.screen!=='play')return;if(!state.answered&&(e.key==='ArrowLeft'||e.key==='1'))answer('T');else if(!state.answered&&(e.key==='ArrowRight'||e.key==='2'))answer('G');else if(state.answered&&e.key==='Enter'){state.index++;showQuestion()}});
startScreen();
})();
</script></body></html>

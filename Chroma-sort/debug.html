<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Chroma Sort Debug</title><style>body{margin:0;background:#050a1d;color:#eaf2ff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;overflow:hidden}#app{height:100vh;display:flex;flex-direction:column;max-width:520px;margin:auto}.bar,.footer{background:#020614ee;padding:10px 12px;display:flex;gap:8px;align-items:center}.bar{justify-content:space-between}.stage{font-size:20px;font-weight:900}.badge{display:inline-block;margin-top:4px;padding:3px 8px;border-radius:9px;background:#00bfff33;color:#5adfff;font-size:10px;font-weight:900}.coins{color:#ffd050;font-weight:900}.gear{font-size:20px;border-radius:12px;padding:8px;background:#ff7a3033;border:1px solid #ff963c66;color:white}#game{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 6px;width:100%;justify-items:center}.bottle{display:flex;flex-direction:column;align-items:center}.cap{width:52px;height:18px;border-radius:16px 16px 3px 3px;background:linear-gradient(#555,#050505)}.body{position:relative;width:52px;height:124px;border:2px solid #dcefff55;border-radius:3px 3px 16px 16px;overflow:hidden;background:#ffffff12}.liq{position:absolute;inset:0;display:flex;flex-direction:column-reverse}.seg{flex:1;position:relative;border-bottom:1px solid #0006}.seg[data-sym]::before{content:attr(data-sym);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:white;text-shadow:0 2px 5px black}.light[data-sym]::before{color:#000}.act{flex:1;border:0;border-radius:14px;background:linear-gradient(160deg,#ff9328,#dc4f00);color:white;padding:8px 2px;font-weight:800;font-size:9px}.act.on{background:linear-gradient(160deg,#7c5cff,#3516b8)}.act span{display:block;font-size:20px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px}.hidden{display:none}.card{background:#080d22;border:1px solid #78a0ff55;border-radius:22px;padding:20px;max-width:360px;width:100%}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #fff1}.pill,.btn{background:#ffffff14;border:1px solid #ffffff30;color:white;border-radius:9px;padding:8px;font-weight:900}.pill.on{background:#ff7a3070}.btn{width:100%;margin-top:12px}.err{position:fixed;left:6px;right:6px;bottom:6px;background:#300;color:#fff;border:1px solid #f66;border-radius:8px;padding:8px;font-size:11px;z-index:99;white-space:pre-wrap}.ok{background:#063;border-color:#6f9}</style><div id="app"><header class="bar"><div><div class="stage" id="stage">Stage 1</div><div id="diff" class="badge">EASY / 4色</div></div><div class="coins">🪙 <span id="coins">100</span></div><button class="gear" id="open">⚙️</button></header><main id="game"><div id="grid"></div></main><footer class="footer"><button class="act" id="undo"><span>↩</span>Undo</button><button class="act" id="restart"><span>↺</span>Restart</button><button class="act" id="hint"><span>💡</span>Hint</button><button class="act" id="extra"><span>🧪</span>+Bottle</button><button class="act" id="sym"><span>🔣</span>Symbol<br><small id="symTxt">OFF</small></button></footer></div><div id="settings" class="modal hidden"><div class="card"><h2>⚙️ Debug Settings</h2><div class="row"><b>難易度</b><div id="diffBtns"><button class="pill" data-d="easy">EASY</button><button class="pill" data-d="normal">NORMAL</button><button class="pill" data-d="hard">HARD</button><button class="pill" data-d="expert">EXPERT</button></div></div><div class="row"><span>状態</span><span id="desc">-</span></div><button class="btn" id="clearStore">保存データ削除</button><button class="btn" id="close">閉じる</button></div></div><div id="log" class="err">booting...</div><script>const LOG=document.getElementById('log');function log(s,ok){LOG.textContent=s;LOG.className='err '+(ok?'ok':'')}window.onerror=(m,u,l,c,e)=>log('ERROR: '+m+'\nline:'+l+':'+c+'\n'+(e&&e.stack||''));try{const CAP=4,DIFFS={easy:['EASY',4],normal:['NORMAL',8],hard:['HARD',12],expert:['EXPERT',16]},COLORS=[['red','●','linear-gradient(#ff3333,#bb0000)'],['blue','■','linear-gradient(#3344ff,#0011cc)'],['green','＋','linear-gradient(#00ee55,#009933)'],['yellow','★','linear-gradient(#ffee00,#ccaa00)',1],['orange','▲','linear-gradient(#ff9900,#cc5500)'],['cyan','○','linear-gradient(#00aaff,#0066bb)',1],['purple','◆','linear-gradient(#cc00ff,#8800cc)'],['pink','♥','linear-gradient(#ff44bb,#cc0066)'],['gray','×','linear-gradient(#bbbbbb,#777777)',1],['brown','⬟','linear-gradient(#cc6622,#884411)'],['lime','✚','linear-gradient(#ccff00,#88bb00)',1],['teal','◇','linear-gradient(#00ffcc,#009977)'],['cream','☀','linear-gradient(#fffff0,#eecc88)',1],['indigo','⬢','linear-gradient(#7722ff,#4400bb)'],['silver','✦','linear-gradient(#aaccee,#7799bb)',1],['lavender','✿','linear-gradient(#dd99ff,#9966cc)',1]],C=Object.fromEntries(COLORS.map(x=>[x[0],{id:x[0],sym:x[1],bg:x[2],light:!!x[3]}]));let S={stage:1,coins:100,diff:'easy',symbols:false,bottles:[],initial:[],selected:null,history:[],extra:0};function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function safeSave(){try{localStorage.setItem('chroma-debug',JSON.stringify(S))}catch(e){log('localStorage save NG: '+e.message)}}function makeBoard(){const n=DIFFS[S.diff][1],names=COLORS.slice(0,n).map(x=>x[0]),pool=[],r=rng(S.stage*913+n*31);for(let b=0;b<16;b++)for(let i=0;i<CAP;i++)pool.push(names[b%n]);for(let i=pool.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}let out=[];for(let i=0;i<16;i++)out.push(pool.slice(i*4,i*4+4));for(let i=0;i<4;i++)out.push([]);return out}function newStage(){S.bottles=makeBoard();S.initial=S.bottles.map(x=>x.slice());S.selected=null;S.history=[];render();safeSave()}function render(){if(!Array.isArray(S.bottles)||S.bottles.length<20)newStage();const [label,n]=DIFFS[S.diff];stage.textContent='Stage '+S.stage;diff.textContent=label+' / '+n+'色';coins.textContent=S.coins;sym.classList.toggle('on',S.symbols);symTxt.textContent=S.symbols?'ON':'OFF';desc.textContent=n+'色 / '+S.bottles.length+'本 / seg '+S.bottles.flat().length;document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('on',b.dataset.d===S.diff));grid.innerHTML='';S.bottles.forEach((arr,i)=>{let w=document.createElement('div');w.className='bottle';w.dataset.i=i;w.innerHTML='<div class=cap></div><div class=body><div class=liq></div></div>';let q=w.querySelector('.liq');for(let j=0;j<4;j++){let s=document.createElement('div');s.className='seg';if(arr[j]){let c=C[arr[j]];s.style.background=c.bg;if(S.symbols){s.dataset.sym=c.sym;if(c.light)s.classList.add('light')}}q.appendChild(s)}grid.appendChild(w)});log('OK: bottles '+document.querySelectorAll('.bottle').length+' / segments '+document.querySelectorAll('.seg').length,true)}function top(a){return a[a.length-1]}function can(f,t){let a=S.bottles[f],b=S.bottles[t];return a&&b&&a.length&&b.length<4&&(!b.length||top(a)===top(b))}function tap(i){if(S.selected==null){if(!S.bottles[i].length)return;S.selected=i;render();return}let f=S.selected;if(f===i){S.selected=null;render();return}if(can(f,i)){S.history.push(S.bottles.map(x=>x.slice()));S.bottles[i].push(S.bottles[f].pop());S.selected=null;render();safeSave()}}grid.onclick=e=>{let b=e.target.closest('.bottle');if(b)tap(+b.dataset.i)};open.onclick=()=>{settings.classList.remove('hidden');render()};close.onclick=()=>settings.classList.add('hidden');sym.onclick=()=>{S.symbols=!S.symbols;render();safeSave()};restart.onclick=()=>{S.bottles=S.initial.map(x=>x.slice());render();safeSave()};undo.onclick=()=>{let h=S.history.pop();if(h){S.bottles=h;render();safeSave()}};extra.onclick=()=>{S.bottles.push([]);render();safeSave()};hint.onclick=()=>log('hint button works',true);clearStore.onclick=()=>{try{localStorage.removeItem('chroma-debug')}catch(e){};newStage()};document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{S.diff=b.dataset.d;S.stage=1;newStage()});newStage()}catch(e){log('BOOT ERROR: '+e.message+'\n'+e.stack)}</script></html>

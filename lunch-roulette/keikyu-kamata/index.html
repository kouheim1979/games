<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="蒲田4+">
<title>京急蒲田グルメ 4+ | Google Maps 高評価店</title>
<style>
:root{--bg:#0e0f12;--panel:#17191e;--panel2:#20232a;--text:#f7f7f4;--muted:#a7aab3;--line:#2d3038;--accent:#ffd34e;--accent2:#ff8a45;--ok:#65d99b;--shadow:0 14px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;min-height:100vh}button,select,input{font:inherit}.app{max-width:820px;margin:auto;padding:env(safe-area-inset-top) 14px calc(36px + env(safe-area-inset-bottom))}.hero{padding:26px 4px 12px}.eyebrow{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.12em}.hero h1{font-size:clamp(28px,8vw,44px);line-height:1.06;margin:7px 0 10px;letter-spacing:-.035em}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}.hero strong{color:#fff}.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 74%,rgba(14,15,18,0));padding:10px 0 18px}.search{display:flex;gap:8px}.search input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:13px 14px;outline:none}.search input:focus{border-color:#656a78}.random{border:0;background:var(--accent);color:#111;border-radius:14px;padding:0 15px;font-weight:900;white-space:nowrap}.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:var(--panel);color:#d7d8dd;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:750;white-space:nowrap}.chip.active{background:#fff;color:#111;border-color:#fff}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 14px}.controls select{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 12px}.summary{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:4px 2px 10px}.summary .count{font-size:14px;font-weight:800}.summary .updated{font-size:11px;color:var(--muted);text-align:right}.list{display:grid;gap:12px}.card{position:relative;background:linear-gradient(145deg,var(--panel),#14161a);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);overflow:hidden}.card::after{content:"";position:absolute;width:110px;height:110px;right:-55px;top:-55px;border-radius:50%;background:radial-gradient(circle,rgba(255,211,78,.14),transparent 68%);pointer-events:none}.rank{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;color:#101114;background:var(--accent);padding:5px 8px;border-radius:999px;margin-bottom:10px}.rank.hidden{display:none}.head{display:flex;gap:12px;align-items:flex-start}.main{min-width:0;flex:1}.name{font-size:20px;line-height:1.25;font-weight:900;letter-spacing:-.02em;margin:0}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{font-size:11px;color:#d7d8dd;background:var(--panel2);border:1px solid var(--line);padding:4px 7px;border-radius:999px}.tag.special{color:#17130a;background:#ffe38d;border-color:#ffe38d}.fav{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:#9da0aa;font-size:21px;display:grid;place-items:center}.fav.on{color:#ff728f;background:#392029;border-color:#64303f}.metrics{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin:14px 0 12px}.metric{background:#111318;border:1px solid #252832;border-radius:12px;padding:10px}.metric small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.metric b{font-size:15px}.rating{color:var(--accent);font-size:21px!important}.stars{font-size:11px;color:var(--accent);letter-spacing:1px}.why{font-size:13px;line-height:1.65;color:#d9dae0;margin:0 0 13px}.actions{display:grid;grid-template-columns:1fr auto;gap:8px}.maps,.detail{border:0;border-radius:12px;padding:11px 13px;font-weight:850}.maps{background:#fff;color:#111;text-decoration:none;text-align:center}.detail{background:var(--panel2);color:#eee;border:1px solid var(--line)}.extra{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.7}.extra.open{display:block}.extra b{color:#fff}.notice{margin:20px 0 0;padding:14px;border:1px dashed #3b3f49;border-radius:14px;color:var(--muted);font-size:11px;line-height:1.65}.empty{text-align:center;color:var(--muted);padding:36px 8px}.modalWrap{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;padding:14px}.modalWrap.open{display:flex}.modal{width:min(100%,620px);background:#1b1d23;border:1px solid #343844;border-radius:24px;padding:20px;box-shadow:0 25px 80px rgba(0,0,0,.55);animation:up .22s ease}.modal h2{margin:0 0 5px;font-size:13px;color:var(--accent)}.modal .pick{font-size:28px;font-weight:950;margin:2px 0 7px}.modal p{color:var(--muted);font-size:13px;line-height:1.6}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.modalBtns a,.modalBtns button{border-radius:13px;padding:12px;border:0;font-weight:850;text-align:center;text-decoration:none}.go{background:var(--accent);color:#111}.again{background:var(--panel2);color:#fff}.close{width:100%;margin-top:8px;background:transparent;color:var(--muted);border:0;padding:8px}@keyframes up{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}@media(min-width:680px){.list{grid-template-columns:1fr 1fr}.controls{grid-template-columns:220px 220px}.card{padding:18px}.hero{padding-top:34px}}
</style>
</head>
<body>
<div class="app">
<section class="hero"><div class="eyebrow">KEIKYU KAMATA · GOURMET FINDER</div><h1>京急蒲田<br>Google Maps 4+</h1><p><strong>★4.0以上</strong>の候補だけ。評価・口コミ数・駅からの近さで、今行く店をすぐ決める。</p></section>
<div class="topbar"><div class="search"><input id="search" type="search" placeholder="店名・料理で検索（例：とんかつ）" autocomplete="off"><button class="random" id="randomBtn">今夜の1軒</button></div><div class="chips" id="chips"></div></div>
<div class="controls"><select id="sort"><option value="smart">おすすめ順</option><option value="rating">評価が高い順</option><option value="reviews">口コミが多い順</option><option value="distance">駅から近い順</option></select><select id="minRating"><option value="4.0">★4.0以上</option><option value="4.2">★4.2以上</option><option value="4.3">★4.3以上</option><option value="4.4">★4.4以上</option></select></div>
<div class="summary"><div class="count" id="count"></div><div class="updated">評価スナップショット<br>2026/09/04</div></div><main class="list" id="list"></main><div class="notice">Google Mapsの評価・口コミ数・営業時間は日々変わります。このアプリの数値は作成時点のスナップショットです。来店前は「Googleマップで確認」から最新情報をご確認ください。外部APIや位置情報は使っていないため、iPhoneでも軽く動きます。</div>
</div>
<div class="modalWrap" id="modalWrap" aria-hidden="true"><div class="modal"><h2>TONIGHT'S PICK</h2><div class="pick" id="pickName"></div><p id="pickText"></p><div class="modalBtns"><a class="go" id="pickMap" target="_blank" rel="noopener">Googleマップ</a><button class="again" id="again">もう一回</button></div><button class="close" id="close">閉じる</button></div></div>
<script>
const restaurants=[
{id:'maruichi',name:'丸一',genre:'とんかつ',rating:4.4,reviews:1000,walk:5,budget:'¥1,000〜2,000',special:'名店',why:'口コミ数も多く評価も高い、蒲田とんかつの有力候補。営業日・営業時間は要確認。',note:'とんかつを最優先で選びたいときの本命候補。',query:'丸一 とんかつ 蒲田'},
{id:'daiki',name:'とんかつ 大希 蒲田',genre:'とんかつ',rating:4.3,reviews:459,walk:1,budget:'¥2,000〜3,000',special:'駅近',why:'京急蒲田からすぐ。高評価とアクセスの両方を取りたいなら強い。',note:'羽釜ご飯ととんかつ。駅近なので時間がない夜にも使いやすい。',query:'とんかつ 大希 蒲田'},
{id:'ms',name:"Trattoria M's",genre:'イタリアン',rating:4.3,reviews:302,walk:5,budget:'¥5,000〜6,000',special:'魚介',why:'旬の魚介を主役にした「おさかなイタリアン」。落ち着いて食べたい夜向き。',note:'1995年から蒲田で親しまれる店。魚介、パスタ、自家製ラザニアなど。',query:"Trattoria M's 蒲田"},
{id:'aoki-main',name:'とんかつ檍 蒲田本店',genre:'とんかつ',rating:4.2,reviews:1944,walk:8,budget:'¥1,000〜2,000',special:'口コミ多数',why:'口コミ約2,000件級でも4.2。少し歩いても実績重視なら候補。',note:'蒲田を代表するとんかつ店のひとつ。混雑も想定しておくと安心。',query:'とんかつ檍 蒲田本店'},
{id:'aoki-keikyu',name:'とんかつ檍 京急蒲田店',genre:'とんかつ',rating:4.0,reviews:600,walk:3,budget:'¥1,000〜2,000',special:'駅近',why:'京急蒲田側で檍を食べたいときに便利。駅から近く、口コミ数も十分。',note:'営業時間が早めに終わる日があるため、夜はマップで最新情報確認推奨。',query:'とんかつ檍 京急蒲田店'},
{id:'hoanyon',name:'歓迎 本店',genre:'餃子・中華',rating:4.0,reviews:1633,walk:9,budget:'¥1,000〜3,000',special:'蒲田名物',why:'羽根付き餃子で「蒲田らしさ」を取りたいなら有力。口コミ数も非常に多い。',note:'餃子を中心に中華を複数人でシェアする使い方にも向く。',query:'歓迎 本店 蒲田'}
];
const genres=['すべて','とんかつ','餃子・中華','イタリアン','お気に入り','徒歩5分'];let activeGenre='すべて';const favs=new Set(JSON.parse(localStorage.getItem('keikyu-kamata-favs')||'[]'));const $=s=>document.querySelector(s);const mapsUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
function smartScore(r){return r.rating*20+Math.log10(Math.max(r.reviews,1))*8-r.walk*.55}function renderChips(){$('#chips').innerHTML=genres.map(g=>`<button class="chip ${g===activeGenre?'active':''}" data-genre="${g}">${g}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{activeGenre=b.dataset.genre;renderChips();render()})}function filtered(){const q=$('#search').value.trim().toLowerCase();const min=Number($('#minRating').value);let arr=restaurants.filter(r=>r.rating>=min);if(activeGenre==='お気に入り')arr=arr.filter(r=>favs.has(r.id));else if(activeGenre==='徒歩5分')arr=arr.filter(r=>r.walk<=5);else if(activeGenre!=='すべて')arr=arr.filter(r=>r.genre===activeGenre);if(q)arr=arr.filter(r=>`${r.name} ${r.genre} ${r.special} ${r.why} ${r.note}`.toLowerCase().includes(q));const sort=$('#sort').value;arr.sort((a,b)=>sort==='rating'?b.rating-a.rating||b.reviews-a.reviews:sort==='reviews'?b.reviews-a.reviews:sort==='distance'?a.walk-b.walk:smartScore(b)-smartScore(a));return arr}function stars(r){return'★'.repeat(Math.floor(r))+(r%1>=.5?'☆':'')}function card(r,i){return`<article class="card"><div class="rank ${i<3?'':'hidden'}">${i===0?'🏆 BEST MATCH':i===1?'#2 HIGH SCORE':'#3 PICK'}</div><div class="head"><div class="main"><h2 class="name">${r.name}</h2><div class="tags"><span class="tag">${r.genre}</span><span class="tag special">${r.special}</span></div></div><button class="fav ${favs.has(r.id)?'on':''}" data-fav="${r.id}" aria-label="お気に入り">♥</button></div><div class="metrics"><div class="metric"><small>Google Maps</small><b class="rating">★ ${r.rating.toFixed(1)}</b><div class="stars">${stars(r.rating)}</div></div><div class="metric"><small>口コミ</small><b>${r.reviews.toLocaleString()}件${r.reviews===1000?'+':''}</b></div><div class="metric"><small>京急蒲田から</small><b>徒歩 約${r.walk}分</b></div></div><p class="why">${r.why}</p><div class="actions"><a class="maps" href="${mapsUrl(r.query)}" target="_blank" rel="noopener">Googleマップで確認</a><button class="detail" data-detail="${r.id}">詳細</button></div><div class="extra" id="extra-${r.id}"><b>予算目安：</b>${r.budget}<br><b>メモ：</b>${r.note}</div></article>`}function render(){const arr=filtered();$('#count').textContent=`条件に合う店 ${arr.length}件`;$('#list').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">条件に合う店がありません。<br>絞り込みを少し緩めてください。</div>';document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const id=b.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('keikyu-kamata-favs',JSON.stringify([...favs]));render();renderChips()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>document.querySelector('#extra-'+b.dataset.detail).classList.toggle('open'))}function pick(){const arr=filtered();if(!arr.length)return;const pool=arr.slice(0,Math.min(arr.length,4));const r=pool[Math.floor(Math.random()*pool.length)];$('#pickName').textContent=r.name;$('#pickText').textContent=`★${r.rating.toFixed(1)}・口コミ${r.reviews.toLocaleString()}件・徒歩約${r.walk}分。${r.why}`;$('#pickMap').href=mapsUrl(r.query);$('#modalWrap').classList.add('open');$('#modalWrap').setAttribute('aria-hidden','false')}
$('#search').addEventListener('input',render);$('#sort').addEventListener('change',render);$('#minRating').addEventListener('change',render);$('#randomBtn').onclick=pick;$('#again').onclick=pick;$('#close').onclick=()=>{$('#modalWrap').classList.remove('open');$('#modalWrap').setAttribute('aria-hidden','true')};$('#modalWrap').onclick=e=>{if(e.target.id==='modalWrap')$('#close').click()};renderChips();render();
</script>
</body>
</html>

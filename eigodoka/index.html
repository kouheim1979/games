<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1ea"><title>英単語ボム！</title><style>
:root{--paper:#f4f1ea;--ink:#14121a;--red:#ff3b1f;--gold:#ffcc00}*{box-sizing:border-box}body{margin:0;background:radial-gradient(#14121a12 .7px,transparent .8px) 0 0/5px 5px,var(--paper);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:disabled{cursor:default}button:focus-visible{outline:3px solid #347be4;outline-offset:2px}[hidden]{display:none!important}h1,h2,p{margin:0}main{max-width:425px;margin:auto;min-height:100dvh;padding:max(8px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}header{display:flex;align-items:center;justify-content:space-between;gap:4px}header a{color:var(--ink);font-size:11px;font-weight:900;text-decoration:none;border-bottom:2px solid}.small{border:2px solid;background:white;font-weight:900;font-size:11px;padding:5px 8px;box-shadow:2px 2px var(--ink)}.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px}.kicker{font-size:11px;font-weight:1000;letter-spacing:.15em;background:var(--ink);color:white;padding:6px 9px;transform:skewX(-8deg)}.logo{font-size:clamp(44px,13vw,74px);font-weight:1000;letter-spacing:-.1em;font-style:italic;white-space:nowrap;transform:rotate(-5deg);line-height:1.1}.logo span{color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px var(--ink)}.tag{font:bold 23px "Yu Mincho",serif}.demo{width:100%;background:white;border:3px solid;box-shadow:4px 4px var(--ink);padding:14px;display:grid;gap:8px;justify-items:center}.demo p{font-size:15px;font-weight:1000}.demo .demoRow{display:flex;align-items:center;justify-content:center;gap:8px}.demoBall{border:3px solid var(--ink);background:#347be4;color:white;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:25px;font-weight:1000;box-shadow:3px 3px var(--ink)}.demoWord{background:var(--gold);border:2px solid;padding:6px 8px;font-weight:1000;font-size:16px;box-shadow:2px 2px var(--ink)}.cta{background:var(--ink);color:white;border:3px solid var(--ink);width:100%;padding:12px;font-size:23px;font-weight:1000;font-style:italic;box-shadow:5px 5px var(--red)}.note{color:#68636d;font-size:11px;font-weight:800;line-height:1.5}.hud{display:grid;grid-template-columns:1.7fr .7fr .75fr;border:3px solid var(--ink);background:white;box-shadow:3px 3px var(--ink)}.hud div{padding:5px 7px;min-width:0}.hud div+div{border-left:2px solid}.hud small{display:block;font-size:9px;font-weight:900;color:#68636d}.hud b{font-size:clamp(17px,5.4vw,25px);font-weight:1000;font-style:italic;font-variant-numeric:tabular-nums}.red{color:var(--red)}.meter{height:8px;border:2px solid var(--ink);background:white;margin:5px 0 0;box-shadow:2px 2px var(--ink);overflow:hidden}.meter i{display:block;height:100%;background:var(--red);width:0;transition:width .2s}.meter.charged i{background:var(--gold)}.field{border:3px solid;background:white;box-shadow:3px 3px var(--ink);margin-top:7px;padding:6px;position:relative;overflow:hidden}.fieldtop{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:1000;min-height:18px}.field.flash{background:#ffcc00}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:4px auto 0;max-width:326px;background:var(--paper);border:2px solid;padding:4px}.cell{aspect-ratio:1;display:grid;place-items:center;min-width:0;border:1px dashed #14121a22;background:transparent;padding:0;position:relative}.cell:not(:disabled):active .ball{transform:scale(.9)}.ball{width:87%;aspect-ratio:1;border-radius:50%;border:2.5px solid var(--ink);box-shadow:2px 3px var(--ink),inset 3px 3px #ffffff60,inset -3px -3px #14121a28;display:grid;place-items:center;font-size:clamp(16px,5vw,23px);line-height:1;font-weight:1000;font-style:italic;letter-spacing:-.03em;overflow:hidden}.ball.long{font-size:clamp(10px,3.3vw,15px)}.cell.demoTarget:after{content:"▼";position:absolute;top:-4px;left:50%;transform:translateX(-50%);color:white;text-shadow:1px 1px var(--ink),-1px -1px var(--ink);font-size:15px;animation:nudge .7s ease-in-out infinite alternate}.cell.demoTarget{outline:3px solid var(--red);outline-offset:-2px;background:#ffcc0044}.cell.hit .ball{animation:hit .32s ease-out both}.cell.changed .ball{animation:pulse .32s ease-out}.ticker{min-height:25px;font-size:14px;font-weight:1000;text-align:center;margin:5px 0 0}.burst{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);z-index:4;font:bold clamp(27px,8vw,43px) "Yu Mincho",serif;color:var(--red);-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-shadow:2px 2px white;white-space:nowrap;pointer-events:none;opacity:0}.burst.pop{animation:pop .65s ease-out}.powers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0 0}.power{border:3px solid var(--ink);background:white;box-shadow:3px 3px var(--ink);padding:8px 3px;display:grid;justify-items:center;gap:5px;min-height:79px}.power[aria-pressed=true]{background:var(--gold);box-shadow:3px 3px var(--red);transform:translateY(-2px)}.power:disabled{opacity:.75}.power strong{font-size:clamp(14px,4vw,19px);font-weight:1000;letter-spacing:-.03em}.power svg{width:34px;height:29px}.power .meaning{font-size:10px;font-weight:900;color:#4f4a54}.under{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:9px}.under .note{font-size:10px}.hintline{font-size:12px;font-weight:900;text-align:center;padding:7px;background:white;border:2px dashed;margin-top:6px}.report{width:100%;background:white;border:3px solid;box-shadow:4px 4px var(--ink);padding:14px;text-align:left}.score{font-size:clamp(37px,12vw,60px);font-weight:1000;font-style:italic;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:1fr 1fr;border:2px solid;margin:9px 0}.stats>div{border:1px solid;padding:8px}.stats small{display:block;font-size:10px;color:#68636d;font-weight:900}.stats b{font-size:23px;font-weight:1000}.words{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.words span{font-size:12px;font-weight:900;border:2px solid;padding:5px;background:var(--paper)}@keyframes hit{0%{transform:scale(1)}40%{transform:scale(1.3);background:white;color:var(--red)}100%{transform:scale(.15);opacity:0}}@keyframes pulse{0%{transform:scale(.7)}60%{transform:scale(1.17)}100%{transform:scale(1)}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%,75%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) rotate(-8deg) scale(1.08)}}@keyframes nudge{to{transform:translate(-50%,4px)}}@media(max-height:740px){main{gap:5px}.board{max-width:264px}.power{min-height:65px;padding:5px 2px}.power svg{width:29px;height:25px}.powers{margin-top:7px}.under{margin-top:7px}.center{gap:12px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style></head><body><main><header><a href="../">← まいにち道具箱</a><div><button class="small" id="sound">♪ ON</button> <button class="small" id="voice">英音 OFF</button> <button class="small" id="quit" hidden>終了</button></div></header><section class="center" id="title"><p class="kicker">英語で爆破パズル</p><h1 class="logo">英単語<span>ボム！</span></h1><p class="tag">英語を選んで、玉を爆破！</p><div class="demo"><div class="demoRow"><span class="demoWord">DOUBLE</span><span class="demoBall">4</span><b>→</b><span class="demoBall">8</span></div><div class="demoRow"><span class="demoWord">EXPLODE</span><span class="demoBall">8</span><b>→</b><b class="red" style="font-size:25px">BOOM!</b></div><p>大きくして、まとめて爆破。</p></div><button class="cta" id="start">すぐ遊ぶ！</button><p class="note" id="best"></p></section>
<section id="game" hidden><div class="hud"><div><small>SCORE</small><b id="score">0</b></div><div><small>DP</small><b class="red" id="dp">0</b></div><div><small>TURN</small><b id="turn">1/15</b></div></div><div class="meter" id="meter"><i id="fill"></i></div><div class="field" id="field"><div class="fieldtop"><span>英単語ボム！</span><span id="fever">次の爆発 ×1</span></div><div class="board" id="board" role="group" aria-label="玉をタップ"></div><div class="burst" id="burst"></div><p id="ticker" class="ticker" aria-live="polite">光っている玉をタップ！</p></div><div class="powers" id="powers" aria-label="英語の技"></div><div class="under"><span class="note">英語 → 玉をタップ</span><button class="small" id="hint">？ 意味</button></div><div class="hintline" id="meaning" hidden></div></section>
<section id="result" class="center" hidden><div class="report"><p class="kicker">ゲーム結果</p><p class="note" style="margin-top:10px">SCORE</p><p class="score" id="final"></p><p class="red" id="record" style="font-weight:1000"></p><div class="stats"><div><small>最大連鎖</small><b id="chain"></b></div><div><small>爆破した玉</small><b id="destroyed"></b></div></div><p class="tag" style="font-size:16px">使った英語</p><div class="words" id="words"></div></div><button class="cta" id="again">もう一回！</button><button class="small" id="home">タイトルへ</button></section></main><script>
"use strict";
const N=5,MAX=15,C=["red","blue","yellow","green"],JP={red:"赤",blue:"青",yellow:"黄",green:"緑"},LOOK={red:["#ff3b1f","#fff"],blue:["#347be4","#fff"],yellow:["#ffcc00","#14121a"],green:["#33af76","#14121a"]};
const VERBS={double:{name:"Double",ja:"2倍にする",hint:"つながった同色の玉を2倍にする。",icon:'<path d="M4 8L15 20M15 8L4 20" stroke="currentColor" stroke-width="3"/><text x="19" y="22" font-size="23" font-weight="900">2</text>'},explode:{name:"Explode",ja:"爆破する",hint:"同じ色でつながっている玉をまとめて爆破。",icon:'<path d="M21 1L25 9L36 5L32 15L42 20L30 22L35 30L25 27L20 35L15 27L4 31L8 22L0 18L10 14L5 5L16 9Z" fill="#ff3b1f" stroke="#14121a" stroke-width="2"/>'},absorb:{name:"Absorb",ja:"吸収する",hint:"上下左右の玉を吸い込み、数字を足す。",icon:'<circle cx="21" cy="18" r="8" fill="#ffcc00" stroke="currentColor" stroke-width="2"/><path d="M2 18H11M7 14L11 18L7 22M40 18H31M35 14L31 18L35 22M21 0V8M17 4L21 8L25 4M21 36V28M17 32L21 28L25 32" fill="none" stroke="currentColor" stroke-width="2"/>'},convert:{name:"Convert",ja:"変換する",hint:"上下左右の玉を、タップした玉と同じ色にする。",icon:'<circle cx="8" cy="18" r="7" fill="#347be4" stroke="currentColor" stroke-width="2"/><path d="M17 18H26M22 14L26 18L22 22" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="34" cy="18" r="7" fill="#ff3b1f" stroke="currentColor" stroke-width="2"/>'},split:{name:"Split",ja:"分裂する",hint:"隣に空きがあれば、数字を分けて玉を増やす。",icon:'<circle cx="9" cy="18" r="8" fill="#347be4" stroke="currentColor" stroke-width="2"/><path d="M18 18H25M21 14L25 18L21 22" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="34" cy="10" r="6" fill="#347be4" stroke="currentColor" stroke-width="2"/><circle cx="34" cy="26" r="6" fill="#347be4" stroke="currentColor" stroke-width="2"/>'},triple:{name:"Triple",ja:"3倍にする",hint:"つながった同色の玉を3倍にする。",icon:'<path d="M4 8L15 20M15 8L4 20" stroke="currentColor" stroke-width="3"/><text x="19" y="22" font-size="23" font-weight="900">3</text>'}};
const rand=n=>Math.floor(Math.random()*n),pick=a=>a[rand(a.length)],copy=b=>b.map(t=>t?{...t}:null),ball=(c=pick(C),v=1+rand(4))=>({c,v}),cap=v=>Math.min(999999,v),empty=()=>Array(N*N).fill(null);
function adj(i){let x=i%N,y=Math.floor(i/N),a=[];if(x)a.push(i-1);if(x<N-1)a.push(i+1);if(y)a.push(i-N);if(y<N-1)a.push(i+N);return a}
function gravity(b){let r=empty();for(let x=0;x<N;x++){let y=N-1;for(let z=N-1;z>=0;z--){let t=b[z*N+x];if(t)r[y--*N+x]=t}}return r}
function layers(b,i){if(!b[i])return [];let seen=new Set([i]),out=[[i]],c=b[i].c;while(true){let next=[];for(let j of out[out.length-1])for(let k of adj(j)){if(b[k]?.c===c&&!seen.has(k)){seen.add(k);next.push(k)}}if(!next.length)break;out.push(next)}return out}
function initial(){let b=empty();for(let i=5;i<25;i++)b[i]=ball();b[17]=ball("blue",4);b[22]=ball("blue",5);b[23]=ball("blue",3);b[12]=ball("red",3);return b}
function refill(b,n){let r=copy(b);for(let j=0;j<n;j++){let cols=[];for(let x=0;x<N;x++)if(!r[x])cols.push(x);if(!cols.length)break;let x=pick(cols);for(let y=N-1;y>=0;y--)if(!r[y*N+x]){r[y*N+x]=ball();break}}return r}
function available(b,v,i){if(!b[i])return false;if(v==="split")return b[i].v>1&&adj(i).some(j=>!b[j]);if(v==="absorb")return adj(i).some(j=>b[j]);if(v==="convert")return adj(i).some(j=>b[j]&&b[j].c!==b[i].c);return true}
function actions(turn,b){let extra=turn<3?"absorb": ["convert","split","triple","absorb"][(turn-3)%4];if(!b.some((t,i)=>available(b,extra,i)))extra="triple";return ["double","explode",extra]}
function resolve(board,v,i,boost=false){if(!available(board,v,i))return null;let b=copy(board),changed=[],frames=[];if(v==="explode"){let ls=layers(b,i);ls.forEach((ids,k)=>{let hit=copy(b),base=ids.reduce((n,j)=>n+b[j].v,0),pts=base*100*(k+1)*(k+1)*(boost?3:1);for(let j of ids)b[j]=null;frames.push({hit,ids,board:copy(b),pts,dp:ids.length*2+(k?2:0)})});b=gravity(b)}else if(v==="double"||v==="triple"){changed=layers(b,i).flat();for(let j of changed)b[j].v=cap(b[j].v*(v==="double"?2:3))}else if(v==="absorb"){for(let j of adj(i))if(b[j]){b[i].v=cap(b[i].v+b[j].v);b[j]=null}changed=[i]}else if(v==="convert"){for(let j of adj(i))if(b[j]&&b[j].c!==b[i].c){b[j].c=b[i].c;changed.push(j)}}else if(v==="split"){let j=adj(i).find(j=>!b[j]),v0=b[i].v;b[i].v=Math.ceil(v0/2);b[j]=ball(b[i].c,Math.floor(v0/2));changed=[i,j]}return {b:gravity(b),effect:copy(b),changed,frames}}
const $=id=>document.getElementById(id);let S=null,screen="title",busy=false,run=0,ctx=null,meaning=false;const get=(k,d)=>{try{return JSON.parse(localStorage.getItem("eigodoka.tap."+k))??d}catch{return d}},set=(k,v)=>{try{localStorage.setItem("eigodoka.tap."+k,JSON.stringify(v))}catch{}};let sound=get("sound",true),voice=get("voice",false);
function unlock(){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume().catch(()=>{})}catch{}}
function tone(n){if(!sound||!ctx)return;try{for(let j=0;j<3;j++){let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+j*.045;o.type="triangle";o.frequency.value=Math.min(1800,200+n*130+j*160);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.19)}}catch{}}
function say(v){if(!voice||!window.speechSynthesis)return;try{window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(VERBS[v].name);u.lang="en-US";u.rate=.9;window.speechSynthesis.speak(u)}catch{}}
function soundUI(){$("sound").textContent=sound?"♪ ON":"♪ OFF";$("voice").textContent=voice?"英音 ON":"英音 OFF"}soundUI();$("sound").onclick=()=>{sound=!sound;set("sound",sound);soundUI();unlock()};$("voice").onclick=()=>{voice=!voice;set("voice",voice);soundUI();if(voice&&S)say(S.selected);else if(window.speechSynthesis)window.speechSynthesis.cancel()};
function show(id){["title","game","result"].forEach(x=>$(x).hidden=x!==id);screen=id;$("quit").hidden=id!=="game";window.scrollTo(0,0)}
function best(){$("best").textContent="BEST "+Number(get("best",0)).toLocaleString()}best();
function begin(){run++;busy=false;meaning=false;unlock();S={b:initial(),turn:0,score:0,dp:0,selected:"double",used:new Set(),maxChain:0,destroyed:0};show("game");$("field").classList.remove("flash");$("burst").classList.remove("pop");$("ticker").textContent="光っている玉をタップ！";render()}
function hud(){$("score").textContent=S.score.toLocaleString();$("dp").textContent=Math.min(20,S.dp);$("turn").textContent=Math.min(MAX,S.turn+1)+"/"+MAX;$("fill").style.width=Math.min(100,S.dp/20*100)+"%";$("meter").classList.toggle("charged",S.dp>=20);$("fever").textContent=S.dp>=20?"FEVER! 次の爆発 ×3":"次の爆発 ×1"}
function boardView(b,hit=[],changed=[]){$("board").replaceChildren();b.forEach((t,i)=>{let e=document.createElement("button");e.className="cell"+(hit.includes(i)?" hit":"")+(changed.includes(i)?" changed":"")+(!busy&&S.turn===0&&S.selected==="double"&&i===17?" demoTarget":"");e.disabled=busy||!available(b,S.selected,i);if(t){let a=document.createElement("span");a.className="ball"+(t.v>=1000?" long":"");a.style.background=LOOK[t.c][0];a.style.color=LOOK[t.c][1];a.textContent=t.v.toLocaleString();e.append(a);e.setAttribute("aria-label",JP[t.c]+" "+t.v)}else e.setAttribute("aria-label","空き");e.onclick=()=>tap(i);$("board").append(e)})}
function renderPowers(){let a=actions(S.turn,S.b);if(!a.includes(S.selected))S.selected=a[0];$("powers").replaceChildren();for(let v of a){let data=VERBS[v],b=document.createElement("button");b.className="power";b.disabled=busy;b.setAttribute("aria-pressed",String(v===S.selected));b.setAttribute("aria-label",data.name);b.innerHTML='<svg viewBox="0 0 42 36" aria-hidden="true">'+data.icon+'</svg><strong>'+data.name+'</strong>'+(meaning?'<span class="meaning">'+data.ja+'</span>':'');b.onclick=()=>{if(busy)return;S.selected=v;say(v);meaningView();$("ticker").textContent=data.name+" → 玉をタップ！";render()};$("powers").append(b)}}
function meaningView(){$("meaning").hidden=!meaning;$("hint").textContent=meaning?"意味を隠す":"？ 意味";$("meaning").textContent=VERBS[S.selected].hint}
function render(){renderPowers();boardView(S.b);hud();meaningView()}
$("hint").onclick=()=>{if(!busy){meaning=!meaning;render()}};
function pop(s){let e=$("burst");e.textContent=s;e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}
const wait=ms=>new Promise(r=>setTimeout(r,ms));async function tap(i){if(busy||screen!=="game"||S.turn>=MAX)return;let v=S.selected,boost=S.dp>=20&&v==="explode",r=resolve(S.b,v,i,boost);if(!r)return;busy=true;let token=run;unlock();S.used.add(v);say(v);if(boost)S.dp-=20;render();if(v!=="explode"){boardView(r.effect,[],r.changed);pop(v==="double"?"×2!!":v==="triple"?"×3!!":VERBS[v].name.toUpperCase()+"!");tone(1);await wait(350);if(token!==run)return}else{for(let k=0;k<r.frames.length;k++){let f=r.frames[k];S.score+=f.pts;S.dp=Math.min(40,S.dp+f.dp);S.destroyed+=f.ids.length;S.maxChain=Math.max(S.maxChain,k+1);$("field").classList.add("flash");boardView(f.hit,f.ids);pop((k+1)+" CHAIN!!");$("ticker").textContent="+"+f.pts.toLocaleString();hud();tone(k+3+(boost?2:0));await wait(280);if(token!==run)return;boardView(f.board);$("field").classList.remove("flash");await wait(70);if(token!==run)return}}S.b=r.b;S.turn++;if(S.turn>=MAX){busy=false;finish();return}S.b=refill(S.b,Math.max(1,17-S.b.filter(Boolean).length));if(S.turn===1&&v==="double"){S.selected="explode";$("ticker").textContent="今度は爆破！ 玉をタップ"}else $("ticker").textContent=v==="explode"?"BOOM! 次の技を選ぼう":VERBS[v].name+"! 次の技を選ぼう";busy=false;render()}
function finish(){show("result");$("final").textContent=S.score.toLocaleString();let old=get("best",0);if(S.score>old)set("best",S.score);$("record").textContent=S.score>old?"NEW RECORD!!":"BEST "+Number(old).toLocaleString();$("chain").textContent=S.maxChain;$("destroyed").textContent=S.destroyed;$("words").replaceChildren();for(let v of S.used){let e=document.createElement("span");e.textContent=VERBS[v].name+" = "+VERBS[v].ja;$("words").append(e)}best()}
$("start").onclick=begin;$("again").onclick=begin;$("home").onclick=()=>show("title");$("quit").onclick=()=>{run++;busy=false;finish()};
</script></body></html>

function seed(m,b=empty(),minimum=10){let r=copy(b);while(r.filter(Boolean).length<minimum){let cols=shuffle(Array.from({length:W},(_,i)=>i)).filter(x=>!r[x]);let placed=false;for(let x of cols){let i=landing(r,x)*W+x,opts=wordPool(m).filter(w=>!adj(i).some(j=>match(m,w,r[j])));if(opts.length){r[i]=pick(opts);placed=true;break}}if(!placed)break}return r}
function topOptions(b,m){let options=[];for(let x=0;x<W;x++){if(b[x])continue;let y=landing(b,x),i=y*W+x;for(let j of adj(i))if(b[j])for(let p of m.pairs){if(p[0]===b[j])options.push({word:p[1],target:j,x});else if(p[1]===b[j])options.push({word:p[0],target:j,x})}}return options}
function spawn(b,m,last){let opts=topOptions(b,m);if(!opts.length)return null;let pool=opts.filter(q=>q.word!==last);let p=pick(pool.length?pool:opts),x=[2,1,3,0,4].find(j=>!b[j]);return x===undefined?null:{word:p.word,x,y:0}}
function pairHits(b,m){let ids=new Set(),pairs=[];for(let i=0;i<b.length;i++)if(b[i])for(let j of adj(i))if(j>i&&match(m,b[i],b[j])){ids.add(i);ids.add(j);pairs.push([b[i],b[j]])}return {ids:[...ids],pairs}}
function settle(b,m,first,fever){let r=copy(b),frames=[];for(let k=0;k<40;k++){let result=pairHits(r,m);if(k===0&&!result.ids.includes(first))break;if(!result.ids.length)break;let hit=copy(r),n=k+1,pts=result.ids.length*500*n*n*(fever?3:1);result.ids.forEach(j=>r[j]=null);r=gravity(r);frames.push({...result,hit,b:copy(r),pts,dp:result.ids.length*2+(n-1)*2})}return {b:r,frames}}
const $=id=>document.getElementById(id);let S=null,screen="title",busy=false,paused=false,run=0,timer=null,ctx=null,selected="all",hinted=false,voice=true,sound=true;
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem("eigodoka.words."+k))??d}catch{return d}},set=(k,v)=>{try{localStorage.setItem("eigodoka.words."+k,JSON.stringify(v))}catch{}};
voice=get("voice",true);sound=get("sound",true);const speechOK=()=>!!window.speechSynthesis;
function say(w){if(!speechOK())return;try{window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.86;window.speechSynthesis.speak(u)}catch{}}
function unlock(){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume().catch(()=>{})}catch{}}
function tone(n){if(!sound||!ctx)return;try{for(let j=0;j<3;j++){let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+j*.04;o.type="triangle";o.frequency.value=Math.min(1800,220+n*160+j*180);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.19)}}catch{}}
function soundUI(){$("sound").textContent=sound?"♪ ON":"♪ OFF";$("voice").textContent=voice?"英音 ON":"英音 OFF"}soundUI();
$("sound").onclick=()=>{sound=!sound;set("sound",sound);soundUI();unlock()};$("voice").onclick=()=>{voice=!voice;set("voice",voice);soundUI();if(voice&&S?.active)say(S.active.word);else if(speechOK())window.speechSynthesis.cancel()};
function modes(){let all=[{id:"all",name:"全部ミックス"},...DATA];$("modes").replaceChildren();for(let m of all){let b=document.createElement("button");b.className="small";b.textContent=m.name;b.dataset.mode=m.id;b.setAttribute("aria-pressed",String(selected===m.id));b.onclick=()=>{selected=m.id;modes();best()};$("modes").append(b)}}modes();
function best(){$("best").textContent="BEST "+Number(get("best."+selected,0)).toLocaleString()}best();
function show(id){["title","game","result"].forEach(x=>$(x).hidden=x!==id);screen=id;$("quit").hidden=id!=="game";$("overlay").hidden=true;window.scrollTo(0,0)}
function mode(){return S.order[S.stage]}
function hiddenWord(){return mode().id==="listen"&&speechOK()&&!hinted}
function boardView(b,a=null,hits=[]){let i0=a?a.y*W+a.x:-1,g=a?landing(b,a.x,a.y)*W+a.x:-1;$("board").replaceChildren();for(let i=0;i<b.length;i++){let e=document.createElement("div"),w=i===i0?a.word:b[i];e.className="cell"+(hits.includes(i)?" hit":"");e.setAttribute("role","gridcell");if(w){let el=document.createElement("span");let mask=i===i0&&hiddenWord();el.className="ball"+(w.length>=7?" long":"")+(i===i0?" falling":"");el.textContent=mask?"🔊":w;el.setAttribute("aria-label",mask?"発音を聞く単語":w);el.style.background=COLORS[Math.floor(i/W)%COLORS.length];el.style.color="#14121a";e.append(el)}else if(i===g&&a){let el=document.createElement("span");el.className="ghost";e.append(el)}$("board").append(e)}}
function hud(){$("score").textContent=S.score.toLocaleString();$("dp").textContent=S.dp;$("level").textContent=(S.stage+1)+"/"+S.order.length;let m=mode();$("ruleName").textContent=m.name;$("ruleSub").textContent=m.sub;$("example").textContent=m.example;$("fallWord").textContent=S.active?"FALL: "+(hiddenWord()?"🔊":S.active.word):"BOOM!";$("dots").replaceChildren();for(let j=0;j<GOAL;j++){let e=document.createElement("i");e.className=j<S.progress?"on":"";$("dots").append(e)}let d=busy||paused||!S.active;for(let id of ["left","right","drop","hint","listen"])$(id).disabled=d||id==="listen"&&!speechOK()}
function render(){boardView(S.b,S.active);hud()}
function stop(){clearTimeout(timer);timer=null}
function schedule(){stop();if(screen!=="game"||paused||busy||!S.active)return;timer=setTimeout(step,Math.max(900,1750-S.stage*100))}
function nextPiece(){let m=mode();S.b=seed(m,S.b,10);S.active=spawn(S.b,m,S.last);hinted=false;$("meaning").hidden=true;if(!S.active)return false;S.last=S.active.word;if(voice||m.id==="listen")say(S.active.word);return true}
function begin(){run++;stop();busy=false;paused=false;hinted=false;unlock();let order=selected==="all"?DATA:[DATA.find(m=>m.id===selected)];S={order,stage:0,progress:0,b:seed(order[0]),active:null,last:null,score:0,dp:0,maxChain:0,destroyed:0,words:new Map(),complete:false};show("game");$("field").classList.remove("flash");$("burst").classList.remove("pop");$("ticker").textContent="相棒を見つけよう！";if(!nextPiece()){finish();return}render();schedule()}
function pop(s){let e=$("burst");e.textContent=s;e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}
function move(dx){if(busy||paused||screen!=="game"||!S.active)return;let a=S.active,x=a.x+dx;if(x<0||x>=W||S.b[a.y*W+x])return;a.x=x;render()}
function step(){timer=null;if(busy||paused||screen!=="game"||!S.active)return;let a=S.active;if(a.y+1<H&&!S.b[(a.y+1)*W+a.x]){a.y++;render();schedule()}else lock()}
function drop(){if(busy||paused||screen!=="game"||!S.active)return;S.active.y=landing(S.b,S.active.x,S.active.y);lock()}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function lock(){
 if(busy||paused||!S.active)return;
 stop();busy=true;let token=run,a=S.active,i=a.y*W+a.x,m=mode();S.b[i]=a.word;S.active=null;let fever=S.dp>=20,result=settle(S.b,m,i,fever);render();
 if(result.frames.length){if(fever)S.dp-=20;S.progress++;for(let k=0;k<result.frames.length;k++){if(token!==run)return;let f=result.frames[k];S.score+=f.pts;S.dp=Math.min(99,S.dp+f.dp);S.destroyed+=f.pairs.length;S.maxChain=Math.max(S.maxChain,k+1);f.pairs.forEach(p=>S.words.set(m.name+":"+p.slice().sort().join("|"),{m:m.name,p}));$("field").classList.add("flash");boardView(f.hit,null,f.ids);pop(k?" "+(k+1)+" CHAIN!!":fever?"FEVER ×3!!":"BOOM!!");$("ticker").textContent=f.pairs[0].join(" ＋ ")+"  +"+f.pts.toLocaleString();hud();tone(k+3);await wait(350);if(token!==run)return;boardView(f.b);$("field").classList.remove("flash");await wait(100)}}else{$("ticker").textContent="まだつながらない！";tone(1)}
 if(token!==run)return;S.b=result.b;
 if(S.progress>=GOAL){S.score+=3000;pop("STAGE CLEAR!!");$("ticker").textContent="ステージクリア！ +3,000";tone(8);hud();await wait(700);if(token!==run)return;if(S.stage+1>=S.order.length){S.complete=true;finish();return}S.stage++;S.progress=0;S.last=null;S.b=seed(mode());$("ticker").textContent="新しいルール！ "+mode().name}
 busy=false;if(!nextPiece()){finish();return}render();schedule();
}
function setPause(p){if(screen!=="game")return;paused=p;$("overlay").hidden=!p;if(p){stop();if(speechOK())window.speechSynthesis.cancel()}else schedule();hud()}
function finish(){stop();run++;busy=false;paused=false;show("result");$("resultTitle").textContent=S.complete?"ALL CLEAR!":"GAME OVER";$("final").textContent=S.score.toLocaleString();let key="best."+selected,old=get(key,0);if(S.score>old)set(key,S.score);$("record").textContent=S.score>old?"NEW RECORD!!":"BEST "+Number(old).toLocaleString();$("chain").textContent=S.maxChain;$("destroyed").textContent=S.destroyed;$("words").replaceChildren();for(let {m,p} of S.words.values()){let e=document.createElement("span");e.textContent=p.join(" ↔ ")+"（"+m+"）";$("words").append(e)}best()}
$("left").onclick=()=>move(-1);$("right").onclick=()=>move(1);$("drop").onclick=drop;$("listen").onclick=()=>{if(S.active)say(S.active.word)};
$("hint").onclick=()=>{if(busy||!S.active)return;hinted=!hinted;let w=S.active.word,m=mode(),matches=wordPool(m).filter(x=>match(m,w,x));$("meaning").hidden=!hinted;$("meaning").textContent=w+(JP[w]?"（"+JP[w]+"）":"")+" → "+matches.join(" / ");render()};
$("quit").onclick=()=>setPause(!paused);$("resume").onclick=()=>setPause(false);$("finish").onclick=finish;$("start").onclick=begin;$("again").onclick=begin;$("home").onclick=()=>show("title");
let touch=null;$("board").addEventListener("pointerdown",e=>{if(busy||paused||!S?.active)return;touch={x:e.clientX,y:e.clientY};try{$("board").setPointerCapture(e.pointerId)}catch{}});
$("board").addEventListener("pointerup",e=>{if(!touch||busy||paused||!S?.active){touch=null;return}let dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(dy>25&&dy>Math.abs(dx)){drop();return}let rect=$("board").getBoundingClientRect(),to=Math.max(0,Math.min(W-1,Math.floor((e.clientX-rect.left)/rect.width*W)));let dir=Math.sign(to-S.active.x);while(dir&&S.active.x!==to){let old=S.active.x;move(dir);if(old===S.active.x)break}});
$("board").addEventListener("pointercancel",()=>touch=null);
document.addEventListener("keydown",e=>{if(screen!=="game")return;if(e.key==="Escape"){setPause(!paused);return}if(paused)return;if(["ArrowLeft","ArrowRight","ArrowDown"," "].includes(e.key))e.preventDefault();if(e.key==="ArrowLeft")move(-1);else if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowDown"||e.key===" ")drop()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&screen==="game")setPause(true)});
</script></body></html>

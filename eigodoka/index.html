<section id="game" hidden><div class="hud"><div><small>SCORE</small><b id="score">0</b></div><div><small>DP</small><b class="red" id="dp">10</b></div><div><small>LEVEL</small><b id="level">1</b></div></div><div class="field" id="field"><div class="fieldtop"><span>英単語ボム！</span><span class="next">NEXT <span class="mini" id="next"></span></span></div><div class="board" id="board" role="grid" aria-label="落下フィールド"></div><div class="burst" id="burst"></div><p id="ticker" class="ticker" aria-live="polite">同じ色を3つつなごう！</p><div class="pausebox" id="overlay" hidden><div><h2>一時停止</h2><button class="cta" id="resume">再開</button><button class="small" id="finish">終了</button></div></div></div><div class="moves"><button class="move" id="left" aria-label="左">←</button><button class="move drop" id="drop" aria-label="一気に落とす">↓ DROP</button><button class="move" id="right" aria-label="右">→</button></div><div class="powers"><button class="power" id="double"><span class="symbol">×2</span><strong>Double</strong><small>2倍</small></button><button class="power" id="swap"><span class="symbol">⇄</span><strong>Swap</strong><small>NEXT と交換</small></button><button class="power" id="explode"><span class="symbol">✹</span><strong>Explode</strong><small>10 DP</small></button></div><div class="under"><span class="note">技は1玉に1回</span><button class="small" id="hint">？</button></div><p class="hintline" id="meaning" hidden>Double＝2倍 ／ Swap＝次の玉と交換 ／ Explode＝着地で周囲を爆破</p></section><section id="result" class="center" hidden><div class="report"><p class="kicker">ゲーム結果</p><p class="note" style="margin-top:10px">SCORE</p><p class="score" id="final"></p><p class="red" id="record" style="font-weight:1000"></p><div class="stats"><div><small>最大連鎖</small><b id="chain"></b></div><div><small>爆破した玉</small><b id="destroyed"></b></div></div><p class="tag" style="font-size:16px">使った英語</p><div class="words" id="words"></div></div><button class="cta" id="again">もう一回！</button><button class="small" id="home">タイトルへ</button></secti "use strict";
const W=6,H=10,C=["red","blue","yellow","green"],LOOK={red:["#ff3b1f","#fff"],blue:["#347be4","#fff"],yellow:["#ffcc00","#14121a"],green:["#33af76","#14121a"]},V={double:["Double","2倍"],swap:["Swap","交換"],explode:["Explode","爆破"]};
const rand=n=>Math.floor(Math.random()*n),pick=a=>a[rand(a.length)],empty=()=>Array(W*H).fill(null),copy=b=>b.map(t=>t?{...t}:null),ball=()=>({c:pick(C),v:1+rand(4),bomb:false});
function adj(i){let x=i%W,y=Math.floor(i/W),a=[];if(x)a.push(i-1);if(x<W-1)a.push(i+1);if(y)a.push(i-W);if(y<H-1)a.push(i+W);return a}
function gravity(b){let r=empty();for(let x=0;x<W;x++){let y=H-1;for(let z=H-1;z>=0;z--){let t=b[z*W+x];if(t)r[y--*W+x]=t}}return r}
function landing(b,x,y){while(y+1<H&&!b[(y+1)*W+x])y++;return y}
function groups(b){let seen=new Set(),out=[];for(let i=0;i<b.length;i++){if(!b[i]||seen.has(i))continue;let g=[i];seen.add(i);for(let j=0;j<g.length;j++)for(let k of adj(g[j]))if(b[k]&&b[k].c===b[i].c&&!seen.has(k)){seen.add(k);g.push(k)}if(g.length>=3)out.push(g)}return out}
function settle(board,bomb=-1){let b=copy(board),frames=[];for(let k=0;k<60;k++){let ids=k===0&&bomb>=0?[bomb,...adj(bomb)].filter(i=>b[i]):groups(b).flat();if(!ids.length)break;ids=[...new Set(ids)];let hit=copy(b),n=k+1,pts=ids.reduce((v,i)=>v+b[i].v,0)*100*n*n,dp=ids.length*2+(n-1)*2;ids.forEach(i=>b[i]=null);b=gravity(b);frames.push({hit,ids,b:copy(b),pts,dp})}return {b,frames}}
function initial(){let b=empty();b[54]={c:"blue",v:2};b[55]={c:"blue",v:3};return b}
function spawn(b,p){let x=[2,1,3,0,4,5].find(i=>!b[i]);return x===undefined?null:{...p,x,y:0,used:false}}
const $=id=>document.getElementById(id);
let S=null,screen="title",busy=false,paused=false,run=0,timer=null,ctx=null,meaning=false;
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem("eigodoka.fall."+k))??d}catch{return d}},set=(k,v)=>{try{localStorage.setItem("eigodoka.fall."+k,JSON.stringify(v))}catch{}};
let sound=get("sound",true),voice=get("voice",false);
function unlock(){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume().catch(()=>{})}catch{}}
function tone(n){if(!sound||!ctx)return;try{for(let j=0;j<3;j++){let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+j*.04;o.type="triangle";o.frequency.value=Math.min(1800,200+n*130+j*160);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.18)}}catch{}}
function say(v){if(!voice||!window.speechSynthesis)return;try{window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(v);u.lang="en-US";u.rate=.9;window.speechSynthesis.speak(u)}catch{}}
function soundUI(){$("sound").textContent=sound?"♪ ON":"♪ OFF";$("voice").textContent=voice?"英音 ON":"英音 OFF"}
soundUI();$("sound").onclick=()=>{sound=!sound;set("sound",sound);soundUI();unlock()};$("voice").onclick=()=>{voice=!voice;set("voice",voice);soundUI();if(voice)say("Drop");else if(window.speechSynthesis)window.speechSynthesis.cancel()};
function show(id){["title","game","result"].forEach(x=>$(x).hidden=x!==id);screen=id;$("quit").hidden=id!=="game";$("overlay").hidden=true;window.scrollTo(0,0)}
function best(){$("best").textContent="BEST "+Number(get("best",0)).toLocaleString()}best();
function boardView(b,a=null,hits=[]){let i0=a?a.y*W+a.x:-1,g=a?landing(b,a.x,a.y)*W+a.x:-1;$("board").replaceChildren();for(let i=0;i<b.length;i++){let e=document.createElement("div"),t=i===i0?a:b[i];e.className="cell"+(hits.includes(i)?" hit":"");e.setAttribute("role","gridcell");if(t){let el=document.createElement("span");el.className="ball"+(i===i0?" falling":"")+(t.bomb?" bomb":"");el.textContent=t.v;el.style.background=LOOK[t.c][0];el.style.color=LOOK[t.c][1];e.append(el)}else if(i===g&&a){let el=document.createElement("span");el.className="ghost";el.style.color=LOOK[a.c][0];e.append(el)}$("board").append(e)}}
function hud(){$("score").textContent=S.score.toLocaleString();$("dp").textContent=S.dp;$("level").textContent=S.level;let p=S.next,n=$("next");n.style.background=LOOK[p.c][0];n.style.color=LOOK[p.c][1];n.textContent=p.v;let d=busy||paused||!S.active;for(let id of ["left","right","drop"])$(id).disabled=d;for(let id of Object.keys(V)){$(id).disabled=d||S.active?.used||(id==="explode"&&S.dp<10);$(id).classList.toggle("ready",id==="explode"&&!$(id).disabled)}}
function render(){boardView(S.b,S.active);hud()}
function stop(){clearTimeout(timer);timer=null}
function schedule(){stop();if(screen!=="game"||paused||busy||!S.active)return;timer=setTimeout(step,Math.max(300,1050-(S.level-1)*100))}
function begin(){run++;stop();busy=false;paused=false;meaning=false;unlock();let b=initial();S={b,active:spawn(b,{c:"blue",v:4}),next:ball(),score:0,dp:10,level:1,drops:0,maxChain:0,destroyed:0,used:new Set()};show("game");$("meaning").hidden=true;$("field").classList.remove("flash");$("burst").classList.remove("pop");$("ticker").textContent="同じ色を3つつなごう！";render();schedule()}
function pop(s){let e=$("burst");e.textContent=s;e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}
function move(dx){if(busy||paused||screen!=="game"||!S.active)return;let a=S.active,x=a.x+dx;if(x<0||x>=W||S.b[a.y*W+x])return;a.x=x;render()}
function step(){timer=null;if(busy||paused||screen!=="game"||!S.active)return;let a=S.active;if(a.y+1<H&&!S.b[(a.y+1)*W+a.x]){a.y++;render();schedule()}else lock()}
function drop(){if(busy||paused||screen!=="game"||!S.active)return;S.active.y=landing(S.b,S.active.x,S.active.y);say("Drop");lock()}
function power(v){if(busy||paused||screen!=="game"||!S.active||S.active.used||(v==="explode"&&S.dp<10))return;let a=S.active;if(v==="double")a.v*=2;else if(v==="swap"){let p=S.next;S.next={c:a.c,v:a.v};a.c=p.c;a.v=p.v}else{S.dp-=10;a.bomb=true}a.used=true;S.used.add(v);say(V[v][0]);$("ticker").textContent=V[v][0]+"!";tone(2);render()}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function lock(){
 if(busy||paused||!S.active)return;
 stop();busy=true;let token=run,a=S.active,i=a.y*W+a.x;
 S.b[i]={c:a.c,v:a.v,bomb:a.bomb};S.active=null;S.drops++;
 let result=settle(S.b,a.bomb?i:-1);render();
 for(let k=0;k<result.frames.length;k++){
   if(token!==run)return;
   let f=result.frames[k];S.score+=f.pts;S.dp=Math.min(99,S.dp+f.dp);S.destroyed+=f.ids.length;S.maxChain=Math.max(S.maxChain,k+1);
   $("field").classList.add("flash");boardView(f.hit,null,f.ids);pop(k===0?"BOOM!!":(k+1)+" CHAIN!!");$("ticker").textContent="+"+f.pts.toLocaleString()+" / "+f.ids.length+" BOOM!";hud();tone(k+3);
   await wait(300);if(token!==run)return;boardView(f.b);$("field").classList.remove("flash");await wait(90);
 }
 if(token!==run)return;
 if(result.frames.length&&result.b.every(t=>!t)){S.score+=5000;S.dp=Math.min(99,S.dp+8);pop("ALL CLEAR!!");$("ticker").textContent="全消し！ +5,000";tone(9)}
 S.b=result.b;S.level=1+Math.floor(S.drops/12);S.active=spawn(S.b,S.next);S.next=ball();busy=false;
 if(!S.active){finish();return}render();schedule();
}
function setPause(p){if(screen!=="game")return;paused=p;$("overlay").hidden=!p;if(p)stop();else schedule();hud()}
function finish(){stop();run++;busy=false;paused=false;show("result");$("final").textContent=S.score.toLocaleString();let old=get("best",0);if(S.score>old)set("best",S.score);$("record").textContent=S.score>old?"NEW RECORD!!":"BEST "+Number(old).toLocaleString();$("chain").textContent=S.maxChain;$("destroyed").textContent=S.destroyed;$("words").replaceChildren();for(let v of S.used){let e=document.createElement("span");e.textContent=V[v][0]+" = "+V[v][1];$("words").append(e)}best()}
$("left").onclick=()=>move(-1);$("right").onclick=()=>move(1);$("drop").onclick=drop;Object.keys(V).forEach(v=>$(v).onclick=()=>power(v));$("hint").onclick=()=>{meaning=!meaning;$("meaning").hidden=!meaning};$("quit").onclick=()=>setPause(!paused);$("resume").onclick=()=>setPause(false);$("finish").onclick=finish;$("start").onclick=begin;$("again").onclick=begin;$("home").onclick=()=>show("title");
let touch=null;
$("board").addEventListener("pointerdown",e=>{if(busy||paused||!S?.active)return;touch={x:e.clientX,y:e.clientY};try{$("board").setPointerCapture(e.pointerId)}catch{}});
$("board").addEventListener("pointerup",e=>{if(!touch||busy||paused||!S?.active){touch=null;return}let dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(dy>25&&dy>Math.abs(dx)){drop();return}let rect=$("board").getBoundingClientRect(),to=Math.max(0,Math.min(W-1,Math.floor((e.clientX-rect.left)/rect.width*W)));if(Math.abs(dx)>15){let n=Math.max(1,Math.round(Math.abs(dx)/(rect.width/W)));for(let j=0;j<n;j++)move(dx>0?1:-1)}else{let dir=Math.sign(to-S.active.x);while(dir&&S.active.x!==to){let old=S.active.x;move(dir);if(old===S.active.x)break}}});
$("board").addEventListener("pointercancel",()=>touch=null);
document.addEventListener("keydown",e=>{if(screen!=="game")return;if(e.key==="Escape"){setPause(!paused);return}if(paused)return;if(["ArrowLeft","ArrowRight","ArrowDown"," ","1","2","3"].includes(e.key))e.preventDefault();if(e.key==="ArrowLeft")move(-1);else if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowDown"||e.key===" ")drop();else if(!e.repeat&&["1","2","3"].includes(e.key))power(Object.keys(V)[+e.key-1])});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&screen==="game")setPause(true)});

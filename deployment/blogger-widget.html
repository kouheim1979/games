(()=>{const start=()=>{
// Pure, deterministic planning models. No network calls or storage.
function number(value, name, min, max, integer=false) {
  if (value === '' || (typeof value === 'string' && !value.trim()) || value === null || value === undefined || typeof value === 'boolean') throw new Error(`${name}: enter a number.`);
  const n = Number(value);
  if (!Number.isFinite(n) || n < min || n > max || (integer && !Number.isInteger(n))) throw new Error(`${name}: enter ${integer?'a whole number':'a number'} from ${min} to ${max}.`);
  return n;
}
function heatPump(x) {
  const litres=number(x.litres,'Daily delivered water',0,10000), days=number(x.days,'Days per year',1,366,true);
  const cold=number(x.cold,'Cold inlet temperature',0,40), hot=number(x.hot,'Delivered water temperature',1,80);
  if(hot<=cold) throw new Error('Delivered water temperature must be above the cold inlet temperature.');
  const cop=number(x.cop,'Seasonal heat-pump COP',1,8), loss=number(x.loss,'Heat-loss allowance',0,100)/100;
  const auxiliary=number(x.auxiliary,'Resistance heat share',0,100)/100;
  const rate=number(x.rate,'Electricity price',0,10000), baselineRate=number(x.baselineRate,'Baseline energy price',0,10000);
  const baselineEfficiency=number(x.baselineEfficiency,'Baseline efficiency',1,100)/100;
  const extra=number(x.extra,'Additional upfront cost',0,1000000);
  const drawHeat=litres*4.186*(hot-cold)/3600*days, heat=drawHeat*(1+loss);
  const electricity=heat*((1-auxiliary)/cop+auxiliary), baselineEnergy=heat/baselineEfficiency;
  const cost=electricity*rate, baselineCost=baselineEnergy*baselineRate, saving=baselineCost-cost;
  return {drawHeat,heat,electricity,baselineEnergy,cost,baselineCost,saving,payback:extra>0&&saving>0?extra/saving:null,
    scenarios:[2,3,4].map(c=>({cop:c,kwh:heat*((1-auxiliary)/c+auxiliary),cost:heat*((1-auxiliary)/c+auxiliary)*rate}))};
}
function stockpile(x) {
  const people=number(x.people,'People',1,1000,true), days=number(x.days,'Days',1,90,true);
  const waterRate=number(x.waterRate,'Water per person per day',0.1,50), mealRate=number(x.mealRate,'Meals per person per day',1,10,true);
  const toiletRate=number(x.toiletRate,'Toilet uses per person per day',1,30,true), bottle=number(x.bottle,'Container capacity',0.1,1000);
  const waterOwned=number(x.waterOwned,'Water already stored',0,1000000), mealsOwned=number(x.mealsOwned,'Meals already stored',0,1000000,true), toiletsOwned=number(x.toiletsOwned,'Toilet uses already supplied',0,1000000,true);
  const water=people*days*waterRate, meals=people*days*mealRate, toilets=people*days*toiletRate;
  const waterBuy=Math.max(0,water-waterOwned), mealsBuy=Math.max(0,meals-mealsOwned), toiletsBuy=Math.max(0,toilets-toiletsOwned);
  return {water,meals,toilets,waterBuy,mealsBuy,toiletsBuy,containers:Math.ceil(waterBuy/bottle)};
}
function backup(x) {
  const capacity=number(x.capacity,'Usable battery capacity',0.1,1000), start=number(x.start,'Starting charge',0,100), reserve=number(x.reserve,'Reserve charge',0,100);
  if(reserve>start) throw new Error('Reserve charge cannot exceed starting charge.');
  const efficiency=number(x.efficiency,'Conversion efficiency',1,100)/100, load=number(x.load,'Average AC load',1,100000), standby=number(x.standby,'AC-equivalent standby load',0,10000);
  const energy=capacity*(start-reserve)/100*efficiency;
  return {energy,hours:energy/((load+standby)/1000)};
}
function lockers(x) {
  const homes=number(x.homes,'Homes',1,100000,true), rate=number(x.rate,'Parcels per home per week',0,1000), hours=number(x.hours,'Mean collection delay',0,720);
  const peak=number(x.peak,'Peak multiplier',1,20), utilisation=number(x.utilisation,'Target occupancy',1,100)/100;
  const daily=homes*rate/7, mean=daily*hours/24, capacity=Math.ceil(mean*peak/utilisation);
  return {daily,mean,capacity};
}
function readiness(x) {
  const unit=x.unit==='in'?25.4:1;
  const length=number(x.length,'Bolt centre to bowl front',1,1000/unit)*unit;
  const bolts=number(x.bolts,'Bolt spacing',1,1000/unit)*unit;
  const clearance=number(x.clearance,'Rear clearance',0,1000/unit)*unit;
  const tasks=['Compare all three dimensions and the tank/bowl contour with the exact product drawing.','Confirm mounting access, hose routing, water pressure and local backflow requirements with the product instructions.'];
  if(x.shape==='unknown') tasks.push('Identify the toilet bowl shape and model. A round/elongated label alone does not prove fit.');
  if(x.voltage==='unknown'||x.productVoltage==='unknown') tasks.push('Confirm both local supply and the exact product voltage AND frequency rating.');
  else if(x.voltage!==x.productVoltage) tasks.push('Voltage mismatch recorded. Choose a locally approved model with matching supply; do not treat a plug adapter as a solution.');
  else tasks.push('Voltage labels match; frequency, certification, circuit capacity and manufacturer instructions still need verification.');
  if(x.outlet!=='yes') tasks.push('Have a qualified local installer verify the protected, grounded outlet location and wet-area requirements.');
  if(x.valve!=='yes') tasks.push('Have the water shut-off valve and connection arrangement checked before purchase.');
  return {length,bolts,clearance,tasks};
}

const fmt=(n,d=1)=>{
  // Remove floating-point noise only at display precision; model values stay unchanged.
  const scale=10**d, magnitude=Math.abs(n)*scale;
  const rounded=Math.round(magnitude+Number.EPSILON*Math.max(1,magnitude)*2)/scale;
  const display=rounded===0?0:n<0?-rounded:rounded;
  return new Intl.NumberFormat('en',{maximumFractionDigits:d}).format(display);
};
const money=(n,c)=>new Intl.NumberFormat('en',{style:'currency',currency:c,maximumFractionDigits:0}).format(n);
const metric=(value,label)=>`<div class="metric"><strong>${value}</strong><span>${label}</span></div>`;
const functions={heatPump,stockpile,backup,lockers,readiness};
for(const form of document.querySelectorAll('form[data-tool]')){
  const result=form.querySelector('.result'), error=form.querySelector('.error');
  const clear=()=>{result.hidden=true;result.replaceChildren();error.hidden=true;error.textContent='';};
  form.addEventListener('input',clear);
  form.addEventListener('change',clear);
  let measurementUnit='mm';
  form.addEventListener('reset',()=>{clear();measurementUnit='mm';});
  if(form.elements.unit) form.elements.unit.addEventListener('change',()=>{
    const next=form.elements.unit.value;
    if(next!==measurementUnit){
      for(const name of ['length','bolts','clearance']){
        const input=form.elements.namedItem(name);
        if(input.value!==''&&Number.isFinite(Number(input.value))) input.value=String(Number((Number(input.value)*(next==='in'?1/25.4:25.4)).toFixed(3)));
      }
      measurementUnit=next;
    }
  });
  const preset=form.elements.waterPreset;
  if(preset) preset.addEventListener('change',()=>{if(preset.value!=='custom')form.elements.waterRate.value=preset.value;});
  if(form.elements.waterRate) form.elements.waterRate.addEventListener('input',()=>{preset.value='custom';});
  form.addEventListener('submit',event=>{
    event.preventDefault();clear();
    try{
      if(!form.checkValidity()) {const invalid=form.querySelector('input:invalid,select:invalid');throw new Error(`${invalid.labels?.[0]?.textContent.trim()||'Input'}: ${invalid.validationMessage||'check this value.'}`);}
      const x=Object.fromEntries(new FormData(form)), type=form.dataset.tool, r=functions[type](x);
      let content='';
      if(type==='heatPump'){
        content=`<div class="metrics">${metric(fmt(r.electricity,0)+' kWh','Modelled annual electricity')}${metric(money(r.cost,x.currency),'Modelled annual running cost')}${metric(money(r.saving,x.currency),r.saving>=0?'Annual saving against your baseline':'Annual saving (negative = higher cost)')}</div><p>Baseline energy: ${fmt(r.baselineEnergy,0)} kWh/year; baseline cost: ${money(r.baselineCost,x.currency)}/year. Useful hot-water heat: ${fmt(r.drawHeat,0)} kWh/year.</p><p>${r.payback===null?'Simple payback not shown: enter a positive additional upfront cost and obtain a positive annual saving.':`Illustrative simple payback: ${fmt(r.payback)} years. This ignores financing, maintenance, price changes and equipment life.`}</p><h3>COP sensitivity \u2014 other inputs unchanged</h3><div class="table-scroll"><table><thead><tr><th>COP</th><th>Electricity / year</th><th>Cost / year</th></tr></thead><tbody>${r.scenarios.map(s=>`<tr><th>${s.cop}</th><td>${fmt(s.kwh,0)} kWh</td><td>${money(s.cost,x.currency)}</td></tr>`).join('')}</tbody></table></div>`;
      }else if(type==='stockpile'){
        content=`<div class="metrics">${metric(fmt(r.water)+' L','Total water target')}${metric(fmt(r.meals,0),'Total individual meal portions')}${metric(fmt(r.toilets,0),'Total toilet uses to supply')}</div><h3>Additional supplies after existing stock</h3><ul><li>${fmt(r.waterBuy)} L water: ${fmt(r.containers,0)} additional containers of ${fmt(Number(x.bottle))} L, rounded up.</li><li>${fmt(r.mealsBuy,0)} individual meal portions.</li><li>Products covering ${fmt(r.toiletsBuy,0)} toilet uses. Confirm uses per package; this is not automatically a bag count.</li></ul><p>Plan separate water and supplies for pets, extra hygiene, medical needs and local conditions. Three meal portions is a counting convention, not a nutritional prescription.</p>`;
      }else if(type==='backup'){
        content=`<div class="metrics">${metric(fmt(r.energy,2)+' kWh','Available modelled AC energy')}${metric(fmt(r.hours)+' hours','At your average load and standby input')}</div><p>This energy budget does not verify V2H compatibility, islanding, starting surges, continuous inverter power, battery condition or local approval. Do not use it to size life-critical backup.</p>`;
      }else if(type==='lockers'){
        content=`<div class="metrics">${metric(fmt(r.daily),'Expected parcels per day')}${metric(fmt(r.mean,2),'Mean occupied compartments')}${metric(fmt(r.capacity,0),'Illustrative planning compartments')}</div><p>${r.capacity===0?'Zero occupancy in the supplied scenario. Real deliveries and collection delays may still require compartments.':'One parcel per compartment is assumed.'} This is a steady-state mean with an arbitrary headroom adjustment, not a probability of availability or a service-level guarantee. Test size mix, clustered arrivals and longer collection delays separately.</p>`;
      }else{
        content=`<h3>Measurements recorded \u2014 compatibility not certified</h3><p>Bolt centre to bowl front: ${fmt(r.length)} mm \u00b7 bolt spacing: ${fmt(r.bolts)} mm \u00b7 rear clearance: ${fmt(r.clearance)} mm.</p><ul>${r.tasks.map(t=>`<li>${t}</li>`).join('')}</ul><p>Keep the toilet model number, chosen seat drawing and photos together for the manufacturer or installer. No universal pass/fail score is assigned.</p>`;
      }
      result.innerHTML=`<h2>Your planning result</h2>${content}<p class="small">Calculated from the current inputs. Changing any input clears this result. No input is sent to a server.</p>`;
      result.hidden=false;result.focus();
    }catch(e){error.textContent=e.message;error.hidden=false;error.focus();}
  });
}

      ['\u540c\u3058\u7a2e\u985e\u30fb\u540c\u3058\u30ec\u30d9\u30eb\u306e\u30a2\u30a4\u30c6\u30e0\u3092\u5408\u6210\u3057\u3001\u6ce8\u6587\u306b\u5fc5\u8981\u306a\u54c1\u3092\u3064\u304f\u3063\u3066\u7d0d\u54c1\u3057\u307e\u3059\u3002\u30a2\u30a4\u30c6\u30e0\u30921\u56de\u30bf\u30c3\u30d7\u3059\u308b\u3068\u540d\u524d\u3068\u30ec\u30d9\u30eb\u3092\u78ba\u8a8d\u3067\u304d\u307e\u3059\u3002', '\u6ce8\u6587\u306e\u7d75\u3092\u62bc\u3059\u3068\u3001\u5fc5\u8981\u306a\u5c4b\u53f0\u3068\u5408\u6210\u306e\u9806\u756a\u304c\u308f\u304b\u308a\u307e\u3059\u3002\u76e4\u9762\u304c\u72ed\u304f\u306a\u3063\u305f\u3089\u5009\u5eab\u3082\u6d3b\u7528\u3057\u307e\u3057\u3087\u3046\u3002\u8a18\u9332\u3092\u6b8b\u3057\u305f\u3044\u3068\u304d\u306f\u30b2\u30fc\u30e0\u5185\u306e\u30d0\u30c3\u30af\u30a2\u30c3\u30d7\u3092\u78ba\u8a8d\u3057\u3066\u304f\u3060\u3055\u3044\u3002'],
      ['Merge two items of the same type and level, then deliver the items requested by orders. Tap an item once to check its name and level.', 'Tap an order picture to see the producer and merge sequence. Use the warehouse when the board gets crowded. Check the game\u2019s backup feature to keep a copy of your progress.'],
      ['\u5408\u6210\u540c\u79cd\u7c7b\u3001\u540c\u7b49\u7ea7\u7684\u7269\u54c1\uff0c\u5236\u4f5c\u8ba2\u5355\u6240\u9700\u7684\u6210\u54c1\u5e76\u4ea4\u4ed8\u3002\u70b9\u51fb\u4e00\u6b21\u7269\u54c1\u5373\u53ef\u67e5\u770b\u540d\u79f0\u548c\u7b49\u7ea7\u3002', '\u70b9\u51fb\u8ba2\u5355\u56fe\u7247\u53ef\u67e5\u770b\u751f\u4ea7\u644a\u4f4d\u548c\u5408\u6210\u987a\u5e8f\u3002\u68cb\u76d8\u62e5\u6324\u65f6\u53ef\u4ee5\u4f7f\u7528\u4ed3\u5e93\uff1b\u60f3\u4fdd\u7559\u8fdb\u5ea6\u526f\u672c\u65f6\uff0c\u8bf7\u67e5\u770b\u6e38\u620f\u5185\u7684\u5907\u4efd\u529f\u80fd\u3002'],
      ['Combina dos objetos del mismo tipo y nivel para preparar y entregar pedidos. Toca un objeto una vez para ver su nombre y nivel.', 'Toca la imagen de un pedido para consultar el puesto y la secuencia de combinaci\u00f3n. Usa el almac\u00e9n si falta espacio y revisa la funci\u00f3n de copia de seguridad para conservar tu progreso.']
    ],
    'word-wolf2': [
      ['\u53c2\u52a0\u8005\u3068\u30a6\u30eb\u30d5\u306e\u4eba\u6570\u3092\u8a2d\u5b9a\u3057\u30011\u53f0\u3092\u56de\u3057\u3066\u81ea\u5206\u306e\u304a\u984c\u3060\u3051\u3092\u78ba\u8a8d\u3057\u307e\u3059\u3002\u304a\u984c\u305d\u306e\u3082\u306e\u3092\u8a00\u308f\u305a\u306b\u8a71\u3057\u5408\u3044\u3001\u9055\u3046\u304a\u984c\u3092\u6301\u3063\u3066\u3044\u305d\u3046\u306a\u4eba\u3078\u6295\u7968\u3057\u307e\u3059\u3002', '\u6700\u521d\u306f\u5e83\u3044\u7279\u5fb4\u304b\u3089\u8a71\u3059\u3068\u3001\u304a\u984c\u304c\u3059\u3050\u306b\u3070\u308c\u305a\u4f1a\u8a71\u304c\u7d9a\u304d\u307e\u3059\u3002\u5927\u9006\u8ee2\u30e2\u30fc\u30c9\u3092\u4f7f\u3046\u3068\u3001\u8ffd\u653e\u5f8c\u306b\u30a6\u30eb\u30d5\u304c\u5e02\u6c11\u306e\u304a\u984c\u3092\u5f53\u3066\u308b\u30c1\u30e3\u30f3\u30b9\u304c\u3042\u308a\u307e\u3059\u3002'],
      ['Set the players and wolves, then pass one device around so each person sees only their own word. Discuss without saying the word itself, then vote for someone who seems to have a different word.', 'Start with broad clues to keep the discussion going. With reversal mode enabled, an expelled wolf gets a chance to guess the citizens\u2019 word. The topic words remain Japanese.'],
      ['\u8bbe\u7f6e\u73a9\u5bb6\u548c\u72fc\u7684\u4eba\u6570\uff0c\u8f6e\u6d41\u4f7f\u7528\u540c\u4e00\u53f0\u8bbe\u5907\uff0c\u53ea\u67e5\u770b\u81ea\u5df1\u7684\u8bcd\u8bed\u3002\u4e0d\u76f4\u63a5\u8bf4\u51fa\u8bcd\u8bed\uff0c\u901a\u8fc7\u8ba8\u8bba\u627e\u51fa\u62ff\u5230\u4e0d\u540c\u8bcd\u8bed\u7684\u4eba\u5e76\u6295\u7968\u3002', '\u5148\u804a\u5bbd\u6cdb\u7279\u5f81\uff0c\u53ef\u4ee5\u907f\u514d\u8fc7\u65e9\u6cc4\u9732\u8bcd\u8bed\u3002\u5f00\u542f\u9006\u8f6c\u6a21\u5f0f\u540e\uff0c\u88ab\u653e\u9010\u7684\u72fc\u8fd8\u6709\u673a\u4f1a\u731c\u51fa\u5e02\u6c11\u7684\u8bcd\u8bed\u3002\u9898\u76ee\u8bcd\u8bed\u4ecd\u4e3a\u65e5\u8bed\u3002'],
      ['Configura los jugadores y lobos y pasa el dispositivo para que cada persona vea solo su palabra. Conversad sin decir la palabra y votad por quien parezca tener una distinta.', 'Empieza con pistas generales. Si activas el modo de remontada, el lobo expulsado puede intentar adivinar la palabra de los dem\u00e1s. Las palabras del juego siguen en japon\u00e9s.']
    ],
    'Chroma-sort': [
      ['\u753b\u9762\u306b\u4e26\u3076\u8272\u3092\u898b\u6bd4\u3079\u3001\u30b2\u30fc\u30e0\u5185\u306e\u6848\u5185\u306b\u6cbf\u3063\u3066\u79fb\u52d5\u5148\u3092\u9078\u3073\u3001\u8272\u3092\u6574\u7406\u3057\u307e\u3059\u3002\u6700\u521d\u306f\u53d6\u308a\u7d44\u307f\u3084\u3059\u3044\u96e3\u6613\u5ea6\u3067\u3001\u52d5\u304b\u305b\u308b\u5834\u6240\u3092\u78ba\u304b\u3081\u306a\u304c\u3089\u9032\u3081\u307e\u3057\u3087\u3046\u3002', '\u8272\u306e\u6570\u3084\u4e26\u3073\u3092\u4e00\u5ea6\u306b\u899a\u3048\u3088\u3046\u3068\u305b\u305a\u3001\u307e\u305a\u4e00\u8272\u306e\u884c\u304d\u5148\u306b\u6ce8\u76ee\u3057\u3066\u307f\u307e\u3057\u3087\u3046\u3002\u9014\u4e2d\u3067\u52d5\u304b\u305b\u306a\u304f\u306a\u3063\u305f\u3089\u3001\u5225\u306e\u52d5\u304b\u3057\u65b9\u3092\u8003\u3048\u308b\u306e\u3082\u30d1\u30ba\u30eb\u306e\u697d\u3057\u307f\u3067\u3059\u3002'],
      ['Compare the colors on the board and follow the in-game prompts to select moves and sort them. Start with a manageable difficulty and check which destinations are available.', 'Focus on where one color should go before trying to track the whole board. When a move blocks your options, consider a different route.'],
      ['\u89c2\u5bdf\u68cb\u76d8\u4e0a\u7684\u989c\u8272\uff0c\u6309\u7167\u6e38\u620f\u5185\u63d0\u793a\u9009\u62e9\u79fb\u52a8\u4f4d\u7f6e\u5e76\u6574\u7406\u989c\u8272\u3002\u5efa\u8bae\u5148\u4ece\u5bb9\u6613\u7684\u96be\u5ea6\u5f00\u59cb\uff0c\u786e\u8ba4\u54ea\u4e9b\u4f4d\u7f6e\u53ef\u4ee5\u79fb\u52a8\u3002', '\u4e0d\u5fc5\u4e00\u6b21\u8bb0\u4f4f\u5168\u90e8\u6392\u5217\uff0c\u5148\u60f3\u6e05\u4e00\u79cd\u989c\u8272\u8be5\u53bb\u54ea\u91cc\u3002\u67d0\u4e00\u6b65\u9650\u5236\u4e86\u540e\u7eed\u9009\u62e9\u65f6\uff0c\u53ef\u4ee5\u5c1d\u8bd5\u53e6\u4e00\u6761\u601d\u8def\u3002'],
      ['Compara los colores y sigue las indicaciones del juego para elegir movimientos y ordenarlos. Empieza con una dificultad asequible y comprueba los destinos disponibles.', 'C\u00e9ntrate primero en el destino de un color. Si un movimiento te deja sin opciones, busca otra secuencia.']
    ],
    yakitori: [
      ['\u4e32\u3092\u30bf\u30c3\u30d7\u3057\u3066\u304b\u3089\u79fb\u52d5\u5148\u306e\u713c\u304d\u53f0\u3092\u30bf\u30c3\u30d7\u3057\u3001\u7a7a\u304d\u5834\u6240\u3078\u79fb\u3057\u307e\u3059\u3002\u540c\u3058\u713c\u304d\u53f0\u306b\u540c\u3058\u4e32\u30923\u672c\u305d\u308d\u3048\u308b\u3068\u3001\u713c\u304d\u4e0a\u304c\u3063\u3066\u304a\u5ba2\u3055\u3093\u306e\u6ce8\u6587\u306b\u5c4a\u304d\u307e\u3059\u3002', '\u713c\u304d\u53f0\u3068\u5ba2\u5e2d\u306e\u300c\u3064\u304e\u300d\u3092\u898b\u3066\u3001\u5148\u306e\u6ce8\u6587\u3082\u8003\u3048\u308b\u3068\u904b\u3073\u3084\u3059\u304f\u306a\u308a\u307e\u3059\u3002\u5f85\u305f\u305b\u3059\u304e\u30663\u4eba\u3092\u6012\u3089\u305b\u308b\u3068\u9589\u5e97\u3067\u3059\u3002\u56f0\u3063\u305f\u3068\u304d\u306f\u56de\u6570\u5236\u9650\u3064\u304d\u306e\u88dc\u52a9\u3092\u4f7f\u3048\u307e\u3059\u3002'],
      ['Tap a skewer, then a grill with space. Match three identical skewers on one grill to cook them and serve customers\u2019 orders.', 'Check the next skewers and upcoming orders before moving. The shop closes if three customers lose patience. Limited-use helpers can get you out of a tight spot.'],
      ['\u5148\u70b9\u51fb\u70e4\u4e32\uff0c\u518d\u70b9\u51fb\u6709\u7a7a\u4f4d\u7684\u70e4\u67b6\u3002\u8ba9\u540c\u4e00\u70e4\u67b6\u4e0a\u51fa\u73b0\u4e09\u6839\u76f8\u540c\u70e4\u4e32\uff0c\u5373\u53ef\u70e4\u719f\u5e76\u9001\u7ed9\u70b9\u5355\u7684\u5ba2\u4eba\u3002', '\u6ce8\u610f\u70e4\u67b6\u548c\u5ba2\u5e2d\u65c1\u7684\u201c\u4e0b\u4e00\u4e2a\u201d\uff0c\u63d0\u524d\u8003\u8651\u540e\u7eed\u8ba2\u5355\u3002\u4e09\u4f4d\u5ba2\u4eba\u56e0\u7b49\u5f85\u8fc7\u4e45\u800c\u751f\u6c14\u5c31\u4f1a\u5173\u5e97\uff1b\u9047\u5230\u56f0\u96be\u65f6\u53ef\u4f7f\u7528\u6b21\u6570\u6709\u9650\u7684\u8f85\u52a9\u529f\u80fd\u3002'],
      ['Toca una brocheta y despu\u00e9s una parrilla con espacio. Re\u00fane tres iguales en la misma parrilla para cocinarlas y servir los pedidos.', 'Mira las siguientes brochetas y los pr\u00f3ximos pedidos. El local cierra si tres clientes pierden la paciencia. Las ayudas tienen usos limitados.']
    ],
    'ryouri-shokudo': [
      ['\u304a\u5ba2\u3055\u3093\u306e\u6ce8\u6587\u3092\u898b\u3066\u300c\u3064\u304f\u308b\uff01\u300d\u3092\u62bc\u3057\u3001\u6750\u6599\u3048\u3089\u3073\u30fb\u5207\u308b\u30fb\u713c\u304f\u30fb\u307e\u305c\u308b\u30fb\u304b\u3051\u308b\u306e\u5de5\u7a0b\u3092\u9806\u306b\u9032\u3081\u307e\u3059\u3002\u5de5\u7a0b\u3054\u3068\u306e\u51fa\u6765\u3070\u3048\u3067\u661f1\u301c3\u3064\u304c\u6c7a\u307e\u308a\u3001\u58f2\u4e0a\u3068\u30c1\u30c3\u30d7\u304c\u3082\u3089\u3048\u307e\u3059\u3002', '\u713c\u304f\u5de5\u7a0b\u306f\u30e1\u30fc\u30bf\u30fc\u304c\u307f\u3069\u308a\u306e\u7bc4\u56f2\u3067\u706b\u3092\u3068\u3081\u3001\u304b\u3051\u308b\u5de5\u7a0b\u306f\u307f\u3069\u308a\u306e\u7bc4\u56f2\u3067\u30dc\u30bf\u30f3\u3092\u306f\u306a\u3057\u307e\u3059\u3002\u5f85\u305f\u305b\u3059\u304e\u308b\u3068\u30c1\u30c3\u30d7\u304c\u51fa\u306a\u3044\u306e\u3067\u3001\u58f2\u4e0a\u3067\u5305\u4e01\u30fb\u30d5\u30e9\u30a4\u30d1\u30f3\u30fb\u770b\u677f\u3092\u305d\u308d\u3048\u308b\u3068\u697d\u306b\u306a\u308a\u307e\u3059\u3002'],
      ['Check the order, press Cook, then work through each step: pick ingredients, chop, heat, mix and pour. How well you do each step decides 1\u20133 stars, plus your sales and tips.', 'Turn off the heat when the meter is in the green, and release the pour button in the green. Customers who wait too long leave no tip, so spend your sales on a knife, pan and sign upgrade.'],
      ['\u67e5\u770b\u5ba2\u4eba\u7684\u70b9\u5355\u540e\u6309\u201c\u5f00\u59cb\u505a\u201d\uff0c\u4f9d\u6b21\u5b8c\u6210\u9009\u6750\u3001\u5207\u3001\u52a0\u70ed\u3001\u6405\u62cc\u3001\u6dcb\u9171\u7b49\u6b65\u9aa4\u3002\u6bcf\u4e00\u6b65\u7684\u5b8c\u6210\u5ea6\u51b3\u5b9a1\uff5e3\u9897\u661f\uff0c\u5e76\u83b7\u5f97\u8425\u4e1a\u989d\u548c\u5c0f\u8d39\u3002', '\u52a0\u70ed\u65f6\u5728\u6307\u9488\u8fdb\u5165\u7eff\u8272\u533a\u57df\u65f6\u5173\u706b\uff0c\u6dcb\u9171\u65f6\u5728\u7eff\u8272\u533a\u57df\u677e\u5f00\u6309\u94ae\u3002\u8ba9\u5ba2\u4eba\u7b49\u592a\u4e45\u5c31\u6ca1\u6709\u5c0f\u8d39\uff0c\u53ef\u4ee5\u7528\u8425\u4e1a\u989d\u5347\u7ea7\u83dc\u5200\u3001\u5e73\u5e95\u9505\u548c\u62db\u724c\u3002'],
      ['Mira el pedido, pulsa \u00abA cocinar\u00bb y completa cada paso: elegir ingredientes, cortar, cocinar, mezclar y verter. Cada paso decide de 1 a 3 estrellas, adem\u00e1s de las ventas y propinas.', 'Apaga el fuego cuando el medidor est\u00e9 en verde y suelta el bot\u00f3n de verter en verde. Si el cliente espera demasiado no deja propina; usa tus ventas para mejorar cuchillo, sart\u00e9n y letrero.']
    ],
    'atama-oshiri': [
      ['\u6307\u5b9a\u3055\u308c\u305f\u6700\u521d\u3068\u6700\u5f8c\u306e\u6587\u5b57\u3092\u4f7f\u3046\u65e5\u672c\u8a9e\u3092\u8003\u3048\u307e\u3059\u3002\u3072\u3068\u308a\u30e2\u30fc\u30c9\u306f60\u79d2\u3067\u305f\u304f\u3055\u3093\u7b54\u3048\u308b\u904a\u3073\u3001\u307f\u3093\u306a\u30e2\u30fc\u30c9\u306f\u304a\u984c\u3092\u898b\u3066\u53e3\u3067\u7b54\u3048\u308b\u65e9\u3044\u8005\u52dd\u3061\u3067\u3059\u3002', '\u8eab\u8fd1\u306a\u98df\u3079\u7269\u3084\u52d5\u7269\u306a\u3069\u3001\u7a2e\u985e\u3092\u3072\u3068\u3064\u6c7a\u3081\u308b\u3068\u8a00\u8449\u304c\u6d6e\u304b\u3073\u3084\u3059\u304f\u306a\u308a\u307e\u3059\u3002\u6163\u308c\u3066\u304d\u305f\u3089\u6587\u5b57\u6570\u3057\u3070\u308a\u306b\u3082\u6311\u6226\u3067\u304d\u307e\u3059\u3002'],
      ['Think of a Japanese word with the specified first and last characters. Solo mode gives you 60 seconds; group mode is a spoken race to answer the prompt.', 'Try a familiar category such as food or animals to find words. Once you are comfortable, try the word-length restriction. The word task uses Japanese.'],
      ['\u60f3\u51fa\u4ee5\u6307\u5b9a\u6587\u5b57\u5f00\u5934\u548c\u7ed3\u5c3e\u7684\u65e5\u8bed\u8bcd\u8bed\u3002\u5355\u4eba\u6a21\u5f0f\u9650\u65f660\u79d2\uff0c\u591a\u4eba\u6a21\u5f0f\u5219\u770b\u9898\u76ee\u53e3\u5934\u62a2\u7b54\u3002', '\u5148\u4ece\u98df\u7269\u6216\u52a8\u7269\u7b49\u719f\u6089\u7c7b\u522b\u8054\u60f3\uff0c\u66f4\u5bb9\u6613\u60f3\u51fa\u8bcd\u8bed\u3002\u719f\u6089\u540e\u53ef\u4ee5\u6311\u6218\u9650\u5b9a\u5b57\u6570\u3002\u8bcd\u8bed\u9898\u76ee\u4f7f\u7528\u65e5\u8bed\u3002'],
      ['Piensa en una palabra japonesa con el primer y \u00faltimo car\u00e1cter indicados. El modo individual dura 60 segundos; en grupo se responde en voz alta lo antes posible.', 'Piensa en categor\u00edas conocidas, como comida o animales. Despu\u00e9s prueba la restricci\u00f3n de longitud. La actividad de palabras utiliza japon\u00e9s.']

        const previous = $('#ejl-front-page');
        if (previous) previous.remove();
        main.prepend(portalTemplate.content.cloneNode(true));
        document.body.classList.add('ejl-front', 'mt-front');
      }
    }
    const portal = $('#mt-portal');
    const header = $('#mt-site-header') || $('.Header .header-widget') || $('.Header');
    if (header && !$('.mt-languagebar')) {
      const bar = document.createElement('div');
      bar.className = 'mt-languagebar';
      bar.setAttribute('role', 'group');
      bar.setAttribute('aria-label', 'Language');
      const label = document.createElement('span');
      label.className = 'mt-sr';
      label.dataset.mtI18n = 'language';
      bar.append(label);
      for (const [code, name] of [['ja', '\u65e5\u672c\u8a9e'], ['en', 'English'], ['zh', '\u4e2d\u6587'], ['es', 'Espa\u00f1ol']]) {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.mtLang = code;
        button.lang = code === 'zh' ? 'zh-Hans' : code;
        button.textContent = name;
        bar.append(button);
      }
      header.append(bar);
    }
    // Blogger clones its header while scrolling; cloned buttons lose direct listeners.
    document.addEventListener('click', event => {
      const button = event.target.closest?.('.mt-languagebar [data-mt-lang]');
      if (button && langs.includes(button.dataset.mtLang)) changeLanguage(button.dataset.mtLang, true);
    });
    const pageMenu = $('#PageList1 ul');
    if (pageMenu && !$('.mt-game-nav', pageMenu)) {
      const li = document.createElement('li');
      li.className = 'mt-game-nav';
      const a = document.createElement('a');
      a.href = 'https://everydayjapanlab.blogspot.com/#games';
      a.dataset.mtI18n = 'games';
      li.append(a);
      const homeItem = $('li', pageMenu);
      if (homeItem) homeItem.after(li); else pageMenu.append(li);
    }
    const navKeys = {
      '/p/home.html': 'home', '/p/topics.html': 'guides', '/p/tools.html': 'tools',
      '/p/contact.html': 'contact', '/p/about.html': 'about', '/p/privacy.html': 'privacy',
      '/p/methodology.html': 'methodology', '/p/advertising.html': 'advertising'
    };
    $$('#PageList1 a, .ejl-menu a').forEach(a => {
      const key = navKeys[new URL(a.href, location.href).pathname];
      if (key) a.dataset.mtI18n = key;
    });
    const infoPage = $('[data-mt-info]');
    if (!portal && !infoPage) {
      const article = $('.post-body');
      if (article && !$('#mt-edition-note')) {
        const note = document.createElement('aside');
        note.id = 'mt-edition-note';
        note.className = 'mt-edition-note';
        const p = document.createElement('p');
        p.dataset.mtI18n = 'legacyNotice';
        const a = document.createElement('a');
        a.href = 'https://everydayjapanlab.blogspot.com/#games';
        a.dataset.mtI18n = 'backGames';
        note.append(p, a);
        article.prepend(note);
      }
    }
    const dialog = $('#mt-player');
    const cards = portal ? $$('.mt-game', portal) : [];
    const field = $('#mt-search');
    function gameURL(game) {
      // \u30b2\u30fc\u30e0\u5074\u306e i18n.js \u304c ?lang= \u3092\u8aad\u3093\u3067\u753b\u9762\u3092\u5207\u308a\u66ff\u3048\u308b
      try { const u = new URL(game.url); u.searchParams.set('lang', lang); return u.href; } catch (_) { return game.url; }
    }
    function filteredGames() {
      const normalized = search.normalize('NFKC').trim().toLocaleLowerCase();
      return games.filter(g => (category === 'all' || g.groups.includes(category)) &&
        (!normalized || [g.id, ...Object.values(g.title), ...Object.values(g.description), ...g.groups.map(k => t(k))]
          .join(' ').normalize('NFKC').toLocaleLowerCase().includes(normalized)));
    }
    function filterCards() {
      const visible = new Set(filteredGames().map(g => g.id));
      cards.forEach(card => { card.hidden = !visible.has(card.dataset.mtCard); });
      const results = $('#mt-results');
      if (results) results.textContent = t('results').replace('{count}', visible.size);
      const empty = $('#mt-empty');
      if (empty) empty.hidden = visible.size !== 0;
      const clear = $('#mt-clear');
      if (clear) clear.hidden = !search;
      $$('[data-mt-category]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.mtCategory === category));
      });
    }
    function updateActiveGame() {
      if (!activeGame || !dialog) return;
      $('#mt-player-title').textContent = activeGame.title[lang];
      $('#mt-player-description').textContent = activeGame.description[lang];
      const newTab = $('#mt-new-tab'); if (newTab) newTab.href = gameURL(activeGame);
      $('#mt-game-frame')?.setAttribute('title', t('playing') + ': ' + activeGame.title[lang]);
      const languageLabel = $('#mt-player-language');
      if (languageLabel) {
        languageLabel.dataset.mtI18n = activeGame.localizedGame ? 'original' : 'japaneseGame';
        languageLabel.textContent = t(languageLabel.dataset.mtI18n);
      }
      $('#mt-road-note').hidden = activeGame.id !== 'golden-week';
    }
    function changeLanguage(next, persist) {
      if (!langs.includes(next)) return;
      lang = next;
      document.documentElement.lang = next === 'zh' ? 'zh-Hans' : next;
      if (persist) {
        try { localStorage.setItem('mainichi:language', lang); } catch (_) {}
        const url = new URL(location.href);
        url.searchParams.set('lang', lang);
        try { history.replaceState(null, '', url); } catch (_) {}
      }
      $$('[data-mt-i18n]').forEach(el => { el.textContent = t(el.dataset.mtI18n); });
      $$('[data-mt-title]').forEach(el => {
        const game = games.find(g => g.id === el.dataset.mtTitle);
        if (game) el.textContent = game.title[lang];
      });
      $$('[data-mt-description]').forEach(el => {
        const game = games.find(g => g.id === el.dataset.mtDescription);
        if (game) el.textContent = game.description[lang];
      });
      for (const kind of ['steps', 'tip']) {
        $$('[data-mt-' + kind + ']').forEach(el => {
          const id = el.getAttribute('data-mt-' + kind);
          const guide = window.MainichiGuides?.[id]?.[lang];
          if (guide) el.textContent = guide[kind];
        });
      }
      if (infoPage) {
        $$('[data-mt-info-lang]', infoPage).forEach(section => {
          section.hidden = section.dataset.mtInfoLang !== lang;
          if (!section.hidden) {
            const title = section.dataset.mtPageTitle;
            const heading = $('.post-title');
            if (heading) heading.textContent = title;
            document.title = title + ' | ' + t('brand');
          }
        });
      }
      $$('[data-mt-original-title]').forEach(el => {
        const game = games.find(g => g.id === el.dataset.mtOriginalTitle);
        el.hidden = lang === 'ja' || game.title.ja === game.title[lang];
      });
      $$('.mt-card-art[data-mt-game]').forEach(link => {
        const game = games.find(g => g.id === link.dataset.mtGame);
        if (game) link.setAttribute('aria-label', game.title[lang]);
      });
      $('.mt-filters')?.setAttribute('aria-label', t('games'));
      $('.mt-footer-links')?.setAttribute('aria-label', t('about'));
      $$('[data-mt-lang]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mtLang === lang)));
      $$('.mt-languagebar').forEach(bar => bar.setAttribute('aria-label', t('language')));
      $$('#mt-site-header h1, .Header h1, .Header h2').forEach(heading => {
        const title = $('a', heading) || heading;
        title.textContent = t('brand');
      });
      $$('#mt-site-header > p, .Header .header-widget > p, .Header .description').forEach(description => {
        description.textContent = t('subtitle');
      });
      if (portal) portal.lang = next === 'zh' ? 'zh-Hans' : next;
      if (portal) document.title = t('brand') + ' | ' + t('subtitle');
      if (field) {
        field.placeholder = t('search');
        field.setAttribute('aria-label', t('search'));
      }
      const clear = $('#mt-clear');
      if (clear) clear.setAttribute('aria-label', t('clear'));
      for (const a of $$('a[data-mt-i18n], #mt-portal .mt-tool-card a, #mt-portal .mt-footer a')) {
        const url = new URL(a.getAttribute('href'), location.href);
        if (url.hostname === 'everydayjapanlab.blogspot.com') {
          url.searchParams.set('lang', lang);
          a.href = url.href;
        }
      }
      const close = $('#mt-close');
      if (close) close.setAttribute('aria-label', t('close'));
      filterCards();
      updateActiveGame();
    }
    if (field) field.addEventListener('input', () => { search = field.value; filterCards(); });
    $('#mt-clear')?.addEventListener('click', () => { search = ''; field.value = ''; filterCards(); field.focus(); });
    $$('[data-mt-category]').forEach(button => button.addEventListener('click', () => {
      category = button.dataset.mtCategory;
      filterCards();
    }));
    $('#mt-reset')?.addEventListener('click', () => {
      category = 'all'; search = ''; field.value = ''; filterCards(); field.focus();
    });
    function closePlayer() {
      if (!dialog) return;
      if (document.fullscreenElement === dialog && document.exitFullscreen) document.exitFullscreen().catch(() => {});
      if (dialog.open) dialog.close();
      const frame = $('#mt-game-frame');
      if (frame) frame.remove();
      clearTimeout(loadTimer);
      document.body.classList.remove('mt-playing');
      activeGame = null;
      if (returnFocus && returnFocus.isConnected) returnFocus.focus();
      returnFocus = null;
    }
    function openGame(id, trigger) {
      const game = games.find(g => g.id === id);
      if (!game) return;
      if (!dialog || !dialog.showModal) { location.href = gameURL(game); return; }
      clearTimeout(loadTimer);
      $('#mt-game-frame')?.remove();
      activeGame = game;
      returnFocus = trigger || document.activeElement;
      $('#mt-new-tab').href = gameURL(game);
      const status = $('#mt-loading');
      status.hidden = false;
      status.textContent = t('loading');
      $('#mt-frame-hint').textContent = t('frameHint');
      updateActiveGame();
      const frame = document.createElement('iframe');
      frame.id = 'mt-game-frame';
      frame.title = t('playing') + ': ' + game.title[lang];
      frame.allow = 'fullscreen; autoplay';
      frame.allowFullscreen = true;
      frame.referrerPolicy = 'strict-origin-when-cross-origin';
      frame.addEventListener('load', () => { clearTimeout(loadTimer); status.hidden = true; });
      frame.src = gameURL(game);
      $('#mt-frame-wrap').append(frame);
      if (!dialog.open) dialog.showModal();
      document.body.classList.add('mt-playing');
      $('#mt-close').focus();
      loadTimer = setTimeout(() => { status.textContent = t('frameHint'); }, 12000);
    }
    $$('[data-mt-game]').forEach(link => link.addEventListener('click', event => {
      if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      openGame(link.dataset.mtGame, link);
    }));
    $('#mt-close')?.addEventListener('click', closePlayer);
    dialog?.addEventListener('cancel', event => { event.preventDefault(); closePlayer(); });
    dialog?.addEventListener('close', () => { if (activeGame) closePlayer(); });
    $('#mt-fullscreen')?.addEventListener('click', async () => {
      const frame = $('#mt-game-frame');
      if (!frame) return;
      try {
        if (dialog.requestFullscreen) await dialog.requestFullscreen();
        else throw new Error('Unsupported');
      } catch (_) { $('#mt-frame-hint').textContent = t('fullscreenError'); }
    });
    changeLanguage(lang, false);
    if (portal && games.some(g => g.id === query.get('game'))) openGame(query.get('game'), null);
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, {once:true});
  else boot();
}());


</script>

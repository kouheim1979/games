:root{
  /* 二色刷りの週刊マンガ誌。色つきザラ紙に墨と赤だけ。太ゴシック=アクション、太明朝=判定。 */
  --paper:#f4f1ea; --ink:#14121a; --red:#ff3b1f; --gold:#ffcc00; --mute:#6b6772; --white:#ffffff;
  --gothic:"GD Gothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Meiryo",sans-serif;
  --mincho:"GD Mincho","Hiragino Mincho ProN","Noto Serif JP","Yu Mincho","MS PMincho",serif;
  --body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;touch-action:none}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}

#mute{position:fixed;top:8px;right:8px;z-index:6;width:38px;height:38px;border:2.5px solid var(--ink);border-radius:50%;
  background:var(--white);box-shadow:2px 2px 0 var(--ink);font-family:var(--gothic);font-weight:900;font-size:18px;line-height:1;
  display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
#mute.off{color:#b9b5bf}
#mute.off::after{content:"";position:absolute;width:26px;height:3px;background:var(--red);transform:rotate(-40deg)}

.ov{position:fixed;inset:0;z-index:5;display:flex;padding:16px 20px 22px;background:rgba(244,241,234,.86);
  overflow-y:auto;touch-action:pan-y}
.ov[hidden]{display:none}
.ov.lock button,.ov.lock a{pointer-events:none}
.col{width:100%;max-width:372px;margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}

.kicker{font-family:var(--gothic);font-weight:900;font-size:12px;letter-spacing:.28em;padding:5px 9px 5px 14px;
  background:var(--ink);color:var(--paper);transform:skewX(-10deg)}
.logo{font-family:var(--gothic);font-weight:900;font-style:italic;font-size:clamp(64px,23vw,104px);line-height:1;
  letter-spacing:-.07em;white-space:nowrap;transform:rotate(-5deg);margin:6px 0 0;padding-right:.08em}
.logo .a{color:var(--ink);text-shadow:4px 4px 0 var(--white)}
.logo .b{color:var(--red);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
.tag{font-family:var(--mincho);font-weight:900;font-size:19px;line-height:1.4;text-wrap:balance}
.tag b{font-weight:900;color:var(--red)}

.koma{list-style:none;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.koma li{position:relative;background:var(--white);border:3px solid var(--ink);padding:24px 10px 10px}
.koma li:last-child{grid-column:1/-1}
.koma .no{position:absolute;top:-3px;left:-3px;background:var(--ink);color:var(--white);
  font-family:var(--gothic);font-weight:900;font-size:11px;letter-spacing:.08em;padding:3px 8px}
.koma h2{font-family:var(--gothic);font-weight:900;font-style:italic;font-size:22px;line-height:1.1}
.koma li:nth-child(2) h2{color:var(--red)}
.koma p{font-size:12.5px;line-height:1.5;font-weight:600;color:#3a3742;margin-top:3px}
.koma li:last-child p{margin-top:0}

.cta{-webkit-appearance:none;appearance:none;width:100%;border:3px solid var(--ink);background:var(--ink);color:var(--white);
  font-family:var(--gothic);font-weight:900;font-style:italic;font-size:24px;letter-spacing:.12em;padding:13px 0 15px;
  box-shadow:6px 6px 0 var(--red);cursor:pointer;touch-action:manipulation;transition:transform .06s,box-shadow .06s}
.cta:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--red)}
.best{font-family:var(--gothic);font-weight:900;font-size:13px;letter-spacing:.1em;font-variant-numeric:tabular-nums}

.card{width:100%;background:var(--white);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:14px 15px 13px;text-align:left}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-height:50px}
.stamp{transform:rotate(7deg);font-family:var(--mincho);font-weight:900;font-size:18px;line-height:1.2;color:var(--red);
  border:3px double var(--red);border-radius:7px;padding:4px 10px 6px;text-align:center;white-space:nowrap}
.stamp small{display:block;font-family:var(--body);font-size:9px;font-weight:700;letter-spacing:.3em;padding-left:.3em}
.lbl{font-family:var(--gothic);font-weight:900;font-size:11px;letter-spacing:.2em;color:var(--mute)}
.score{font-family:var(--gothic);font-weight:900;font-style:italic;font-size:clamp(38px,12.5vw,52px);line-height:1.08;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rec{display:inline-block;margin-top:5px;font-family:var(--gothic);font-weight:900;font-size:12px;letter-spacing:.14em;
  color:var(--white);background:var(--red);padding:3px 10px;transform:skewX(-10deg)}
.rec[hidden]{display:none}
.verdict{margin-top:12px;padding-top:11px;border-top:3px solid var(--ink)}
.vt{font-family:var(--mincho);font-weight:900;font-size:clamp(25px,8.4vw,34px);line-height:1.2;margin-top:2px;text-wrap:balance}
.meter{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-top:8px;font-size:17px;line-height:1}
.track{height:12px;border:2.5px solid var(--ink);position:relative;
  background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(20,18,26,.18) 9px 10px)}
.track i{position:absolute;top:-7px;width:10px;height:21px;margin-left:-5px;background:var(--red);border:2.5px solid var(--ink)}
.vc{font-size:12.5px;font-weight:700;margin-top:6px;color:#3a3742;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:11px;border:2.5px solid var(--ink)}
.stats div{padding:6px 9px 7px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink)}
.stats div:nth-child(2n){border-right:0}
.stats div:nth-last-child(-n+2){border-bottom:0}
.stats dt{font-size:10.5px;font-weight:700;color:var(--mute)}
.stats dd{font-family:var(--gothic);font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;margin-top:1px}
.taunt{margin-top:10px;font-size:12.5px;font-weight:700;line-height:1.55;color:#3a3742}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;width:100%}
.sub{-webkit-appearance:none;appearance:none;display:block;text-align:center;text-decoration:none;cursor:pointer;
  border:3px solid var(--ink);background:var(--white);color:var(--ink);font-family:var(--gothic);font-weight:900;font-size:13px;
  line-height:1.2;padding:11px 2px 12px;box-shadow:4px 4px 0 var(--ink);touch-action:manipulation;white-space:nowrap}

<body>

    <h1 class="logo" aria-label="ギリドカ"><span class="a">ギリ</span><span class="b">ドカ</span></h1>
    <p class="tag">ビビったら負け。<b>欲張っても負け。</b></p>
    <ol class="koma">

      <li><span class="no">2</span><h2>離す</h2><p>ドカン！ギリギリで離すほど高得点。</p></li>

    <div class="card">

      </div>

        <p class="vc" id="rchicken">チキン度 0%</p>
      </div>
      <dl class="stats">
        <div><dt>最ギリ（衝突まで）</dt><dd id="s1">—</dd></div>

    <button id="resume" class="cta" type="button">つづける</button>
  </div>
</section>
<div id="toast" role="status"></div>

<script id="sim">
/* ===== ギリドカ: ゲームロジック（DOM非依存。バランス調整はここだけ） ===== */
(function (root) {
  'use strict';
  var W = 400, CORE_R = 20, R_MIN = 54, R_MAX = 172, T_CHARGE = 0.85;
  var G0 = R_MAX - CORE_R, M_MAX = 30, HIT_SLOP = 3, CHAIN_DELAY = 0.055, CHAIN_CAP = 25;
  var FEVER_T = 6.5, LOCK_T = 0.2, CK_SPAN = 14;
  // r:半径 val:基礎点 base/pull/cap:速度・吸引・最高速の係数 chain:誘爆半径
  var TYPES = {
    n: { r: 9,  val: 100,  base: 1.00, pull: 1.00, cap: 1.00, chain: 28 },
    d: { r: 8,  val: 150,  base: 1.50, pull: 1.70, cap: 1.40, chain: 26 },
    h: { r: 16, val: 600,  base: 0.62, pull: 0.46, cap: 0.56, chain: 44 },
    b: { r: 11, val: 250,  base: 0.85, pull: 0.85, cap: 0.88, chain: 92 },
    g: { r: 13, val: 2500, base: 0,    pull: 0,    cap: 1,    chain: 40 }
  };
  // 難易度カーブ: 値 = x0 + x1 * 経過秒
  var DEF = {
    base0: 50, base1: 0.5,       // 吸われていない時の接近速度
    cap0: 285, cap1: 1.8,        // 吸引時の最高速度
    acc0: 310, acc1: 2.8,        // 吸引の加速度
    rate0: 3.2, rate1: 0.065,    // 1秒あたりの出現数
    drain0: 0.019, drain1: 0.0008, // 度胸ゲージの減り（毎秒）
    gain: 0.022,                 // 爆破1回の回復 = gain × √(倍率−1)
    e0: 0.5, eAfter: 0.35        // 開始時 / フィーバー明けのゲージ
  };

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  // 一番近い敵とのすき間(gap)→倍率。すき間0で最大30倍。最後の30pxで急上昇する
  function multOf(gap) {
    if (!(gap < G0)) return 1;
    var k = 1 - (gap > 0 ? gap : 0) / G0;
    return 1 + (M_MAX - 1) * k * k * k * k * k;
  }
  function rankOf(m) { return m >= 20 ? 4 : m >= 10 ? 3 : m >= 4 ? 2 : m >= 1.5 ? 1 : 0; }
  function byD(a, b) { return a.d - b.d; }

  function createSim(opts) {
    opts = opts || {};
    var rnd = opts.rng || Math.random, c = {}, key;
    for (key in DEF) c[key] = opts.cfg && opts.cfg[key] != null ? opts.cfg[key] : DEF[key];
    var S = {
      W: W, H: 700, coreX: W / 2, coreY: 485,
      t: 0, score: 0, level: 1, energy: c.e0, fever: 0, feverCount: 0,
      holding: false, pulling: false, holdT: 0, lock: 0, charge: 0, ring: R_MIN, last: false,
      gap: Infinity, tti: Infinity, mult: 1, potential: 0, inRing: 0, nearest: null,
      enemies: [], events: [], over: false, cause: null,
      stats: { blasts: 0, hits: 0, sumM: 0, sumRaw: 0, chickens: 0, bestTTI: Infinity, maxM: 1, maxChain: 0, kills: 0, bestBlast: 0, missed: 0 }
    };
    var nextSpawn = 0.3, nextPack = 4.5, nextGold = 9 + rnd() * 4, nextId = 1;
    var spinBias = rnd() < 0.5 ? -1 : 1, lastNeed = c.gain * Math.sqrt(5), feverBack = c.eAfter;

    function ev(type, data) { data = data || {}; data.type = type; S.events.push(data); }
    function base(t) { return c.base0 + c.base1 * t; }
    function capV(t) { return c.cap0 + c.cap1 * t; }
    function acc(t) { return c.acc0 + c.acc1 * t; }

    S.setH = function (H) { S.H = H; S.coreY = H - 215; };
    S.setH(opts.H || 700);

    function addEnemy(kind, x, y) {
      var T = TYPES[kind], dx = x - S.coreX, dy = y - S.coreY;
      var e = {
        id: nextId++, kind: kind, T: T, r: T.r, val: T.val, x: x, y: y,
        d: Math.sqrt(dx * dx + dy * dy), th: Math.atan2(dy, dx),
        vr: base(S.t) * T.base, kb: 0, age: 0, seed: rnd(),
        spin: (rnd() < 0.78 ? spinBias : -spinBias) * (0.55 + rnd() * 0.6),
        doomed: false, doomT: 0, ctx: null, dead: false, gv: 0, gy: 0, gv0: false
      };
      S.enemies.push(e);
      return e;
    }
    function spawnPoint() {
      var sideMax = S.coreY - 255;
      if (rnd() < 0.68 || sideMax < 10) return { x: 15 + rnd() * (W - 30), y: -24 };
      return { x: rnd() < 0.5 ? -24 : W + 24, y: -24 + rnd() * (sideMax + 24) };
    }
    function pickKind() {
      var t = S.t, r = rnd();
      var pd = t < 10 ? 0 : Math.min(0.24, 0.08 + (t - 10) * 0.0016);
      var pb = t < 16 ? 0 : 0.07, ph = t < 24 ? 0 : 0.07;
      if (r < pd) return 'd';
      if (r < pd + pb) return 'b';
      if (r < pd + pb + ph) return 'h';
      return 'n';
    }
    function spawnPack() {
      var n = Math.min(11, 4 + Math.floor(S.t / 22) + Math.floor(rnd() * 3)), p = spawnPoint(), i;
      for (i = 0; i < n; i++) {
        var a = rnd() * 6.2832, rr = 10 + rnd() * 44;
        var x = p.x + Math.cos(a) * rr, y = p.y + Math.sin(a) * rr;
        if (p.y < 0) y -= 34; else x += p.x < 0 ? -34 : 34;
        addEnemy(i === 0 && S.t > 16 && rnd() < 0.45 ? 'b' : 'n', x, y);
      }
    }
    function addGold() {
      var dir = rnd() < 0.5 ? 1 : -1;
      var e = addEnemy('g', dir > 0 ? -26 : W + 26, S.coreY - (112 + rnd() * 44));
      e.gv = dir * (130 + rnd() * 40); e.gy = e.y;
    }
    function interval(rate) { return clamp(-Math.log(1 - rnd() * 0.999) / rate, 0.3 / rate, 2.6 / rate); }
    function compact() {
      var en = S.enemies, w = 0, i;
      for (i = 0; i < en.length; i++) if (!en[i].dead) en[w++] = en[i];
      en.length = w;
    }
    function startFever(back) { feverBack = back; S.fever = FEVER_T; S.feverCount++; ev('fever'); }
    function addEnergy(x) {
      if (S.fever > 0) return;
      S.energy += x;
      if (S.energy >= 1) { S.energy = 1; startFever(c.eAfter); }
    }
    // 金の星を巻き込んだら即フィーバー（ゲージは減らさない）
    function goldFever() { if (S.fever > 0) S.fever += 1.5; else startFever(Math.max(S.energy, c.eAfter)); }
    function potentialOf(mult) {
      var en = S.enemies, list = [], i, e, sum = 0;
      for (i = 0; i < en.length; i++) { e = en[i]; if (!e.doomed && !e.dead && e.d - e.r <= S.ring) list.push(e); }
      list.sort(byD);
      for (i = 0; i < list.length; i++) sum += list[i].val * Math.min(i + 1, CHAIN_CAP);
      S.inRing = list.length;
      return Math.round(sum * mult * (S.fever > 0 ? 3 : 1) / 10) * 10;
    }
    function kill(e) {
      if (e.dead) return;
      var ctx = e.ctx, st = S.stats, en = S.enemies, i, o, dx, dy, lim;
      e.dead = true; ctx.count++; ctx.pending--;
      var pts = Math.round(e.val * Math.min(ctx.count, CHAIN_CAP) * ctx.mult * ctx.fm / 10) * 10;
      S.score += pts; ctx.total += pts; st.kills++;
      if (ctx.count > st.maxChain) st.maxChain = ctx.count;
      ev('kill', { x: e.x, y: e.y, kind: e.kind, pts: pts, idx: ctx.count, r: e.r, chain: e.T.chain });
      if (e.kind === 'g') { ev('jackpot', { x: e.x, y: e.y }); if (!e.gv0) goldFever(); }
      for (i = 0; i < en.length; i++) {
        o = en[i]; if (o.doomed || o.dead) continue;
        dx = o.x - e.x; dy = o.y - e.y; lim = e.T.chain + o.r;
        if (dx * dx + dy * dy <= lim * lim) {
          o.doomed = true; o.ctx = ctx; ctx.pending++;
          o.doomT = CHAIN_DELAY + (e.kind === 'b' ? Math.sqrt(dx * dx + dy * dy) / 1400 : 0);
        }
      }
      if (ctx.pending === 0) {
        if (ctx.total > st.bestBlast) st.bestBlast = ctx.total;
        ev('blastEnd', { total: ctx.total, count: ctx.count, m: ctx.mult, rank: ctx.rank });
      }
    }
    function flush() {
      var en = S.enemies, any = true, guard = 0, i;
      while (any && guard++ < 60) { any = false; for (i = 0; i < en.length; i++) if (en[i].doomed && !en[i].dead) { kill(en[i]); any = true; } }
      compact();
    }
    function die(cause, e) {
      flush();
      S.over = true; S.cause = cause; S.holding = false; S.pulling = false;
      ev('death', { cause: cause, x: e ? e.x : S.coreX, y: e ? e.y : S.coreY, missed: S.stats.missed });
    }

    S.press = function () { if (S.over || S.holding) return; S.holding = true; S.holdT = 0; };

    S.release = function () {
      if (S.over || !S.holding) return;
      S.holding = false;
      if (S.lock > 0 || !(S.holdT > 0)) { S.holdT = 0; S.pulling = false; return; }
      var charge = Math.min(1, S.holdT / T_CHARGE);
      var ring = R_MIN + (R_MAX - R_MIN) * (1 - (1 - charge) * (1 - charge));
      var en = S.enemies, i, e, g, v, k, gap = Infinity, tti = Infinity, targets = [];
      for (i = 0; i < en.length; i++) {
        e = en[i]; if (e.doomed || e.dead) continue;
        if (e.kind !== 'g') { g = e.d - CORE_R - e.r; if (g < gap) { gap = g; v = e.vr - e.kb; tti = g / (v > 1 ? v : 1); } }
        if (e.d - e.r <= ring) targets.push(e);
      }
      if (gap < 0) gap = 0;
      if (tti < 0) tti = 0;
      var m = 1 + (multOf(gap) - 1) * charge, rank = rankOf(m), n = targets.length;
      var ctx = { mult: m, fm: S.fever > 0 ? 3 : 1, count: 0, total: 0, pending: n, rank: rank };
      targets.sort(byD);
      var stag = n > 0 ? Math.min(0.03, 0.42 / n) : 0;
      for (i = 0; i < n; i++) {
        e = targets[i]; e.doomed = true; e.doomT = 0.015 + i * stag; e.ctx = ctx;
        if (e.kind === 'g') { e.gv0 = true; goldFever(); }
      }
      var bs = base(S.t), kbS = 0.45 + 0.55 * charge;
      for (i = 0; i < en.length; i++) {
        e = en[i]; if (e.doomed || e.dead || e.kind === 'g') continue;
        k = 1 - (e.d - ring) / 240;
        if (k > 0) { k = 250 * k * kbS; if (k > e.kb) e.kb = k; }
        e.vr = bs * e.T.base;
      }
      var st = S.stats;
      st.blasts++; st.sumM += m; st.sumRaw += n > 0 ? multOf(gap) : 1; if (rank === 0) st.chickens++;
      if (n > 0) { st.hits++; if (m > st.maxM) st.maxM = m; if (rank >= 2 && tti < st.bestTTI) st.bestTTI = tti; }
      S.lock = LOCK_T; S.holdT = 0; S.charge = 0; S.pulling = false; S.ring = R_MIN; S.mult = 1;
      ev('blast', { ring: ring, m: m, rank: rank, n: n, gap: gap, tti: tti, charge: charge });
      if (n > 0) addEnergy(c.gain * Math.sqrt(m > 1 ? m - 1 : 0));
      // ラストチャンスは×6以上の爆破でしか生き残れない
      var last = S.last; S.last = false;
      if (S.fever <= 0 && (S.energy <= 0 || (last && S.energy < lastNeed))) die('chicken', null);
    };

    S.step = function (dt) {
      if (S.over || !(dt > 0)) return;
      S.t += dt;
      var t = S.t, en = S.enemies, i, e, T, b, cp, v, pf, g;
      var lv = 1 + Math.floor(t / 12);
      if (lv !== S.level) { S.level = lv; ev('level', { level: lv }); }
      var bs = base(t), cs = capV(t), pa = acc(t);
      if (S.lock > 0) S.lock -= dt;
      var pulling = S.holding && S.lock <= 0;
      if (pulling) S.holdT += dt;
      S.pulling = pulling;
      S.charge = pulling ? Math.min(1, S.holdT / T_CHARGE) : 0;
      S.ring = R_MIN + (R_MAX - R_MIN) * (1 - (1 - S.charge) * (1 - S.charge));

      var gap = Infinity, tti = Infinity, near = null, hit = null, due = null, gone = false;
      for (i = 0; i < en.length; i++) {
        e = en[i]; e.age += dt;
        if (e.doomed) { e.doomT -= dt; if (e.doomT <= 0) (due || (due = [])).push(e); continue; }
        if (e.kind === 'g') {
          e.x += e.gv * dt; e.y = e.gy + Math.sin(e.age * 3.2) * 12;
          e.d = Math.sqrt((e.x - S.coreX) * (e.x - S.coreX) + (e.y - S.coreY) * (e.y - S.coreY));
          e.th = Math.atan2(e.y - S.coreY, e.x - S.coreX);
          if (e.x < -44 || e.x > W + 44) { e.dead = true; gone = true; }
          continue;
        }
        T = e.T; b = bs * T.base; cp = cs * T.cap;
        if (pulling) { e.vr += pa * T.pull * dt; if (e.vr > cp) e.vr = cp; }
        else if (e.vr > b) { e.vr -= 640 * dt; if (e.vr < b) e.vr = b; }
        else e.vr = b;
        if (e.kb > 0) { e.kb -= e.kb * Math.min(1, 4.5 * dt); if (e.kb < 3) e.kb = 0; }
        v = e.vr - e.kb;
        e.d -= v * dt;
        pf = e.vr / cp; if (pf > 1) pf = 1;
        e.th += e.spin * (0.18 + 1.0 * pf) * clamp(160 / e.d, 0.5, 2.2) * dt;
        e.x = S.coreX + Math.cos(e.th) * e.d; e.y = S.coreY + Math.sin(e.th) * e.d;
        g = e.d - CORE_R - e.r;
        if (g < gap) { gap = g; tti = g / (v > 1 ? v : 1); near = e; }
        if (g <= -HIT_SLOP && !hit) hit = e;
      }
      if (due) { due.sort(function (p, q) { return p.doomT - q.doomT; }); for (i = 0; i < due.length; i++) kill(due[i]); }
      if (due || gone) compact();

      S.gap = gap; S.tti = tti; S.nearest = near;
      S.mult = pulling ? 1 + (multOf(gap) - 1) * S.charge : 1;
      if (hit) { S.stats.missed = potentialOf(1 + (M_MAX - 1) * S.charge); die('greed', hit); return; }

      if (S.fever > 0) {
        S.fever -= dt;
        if (S.fever <= 0) { S.fever = 0; S.energy = feverBack; ev('feverEnd'); }
      } else {
        S.energy -= (c.drain0 + c.drain1 * t) * dt;
        // ゲージが尽きても、長押し中は「最後の一発」を待つ
        if (S.energy <= 0) { S.energy = 0; if (!S.holding) { die('chicken', null); return; } S.last = true; }
      }

      if (en.length < 110) {
        var rate = (c.rate0 + c.rate1 * t) * (S.fever > 0 ? 1.8 : 1), p;
        nextSpawn -= dt;
        while (nextSpawn <= 0) { p = spawnPoint(); addEnemy(pickKind(), p.x, p.y); nextSpawn += interval(rate); }
        nextPack -= dt;
        if (nextPack <= 0) { spawnPack(); nextPack = Math.max(2.4, 4.4 + rnd() * 3 - t * 0.012); }
      }
      nextGold -= dt;
      if (nextGold <= 0) { addGold(); nextGold = 28 + rnd() * 17; }
    };

    S.preview = function () {
      if (S.pulling && !S.over) S.potential = potentialOf(S.mult);
      else { S.potential = 0; S.inRing = 0; }
      return S.potential;
    };

    // チキン度: どこまで引きつけたか（すき間だけで決まる倍率）の平均。1倍で100%、CK_SPAN+1倍で0%
    S.verdict = function () {
      var st = S.stats, avg = st.blasts ? st.sumRaw / st.blasts : 0;
      if (!st.blasts) return { chicken: null, avg: 0, title: '無謀' };
      var ck = clamp(Math.round(100 * (1 - (avg - 1) / CK_SPAN)), 0, 100);
      var title = ck >= 85 ? 'ノミの心臓' : ck >= 68 ? 'チキンハート' : ck >= 52 ? 'ガラスのハート' : ck >= 36 ? '人並みの心臓'
        : ck >= 20 ? '鋼の心臓' : ck >= 8 ? '心臓に毛が生えてる' : '心臓が剛毛だらけ';
      return { chicken: ck, avg: avg, title: title };
    };

    // 開始時に数体おいておく（最初の長押しからまとめて吹き飛ばせるように）
    (function () {
      var maxY = Math.max(40, S.coreY - 250), i;
      for (i = 0; i < 7; i++) addEnemy('n', 30 + rnd() * (W - 60), 20 + rnd() * (maxY - 20));
    })();
    return S;
  }

  // 自動プレイ（タイトルのデモとバランス検証用）。衝突まで tau 秒を切ったら離す
  function makeBot(sim, tau, sigma, rng) {
    rng = rng || Math.random;
    var thr, wait = 0.3;
    function gauss() { var u = 0; while (!u) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2832 * rng()); }
    function sample() { return Math.max(0.004, tau + sigma * gauss()); }
    thr = sample();
    return function (dt) {
      if (sim.over) return;
      if (!sim.holding) { wait -= dt; if (wait <= 0) sim.press(); return; }
      if (sim.lock > 0) return;

  // ---------- ゲームの出来事 → 演出 ----------
  function onEvent(ev, live) {
    var S = sim, kx = S.coreX, ky = S.coreY, k, q;
    switch (ev.type) {
      case 'kill':
        k = ev.kind;
        bursts.push({ x: ev.x, y: ev.y, r: k === 'b' ? ev.chain * 0.9 : ev.r * 2.2, life: 0, max: k === 'b' ? 0.26 : 0.17,
          seed: Math.random() * 99, n: k === 'b' ? 12 : 8, w: k === 'b' ? 3 : 2, red: k === 'b' || k === 'g', gold: k === 'g' });
        ink(ev.x, ev.y, S.fever > 0 ? k : (k === 'b' ? 'r' : k === 'g' ? 'g' : 'k'), live ? 7 : 4, 240, ev.r * 0.45, 0.42);
        shake = Math.max(shake, Math.min(9, 2.5 + ev.idx * 0.3) + (k === 'b' ? 5 : 0));
        if (!live) break;
        Snd.pling(ev.idx, k);
        if (k === 'b') sfxPop('ボン!', ev.x, ev.y - 22, 22, RED, 0.45, (Math.random() - 0.5) * 0.4, 0.3, 10);
        if (ev.idx <= 12 || ev.idx % 2 === 0) ptPop('+' + fmt(ev.pts), ev.x, ev.y - ev.r - 8, Math.min(19, 11 + ev.idx * 0.4), INK, 0.55);
        break;
      case 'blast':
        k = ev.rank;
        rings.push({ x: kx, y: ky, r0: CORE_R, r1: ev.ring * 1.3, life: 0, max: 0.3, w: 5 + k * 1.5, col: k >= 3 ? RED : INK });
        bursts.push({ x: kx, y: ky, r: 40 + k * 9, life: 0, max: 0.2, seed: Math.random() * 99, n: 14, w: 3, red: k >= 2, gold: false });
        linesBoost = Math.max(linesBoost, 0.5 + k * 0.125);
        if (!live) break;
        if (ev.n === 0) { banner = { text: 'スカッ', sub: '', rank: 0, t: 0, dur: 0.5, seed: Math.random() * 9 }; Snd.whiff(); break; }
        hitStop = [0.02, 0.04, 0.06, 0.1, 0.15][k] * (RM ? 0.4 : 1);
        if (k >= 3) { slowT = 0.3; slowScale = k === 4 ? 0.35 : 0.5; invertT = k === 4 ? 0.12 : 0.07; }
        shake = Math.max(shake, [2, 4, 7, 11, 16][k] + Math.min(7, ev.n * 0.35));
        zoomKick = 0.012 + k * 0.012;
        vib([0, 10, 18, 28, 45][k]);
        Snd.blast(k);
        sfxPop(BOOM_TXT[k], kx + (Math.random() - 0.5) * 30, ky - 66, [17, 24, 32, 40, 46][k], k >= 2 ? RED : INK, 0.5, -0.14 + Math.random() * 0.1, 0.4, 14);
        banner = { text: RANK_TXT[k], rank: k, t: 0, dur: k >= 3 ? 1.05 : 0.8, seed: Math.random() * 9,
          sub: k >= 2 ? '×' + ev.m.toFixed(1) + '・衝突' + ev.tti.toFixed(2) + '秒前' : k === 1 ? '×' + ev.m.toFixed(1) : 'もっと引きつけろ' };
        if (tutorial) { firstBlast = true; hintT = 6; if (k >= 1) { tutorial = false; save('tut', 1); } }
        break;
      case 'blastEnd':
        if (!live || !ev.count) break;
        ptPop('+' + fmt(ev.total), kx, ky - 122, 24 + ev.rank * 4, ev.rank >= 3 ? RED : INK, 1.0);
        if (ev.count >= 6) ptPop(ev.count + ' CHAIN', kx, ky - 96, 15, INK, 0.9);
        break;
      case 'fever':
        if (!live) break;
        notice = { text: 'フィーバー!!', sub: 'スコア×3・心臓に毛が生えた', col: RED, t: 0, dur: 1.7, seed: Math.random() * 9, big: true };
        shake = Math.max(shake, 12); linesBoost = 1; invertT = 0.08; vib(60); Snd.fever(true);
        for (q = 0; q < 26; q++) ink(kx, ky, 'ndhbg'.charAt(q % 5), 1, 420, 5, 0.7);
        break;
      case 'feverEnd':
        if (live) Snd.fever(false);
        break;
      case 'level':
        if (!live) break;
        notice = { text: 'LEVEL ' + ev.level, sub: 'スピードアップ', col: INK, t: 0, dur: 1.3, seed: Math.random() * 9, big: false };
        Snd.level(ev.level);
        break;
      case 'jackpot':
        ink(ev.x, ev.y, 'g', 22, 380, 5.5, 0.8);
        if (live) { sfxPop('ジャックポット!', clamp(ev.x, 100, W - 100), ev.y - 30, 19, RED, 0.9, -0.08, 0.1, 20); vib(30); }
        break;
      case 'death':
        if (!live) { attractT = 1.3; coreGone = true; ink(kx, ky, 'k', 30, 380, 6, 0.7); ink(kx, ky, 'r', 16, 300, 5, 0.6); break; }
        state = 'dying'; dyingT = 0; deathCause = ev.cause; deathBoom = false; chickPop = false;
        pid = null; keyHeld = false; banner = null;
        Snd.setHold(false, 0, 0); Snd.setLow(false); Snd.stopMusic(); Snd.death(ev.cause);
        if (ev.cause === 'greed') { hitStop = RM ? 0.1 : 0.3; invertT = 0.3; shake = 10; vib([60, 40, 160]); }
        else vib(80);
        break;
    }
  }

  // ---------- 進行 ----------
  function newSim() { sim = GD.createSim({ H: FH }); }
  function toTitle() {
    state = 'title'; newSim(); bot = GD.makeBot(sim, 0.1, 0.02); resetFx();
    $('title').hidden = false; $('result').hidden = true; $('pause').hidden = true;
    $('tbest').textContent = 'BEST ' + fmt(best);
  }
  function startGame() {
    Snd.init();
    newSim(); bot = null; resetFx(); state = 'play'; firstBlast = false; tutSlow = false; pid = null; keyHeld = false;
    $('title').hidden = true; $('result').hidden = true; $('pause').hidden = true; $('sharebox').hidden = true;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    Snd.startMusic();
  }
  function shareText() {
    var S = sim, st = S.stats, v = S.verdict(), L = ['ギリドカ｜度胸だめしアクション', 'SCORE ' + fmt(S.score)];
    L.push('判定【' + v.title + '】' + (v.chicken == null ? '' : 'チキン度' + v.chicken + '%'));
    if (st.bestTTI < Infinity) L.push('最ギリ 衝突' + st.bestTTI.toFixed(2) + '秒前／最大×' + st.maxM.toFixed(1));
    L.push('死因：' + (S.cause === 'greed' ? '欲張りすぎ' : 'ビビりすぎ'));
    L.push('#ギリドカ');
    if (SHARE_URL) L.push(SHARE_URL);
    return L.join('\n');
  }
  function countUp(el, to, dur, done) {
    var t0 = performance.now(), lastTick = 0;
    (function f() {
      var now = performance.now(), k = Math.min(1, (now - t0) / dur);
      el.textContent = fmt(to * (1 - Math.pow(1 - k, 3)));
      if (k < 1 && state === 'result') { if (now - lastTick > 55) { lastTick = now; Snd.tick(); } requestAnimationFrame(f); }
      else { el.textContent = fmt(to); if (done && state === 'result') done(); }
    })();
  }
  function showResult() {
    state = 'result';
    var S = sim, st = S.stats, v = S.verdict(), greed = S.cause === 'greed';
    var isNew = S.score > best && S.score > 0;
    if (isNew) { best = S.score; save('best', best); }
    save('plays', (+mem.plays || 0) + 1);
    $('rcause').textContent = greed ? '欲張りすぎ' : 'ビビりすぎ';
    $('rtitle').textContent = v.title;
    $('rchicken').textContent = v.chicken == null ? '一度も爆破せずに散った' : 'チキン度 ' + v.chicken + '%（平均 ×' + v.avg.toFixed(1) + ' まで引きつけた）';
    $('rmark').style.left = (v.chicken == null ? 50 : 100 - v.chicken) + '%';
    $('s1').textContent = st.bestTTI < Infinity ? st.bestTTI.toFixed(2) + '秒前' : '—';
    $('s2').textContent = st.hits ? '×' + st.maxM.toFixed(1) : '—';
    $('s3').textContent = st.maxChain ? String(st.maxChain) : '—';
    $('s4').textContent = mmss(S.t);
    $('rtaunt').textContent = greed
      ? (st.missed > 0 ? 'あと一瞬早く離せば +' + fmt(st.missed) + ' だった。' : '引きつけすぎた。')
      : '度胸ゲージが尽きた。もっとギリギリまで引きつけろ。';
    $('rnew').hidden = true; $('sharebox').hidden = true;
    shareStr = shareText();
    $('xpost').href = 'https://x.com/intent/tweet?text=' + encodeURIComponent(shareStr);
    $('linepost').href = 'https://line.me/R/share?text=' + encodeURIComponent(shareStr);
    var el = $('result');
    el.hidden = false; el.scrollTop = 0; el.classList.add('lock');
    setTimeout(function () { el.classList.remove('lock'); }, 450);
    countUp($('rscore'), S.score, Math.min(1100, 350 + S.score / 2000), function () { if (isNew) { $('rnew').hidden = false; Snd.record(); } });
  }
  function toast(msg) {
    var el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }
  function copyResult() {
    function fallback() {
      var box = $('sharebox'); box.hidden = false; box.value = shareStr; box.focus(); box.select();
      var done = false; try { done = document.execCommand('copy'); } catch (e) {}
      toast(done ? '結果をコピーしました' : '下の文章を長押しでコピーしてください');
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareStr).then(function () { toast('結果をコピーしました'); }, fallback);
        return;
      }
    } catch (e) {}
    fallback();
  }
  function pause() {
    if (state !== 'play') return;
    if (sim.holding) { pid = null; keyHeld = false; sim.release(); }
    state = 'paused'; $('pause').hidden = false; Snd.setHold(false, 0, 0); Snd.suspend();
  }
  function resume() {
    if (state !== 'paused') return;
    $('pause').hidden = true; state = 'play'; lastT = performance.now() / 1000; Snd.resume();
  }

  function stepSim(dt) {
    var S = sim, rem = dt, h, i, evs;
    while (rem > 1e-6 && !S.over) { h = rem > 1 / 120 ? 1 / 120 : rem; if (bot) bot(h); S.step(h); rem -= h; }
    if (S.events.length) { evs = S.events.splice(0, S.events.length); for (i = 0; i < evs.length; i++) onEvent(evs[i], state !== 'title'); }
  }
  function frame(ts) {
    requestAnimationFrame(frame);
    var now = ts / 1000, rdt = now - lastT, scale = 1, S = sim, i, e;
    lastT = now;
    if (!(rdt > 0)) rdt = 0.016;
    if (rdt > 0.05) rdt = 0.05;
    clock += rdt;
    if (hitStop > 0) { hitStop -= rdt; scale = 0; }
    else if (slowT > 0) { slowT -= rdt; scale = slowScale; }

    if (state === 'play') {
      if (hintT > 0) hintT -= rdt;
      tutSlow = tutorial && !firstBlast && S.pulling && S.gap < 75;
      if (tutSlow && scale > 0.18) scale = 0.18;
      stepSim(rdt * scale);
      if (state === 'play') {
        var pulling = S.pulling && !S.over, lowE = S.fever <= 0 && S.energy < 0.25;
        Snd.setHold(pulling, S.charge, dangerS); Snd.setLow(lowE);
        // ギリ…ギリ…（近づくほど増える描き文字）
        if (pulling && S.mult >= 4 && S.nearest && pops.length < 40) {
          giriT -= rdt;
          if (giriT <= 0) {
            giriT = 0.22 - 0.12 * dangerS;
            var ga = Math.random() * 6.2832, gr = S.ring + 16 + Math.random() * 26;
            sfxPop(S.mult >= 20 ? 'ギリギリ!' : 'ギリ', clamp(S.coreX + Math.cos(ga) * gr, 30, W - 30), clamp(S.coreY + Math.sin(ga) * gr, 136, S.H - 16),
              12 + 10 * dangerS, S.mult >= 10 ? RED : INK, 0.3, (Math.random() - 0.5) * 0.9, 0.2, 0);
          }
        }
        if (lowE) { // 冷や汗
          sweatT -= rdt;
          if (sweatT <= 0 && parts.length < 500) {
            sweatT = 0.2;
            parts.push({ x: S.coreX + (Math.random() - 0.5) * 30, y: S.coreY - 16, vx: (Math.random() - 0.5) * 150, vy: -150 - Math.random() * 60,
              life: 0, max: 0.6, size: 4.2, key: 'w', grav: 520, drag: 0.6 });
          }
        }
      }
    } else if (state === 'title') {
      if (S.over) { attractT -= rdt; if (attractT <= 0) { newSim(); bot = GD.makeBot(sim, 0.1, 0.02); resetFx(); } }
      else stepSim(rdt * scale);
    } else if (state === 'dying') {
      dyingT += rdt;
      if (deathCause === 'greed') {
        if (!deathBoom && dyingT > 0.3) {
          deathBoom = true; coreGone = true; shake = 26; zoomKick = 0.07; linesBoost = 1;
          ink(S.coreX, S.coreY, 'r', 34, 460, 7, 0.9); ink(S.coreX, S.coreY, 'k', 46, 520, 6.5, 0.9);
          bursts.push({ x: S.coreX, y: S.coreY, r: 96, life: 0, max: 0.34, seed: Math.random() * 99, n: 16, w: 4, red: true, gold: false });
          rings.push({ x: S.coreX, y: S.coreY, r0: CORE_R, r1: 330, life: 0, max: 0.5, w: 9, col: INK });
          sfxPop('グシャッ!!', S.coreX, S.coreY - 84, 44, RED, 1.1, -0.1, 0.35, 10);
        }
        if (deathBoom) for (i = 0; i < S.enemies.length; i++) { e = S.enemies[i]; e.d += 280 * rdt; e.x = S.coreX + Math.cos(e.th) * e.d; e.y = S.coreY + Math.sin(e.th) * e.d; }
      } else {
        coreScale = Math.max(0, coreScale - rdt * 1.7);
        if (!deathBoom) { deathBoom = true; sfxPop('ぷすん…', S.coreX, S.coreY - 62, 26, GREY, 1.2, 0.05, 0.1, 16); }
        if (!chickPop && dyingT > 0.6) { chickPop = true; ptPop('🐔', S.coreX, S.coreY - 8, 40, INK, 0.9); }
      }
      if (dyingT > 1.55) showResult();
    }
    sim.preview();
    fxUpdate(rdt, scale);
    draw(rdt);
  }

  // ---------- 入力 ----------
  function press() { if (state === 'play') sim.press(); }
  function release() { if (state === 'play') sim.release(); }
  function pup(e) { if (e.pointerId !== pid) return; pid = null; release(); }
  cv.addEventListener('pointerdown', function (e) {
    if (e.button > 0) return;
    if (pid !== null) { if (!e.isPrimary) return; release(); }
    pid = e.pointerId;
    try { cv.setPointerCapture(pid); } catch (er) {}
    press(); e.preventDefault();
  });
  cv.addEventListener('pointerup', pup);
  cv.addEventListener('pointercancel', pup);
  cv.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {
    if (e.code !== 'Space') return;
    if (state === 'play') { e.preventDefault(); if (!e.repeat && !keyHeld) { keyHeld = true; press(); } return; }
    var ae = document.activeElement, tag = ae ? ae.tagName : '';
    if (e.repeat || tag === 'BUTTON' || tag === 'A' || tag === 'TEXTAREA') return;
    if (state === 'title' || (state === 'result' && !$('result').classList.contains('lock'))) { e.preventDefault(); startGame(); }
  });
  window.addEventListener('keyup', function (e) { if (e.code === 'Space' && keyHeld) { keyHeld = false; release(); } });
  window.addEventListener('blur', function () { if (state === 'play' && sim.holding) { pid = null; keyHeld = false; sim.release(); } });
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { pause(); Snd.suspend(); }
    else { lastT = performance.now() / 1000; if (state !== 'paused') Snd.resume(); }
  });
  $('start').addEventListener('click', startGame);
  $('retry').addEventListener('click', startGame);
  $('resume').addEventListener('click', resume);
  $('copy').addEventListener('click', copyResult);
  $('mute').addEventListener('click', function () { Snd.init(); $('mute').classList.toggle('off', Snd.toggle()); });
  $('mute').classList.toggle('off', Snd.muted());

  // ---------- 起動（再公開されても自己ベストなどを引き継ぐ） ----------
  var hot = window.claude && window.claude.hot;
  function boot(data) {
    if (data && data.best > best) { best = +data.best; save('best', best); }
    if (data && data.tut) tutorial = false;
    resize(); regenLines(); toTitle();
    try { if (document.fonts && document.fonts.load) { document.fonts.load('900 20px "GD Gothic"', 'ギリ0'); document.fonts.load('900 20px "GD Mincho"', '心'); } } catch (e) {}
    lastT = performance.now() / 1000;
    requestAnimationFrame(frame);
  }
  try { if (hot && hot.snapshot) hot.snapshot(function () { return { best: best, tut: !tutorial }; }); } catch (e) {}
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4eb">
  <meta name="description" content="火加減。世界の料理を家庭で。人数に合わせた分量、火加減の目安、タイマーつきの調理ガイド。">
  <title>火加減｜家で作る世界の料理</title>
  <style>
:root {
  color-scheme: light;
  --paper: #f7f4eb;
  --surface: #fffcf6;
  --ink: #252c24;
  --muted: #606457;
  --line: #dedbcf;
  --green: #293e31;
  --dark: #202f25;
  --gold: #ebc577;
  --soft-green: #e8ede2;
  --accent: #a85834;
  --rounded: 18px;
  --serif: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif CJK JP", serif;
  --sans: "Hiragino Sans", "Noto Sans CJK JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: 94px; }
body {
  margin: 0;
  min-width: 280px;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.7 var(--sans);
  -webkit-text-size-adjust: 100%;
}
body:has(#timer-dock:not([hidden])) { padding-bottom: 62px; }
body:has(dialog[open]) { overflow: hidden; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
button, input { font: inherit; }
a { color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:disabled { cursor: default; }
button:disabled:not(.icon-button) { opacity: .46; }
button:disabled.icon-button { color: #96988e; }
:focus-visible { outline: 2px solid #896524; outline-offset: 4px; }
main:focus, [tabindex="-1"]:focus { outline: none; }
img { display: block; width: 100%; height: auto; }
svg.ui-icon, .nav svg { width: 20px; height: 20px; flex: none; }
.wrap { width: min(1240px, calc(100% - 104px)); margin-inline: auto; }
.serif, h1 { font-family: var(--serif); }
.hero h1, .detail-copy h1, .cook-copy h1, .card-copy h3 { text-wrap: balance; }
.skip-link {
  z-index: 50; position: fixed; top: 8px; left: 8px;
  padding: 8px 14px; background: var(--green); color: white;
  transform: translateY(-180%);
}
.skip-link:focus { transform: translateY(0); }

.header {
  position: sticky; top: 0; z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.header-inner { min-height: 69px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; }
.brand-mark {
  display: grid; place-items: center; width: 41px; height: 41px;
  color: var(--gold); background: var(--green); border-radius: 13px;
}
.brand-mark svg { width: 29px; height: 29px; }
.brand-name { font: 800 23px/1 var(--serif); letter-spacing: .07em; white-space: nowrap; }
.nav { display: flex; align-items: center; gap: 26px; }
.nav-link {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
  color: var(--muted); text-decoration: none; font-weight: 650; font-size: 13px; white-space: nowrap;
}
.nav-link[aria-current] { color: var(--green); text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; }
.nav-link:hover { color: var(--green); }
.button {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  min-height: 43px; padding: 9px 16px; border-radius: 10px;
  border: 1px solid transparent; font-size: 14px; font-weight: 700;
  line-height: 1.44; text-align: center; text-decoration: none;
  transition: background .15s ease, color .15s ease;
}
.button-outline { color: var(--green); border-color: #c4c8bb; background: transparent; }
.button-outline:hover { background: var(--soft-green); }
.button-green { color: #fffef6; background: var(--green); }
.button-green:hover { background: #3d5544; }
.button-gold { color: #302510; background: var(--gold); }
.button-gold:hover { background: #f5d58f; }
.button-plain { color: var(--green); background: transparent; }
.button-plain:hover { background: var(--soft-green); }
.nav-shopping { min-height: 40px; padding: 8px 13px; font-size: 13px; }
.shopping-count {
  display: grid; place-items: center; min-width: 20px; height: 20px; padding: 0 4px;
  background: var(--green); color: #fff; border-radius: 100px; font-size: 11px;
}

.hero {
  display: grid; grid-template-columns: .88fr 1.12fr;
  margin-block: 30px 47px; overflow: hidden; min-height: 405px;
  border-radius: 23px; background: var(--dark);
}
.hero-copy {
  position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
  padding: 39px clamp(30px, 4.3vw, 65px) 42px; color: #fef9eb;
}
.eyebrow { display: flex; align-items: center; gap: 9px; color: #3f5847; font-size: 12px; font-weight: 750; letter-spacing: .085em; }
.hero .eyebrow { color: var(--gold); }
.hero .eyebrow::before { content: ""; width: 20px; height: 1px; background: currentColor; }
.hero h1 { font-size: clamp(33px, 4vw, 62px); line-height: 1.19; letter-spacing: .01em; margin: 16px 0 5px; }
.original { font: italic 18px/1.4 Georgia, "Times New Roman", serif; color: var(--muted); }
.hero .original { color: #d6d1b9; }
.hero-summary { color: #ece7d6; margin-block: 16px 18px; max-width: 33em; line-height: 1.85; font-size: 14px; }
.recipe-facts {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  color: var(--muted); font-size: 13px; font-weight: 650;
}
.recipe-facts span { display: inline-flex; align-items: center; gap: 6px; }
.recipe-facts svg.ui-icon { width: 16px; height: 16px; }
.hero .recipe-facts { color: #e4e2d3; }
.hero .button { margin-top: 22px; padding-inline: 17px; min-height: 47px; }
.hero .button .ui-icon { width: 18px; }
.hero-image { position: relative; min-width: 0; background: #372823; }
.hero-image img, .detail-image img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.hero-image img { object-position: 51% 51%; }
.hero-image::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, var(--dark), #202f251f 24%, transparent 46%);
}

.catalog { padding-bottom: 30px; }
.catalog.favorites { padding-top: 32px; min-height: 52vh; }
.catalog-heading, .catalog-controls {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.catalog-heading { margin-bottom: 18px; }
.catalog h2, .catalog h1 { font-size: clamp(26px, 3vw, 36px); line-height: 1.3; }
.search {
  display: flex; align-items: center; gap: 9px; padding: 0 12px; width: min(100%, 310px);
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; color: var(--muted);
}
.search:focus-within { outline: 2px solid #896524; outline-offset: 2px; }
.search input { min-width: 0; flex: 1; min-height: 42px; padding: 6px 0; outline: none; border: 0; background: transparent; color: var(--ink); font-size: 16px; }
.search input::placeholder { color: #686d62; font-size: 13px; }
.catalog-controls { margin-bottom: 17px; }
.filters { display: flex; flex-wrap: wrap; gap: 7px; }
.filter {
  min-height: 37px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 100px;
  background: var(--surface); color: var(--green); font-size: 13px; font-weight: 650; white-space: nowrap;
}
.filter:hover { background: var(--soft-green); }
.filter[aria-pressed="true"] { background: var(--green); color: #fffef7; border-color: var(--green); }
.result-count { min-width: fit-content; color: var(--muted); font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
.recipe-card {
  position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--rounded); transition: box-shadow .15s ease, transform .15s ease;
}
.recipe-card:hover { transform: translateY(-2px); box-shadow: 0 7px 18px #32281e0e; }
.card-link { display: block; text-decoration: none; height: 100%; }
.card-link:focus-visible { outline-offset: -4px; }
.card-photo { display: block; aspect-ratio: 1.85; overflow: hidden; background: #dad4c5; }
.card-photo img { height: 100%; object-fit: cover; }
.card-copy { padding: 15px 17px 13px; }
.card-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px; }
.card-category { color: #3b5343; font-size: 11px; font-weight: 750; letter-spacing: .055em; }
.card-time { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 650; white-space: nowrap; }
.card-time .ui-icon { width: 15px; height: 15px; }
.card-copy h3 { font: 750 clamp(17px, 1.65vw, 23px)/1.42 var(--serif); letter-spacing: -.025em; }
.card-copy p { margin-top: 7px; color: var(--muted); font-size: 13px; line-height: 1.65; }
.card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 13px; padding-top: 11px; border-top: 1px solid #ebe7dc; color: var(--muted); font-size: 12px; }
.card-bottom .ui-icon { color: var(--green); width: 17px; height: 17px; }
.icon-button {
  flex: none; display: inline-grid; place-items: center; width: 43px; height: 43px;
  border-radius: 11px; border: 1px solid var(--line);
  background: var(--surface); color: var(--green); font-size: 23px; line-height: 1;
}
.icon-button:hover { background: var(--soft-green); }
.favorite-button { border-radius: 100px; }
.recipe-card .favorite-button { position: absolute; top: 11px; right: 11px; background: #fffcf6f4; }
.favorite-button[aria-pressed="true"] { color: #a34231; }
.favorite-button[aria-pressed="true"] .ui-icon { fill: currentColor; }
.empty { padding: 40px 18px; text-align: center; border: 1px dashed #c9c8b9; border-radius: var(--rounded); color: var(--muted); }
.empty strong { display: block; margin-bottom: 7px; color: var(--ink); }

.footer {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px;
  border-top: 1px solid var(--line); margin-top: 15px; padding-block: 18px 24px;
  color: var(--muted); font-size: 11px;
}
.footer a { text-decoration-thickness: 1px; text-underline-offset: 3px; }
.back {
  display: inline-flex; align-items: center; gap: 7px; min-height: 43px; color: var(--green);
  text-decoration: none; font-size: 13px; font-weight: 650;
}
.back:hover { text-decoration: underline; }
.back .ui-icon { width: 17px; height: 17px; }
.detail, .cook { padding-block: 10px 30px; }
.detail-hero {
  display: grid; grid-template-columns: 1fr .94fr; align-items: stretch; gap: 0;
  margin: 7px 0 28px; border-radius: var(--rounded); overflow: hidden;
  background: var(--surface); border: 1px solid var(--line);
}
.detail-copy { padding: clamp(22px, 3.8vw, 49px); }
.detail-copy h1 { font-size: clamp(29px, 3.4vw, 49px); line-height: 1.35; margin: 8px 0; }
.detail-summary { color: var(--muted); margin: 13px 0 15px; max-width: 38em; }
.detail-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 21px; }
.detail-image { position: relative; min-height: 220px; background: #d6c8b6; }
.recipe-layout { display: grid; grid-template-columns: minmax(290px, .82fr) minmax(0, 1.4fr); gap: 24px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--rounded); padding: clamp(16px, 2.65vw, 28px); }
.panel h2 { font: 750 25px/1.38 var(--serif); }
.panel-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
.portions { display: inline-flex; flex: none; align-items: center; gap: 6px; }
.portions .icon-button { width: 38px; height: 38px; font-size: 20px; }
.portions output { min-width: 51px; text-align: center; font-size: 14px; font-weight: 700; }
.equipment { color: var(--muted); font-size: 12px; margin-bottom: 9px; }
.ingredient-list, .step-list, .cook-progress, .shop-items { list-style: none; margin: 0; padding: 0; }
.ingredient-list li + li, .shop-items li + li { border-top: 1px solid #ede9de; }
.check-row {
  display: grid; grid-template-columns: 20px minmax(0, 1fr) minmax(min-content, auto); gap: 9px;
  align-items: start; min-height: 44px; padding-block: 10px; cursor: pointer;
}
.check-row input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--green); cursor: pointer; }
.ingredient-name { font-size: 14px; font-weight: 650; line-height: 1.55; min-width: 0; overflow-wrap: anywhere; }
.ingredient-note { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; line-height: 1.45; font-weight: 400; }
.quantity { text-align: right; color: var(--green); white-space: nowrap; font-size: 13px; font-weight: 700; }
.check-row:has(input:checked) .ingredient-name { color: var(--muted); text-decoration: line-through; }
.check-row:has(input:checked) .ingredient-note { text-decoration: none; }
.shop-add { width: 100%; margin-top: 15px; }
.step-list { margin-top: 15px; }
.step-item {
  display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 9px 12px;
  padding-block: 15px; border-top: 1px solid var(--line);
}
.step-item:last-child { padding-bottom: 0; }
.step-number {
  display: grid; place-items: center; width: 29px; height: 29px; border-radius: 50%;
  color: var(--green); background: var(--soft-green); font-size: 13px; font-weight: 750;
}
.step-body h3 { font-size: 16px; line-height: 1.55; margin-bottom: 6px; }
.step-body p { margin-top: 6px; line-height: 1.85; font-size: 14px; }
.step-body .step-cue { color: var(--muted); font-size: 13px; }
.step-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.step-meta span {
  padding: 2px 8px; border-radius: 6px; background: #f0eee4;
  color: #4b5346; font-size: 11px; font-weight: 700;
}
.step-thumb { aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; max-width: 230px; margin-top: 10px; }

.cook { max-width: 960px; margin-inline: auto; }
.cook-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 15px; }
.cook-dish { color: var(--muted); font-size: 13px; font-weight: 700; }
.cook-progress {
  display: flex; gap: 7px; align-items: center; justify-content: space-between; margin: 10px 0 18px;
}
.cook-progress li { flex: 1; min-width: 0; }
.cook-progress a {
  min-height: 39px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--green); font-size: 13px; font-weight: 750; text-decoration: none;
}
.cook-progress .elapsed { background: var(--soft-green); }
.cook-progress a[aria-current="step"] { background: var(--green); color: white; border-color: var(--green); }
.cook-card { display: grid; grid-template-columns: minmax(0, 1fr); overflow: hidden; padding: 0; }
.cook-card.has-photo { grid-template-columns: 1.03fr .97fr; }
.cook-copy { padding: clamp(20px, 3.9vw, 36px); }
.cook-copy h1 { font-size: clamp(26px, 3.3vw, 39px); line-height: 1.4; margin: 8px 0 12px; }
.cook-copy .step-meta span { font-size: 12px; }
.cook-text { font-size: clamp(16px, 1.8vw, 18px); line-height: 1.9; margin-top: 14px; }
.cook-cue { margin-top: 13px; padding: 9px 13px; background: #f0eee4; border-left: 3px solid #b58040; color: #4c5346; border-radius: 0 8px 8px 0; font-size: 14px; }
.cook-photo { position: relative; min-height: 214px; background: #d6c8b6; }
.cook-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cook-materials { margin-top: 13px; padding: 0; }
.cook-materials summary { cursor: pointer; font-weight: 700; padding: 11px 15px; color: var(--green); }
.cook-materials .ingredient-list { padding-inline: 15px; }
.cook-controls {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-top: 14px;
}
.cook-controls .button { min-height: 46px; }
.timer {
  background: var(--soft-green); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  margin-top: 16px; padding: 10px 12px; border-radius: 10px;
}
.timer .button { min-height: 37px; padding: 6px 10px; font-size: 12px; }
.timer-label { color: var(--green); font-size: 12px; font-weight: 650; }
.timer-readout { font-variant-numeric: tabular-nums; font-size: 22px; line-height: 1.1; font-weight: 750; color: var(--green); }
.timer-hint { flex-basis: 100%; font-size: 11px; color: var(--muted); }
.finish { display: grid; grid-template-columns: minmax(0, .96fr) minmax(0, 1fr); overflow: hidden; padding: 0; }
.finish .cook-copy { align-self: center; }
.finish .cook-photo { min-height: 250px; }
.finish .detail-actions { margin-top: 15px; }
#timer-dock {
  position: fixed; z-index: 6; right: max(14px, env(safe-area-inset-right));
  bottom: max(12px, env(safe-area-inset-bottom));
}
.dock-link {
  display: inline-flex; align-items: center; gap: 7px; min-height: 45px; padding: 7px 12px;
  background: var(--dark); color: #fffdf4; border-radius: 11px; text-decoration: none;
  box-shadow: 0 4px 14px #1f26192a; font-size: 13px;
}
.dock-link b { font-variant-numeric: tabular-nums; }
.dock-link .ui-icon { width: 17px; height: 17px; color: var(--gold); }
.toast {
  position: fixed; z-index: 11; max-width: calc(100% - 30px); bottom: 68px; left: 50%; transform: translateX(-50%);
  background: var(--dark); color: #fffdf4; padding: 9px 15px; border-radius: 10px;
  font-size: 13px; text-align: center; pointer-events: none;
}
.toast:empty { opacity: 0; }
dialog {
  width: min(520px, calc(100% - 28px)); max-height: min(78dvh, 685px);
  border: 1px solid var(--line); border-radius: var(--rounded); background: var(--surface); color: var(--ink);
  padding: 0; box-shadow: 0 20px 65px #25241f38;
}
dialog::backdrop { background: #181d17a6; }
.dialog-heading {
  position: sticky; top: 0; z-index: 1; background: var(--surface);
  border-bottom: 1px solid var(--line); padding: 13px 17px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.dialog-heading h2 { font-size: 23px; }
#shopping-body { padding: 15px 18px 19px; }
.shop-group + .shop-group { margin-top: 17px; }
.shop-group h3 { font-family: var(--serif); font-size: 16px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.shop-actions { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 7px; }
.shop-note { color: var(--muted); font-size: 13px; margin-bottom: 13px; }
.shopping-feedback:not(:empty) { margin: 0 18px 15px; color: var(--green); font-size: 13px; font-weight: 650; }

@media (max-width: 1020px) {
  .wrap { width: calc(100% - 58px); }
  .hero-copy { padding-inline: 32px; }
  .hero { min-height: 360px; margin-bottom: 35px; }
  .cards { gap: 14px; }
  .recipe-layout { gap: 15px; }
}
@media (max-width: 760px) {
  .wrap { width: calc(100% - 36px); }
  .header-inner { min-height: 61px; }
  .nav { gap: 12px; }
  .hero { grid-template-columns: 1fr 1fr; min-height: 0; margin-block: 17px 28px; }
  .hero-copy { padding: 23px; }
  .hero h1 { font-size: clamp(26px, 5.1vw, 45px); }
  .hero .button { margin-top: 15px; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .recipe-layout { grid-template-columns: minmax(0, 1fr); }
  .detail-hero { grid-template-columns: 1fr 1fr; }
  .cook-card.has-photo { grid-template-columns: 1fr; }
  .cook-card .cook-photo { min-height: 0; aspect-ratio: 2.15; grid-row: 1; }
}
@media (max-width: 540px) {
  html { scroll-padding-top: 72px; }
  .wrap { width: calc(100% - 28px); }
  .header-inner { min-height: 60px; }
  .brand-mark { width: 35px; height: 35px; border-radius: 10px; }
  .brand-name { font-size: 20px; }
  .brand { gap: 7px; }
  .nav { gap: 9px; }
  .nav-link { font-size: 12px; }
  .nav-favorites, .nav-shopping { min-width: 41px; min-height: 42px; }
  .nav-favorites { border: 1px solid var(--line); border-radius: 10px; }
  .nav-favorites[aria-current] { background: var(--soft-green); border-color: #acb7a9; }
  .nav-favorites span, .nav-shopping > span:first-of-type { display: none; }
  .nav-shopping { padding-inline: 10px; gap: 3px; }
  .hero { grid-template-columns: 1fr; border-radius: 17px; }
  .hero-copy { padding: 18px 18px 21px; }
  .hero-image { grid-row: 1; height: clamp(152px, 48vw, 244px); }
  .hero-image img { object-position: 50% 52%; }
  .hero-image::after { background: linear-gradient(0deg, #202f2597, transparent 22%); }
  .hero h1 { margin-top: 7px; font-size: clamp(27px, 7.5vw, 37px); }
  .hero .original { font-size: 15px; }
  .hero-summary { font-size: 13px; margin-block: 9px 12px; }
  .hero .button { min-height: 42px; }
  .catalog-heading { flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 11px; }
  .search { width: 100%; }
  .catalog-controls { gap: 7px; align-items: start; }
  .result-count { padding-top: 7px; }
  .filter { padding-inline: 10px; font-size: 12px; min-height: 35px; }
  .cards { gap: 10px; }
  .recipe-card { border-radius: 13px; }
  .card-photo { aspect-ratio: 1.32; }
  .card-copy { padding: 9px 10px; }
  .card-copy h3 { font-size: 16px; }
  .card-copy p { font-size: 12px; }

  const defaults = { favorites: [], portions: {}, ingredients: {}, shopping: {}, timers: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (!saved || typeof saved !== "object") return defaults;
    if (Array.isArray(saved.favorites)) defaults.favorites = saved.favorites.filter(id => recipeById.has(id));
    for (const key of ["portions", "ingredients", "shopping", "timers"]) {
      if (saved[key] && typeof saved[key] === "object" && !Array.isArray(saved[key])) {
        defaults[key] = saved[key];

    }
  } catch {
    // The active page also works when browser storage is unavailable.

  return defaults;
}

}

function portionCount(recipe) {
  const saved = state.portions[recipe.id];
  return Number.isInteger(saved) && saved >= 1 && saved <= 8 ? saved : 2;
}
function numberForUnit(value, unit) {
  if (Number.isInteger(value)) return String(value);
  if (unit === "ml" || unit === "g") return String(Math.round(value * 10) / 10);
  const whole = Math.floor(value);
  const eighths = Math.round((value - whole) * 8);
  if (eighths % 4 === 0) return `${whole ? `${whole}と` : ""}${eighths / 4}/2`;
  if (eighths % 2 === 0) return `${whole ? `${whole}と` : ""}${eighths / 2}/4`;
  return `${whole ? `${whole}と` : ""}${eighths}/8`;
}
function quantityFor(ingredient, count) {
  const [, value, unit] = ingredient;
  if (typeof value !== "number") return value;
  const amount = numberForUnit(value * count / 2, unit);
  return unit === "小さじ" || unit === "大さじ" ? `${unit}${amount}` : `${amount}${unit}`;
}
function ingredientNote(ingredient) {
  return typeof ingredient[1] === "number" ? ingredient[3] : ingredient[2];
}
function ingredientChecked(recipe, index) {

        <span class="ingredient-name">${ingredient[0]}${note ? `<small class="ingredient-note">${note}</small>` : ""}</span>
        <span class="quantity">${quantityFor(ingredient, count)}</span>

    }).join("")}

}
function portions(recipe) {

}
function updatePortions(recipe, change) {
  state.portions[recipe.id] = Math.min(8, Math.max(1, portionCount(recipe) + change));
  save();

  document.getElementById("portions-value").textContent = `${count}人分`;
  main.querySelector('[data-change="-1"]').disabled = count === 1;
  main.querySelector('[data-change="1"]').disabled = count === 8;
  main.querySelectorAll(".ingredient-list .quantity").forEach((text, index) => {
    text.textContent = quantityFor(recipe.ingredients[index], count);

function shoppingEntries() {
  return Object.entries(state.shopping).flatMap(([key, item]) => {
    const [id, index] = key.split(":");
    const recipe = recipeById.get(id);
    const ingredient = recipe?.ingredients[Number(index)];
    if (!item || !ingredient || !Number.isInteger(item.count) || item.count < 1 || item.count > 8) return [];
    return [{ key, item, recipe, ingredient }];
  });
}
function updateShoppingCount() {
  const number = shoppingEntries().filter(({ item }) => !item.bought).length;
  shoppingCount.textContent = number;
  shoppingCount.hidden = !number;
  shoppingCount.closest("button").setAttribute("aria-label", number ? `買い物リスト（未購入 ${number}品）` : "買い物リスト");
}
function addToShopping(recipe) {
  const count = portionCount(recipe);
  let added = 0;
  recipe.ingredients.forEach((_, index) => {
    if (ingredientChecked(recipe, index)) return;
    const key = `${recipe.id}:${index}`;
    const existing = state.shopping[key];
    state.shopping[key] = { count, bought: existing?.count === count && existing.bought === true };
    added += 1;
  });
  if (!added) {
    message("未チェックの材料がありません");
    return;
  }
  save();
  updateShoppingCount();
  message(`買い物リストに${added}品を登録しました`);
}
function renderShopping() {
  shoppingFeedback.textContent = "";
  const entries = shoppingEntries();
  if (!entries.length) {
    shopBody.innerHTML = '<p class="shop-note">レシピの材料欄から、買いたい食材を追加できます。</p>';
    return;

  shopBody.innerHTML = recipes.map(recipe => {
    const group = entries.filter(entry => entry.recipe.id === recipe.id);
    if (!group.length) return "";
    return `<section class="shop-group"><h3>${recipe.title}</h3><ul class="shop-items">
      ${group.map(({ key, item, ingredient }) => `<li><label class="check-row">
        <input type="checkbox" data-shop="${key}" ${item.bought ? "checked" : ""}>
        <span class="ingredient-name">${ingredient[0]}</span>
        <span class="quantity">${quantityFor(ingredient, item.count)}</span>
      </label></li>`).join("")}

  }).join("") + `<div class="shop-actions">
    <button type="button" class="button button-green" data-action="copy-shopping" ${entries.every(({ item }) => item.bought) ? "disabled" : ""}>未購入分をコピー</button>
    <button type="button" class="button button-outline" data-action="remove-bought" ${entries.some(({ item }) => item.bought) ? "" : "disabled"}>購入済みを削除</button>
  </div>`;
}
async function copyShopping() {
  const unbought = shoppingEntries().filter(({ item }) => !item.bought);
  const text = recipes.flatMap(recipe => {
    const rows = unbought.filter(entry => entry.recipe.id === recipe.id);
    return rows.length ? [`【${recipe.title}】`, ...rows.map(({ item, ingredient }) =>
      `${ingredient[0]}　${quantityFor(ingredient, item.count)}`
    ), ""] : [];
  }).join("\n").trimEnd();
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    shoppingFeedback.textContent = "未購入の材料をコピーしました";
  } catch {
    const field = document.createElement("textarea");
    field.value = text;
    field.setAttribute("readonly", "");
    field.style.cssText = "position:fixed;opacity:0;inset:0 auto auto 0";
    const previousFocus = document.activeElement;
    shopDialog.append(field);
    field.focus();
    field.select();
    let copied = false;
    try {
      copied = document.execCommand("copy");
    } catch {
      // Some embedder configurations restrict the clipboard.
    }
    field.remove();
    previousFocus?.focus();
    shoppingFeedback.textContent = copied ? "未購入の材料をコピーしました" : "このブラウザーではコピーできませんでした";
  }
}

function timerRemaining(timer, now) {
  if (!timer) return 0;
  if (timer.mode === "running") return Math.max(0, timer.deadline - now);
  if (timer.mode === "paused") return timer.remaining;
  return 0;
}
function timerText(milliseconds) {
  const seconds = Math.max(0, Math.ceil(milliseconds / 1000));
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor(seconds / 60) % 60;
  const pad = value => String(value).padStart(2, "0");
  return `${hours ? `${hours}:` : ""}${pad(minutes)}:${pad(seconds % 60)}`;
}
function timerButton(action, key, label, style = "button-green") {
  return `<button type="button" class="button ${style}" data-action="${action}" data-key="${key}">${label}</button>`;
}
function refreshTimerPanel(container, now) {
  const key = container.dataset.timerKey;
  const definition = timerSteps.get(key);
  const timer = state.timers[key];
  const mode = timer?.mode ?? "ready";
  const time = timerText(timer ? timerRemaining(timer, now) : definition.step.seconds * 1000);
  if (container.dataset.mode !== mode) {
    const controls = {
      ready: timerButton("start-timer", key, "スタート"),
      running: timerButton("pause-timer", key, "一時停止") + timerButton("reset-timer", key, "リセット", "button-outline"),
      paused: timerButton("start-timer", key, "再開") + timerButton("reset-timer", key, "リセット", "button-outline"),
      done: timerButton("reset-timer", key, "リセット", "button-outline")
    };
    container.dataset.mode = mode;
    container.innerHTML = `<span class="timer-label">${mode === "done" ? "タイマー終了" : definition.step.timerLabel}</span>
      <span class="timer-readout" role="timer">${time}</span>${controls[mode]}
      ${mode === "running" ? '<span class="timer-hint">タイマー中はこの画面を開いておいてください。</span>' : ""}`;
  } else {
    const readout = container.querySelector(".timer-readout");
    if (readout.textContent !== time) readout.textContent = time;
  }
}
function prepareAudio() {
  const Context = window.AudioContext || window.webkitAudioContext;
  if (!Context) return;
  try {
    audioContext ||= new Context();
    if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
  } catch {
    // Timer completion remains visible with audio unavailable.
  }
}
function playAlert() {
  if (audioContext?.state !== "running") return;
  const now = audioContext.currentTime;
  [660, 880, 1046].forEach((frequency, index) => {
    const tone = audioContext.createOscillator();
    const volume = audioContext.createGain();
    const start = now + index * 0.16;
    tone.frequency.value = frequency;
    volume.gain.setValueAtTime(0.0001, start);
    volume.gain.exponentialRampToValueAtTime(0.15, start + 0.02);
    volume.gain.exponentialRampToValueAtTime(0.0001, start + 0.28);
    tone.connect(volume).connect(audioContext.destination);
    tone.start(start);
    tone.stop(start + 0.3);
  });
}
function updateTimers() {
  const now = Date.now();
  const changed = [];
  for (const [key, timer] of Object.entries(state.timers)) {
    if (!timerSteps.has(key) || !timer || !["running", "paused", "done"].includes(timer.mode) ||
        (timer.mode === "running" && !Number.isFinite(timer.deadline)) ||
        (timer.mode === "paused" && !Number.isFinite(timer.remaining))) {
      delete state.timers[key];
    } else if (timer.mode === "running" && timer.deadline <= now) {
      state.timers[key] = { mode: "done" };
      changed.push(timerSteps.get(key).step.timerLabel);
    }
  }
  if (changed.length) {
    save();
    message(`${changed.join("・")}のタイマーが終了しました`);
    playAlert();
  }
  const panel = main.querySelector("[data-timer-key]");
  if (panel) refreshTimerPanel(panel, now);
  const otherTimers = Object.entries(state.timers).filter(([key]) => key !== panel?.dataset.timerKey);
  const next = otherTimers.find(([, timer]) => timer.mode === "done")
    ?? otherTimers.find(([, timer]) => timer.mode === "running")
    ?? otherTimers[0];
  dock.hidden = !next;
  if (!next) {
    if (dock.firstElementChild) dock.replaceChildren();
    return;
  }
  const [key, timer] = next;
  const { recipe, step, index } = timerSteps.get(key);
  const time = timer.mode === "done" ? "終了" : `${timer.mode === "paused" ? "停止 " : ""}${timerText(timerRemaining(timer, now))}`;
  const signature = `${key}|${time}|${otherTimers.length}`;
  if (dock.dataset.signature !== signature || !dock.firstElementChild) {
    const link = dock.firstElementChild;
    if (link?.dataset.key === key) {
      link.querySelector("b").textContent = time;
      link.querySelector(".dock-extra").textContent = otherTimers.length > 1 ? `ほか${otherTimers.length - 1}件` : "";
    } else {
      dock.innerHTML = `<a class="dock-link" data-key="${key}" href="#cook/${recipe.id}/${index}">
        ${icon("clock")} ${step.timerLabel} <b>${time}</b><span class="dock-extra">${otherTimers.length > 1 ? `ほか${otherTimers.length - 1}件` : ""}</span>
      </a>`;
    }
    dock.dataset.signature = signature;
  }
}
function changeTimer(action, key) {
  const definition = timerSteps.get(key);
  if (!definition) return;
  updateTimers();
  const timer = state.timers[key];
  if (action === "start-timer") {
    if (timer?.mode === "running") return;
    prepareAudio();
    const remaining = timer?.mode === "paused" ? timer.remaining : definition.step.seconds * 1000;
    state.timers[key] = { mode: "running", deadline: Date.now() + remaining };
  } else if (action === "pause-timer" && timer?.mode === "running") {
    state.timers[key] = { mode: "paused", remaining: timerRemaining(timer, Date.now()) };
  } else if (action === "reset-timer") {
    delete state.timers[key];
  }
  save();
  updateTimers();
  main.querySelector("[data-timer-key] button")?.focus({ preventScroll: true });
}

function renderRoute(shouldFocus = true) {
  const [view, id, indexText] = window.location.hash.slice(1).split("/");
  const recipe = recipeById.get(id);
  activeView = recipe && ["recipe", "cook", "done"].includes(view) ? view : view === "favorites" ? view : "home";
  if (activeView === "favorites" || activeView === "home") {
    lastCatalog = activeView === "favorites" ? "favorites" : "recipes";
    renderCatalog(activeView === "favorites");
  } else if (activeView === "recipe") {
    renderDetail(recipe);
  } else if (activeView === "done") {
    renderFinish(recipe);
  } else {
    const stepIndex = Number(indexText);
    const index = Number.isInteger(stepIndex) && stepIndex >= 0 && stepIndex < recipe.steps.length ? stepIndex : 0;
    renderCook(recipe, index);
  }
  document.querySelectorAll("[data-nav]").forEach(link => {
    if (link.dataset.nav === (activeView === "favorites" ? "favorites" : "recipes")) {
      link.setAttribute("aria-current", "page");
    } else {
      link.removeAttribute("aria-current");
    }
  });
  document.title = recipe ? `${recipe.title}｜火加減` : "火加減｜家で作る世界の料理";
  updateShoppingCount();
  updateTimers();
  const list = view === "recipes" ? document.getElementById("recipes") : null;
  if (shouldFocus) (list?.querySelector("h2") ?? main.querySelector("h1"))?.focus({ preventScroll: true });
  if (list) list.scrollIntoView({ block: "start" });
  else if (shouldFocus) window.scrollTo(0, 0);
}

document.addEventListener("click", event => {
  const target = event.target.closest("[data-action]");
  if (!target) {
    const link = event.target.closest("a");
    if (link?.classList.contains("skip-link")) {
      event.preventDefault();
      main.focus();
    } else if (link?.getAttribute("href") === "#recipes" && location.hash === "#recipes") {
      document.getElementById("recipes")?.scrollIntoView({ block: "start" });
    }
    return;
  }
  const { action, id, category, key, change } = target.dataset;
  const recipe = recipeById.get(id);
  switch (action) {
    case "filter":
      filters[activeView].category = category;
      main.querySelectorAll(".filter").forEach(button => {
        button.setAttribute("aria-pressed", String(button === target));
      });
      renderResults();
      break;
    case "clear-filter":
      filters[activeView] = { category: "すべて", query: "" };
      renderCatalog(activeView === "favorites");
      document.getElementById("search").focus();
      break;
    case "favorite": {
      const remove = state.favorites.includes(id);
      state.favorites = remove ? state.favorites.filter(saved => saved !== id) : [...state.favorites, id];
      save();
      if (activeView === "favorites") {
        renderResults();
        document.getElementById("catalog-title").focus({ preventScroll: true });
      } else {
        const label = `${recipe.title}をお気に入り${remove ? "に追加" : "から外す"}`;
        target.setAttribute("aria-pressed", String(!remove));
        target.setAttribute("aria-label", label);
        target.title = label;
      }
      message(remove ? "お気に入りから外しました" : "お気に入りに追加しました");
      break;
    }
    case "portion":
      updatePortions(recipe, Number(change));
      break;
    case "open-shopping":
      renderShopping();
      shopDialog.showModal();
      break;
    case "close-shopping":
      shopDialog.close();
      break;
    case "add-shopping":
      addToShopping(recipe);
      break;
    case "remove-bought":
      for (const { key: itemKey, item } of shoppingEntries()) {
        if (item.bought) delete state.shopping[itemKey];
      }
      save();
      renderShopping();
      updateShoppingCount();
      shopDialog.querySelector('[data-action="close-shopping"]').focus();
      break;
    case "copy-shopping":
      void copyShopping();
      break;
    case "start-timer":
    case "pause-timer":
    case "reset-timer":
      changeTimer(action, key);
      break;
  }
});
document.addEventListener("input", event => {
  if (event.target.id !== "search") return;
  filters[activeView].query = event.target.value;
  renderResults();
});
document.addEventListener("change", event => {
  const { ingredient, shop } = event.target.dataset;
  if (ingredient) {
    if (event.target.checked) state.ingredients[ingredient] = true;
    else delete state.ingredients[ingredient];
    save();
  }
  if (shop && state.shopping[shop]) {
    state.shopping[shop].bought = event.target.checked;
    save();
    updateShoppingCount();
    const entries = shoppingEntries();
    shopBody.querySelector('[data-action="remove-bought"]').disabled = !entries.some(({ item }) => item.bought);
    shopBody.querySelector('[data-action="copy-shopping"]').disabled = entries.every(({ item }) => item.bought);
  }
});
window.addEventListener("hashchange", () => renderRoute());
document.addEventListener("visibilitychange", updateTimers);

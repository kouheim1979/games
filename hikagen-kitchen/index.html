<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202e26">
  <meta name="description" content="火加減はブラウザーで遊べる料理ゲーム。まな板とコンロを操作し、世界の料理を盛り付けまで完成させよう。">
  <title>火加減 | 料理シミュレーション</title>
  <style>
:root {
  color-scheme: light;
  --paper: #f4f0e6;
  --surface: #fffbf3;
  --ink: #262b23;
  --muted: #5f6255;
  --green: #25382b;
  --green-dark: #202e26;
  --tint: #e7eadf;
  --line: #ded7c8;
  --gold: #edc779;
  --terra: #993e29;
  --serif: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif CJK JP", serif;
  --sans: "Hiragino Sans", "Noto Sans CJK JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-block-start: 12px; }
body { margin: 0; min-width: 280px; background: var(--paper); color: var(--ink); font: 15px/1.65 var(--sans); -webkit-text-size-adjust: 100%; }
body:has(dialog[open]) { overflow: hidden; }
h1, h2, p, ol { margin: 0; }
h1, h2 { font-family: var(--serif); text-wrap: balance; }
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid #b16a35; outline-offset: 3px; }
img { display: block; max-width: 100%; }
.shell { width: min(1232px, calc(100% - 76px)); margin-inline: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.topbar { background: var(--green-dark); color: #fbf6e9; border-bottom: 1px solid #425046; }
.topbar-inner { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 11px; font: 750 25px/1 var(--serif); letter-spacing: .085em; white-space: nowrap; }
.brand-mark { display: grid; place-items: center; width: 41px; height: 41px; border: 1px solid #566454; border-radius: 12px; color: var(--gold); }
.brand-mark svg { width: 29px; height: 29px; }
.top-actions { display: flex; align-items: center; gap: 9px; }
.button {
  display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 44px;
  padding: 8px 15px; border-radius: 10px; border: 1px solid transparent;
  line-height: 1.35; color: inherit; background: transparent; font-size: 13px; font-weight: 750;
  transition: background .14s ease, border-color .14s ease, color .14s ease;
}
.button > svg { width: 18px; height: 18px; flex: none; }
.header-button { color: #fff6e6; padding-inline: 10px; border-color: #536255; min-width: 44px; }
.header-button:hover, .header-button[aria-pressed="true"] { background: #3a4d3e; }
.menu-button { background: var(--gold); color: #302614; }
.menu-button:hover { background: #f6d58e; }
.primary { background: var(--green); color: #fffdf3; }
.primary:not(:disabled):hover { background: #3d5544; }
.secondary { border-color: #b9bba9; color: var(--green); background: var(--surface); }
.secondary:not(:disabled):hover { background: var(--tint); }
.button:disabled { opacity: .5; }

.game-heading {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 18px;
  padding-block: 23px 15px;
}
.cuisine { margin-bottom: 5px; color: #4d624e; font-size: 11px; font-weight: 750; letter-spacing: .08em; }
.game-heading h1 { font-size: clamp(25px, 3.15vw, 42px); line-height: 1.25; letter-spacing: -.025em; }
.phase-list { flex: none; display: flex; gap: 6px; list-style: none; padding: 0; }
.phase-list li {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  background: #eee9de; color: #555a50; border: 1px solid #e1dbcf; border-radius: 8px;
  min-height: 32px; padding: 3px 8px; font-size: 11px; font-weight: 700; white-space: nowrap;
}
.phase-index { font-family: ui-monospace, monospace; font-size: 10px; }
.phase-list li[aria-current="step"] { color: #fcfcf3; background: var(--green); border-color: var(--green); }
.phase-list .passed { color: #385345; background: var(--tint); border-color: #d6dbcd; }

.game-layout {
  display: grid; grid-template-columns: minmax(0, 2.52fr) minmax(255px, 1fr);
  grid-template-areas: "bench guide" "bench footer"; grid-template-rows: min-content 1fr;
  align-items: start; gap: 11px 19px; padding-bottom: 30px;
}
.bench, .guide, .result { border: 1px solid var(--line); border-radius: 15px; background: var(--surface); overflow: hidden; }
.bench { grid-area: bench; }
.station-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  min-height: 45px; padding: 8px 14px; background: #293930; color: #f8f4e8;
}
.station-head h2 { display: flex; align-items: center; gap: 8px; font: 750 14px/1.4 var(--sans); }
.station-head h2::before { content: ""; width: 7px; height: 7px; border-radius: 100%; background: var(--gold); }
.station-head p { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 650; color: #eee5c9; text-align: right; }
.scene-box { position: relative; background: #755238; overflow: hidden; }
#scene {
  display: block; width: 100%; aspect-ratio: 768 / 456;
  touch-action: none; cursor: crosshair; user-select: none;
}
#scene:focus-visible { outline-offset: -4px; outline-color: var(--gold); }
.bench[data-kind="cut"] #scene { cursor: crosshair; }
.bench:is([data-kind="sear"], [data-kind="steam"], [data-kind="fill"]) #scene { cursor: pointer; }
.bench:is([data-kind="mix"], [data-kind="plate"]) #scene { cursor: grab; }
.scene-note {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%); padding: 5px 10px;
  max-width: calc(100% - 14px); width: max-content; pointer-events: none;
  color: #fff9e9; background: #1c2720ed; border: 1px solid #ffffff3b;
  border-radius: 8px; font-size: 12px; font-weight: 700; text-align: center;
}
.controls { padding: 11px 14px 13px; }
.heat-panel {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 7px 12px;
  margin-bottom: 10px; padding: 7px 9px; color: var(--green);
  background: #efece1; border: 1px solid #e4ded0; border-radius: 9px;
}
.heat-label { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; font-size: 12px; }
.heat-label span { color: #685139; font-size: 11px; }
.heat-buttons { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 4px; }
.heat-buttons button {
  min-height: 40px; padding: 4px 9px; border: 1px solid #d5d0c1; border-radius: 7px;
  background: var(--surface); color: var(--green); font-size: 12px; font-weight: 750; white-space: nowrap;
}
.heat-buttons button[aria-pressed="true"] { background: var(--green); color: white; border-color: var(--green); }
.heat-buttons button[data-heat="3"][aria-pressed="true"] { background: var(--terra); border-color: var(--terra); }
.heat-buttons button:disabled { opacity: .65; }
.tray { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.food-tile {
  flex: 1 1 110px; max-width: 160px; display: flex; align-items: center; justify-content: center; gap: 5px;
  min-height: 49px; padding: 4px 7px; border-radius: 8px; border: 1px solid var(--line);
  color: #312f22; background: #fff8e8; font-size: 11px; font-weight: 750; line-height: 1.35;
  touch-action: none; user-select: none; white-space: normal; cursor: grab;
}
.food-tile.active { border-color: #bb7430; box-shadow: inset 0 0 0 1px #bb74302d; background: #fff0cd; }
.food-tile:disabled { color: #767467; background: #f2efe5; cursor: default; }
.food-tile.used { opacity: .6; }
.food-tile span { min-width: 0; }
.food-thumb { width: 37px; height: 34px; flex: none; object-fit: contain; pointer-events: none; }
.cup {
  display: inline-grid; place-items: center; width: 32px; height: 29px; flex: none;
  background: radial-gradient(ellipse at 40% 34%, #fff5 4%, transparent 42%), var(--liquid);
  border: 4px solid #f8edcf; box-shadow: 0 0 0 1px #aa9c7d, inset 0 0 0 1px #2c241a36;
  border-radius: 50%; pointer-events: none;
}
.action-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.action-row .button { min-height: 43px; }
.action-row .next-action { margin-left: auto; padding-inline: 17px; }
.action-row .pour-button { touch-action: none; user-select: none; }
.action-row:empty, .controls:has(.action-row:empty):has(.tray[hidden]):has(.heat-panel[hidden]) { display: none; }

.guide { grid-area: guide; padding: 17px 17px 18px; }
.step-count { color: #875631; font-size: 12px; font-weight: 800; letter-spacing: .06em; }
.guide h2 { margin: 4px 0 8px; font-size: clamp(19px, 2vw, 25px); line-height: 1.4; }
.task-hint { color: var(--muted); font-size: 13px; line-height: 1.68; }
.readouts { display: grid; gap: 10px; margin-top: 14px; }
.readout { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 3px 7px; }
.readout-label { color: #4b5045; font-size: 11px; font-weight: 750; min-width: 0; }
.readout-value { color: var(--green); font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 750; text-align: right; }
.meter {
  position: relative; height: 7px; grid-column: 1 / -1; border-radius: 6px; overflow: hidden;
  background: #e9e4d7; isolation: isolate;
}
.meter-fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: #8c9a69; border-radius: inherit; }
.meter-fill[data-tone="gold"] { background: #b97a36; }
.meter-fill[data-tone="hot"] { background: #a44731; }
.meter-fill[data-tone="done"] { background: #4f7251; }
.meter-mark {
  position: absolute; inset-block: 0; width: 2px; background: #312c1b;
  box-shadow: 0 0 0 1px #fff9; z-index: 1;
}
.ready-message { margin-top: 12px; padding: 7px 9px; border-radius: 8px; color: #2f5535; background: var(--tint); font-size: 12px; font-weight: 750; }
.side-foot { grid-area: footer; display: flex; justify-content: flex-end; }
.quiet { color: #555c4f; background: transparent; }
.quiet:hover { background: #eae5d8; }
.drag-ghost {
  position: fixed; z-index: 20; display: grid; place-items: center; gap: 1px;
  pointer-events: none; transform: translate(-50%, -65%); width: 91px; min-height: 62px; padding: 4px;
  border: 1px solid #fff7d3ad; border-radius: 11px; background: #fffae6ed;
  color: var(--green); box-shadow: 0 7px 20px #25251948; font-size: 10px; font-weight: 800; text-align: center;
}
.drag-ghost .food-thumb { width: 46px; height: 39px; }

dialog {
  width: min(710px, calc(100% - 24px)); max-height: min(82dvh, 750px); padding: 0;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 20px 65px #181d1a52;
}
dialog::backdrop { background: #14201db5; }
.dialog-head {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
  padding: 10px 15px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.dialog-head h2 { font-size: 24px; }
.close-button { width: 43px; height: 43px; padding: 0; border-color: var(--line); font-size: 24px; }
.close-button:hover { background: var(--tint); }
.dish-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; padding: 11px; }
.dish-option {
  min-width: 0; display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden;
  color: var(--ink); border: 1px solid var(--line); border-radius: 9px; background: #f6f2e8;
}
.dish-option:hover { border-color: #a98447; background: #f8ecd3; }
.dish-option[aria-current="true"] { border-color: #4d694f; box-shadow: 0 0 0 1px #4d694f; }
.dish-option img { width: 100%; aspect-ratio: 1.8; object-fit: cover; }
.dish-copy { padding: 7px 8px; }
.dish-copy small { color: var(--muted); display: block; font-size: 10px; }
.dish-copy strong { display: block; font-size: 13px; line-height: 1.45; margin-block: 2px; }

.result { display: grid; grid-template-columns: 1.16fr 1fr; margin-bottom: 25px; }
.result-photo { min-height: 345px; position: relative; background: #453626; }
.result-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.result-copy { padding: clamp(17px, 3vw, 34px); align-self: center; }
.result-copy h2 { font-size: clamp(26px, 3vw, 36px); line-height: 1.3; }
.stars { margin: 5px 0 4px; font-size: 26px; line-height: 1; color: #976127; letter-spacing: .04em; }
.star-empty { color: #7d7b6d; }
.score { color: var(--green); font: 750 36px/1.2 var(--serif); }
.score small { font: 750 13px/1 var(--sans); }
.record { color: var(--muted); font-size: 12px; }
.grades { margin: 11px 0; padding: 0; list-style: none; }
.grades li {
  display: flex; align-items: center; justify-content: space-between; gap: 9px;
  padding-block: 5px; border-bottom: 1px solid #ece6d8; font-size: 12px;
}
.result-buttons { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }

@media (max-width: 960px) {
  .shell { width: calc(100% - 42px); }
  .game-layout { grid-template-columns: minmax(0,2.2fr) minmax(220px,1fr); column-gap: 11px; }
  .guide { padding-inline: 13px; }
}
@media (max-width: 720px) {
  .shell { width: calc(100% - 24px); }
  .topbar-inner { min-height: 57px; }
  .brand { font-size: 21px; gap: 8px; }
  .brand-mark { width: 35px; height: 35px; border-radius: 9px; }
  .brand-mark svg { width: 25px; height: 25px; }
  .top-actions { gap: 6px; }
  .game-heading { display: block; padding-block: 12px 8px; }
  .cuisine { margin-bottom: 2px; }
  .game-heading h1 { font-size: clamp(23px, 5vw, 32px); }
  .phase-list { margin-top: 8px; }
  .phase-list li { flex: 1; padding-inline: 4px; min-width: 0; min-height: 27px; gap: 4px; }
  .game-layout { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "guide" "bench" "footer"; grid-template-rows: auto; gap: 7px; padding-bottom: 14px; }
  .guide, .bench { border-radius: 11px; }
  .guide { padding: 8px 11px 9px; }
  .guide h2 { margin-block: 1px 3px; font-size: 19px; }
  .task-hint { font-size: 12px; line-height: 1.52; }
  .step-count { font-size: 10px; }
  .readouts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 12px; margin-top: 6px; }
  .readout:only-child { grid-column: 1 / -1; }
  .readout { row-gap: 2px; }
  .meter { height: 6px; }
  .ready-message { margin-top: 5px; padding: 3px 7px; }
  .station-head { min-height: 32px; padding: 5px 9px; }
  .station-head h2, .station-head p { font-size: 11px; }
  .controls { padding: 8px 9px 9px; }
  .heat-panel { padding: 5px; gap: 5px; }
  .heat-buttons button { padding-inline: 6px; min-height: 42px; }
  .heat-label { font-size: 11px; }
  .food-tile { flex-basis: 68px; max-width: 140px; min-height: 45px; gap: 3px; padding: 3px; }
  .food-thumb { width: 29px; height: 27px; }
  .food-tile .cup { width: 24px; height: 22px; border-width: 3px; }
  .action-row .button { min-height: 44px; }
  .side-foot .button { min-height: 38px; }
  .result { grid-template-columns: minmax(0,1fr); }
  .result-photo { min-height: 0; aspect-ratio: 1.85; }
  .result-copy { padding: 14px; }
}
@media (max-width: 460px) {
  .dish-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .heat-panel { justify-content: stretch; }
  .heat-buttons { flex: 1; }
  .tray { gap: 4px; }
  .food-tile { font-size: 10px; }
}
@media (max-width: 355px) {
  .sound span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 18.5h19c0 4.3-3.6 7.5-9.5 7.5S5 22.8 5 18.5Zm19 0 4-2M11 15c-1.7-2 .2-3 0-4.4m4 4c-2.8-3 .9-4.7 0-7.3m4 7.5c-1.7-2 .2-3 0-4.4"/>
          </svg>
        </span>
        <span>火加減</span>
      </div>
      <nav class="top-actions" aria-label="ゲーム設定">
        <button class="button header-button sound" id="sound-button" type="button" data-action="sound" aria-label="音を出す" aria-pressed="false"></button>
        <button class="button menu-button" type="button" data-action="menu"><span>料理を選ぶ</span><span aria-hidden="true">⌄</span></button>
      </nav>
    </div>
  </header>
  <main class="shell">
    <header class="game-heading">
      <div class="title-position">
        <p id="cuisine" class="cuisine"></p>
        <h1 id="dish-name"></h1>
      </div>
      <ol class="phase-list" id="phases" aria-label="調理工程"></ol>
    </header>
    <div class="game-layout" id="game-layout">
      <section class="bench" aria-labelledby="station-name">
        <header class="station-head">
          <h2 id="station-name"></h2>
          <p id="station-status"></p>
        </header>
        <div class="scene-box">
          <canvas id="scene" tabindex="0" aria-label="調理台"></canvas>
          <p id="scene-note" class="scene-note" hidden></p>
        </div>
        <div class="controls">
          <div id="heat-panel" class="heat-panel" hidden>
            <div class="heat-label"><strong>コンロ</strong><span id="heat-guide"></span></div>
            <div class="heat-buttons" role="group" aria-label="火加減">
              <button type="button" data-action="heat" data-heat="0" aria-pressed="true">消火</button>
              <button type="button" data-action="heat" data-heat="1" aria-pressed="false">弱火</button>
              <button type="button" data-action="heat" data-heat="2" aria-pressed="false">中火</button>
              <button type="button" data-action="heat" data-heat="3" aria-pressed="false">強火</button>
            </div>
          </div>
          <div id="tray" class="tray" role="group" aria-label="調理に使う食材" hidden></div>
          <div class="action-row" id="actions"></div>
        </div>
      </section>
      <aside class="guide" aria-labelledby="task-title">
        <p id="step-count" class="step-count"></p>
        <h2 id="task-title"></h2>
        <p id="task-hint" class="task-hint"></p>
        <div class="readouts" id="readouts"></div>
        <div class="ready-message" id="ready-message" hidden></div>
      </aside>
      <div class="side-foot">
        <button type="button" class="button quiet" data-action="restart">↺ <span>最初から</span></button>
      </div>
    </div>
    <section class="result" id="result" hidden aria-labelledby="result-title"></section>
  </main>
  <dialog id="dish-menu" aria-labelledby="menu-title">
    <header class="dialog-head">
      <h2 id="menu-title">料理を選ぶ</h2>
      <button type="button" class="button close-button" data-action="close-menu" aria-label="閉じる">×</button>
    </header>
    <div id="dish-options" class="dish-options"></div>
  </dialog>
  <div id="drag-ghost" class="drag-ghost" hidden aria-hidden="true"></div>
  <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
  <noscript><p class="shell">遊ぶにはJavaScriptを有効にしてください。</p></noscript>
  <script>

function randomizer(seed) {
  return () => {
    seed = (1664525 * seed + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}
function oval(context, x, y, rx, ry) {
  context.beginPath();
  context.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), 0, 0, Math.PI * 2);
}
function roundBox(context, x, y, width, height, radius) {
  context.beginPath();
  context.roundRect(x, y, width, height, radius);
}

function table(daylight) {
  const kind = daylight ? "wood" : "metal";
  if (tables.has(kind)) return tables.get(kind);
  const surface = document.createElement("canvas");
  surface.width = W;
  surface.height = H;
  const g = surface.getContext("2d");
  const wash = g.createLinearGradient(0, 0, W, H);
  wash.addColorStop(0, daylight ? "#875839" : "#4a5147");
  wash.addColorStop(.62, daylight ? "#593c29" : "#353b34");
  wash.addColorStop(1, daylight ? "#39271c" : "#222b26");
  g.fillStyle = wash;
  g.fillRect(0, 0, W, H);
  const random = randomizer(daylight ? 340 : 1190);
  for (let i = 0; i < (daylight ? 500 : 260); i += 1) {
    const x = random() * W;
    const y = random() * H;
    const length = 21 + random() * (daylight ? 360 : 90);
    g.strokeStyle = random() > .52 ? "#f5d29b19" : "#1d180d3a";
    g.lineWidth = .45 + random() * 1.25;
    g.beginPath();
    g.moveTo(x - 130, y);
    g.bezierCurveTo(x - 40, y + 6, x + length * .4, y - 5, x + length, y + 1.6);
    g.stroke();
  }
  if (daylight) {
    for (const y of [69, 171, 298, 399]) {
      g.fillStyle = "#20181053";
      g.fillRect(0, y, W, 2);
      g.fillStyle = "#e6bd861d";
      g.fillRect(0, y + 2, W, 1);
    }
  }
  const light = g.createRadialGradient(310, 190, 45, 395, 215, 420);
  light.addColorStop(0, "#fff1d217");
  light.addColorStop(.78, "#06070400");
  light.addColorStop(1, "#04070445");
  g.fillStyle = light;
  g.fillRect(0, 0, W, H);
  tables.set(kind, surface);
  return surface;
}

function board(ctx) {

  ctx.shadowOffsetY = 13;
  ctx.fillStyle = "#462b1b";

  const wood = ctx.createLinearGradient(133, 73, 654, 397);
  wood.addColorStop(0, "#dcb780");
  wood.addColorStop(.48, "#c59560");
  wood.addColorStop(1, "#aa7247");
  ctx.fillStyle = wood;
  roundBox(ctx, 117, 54, 534, 333, 29);
  ctx.fill();
  ctx.clip();
  const random = randomizer(462);
  for (let i = 0; i < 132; i += 1) {
    const y = 55 + random() * 335;
    ctx.strokeStyle = i % 3 ? "#60381d23" : "#fff2be39";
    ctx.lineWidth = 1 + random() * 1.35;
    ctx.beginPath();
    ctx.moveTo(100, y);
    ctx.bezierCurveTo(295, y + random() * 9, 491, y - random() * 7, 689, y + 2);
    ctx.stroke();
  }
  ctx.strokeStyle = "#935b3d77";
  ctx.lineWidth = 2;
  roundBox(ctx, 130, 67, 508, 307, 23);
  ctx.stroke();
  ctx.strokeStyle = "#f4d79d69";
  roundBox(ctx, 133, 70, 502, 301, 20);
  ctx.stroke();
  ctx.fillStyle = "#7f5036";
  roundBox(ctx, 152, 178, 24, 95, 12);
  ctx.fill();
  ctx.fillStyle = "#59402b";
  roundBox(ctx, 155, 178, 18, 88, 9);
  ctx.fill();

}

function knife(ctx, x, y, rotation) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  ctx.shadowColor = "#14110a8a";
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 4;
  const steel = ctx.createLinearGradient(-26, 0, 24, 0);
  steel.addColorStop(0, "#818c7f");
  steel.addColorStop(.35, "#e3eae2");
  steel.addColorStop(.78, "#afb9ae");

  ctx.quadraticCurveTo(21, -113, 24, -75);
  ctx.lineTo(24, 33);
  ctx.lineTo(-18, 33);
  ctx.lineTo(-18, -92);
  ctx.quadraticCurveTo(-15, -119, 0, -132);

  ctx.fillStyle = "#28241e";

function coloredSprite(sprite, shade) {
  const key = `${sprite}:${shade}`;
  if (tintedSprites.has(key)) return tintedSprites.get(key);
  const image = spriteImages.get(sprite);
  const tinted = document.createElement("canvas");
  tinted.width = image.naturalWidth;
  tinted.height = image.naturalHeight;
  const brush = tinted.getContext("2d");
  brush.drawImage(image, 0, 0);
  brush.globalCompositeOperation = "source-atop";
  const tint = brush.createLinearGradient(0, 0, tinted.width * .8, tinted.height);
  tint.addColorStop(0, shade === "burn" ? "#593a22d9" : "#dfa35244");
  tint.addColorStop(1, shade === "burn" ? "#271d16ef" : "#733715a3");
  brush.fillStyle = tint;
  brush.fillRect(0, 0, tinted.width, tinted.height);
  tintedSprites.set(key, tinted);
  return tinted;
}

function paintFood(key, x, y, width, height, options = {}) {
  const food = foods[key];
  const image = food.sprite && spriteImages.get(food.sprite);
  ctx.save();
  ctx.translate(x, y);
  if (options.angle) ctx.rotate(options.angle);
  if (options.turn) ctx.scale(1, options.turn);
  if (options.alpha != null) ctx.globalAlpha *= options.alpha;
  if (options.shadow !== false) {
    ctx.shadowColor = "#1d100c83";
    ctx.shadowBlur = 9;
    ctx.shadowOffsetY = 6;
  }
  if (image?.complete && image.naturalWidth) {
    const ratio = Math.min(width / image.naturalWidth, height / image.naturalHeight);
    const dx = image.naturalWidth * ratio;
    const dy = image.naturalHeight * ratio;
    const source = options.shade ? coloredSprite(food.sprite, options.shade) : image;
    ctx.drawImage(source, -dx / 2, -dy / 2, dx, dy);
  } else {
    const liquid = food.liquid || food.tint || "#ceac73";
    const gradient = ctx.createRadialGradient(-width * .14, -height * .13, 2, 0, 0, width * .57);
    gradient.addColorStop(0, liquid);
    gradient.addColorStop(1, "#633820");
    ctx.fillStyle = gradient;
    oval(ctx, 0, 0, width * .43, Math.min(height * .43, width * .29));
    ctx.fill();
  }
  ctx.restore();
}

function cutPositions(count) {
  return Array.from({ length: count }, (_, index) => boardCenter.x + (index - (count - 1) / 2) * 66);
}

function prepScene(game) {
  if (!prepBackdrop) {
    prepBackdrop = document.createElement("canvas");
    prepBackdrop.width = W;
    prepBackdrop.height = H;
    const brush = prepBackdrop.getContext("2d");
    brush.drawImage(table(true), 0, 0);
    board(brush);
    knife(brush, 683, 227, -.16);
  }
  ctx.drawImage(prepBackdrop, 0, 0);
  const stage = game.stage;
  const state = game.s;
  const [food, amount] = stage.cuts[state.cutItem];
  const marks = cutPositions(amount);
  const cuts = marks.filter((_, index) => state.cutMarks.has(index));
  const { x, y } = boardCenter;
  if (cuts.length) {
    const edges = [x - 184, ...cuts, x + 184];
    for (let i = 0; i < edges.length - 1; i++) {
      const shift = 5.5 * (i - cuts.length / 2);
      ctx.save();
      ctx.beginPath();
      ctx.rect(edges[i] + shift, 123, edges[i + 1] - edges[i], 210);
      ctx.clip();
      paintFood(food, x + shift, y, 328, 170);
      ctx.restore();
    }
  } else {
    paintFood(food, x, y, 328, 170);
  }
  marks.forEach((mark, index) => {
    const done = state.cutMarks.has(index);
    ctx.save();
    ctx.lineWidth = done ? 2 : 3;
    ctx.setLineDash(done ? [] : [7, 8]);
    ctx.strokeStyle = done ? "#512c28a8" : "#fff2be";
    ctx.shadowColor = "#381a11b0";
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.moveTo(mark, 133);
    ctx.lineTo(mark, 325);
    ctx.stroke();
    ctx.restore();
    if (!done) {
      ctx.fillStyle = "#fcdfa2";
      oval(ctx, mark, 125, 4.5, 4.5);
      ctx.fill();
    }
  });
  if (gesture?.stage === state && gesture.moved) {
    ctx.strokeStyle = "#fdf0c1c9";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(gesture.start.x, gesture.start.y);
    ctx.lineTo(gesture.point.x, gesture.point.y);
    ctx.stroke();
  }
}

function pan(x, y, radius, heat, clock, depth = false) {
  ctx.save();
  if (heat) {
    const halo = ctx.createRadialGradient(x, y, radius * .7, x, y, radius * 1.17);
    halo.addColorStop(0, "#0000");
    halo.addColorStop(.64, heat === 3 ? "#fd63359d" : "#dba04077");
    halo.addColorStop(1, "#0000");
    ctx.fillStyle = halo;
    oval(ctx, x, y + 11, radius * 1.18, radius * 1.12);
    ctx.fill();
    for (let index = 0; index < 13; index++) {
      const angle = .19 + index * .225;
      const wave = reducedMotion ? 0 : Math.sin(clock * 12 + index * 1.8) * 2.9;
      const fx = x + (radius + 3) * Math.cos(angle);
      const fy = y + (radius + 7 + wave) * .92 * Math.sin(angle);
      const light = ctx.createLinearGradient(fx, fy - 7, fx, fy + 9);
      light.addColorStop(0, '#68ab9a86');
      light.addColorStop(.6, heat > 1 ? '#f6b951cf' : '#9bcbd3a5');
      light.addColorStop(1, '#f8bf4700');
      ctx.fillStyle = light;
      oval(ctx, fx, fy, 4.3 + heat, 4.8 + heat * 1.4);
      ctx.fill();
    }
  }
  ctx.translate(x, y);
  ctx.rotate(-.108);
  ctx.shadowColor = "#141610b7";
  ctx.shadowBlur = 17;
  ctx.shadowOffsetY = 9;
  if (depth) {
    ctx.fillStyle = "#252722";
    for (const sign of [-1, 1]) {
      roundBox(ctx, sign === -1 ? -radius - 43 : radius - 15, -21, 58, 38, 10);
      ctx.fill();
    }
  } else {
    const handle = ctx.createLinearGradient(0, -16, 0, 17);
    handle.addColorStop(0, "#76756a");
    handle.addColorStop(.3, "#434743");
    handle.addColorStop(1, "#202420");
    ctx.fillStyle = handle;
    roundBox(ctx, radius - 15, -13, radius * 1.26, 29, 10);
    ctx.fill();
    ctx.shadowColor = "transparent";
    ctx.strokeStyle = "#a1a59385";
    ctx.lineWidth = 2;
    roundBox(ctx, radius * 2.01, -6, radius * .16, 13, 5);
    ctx.stroke();
  }
  ctx.shadowColor = "#13161290";
  ctx.shadowBlur = 14;
  const enamel = ctx.createLinearGradient(-radius, -radius, radius, radius);
  enamel.addColorStop(0, depth ? "#8f9486" : "#90988b");
  enamel.addColorStop(.27, "#454a43");
  enamel.addColorStop(.62, "#20241f");
  enamel.addColorStop(1, "#74786c");
  ctx.fillStyle = enamel;
  oval(ctx, 0, 0, radius, radius * .92);
  ctx.fill();
  ctx.shadowColor = "transparent";
  const coating = ctx.createRadialGradient(-radius * .32, -45, 7, 0, 0, radius);
  coating.addColorStop(0, "#50524a");
  coating.addColorStop(.72, "#272a25");
  coating.addColorStop(1, "#171b17");
  ctx.fillStyle = coating;
  oval(ctx, 0, 0, radius - 8, (radius - 8) * .92);
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = "#bfc3b154";
  ctx.stroke();
  ctx.strokeStyle = "#c5bc9670";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(0, 0, radius - 5, (radius - 5) * .92, 0, Math.PI * 1.05, Math.PI * 1.73);
  ctx.stroke();
  if (heat) {
    ctx.strokeStyle = heat === 3 ? "#fe8b447b" : "#dfb45868";
    ctx.lineWidth = 2;
    ctx.beginPath();
    const pulse = reducedMotion ? 0 : Math.sin(clock * 5) * .07;
    ctx.ellipse(0, 1, radius - 2, (radius - 2) * .92, 0, .12 + pulse, Math.PI - .23);
    ctx.stroke();
  }
  ctx.restore();
}

function vapor(x, y, seconds, strength = 1) {
  if (reducedMotion) seconds = 1;
  ctx.save();
  ctx.lineWidth = 3.6;
  for (let j = 0; j < 7; j++) {
    const time = (seconds * (.3 + j * .028) + j * .147) % 1;
    const tx = x + (j - 3) * 24 + Math.sin(time * 7 + j) * 10;
    const ty = y - time * (69 + j * 4);
    ctx.strokeStyle = `rgba(249, 243, 215, ${(1 - time) * strength * .19})`;
    ctx.beginPath();
    ctx.moveTo(tx, ty + 20);
    ctx.bezierCurveTo(tx - 13, ty + 5, tx + 15, ty - 10, tx + 4, ty - 24);
    ctx.stroke();
  }
  ctx.restore();
}

function sauce(x, y, radius, color, clock, energy = 0) {
  ctx.save();
  const liquid = ctx.createRadialGradient(x - radius * .24, y - radius * .19, 1, x, y, radius);
  liquid.addColorStop(0, color);
  liquid.addColorStop(.79, color);
  liquid.addColorStop(1, "#38221ead");
  ctx.fillStyle = liquid;
  oval(ctx, x, y + 3, radius, radius * .86);
  ctx.fill();
  ctx.clip();
  const rng = randomizer(951);
  for (let i = 0; i < 43; i++) {
    const dx = (rng() - .5) * radius * 2;
    const dy = (rng() - .5) * radius * 1.72;
    const motion = reducedMotion ? 0 : clock * (.6 + energy * .3);
    const phase = (rng() + motion) % 1;
    const bubble = i % 3 === 0;
    ctx.fillStyle = bubble && energy
      ? `rgba(255,236,183,${.29 * (1 - phase)})`
      : i % 2 ? "#f9d49b27" : "#37251439";
    const size = bubble && energy ? 1 + phase * 5 : 1.3 + rng() * 4;
    oval(ctx, x + dx, y + dy, size, size * .78);
    ctx.fill();
  }
  ctx.restore();
}

function searingScene(game) {
  const s = game.s;
  pan(potCenter.x, potCenter.y, 157, s.heat, game.clock);
  let cooking = false;
  s.pieces.forEach((piece, index) => {
    if (!piece.loaded || piece.removed) return;
    const { x, y } = searPositions[index];
    const surface = piece.faces[piece.side ^ 1];
    const edge = piece.faces[piece.side];
    const warmth = Math.max(surface, edge * .66);
    const turn = piece.flipAt && !reducedMotion ? Math.max(.15, Math.abs(Math.min(1, (game.clock - piece.flipAt) * 4.5) * 2 - 1)) : 1;
    paintFood(game.stage.load[index], x, y, 121, 102, {
      shade: warmth > 1.24 ? "burn" : warmth > .48 ? "gold" : "",
      angle: index === 0 ? .19 : -.29,
      turn
    });
    if (s.heat) cooking = true;
    if (!s.complete) {
      const label = finishedPiece(piece) ? "取り出す" : piece.faces[piece.side] >= .82 ? "返す" : index + 1 + "枚目";
      const ready = label === "取り出す" || label === "返す";
      ctx.fillStyle = ready ? "#ead39a" : "#eee7d7de";
      roundBox(ctx, x - 44, y + 46, 88, 26, 8);
      ctx.fill();
      ctx.fillStyle = "#372b21";
      ctx.textAlign = "center";
      ctx.font = "700 15px sans-serif";
      ctx.fillText(label, x, y + 63);
    }
  });
  if (cooking) vapor(potCenter.x, potCenter.y - 50, game.clock, .65 + s.heat * .16);
}

function toppings(keys, x, y, radius, offset = 0, cooked = true) {
  if (!keys.length) return;
  const orbit = keys.length > 1 ? radius * .61 : radius * .22;
  keys.forEach((name, index) => {
    const angle = index / keys.length * Math.PI * 2 + offset + .78;
    const vegetable = foods[name].sprite;
    const mainFood = ["chicken", "beef", "salmon", "rice", "tofu"].includes(vegetable);
    const scale = (mainFood ? .99 : .68) * radius;
    paintFood(name, x + Math.cos(angle) * orbit, y + Math.sin(angle) * orbit * .75, scale, scale * .73, {
      angle: angle * .21,
      shade: cooked && ["chicken", "beef", "pork", "salmon"].includes(vegetable) ? "gold" : "",
      alpha: foods[name].liquid ? .8 : 1,
      shadow: "sprite" in foods[name]
    });
  });
}

function mixingScene(game) {
  const { s, dish, stage, clock } = game;
  const { x, y } = potCenter;
  pan(x, y, 157, s.heat, clock, stage.heat === 1);
  if (s.added || stage.base?.length) {
    const added = stage.load.slice(0, s.added);
    if (added.some(name => foods[name].liquid || name === 'tomato')) {
      sauce(x, y, 131, stage.color ?? dish.color, clock, s.heat);
    }
    toppings([...(stage.base ?? []), ...added], x, y, 126, s.swirl, s.heat > 0 || s.progress > 0);
    if (s.heat) vapor(x, y - 57, clock, .65 + s.heat * .14);
  }
  if (s.stirring > 0) {
    ctx.save();
    ctx.strokeStyle = `rgba(253, 230, 178, ${s.stirring * .46})`;
    ctx.lineWidth = 3;
    for (let index = 0; index < 2; index++) {
      const start = s.swirl + index * Math.PI;
      ctx.beginPath();
      ctx.ellipse(x, y, 113 - index * 13, 87 - index * 7, 0, start, start + 1.78);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function fillingScene(game) {
  const { s, stage, clock } = game;
  const { x, y } = potCenter;
  pan(x, y, 160, 0, clock, true);
  if (s.added) paintFood("rice", x, y + 8, 245, 170);
  ctx.save();
  oval(ctx, x, y, 143, 131);
  ctx.clip();
  const levelY = y + 113 - s.water * 2.23;
  ctx.fillStyle = "#d8b26995";
  ctx.fillRect(x - 150, levelY, 300, 270);
  ctx.strokeStyle = "#ffedb4";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x - 143, levelY);
  ctx.lineTo(x + 144, levelY);
  ctx.stroke();
  const markY = y + 113 - stage.mark * 2.23;
  ctx.setLineDash([8, 7]);
  ctx.strokeStyle = "#fff8ce";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x - 119, markY);
  ctx.lineTo(x + 119, markY);
  ctx.stroke();
  ctx.restore();

function steamingScene(game) {

function paintEffects(game) {
  for (const effect of game.effects) {
    const life = (game.clock - effect.time) / effect.duration;
    const count = reducedMotion ? 4 : 10;
    ctx.save();
    ctx.globalAlpha = (1 - life) * .9;
    ctx.fillStyle = effect.color;
    for (let i = 0; i < count; i++) {
      const angle = i / count * 2 * Math.PI + .6;
      const radius = 10 + life * (52 + i * 2);
      oval(ctx, effect.x + Math.cos(angle) * radius, effect.y + Math.sin(angle) * radius * .73, 3.2 - life, 2.8 - life);
      ctx.fill();
    }
    ctx.restore();
  }

function playSound(effect) {
  if (!settings.sound || audio?.state !== "running") return;
  const notes = {
    cut: [160], drop: [260], turn: [360, 515], stir: [185], water: [235],
    warm: [525], done: [450, 600, 800], serve: [490, 655], finish: [392, 523, 659, 784]
  };
  const now = audio.currentTime;
  notes[effect].forEach((frequency, index) => {
    const tone = audio.createOscillator();
    const volume = audio.createGain();
    const start = now + index * .075;
    tone.type = effect === "cut" || effect === "stir" ? "triangle" : "sine";
    tone.frequency.setValueAtTime(frequency, start);
    if (notes[effect].length === 1) tone.frequency.exponentialRampToValueAtTime(frequency * .62, start + .095);
    volume.gain.setValueAtTime(.001, start);
    volume.gain.exponentialRampToValueAtTime(.12, start + .015);
    volume.gain.exponentialRampToValueAtTime(.001, start + .14);
    tone.connect(volume).connect(audio.destination);
    tone.start(start);
    tone.stop(start + .15);
  });
}

  const length = Math.ceil(audio.sampleRate * .6);
  const buffer = audio.createBuffer(1, length, audio.sampleRate);
  const samples = buffer.getChannelData(0);
  for (let i = 0; i < length; i++) {

function meters() {

  }
  if (stage.kind === "sear") {
    if (!s.added) return readout("フライパンに入れた数", `0 / ${stage.load.length}`, 0);
    return s.pieces.map((piece, index) => {
      const label = slotLabel(stage, stage.load[index], index);
      if (!piece.loaded) return readout(label, "投入待ち", 0);
      if (piece.removed) return readout(label, "焼き上がり", 100, { tone: "done" });
      const heat = piece.faces[piece.side];
      const side = piece.side === 0 ? "表" : "裏";
      const burned = piece.faces.some(value => value > 1.23);
      const value = finishedPiece(piece) ? (burned ? "焦げ・取り出し時" : "取り出し時")
        : heat > 1.23 ? `${side} 焦げ・返し時`
        : readyToFlip(piece) ? `${side} 返し時` : `${side} ${Math.floor(heat * 100)}%`;
      return readout(label, value, heat / 1.6 * 100, { tone: heat > 1.2 ? "hot" : readyToFlip(piece) ? "gold" : "", mark: 52 });
    }).join("");

  if (stage.kind === "mix") {

    return readout("混ぜた回数", `${s.stirs} / ${stage.stirs}`, s.stirs / stage.stirs * 100)

  });
  if (stage.kind === "cut") updateAction("cut", s.complete || !!s.cutUntil);
  if (stage.kind === "sear") s.pieces.forEach((piece, index) => {
    const caption = piece.removed ? "焼き上がり" : finishedPiece(piece) ? "取り出す" : "返す";
    updateAction(`piece-${index}`, s.complete || !piece.loaded || piece.removed || (!readyToFlip(piece) && !finishedPiece(piece)),
      `${index + 1}枚目 ${caption}`);
  });
  if (stage.kind === "mix") updateAction("stir", s.complete || !allLoaded());
  if (stage.kind === "fill") {
    updateAction("pour", s.complete || !allLoaded());
    updateAction("unfill", s.complete || !allLoaded() || s.water <= 0);
    updateAction("set-water", s.complete || !allLoaded() || s.water < 20);
  }
  if (stage.kind === "steam") updateAction("lid", s.complete || !allLoaded(), s.lid ? "ふたを開ける" : "ふたを閉める");
  if (stage.kind === "plate") updateAction("portion", s.complete || !!s.portion);
}
function stageComplete(quality) {
  const { s } = game;
  if (s.complete) return;
  s.complete = true;
  s.quality = Math.round(clamp(quality, 0, 100));
  game.grades.push(s.quality);
  s.heat = 0;
  playSound("done");
  syncHud();
  cue("工程完了", 1.1);
}
function acceptFood(index, point) {
  if (!canLoad(index)) return;
  const { stage, s } = game;
  const name = stage.load[index];
  s.added++;
  if (stage.kind === "sear") {
    s.pieces[index].loaded = true;
    sparkle(searPositions[index]);
    if (s.heat) sizzle();
  } else if (stage.kind === "plate") {
    s.garnishPoint = point ?? { x: s.portion.x + 22, y: s.portion.y - 19 };
    sparkle(s.garnishPoint, "#a6c36f");
    const placement = distance(s.portion, plateCenter);
    const garnishSpread = distance(s.garnishPoint, s.portion);
    stageComplete(100 - Math.max(0, placement - 24) * .52 - Math.max(0, garnishSpread - 63) * .44);
    return;
  } else {
    sparkle(point ?? potCenter);
  }
  if (stage.between === s.added) s.lockUntil = game.clock + 1.15;
  playSound("drop");
  cue(`${slotLabel(stage, name, index)}を入れた`, .85);
  syncHud();
}
function slice(point, assist = false) {
  const { stage, s } = game;
  if (s.complete || s.cutUntil) return;
  const [item, amount] = stage.cuts[s.cutItem];
  const candidates = cutPositions(amount).flatMap((x, index) => s.cutMarks.has(index) ? [] : [{ x, index }]);
  const target = assist ? candidates[0] : candidates.reduce((best, current) =>
    Math.abs(point.x - current.x) < Math.abs(point.x - best.x) ? current : best
  );
  const error = assist ? 6 : Math.abs(point.x - target.x);
  if (!assist && (point.y < 114 || point.y > 330 || error > 34)) {
    cue("食材の点線に包丁を合わせよう");
    return;
  }
  s.cutMarks.add(target.index);
  s.cutGrades.push(error < 9 ? 100 : Math.max(55, 100 - (error - 8) * 1.7));
  sparkle({ x: target.x, y: clamp(point?.y ?? boardCenter.y, 150, 301) });
  playSound("cut");
  if (s.cutMarks.size === amount) {
    if (s.cutItem + 1 === stage.cuts.length) {
      stageComplete(s.cutGrades.reduce((sum, grade) => sum + grade, 0) / s.cutTotal);
    } else {
      s.cutUntil = game.clock + .38;
      cue(`${foods[item].name}を切った`, .82);
    }
  }
  syncHud();
}
function pieceAction(index) {
  const { s } = game;
  const piece = s.pieces[index];
  if (s.complete || !piece?.loaded || piece.removed) return;
  if (finishedPiece(piece)) {
    piece.removed = true;
    piece.grade = piece.faces.reduce((sum, value) => sum + Math.max(20, 100 - Math.max(0, value - 1.13) * 165), 0) / 2;
    sparkle(searPositions[index]);
    playSound("serve");
    if (s.pieces.every(item => item.removed)) {
      stageComplete(s.pieces.reduce((sum, item) => sum + item.grade, 0) / s.pieces.length);
    } else {
      cue(`${index + 1}枚目を取り出した`);
    }
  } else if (readyToFlip(piece)) {
    piece.side ^= 1;
    piece.flipAt = game.clock;
    sparkle(searPositions[index], "#f0a95e");
    playSound("turn");
  } else {
    cue("焼き色が付くまで少し待とう", .95);
  }
  syncHud();
}
function stir() {
  const { stage, s } = game;
  if (s.complete || !allLoaded()) return;
  s.stirs = Math.min(s.stirs + 1, stage.stirs);
  s.swirl += reducedMotion ? 0 : .37;
  s.stirring = 1;
  sparkle(potCenter, "#ffdfa3", .3);
  playSound("stir");
  syncHud();
}
function pour(amount) {
  if (game.stage.kind !== "fill" || !allLoaded() || game.s.complete) return;
  game.s.water = clamp(game.s.water + amount, 0, 100);
}
function endPour() {
  pourPointer = null;
  if (game?.s) game.s.pouring = false;
}
function adjustLid() {
  const { stage, s } = game;
  if (!allLoaded() || s.complete) {
    if (!s.complete) cue("先に具をのせよう");
    return;
  }
  if (!s.lid) {
    s.lid = true;
    playSound("drop");
  } else {
    s.lid = false;
    if (s.progress >= stage.hold) {
      stageComplete(100 - s.early * 8 - Math.max(0, s.over - 2.5) * 4);
    } else {
      s.early++;
      s.progress = Math.max(0, s.progress - .65);
      cue("もう少し加熱。ふたを閉め直そう");
    }
  }
  syncHud();
}
function portion(point = plateCenter) {
  const { s } = game;
  if (s.portion || s.complete) return;
  const offset = distance(point, plateCenter);
  const limit = 65;
  s.portion = offset <= limit ? point : {
    x: plateCenter.x + (point.x - plateCenter.x) * limit / offset,
    y: plateCenter.y + (point.y - plateCenter.y) * limit / offset
  };
  sparkle(s.portion, "#fff5dc");
  playSound("serve");
  cue("お皿によそった");
  syncHud();
}

function stepSimulation(dt) {
  const { s, stage } = game;
  if (s.complete) return;
  if (s.cutUntil && game.clock >= s.cutUntil) {
    s.cutUntil = 0;
    s.cutItem++;
    s.cutMarks.clear();
    syncHud();
  }
  if (stage.kind === "sear") {
    for (const piece of s.pieces) {
      if (piece.loaded && !piece.removed) piece.faces[piece.side] = Math.min(1.62, piece.faces[piece.side] + heatingRates[s.heat] * dt);
    }
  } else if (stage.kind === "mix") {
    s.stirring = Math.max(0, s.stirring - dt * 1.9);
    if (!reducedMotion) s.swirl += s.stirring * dt * .76;
    if (allLoaded()) {
      if (s.heat === stage.heat) s.progress += dt;
      else if (s.heat) s.badHeat += dt * (s.heat > stage.heat ? 1.4 : .8);
      if (s.progress >= stage.hold && s.stirs >= stage.stirs) stageComplete(100 - Math.min(44, s.badHeat * 5));
    }
  } else if (stage.kind === "fill" && s.pouring) {
    pour(30 * dt);
  } else if (stage.kind === "steam" && s.lid) {
    if (s.progress < stage.hold) {
      s.progress += dt;
      if (s.progress >= stage.hold) {
        cue(stage.cooker ? "炊き上がり！ふたを開けよう" : "蒸し上がり！ふたを開けよう", 2);
        playSound("warm");
      }
    } else if (!stage.cooker) {
      s.over += dt;
    }
  }
}

function pointOnCanvas(event) {
  const rect = canvas.getBoundingClientRect();
  return { x: (event.clientX - rect.left) * W / rect.width, y: (event.clientY - rect.top) * H / rect.height };
}
function inside(point, center, rx, ry = rx) {
  return Math.hypot((point.x - center.x) / rx, (point.y - center.y) / ry) <= 1;
}
canvas.addEventListener("pointerdown", event => {
  if (gesture || event.button !== 0 || game.s.complete) return;
  const point = pointOnCanvas(event);
  gesture = { id: event.pointerId, stage: game.s, start: point, point, moved: false, travel: 0 };
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener("pointermove", event => {
  if (gesture?.id !== event.pointerId || gesture.stage !== game.s) return;
  const point = pointOnCanvas(event);
  if (distance(point, gesture.start) > 20) gesture.moved = true;
  if (game.stage.kind === "mix" && allLoaded() && inside(point, potCenter, 142, 128) && inside(gesture.point, potCenter, 142, 128)) {
    gesture.travel += Math.min(52, distance(gesture.point, point));
    if (gesture.travel >= 125) {
      gesture.travel -= 125;
      stir();
    }
  }
  gesture.point = point;
});
canvas.addEventListener("pointerup", event => {
  if (gesture?.id !== event.pointerId || gesture.stage !== game.s) return;
  const { start, moved } = gesture;
  const point = pointOnCanvas(event);
  const { stage, s } = game;
  gesture = null;
  if (stage.kind === "cut") {
    if (!moved) slice(point);
    else if (Math.abs(point.y - start.y) > 47 && Math.abs(point.x - start.x) < 135) {
      slice({ x: (point.x + start.x) / 2, y: (point.y + start.y) / 2 });
    }
  } else if (stage.kind === "sear") {
    const candidates = searPositions.map((at, index) => ({ index, gap: distance(at, point) }))
      .filter(({ index }) => s.pieces[index]?.loaded && !s.pieces[index].removed);
    candidates.sort((a, b) => a.gap - b.gap);
    if (candidates[0]?.gap < 85) pieceAction(candidates[0].index);
  } else if (stage.kind === "mix" && !moved && inside(point, potCenter, 142, 128)) {
    stir();
  } else if (stage.kind === "fill" && !moved && inside(point, potCenter, 137, 122)) {
    pour(5);
    syncHud();
  } else if (stage.kind === "steam" && !moved && inside(point, potCenter, 152, 139)) {
    adjustLid();
  } else if (stage.kind === "plate" && !s.portion && inside(start, servingPan, 118, 102)) {
    if (inside(point, plateCenter, 154, 137)) portion(point);
    else if (!moved) portion();
    else cue("お皿の上まで運ぼう");
  }
});
canvas.addEventListener("pointercancel", event => {
  if (gesture?.id === event.pointerId) gesture = null;
});
canvas.addEventListener("keydown", event => {
  if (event.key !== " " && event.key !== "Enter") return;
  event.preventDefault();
  const type = game.stage.kind;
  if (type === "cut") slice(null, true);
  else if (type === "mix") stir();
  else if (type === "steam") adjustLid();
  else if (type === "plate") portion();
});

function resetDrag() {
  trayDrag = null;
  ui["drag-ghost"].hidden = true;
}
ui.tray.addEventListener("pointerdown", event => {
  const button = event.target.closest("[data-slot]");
  if (!button || button.disabled || trayDrag || event.button !== 0) return;
  trayDrag = { id: event.pointerId, slot: Number(button.dataset.slot), x: event.clientX, y: event.clientY, moved: false };
  button.setPointerCapture(event.pointerId);
});
ui.tray.addEventListener("pointermove", event => {
  if (trayDrag?.id !== event.pointerId) return;
  if (!trayDrag.moved && Math.hypot(event.clientX - trayDrag.x, event.clientY - trayDrag.y) > 12) {
    const food = game.stage.load[trayDrag.slot];
    trayDrag.moved = true;
    ui["drag-ghost"].innerHTML = `${ingredientThumb(food)}<span>${foods[food].name}</span>`;
    ui["drag-ghost"].hidden = false;
  }
  if (trayDrag.moved) {
    ui["drag-ghost"].style.left = `${event.clientX}px`;
    ui["drag-ghost"].style.top = `${event.clientY}px`;
  }
});
ui.tray.addEventListener("pointerup", event => {
  if (trayDrag?.id !== event.pointerId) return;
  const { moved, slot } = trayDrag;
  resetDrag();
  if (!moved) {
    acceptFood(slot);
    return;
  }
  const point = pointOnCanvas(event);
  const isPlate = game.stage.kind === "plate";
  const center = isPlate ? plateCenter : potCenter;
  if (inside(point, center, 169, 151)) acceptFood(slot, point);
  else cue(isPlate ? "お皿の上へ運ぼう" : "フライパンか鍋の中へ運ぼう");
});
ui.tray.addEventListener("pointercancel", event => {
  if (trayDrag?.id === event.pointerId) resetDrag();
});
ui.actions.addEventListener("pointerdown", event => {
  const button = event.target.closest('[data-action="pour"]');
  if (!button || button.disabled || pourPointer != null || event.button !== 0) return;
  pourPointer = event.pointerId;
  button.setPointerCapture(event.pointerId);
  game.s.pouring = true;
  pour(4);
  playSound("water");
  syncHud();
});
for (const name of ["pointerup", "pointercancel", "lostpointercapture"]) {
  ui.actions.addEventListener(name, event => {
    if (pourPointer === event.pointerId) endPour();
  });
}
document.addEventListener("pointerdown", unlockAudio);
document.addEventListener("keydown", unlockAudio);
document.addEventListener("click", event => {
  const tile = event.target.closest("[data-slot]");
  if (tile && event.detail === 0) {
    acceptFood(Number(tile.dataset.slot));
    return;
  }
  const button = event.target.closest("button[data-action]");
  if (!button || button.disabled) return;
  const { action, heat, dish } = button.dataset;
  if (action === "menu") {
    resetDrag();
    endPour();
    gesture = null;
    renderMenu();
    if (!ui["dish-menu"].open) ui["dish-menu"].showModal();
  } else if (action === "close-menu") {
    ui["dish-menu"].close();
  } else if (action === "dish") {
    ui["dish-menu"].close();
    startDish(dishes.find(option => option.id === dish), true);
    window.scrollTo(0, 0);
  } else if (action === "restart") {
    startDish(game.dish);
    window.scrollTo(0, 0);
  } else if (action === "sound") {
    settings.sound = !settings.sound;
    saveSettings();
    renderSound();
    unlockAudio();
    playSound("warm");
  } else if (action === "next" && game.s.complete) {
    if (game.index + 1 === game.dish.stages.length) finishDish();
    else {
      createStage(game.index + 1);
      canvas.focus({ preventScroll: true });
      if (innerWidth <= 720) window.scrollTo(0, 0);
    }
  } else if (!game.s.complete) {
    if (action === "heat") {
      const setting = Number(heat);
      if (setting > 0 && !game.s.heat && game.s.added) sizzle();
      game.s.heat = setting;
    }
    else if (action === "cut") slice(null, true);
    else if (action.startsWith("piece-")) pieceAction(Number(action.slice(6)));
    else if (action === "stir") stir();
    else if (action === "pour" && event.detail === 0) {
      pour(5);
      playSound("water");
    } else if (action === "unfill") pour(-5);
    else if (action === "set-water") stageComplete(100 - Math.max(0, Math.abs(game.s.water - game.stage.mark) - 2) * 1.8);
    else if (action === "lid") adjustLid();
    else if (action === "portion") portion();
    syncHud();
  }
});

document.addEventListener("visibilitychange", () => {
  gesture = null;
  resetDrag();
  endPour();
  previous = 0;
});
let lastHud = 0;
let lastPaint = 0;
function frame(time) {
  const dt = previous ? Math.min(.5, (time - previous) / 1000) : 0;
  previous = time;
  if (!document.hidden && !ui["dish-menu"].open && !game.finished) {
    game.clock += dt;
    stepSimulation(dt);
    game.effects = game.effects.filter(effect => game.clock - effect.time < effect.duration);
    if (noticeClock && game.clock >= noticeClock) {
      ui["scene-note"].hidden = true;
      noticeClock = 0;
    }
    if (time - lastPaint >= 31) {
      paint(game);
      lastPaint = time;
    }
    if (time - lastHud > 125) {
      syncHud();
      lastHud = time;
    }
  }
  requestAnimationFrame(frame);
}
const linkedDish = location.hash.split("/")[1];
const chosenDish = dishes.find(dish => dish.id === linkedDish) ?? dishes[0];
renderSound();
startDish(chosenDish);
requestAnimationFrame(frame);
  </script>
</body>

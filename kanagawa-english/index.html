<style>
:root{--paper:#f4f1ea;--ink:#15121b;--red:#f34225;--gold:#ffcf22;--muted:#625f67;--green:#148455;--blue:#215bd8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-weight:700}body{background-image:radial-gradient(#15121b14 .8px,transparent .8px);background-size:6px 6px}button,select,textarea,input{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}button:disabled{cursor:default}a{color:var(--ink)}[hidden]{display:none!important}.wrap{max-width:520px;margin:auto;padding:15px 15px max(32px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:10px}.top a{text-decoration:none}.pill{border:2px solid var(--ink);padding:6px 9px;background:white}.kicker{font-size:12px;background:var(--ink);color:white;display:inline-block;padding:5px 10px;letter-spacing:.12em;transform:skewX(-8deg)}.hero{text-align:center;padding:15px 0 2px}.logo{font-size:clamp(42px,12.8vw,73px);letter-spacing:-.09em;line-height:1.06;font-style:italic;font-weight:1000;transform:rotate(-4deg);margin:13px 0;text-shadow:3px 3px white}.logo em{font-style:normal;color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px var(--ink)}.subtitle{font-size:14px;margin:8px 0 14px}.card{background:white;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:14px;margin:16px 0}.section-label{font-size:12px;font-weight:1000;letter-spacing:.09em;margin:3px 0 8px}.muted{color:var(--muted)}.mini{font-size:11px;line-height:1.6;color:var(--muted)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tab,.chip{background:var(--paper);border:2px solid var(--ink);padding:9px 8px;font-weight:900;box-shadow:2px 2px 0 var(--ink)}.tab[aria-pressed=true],.chip[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:2px 2px 0 var(--red)}.tab{font-size:16px}.tab small{display:block;font-size:10px;opacity:.8}.choices-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.count-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.count-grid .chip{padding:9px 1px;font-size:13px}.cta{display:block;width:100%;padding:15px 8px;background:var(--ink);color:white;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--red);font-size:22px;font-weight:1000;letter-spacing:.05em;margin:12px 0}.cta:active,.choice:active,.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}.cta.secondary{background:var(--gold);color:var(--ink);box-shadow:4px 4px 0 var(--ink)}.btn{background:white;border:2px solid var(--ink);padding:9px 12px;font-size:14px;font-weight:900}.line{border:0;border-top:2px solid #dfdad3;margin:13px 0}.stats{display:flex;justify-content:space-between;align-items:center;gap:7px;font-size:12px}.stats strong{font-size:19px}.bar{height:12px;border:2px solid var(--ink);background:#fff;margin:9px 0 14px}.bar>div{height:100%;background:repeating-linear-gradient(120deg,var(--red) 0 13px,var(--gold) 13px 20px);transition:width .18s}.prompt-k{font-size:11px;letter-spacing:.1em;color:var(--muted)}.prompt{font-size:clamp(19px,5vw,25px);font-weight:1000;line-height:1.53;white-space:pre-line;overflow-wrap:anywhere;margin:10px 0 12px}.eng{font-family:Arial,"Hiragino Sans",sans-serif;font-size:1.03em}.context{background:#fff9e7;border:2px solid var(--ink);padding:11px;font-size:15px;line-height:1.65;white-space:pre-line;font-weight:600;margin:10px 0}.question-options{display:grid;gap:8px}.choice{display:flex;align-items:flex-start;gap:10px;width:100%;border:2.5px solid var(--ink);padding:12px;text-align:left;background:white;min-height:49px;box-shadow:2px 2px 0 var(--ink);font-size:16px;line-height:1.4;overflow-wrap:anywhere}.choice .number{display:grid;place-items:center;flex:none;width:27px;height:27px;background:var(--ink);color:white;font-size:12px}.choice.correct{background:#d9f3d8;border-color:#0d724c}.choice.correct .number{background:#0d724c}.choice.incorrect{background:#ffe4df;border-color:var(--red)}.choice.incorrect .number{background:var(--red)}.choice:disabled{opacity:1;color:inherit}.feedback{border:3px solid var(--ink);padding:12px;margin:14px 0;background:#fff;line-height:1.6}.feedback.ok{box-shadow:4px 4px var(--green)}.feedback.ng{box-shadow:4px 4px var(--red)}.verdict{font-size:23px;font-weight:1000;color:var(--red);line-height:1.25}.feedback.ok .verdict{color:var(--green)}.feedback p{font-size:14px;margin:7px 0 0;white-space:pre-line;font-weight:650}.source{font-size:11px;color:var(--muted);line-height:1.6;margin-top:10px}.nav{display:flex;gap:8px;margin-top:13px;align-items:center}.nav>*{flex:1}.nav .cta{font-size:17px;box-shadow:3px 3px 0 var(--red);margin:0;padding:10px}.word-grid{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.word{padding:9px 11px;background:white;border:2px solid var(--ink);box-shadow:2px 2px var(--ink);min-height:44px;font-weight:800}.word.placed{background:var(--gold);box-shadow:none}.answer-zone{min-height:65px;border:2.5px dashed var(--ink);background:#fff9e7;padding:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}.listen{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;font-size:17px;background:var(--gold);border:3px solid var(--ink);padding:13px}.write{width:100%;min-height:95px;border:2px solid var(--ink);padding:12px;font-size:17px;font-weight:600;line-height:1.6;resize:vertical}.pdf-links{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pdf-links a{display:inline-block;border:2px solid var(--ink);background:#fff;padding:8px 9px;text-decoration:none;font-size:12px}.exam-box{background:var(--gold);border:3px solid var(--ink);padding:10px;box-shadow:3px 3px var(--ink);font-size:13px;line-height:1.6;margin:10px 0}.answer-number{font-size:28px;font-weight:1000;margin:7px 0}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pairs label{display:block;font-size:12px}.pairs select{width:100%;background:white;border:2px solid var(--ink);padding:10px;font-size:18px}.review-block{background:white;border:2px solid var(--ink);padding:10px;margin:8px 0;line-height:1.6;font-size:13px}.review-block b{color:var(--red)}.tag{display:inline-block;background:#e9e7e4;padding:4px 7px;font-size:11px}.score-num{font-size:60px;font-weight:1000;letter-spacing:-.06em;line-height:1.2;color:var(--red)}.center{text-align:center}.foot{font-size:11px;line-height:1.65;color:var(--muted);margin-top:24px;text-align:center}.foot a{color:inherit}.skip{border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;padding:10px}.sticker{display:inline-block;transform:rotate(-6deg);background:var(--gold);border:2px solid var(--ink);padding:5px 10px;font-size:13px} .small-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px} @media(max-width:375px){.wrap{padding-left:11px;padding-right:11px}.card{padding:11px}.choices-grid{gap:6px}.chip{font-size:12px;padding:8px 3px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body><div id="app" class="wrap"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const labels={all:'ぜんぶ',vocab:'単語',grammar:'文法',order:'並べ替え',listening:'リスニング',reading:'長文',data:'資料読解',writing:'英作文'};
const official={2026:{page:'https://www.pref.kanagawa.jp/docs/dc4/nyusen/nyusen/gakuryokukensa/r8.html',pdf:'https://www.pref.kanagawa.jp/documents/131902/1_r8eigo_zen_mon.pdf',key:'https://www.pref.kanagawa.jp/documents/131902/1_r8eigo_zen_sei.pdf'},2025:{page:'https://www.pref.kanagawa.jp/docs/dc4/nyusen/nyusen/gakuryokukensa/r7.html',pdf:'https://www.pref.kanagawa.jp/documents/118043/1_r7eigo_zen_mon.pdf',key:'https://www.pref.kanagawa.jp/documents/118043/1_r7eigo_zen_sei.pdf'},2024:{page:'https://www.pref.kanagawa.jp/docs/dc4/nyusen/nyusen/gakuryokukensa/r6.html',pdf:'https://www.pref.kanagawa.jp/documents/107635/r6eigo_zen_mon.pdf',key:'https://www.pref.kanagawa.jp/documents/107635/r6eigo_zen_sei.pdf'}};
const practice=[];let serial=0;
function mc(cat,question,choices,answer,explain,context='',why=''){practice.push({id:'d'+(++serial),cat,type:'mc',question,choices,answer,explain,context,why})}
function O(question,correct,unused,explain){practice.push({id:'d'+(++serial),cat:'order',type:'order',question,correct,words:[...correct,unused],explain})}
function W(question,sample,check,context=''){practice.push({id:'d'+(++serial),cat:'writing',type:'writing',question,sample,check,context})}
function L(spoken,question,choices,answer,explain){practice.push({id:'d'+(++serial),cat:'listening',type:'mc',spoken,question,choices,answer,explain})}
function R(cat,context,question,choices,answer,explain){mc(cat,question,choices,answer,explain,context)}
// 語彙。すべて本アプリ用に作成した練習問題
mc('vocab','Please (    ) the door when you leave.',['close','grow','carry','save'],0,'leave（去る）と一緒に使うのは close the door（ドアを閉める）。','', 'grow＝育つ、carry＝運ぶ、save＝節約する・救う。');
mc('vocab','She was (    ) because she won the speech contest.',['quiet','proud','empty','heavy'],1,'be proud（誇らしい）という感情表現。','', 'quiet＝静かな、empty＝空の、heavy＝重い。');
mc('vocab','The train was (    ) because of heavy snow.',['delayed','printed','invited','painted'],0,'雪のため電車が遅れたので delayed。','', 'printed＝印刷された、invited＝招待された、painted＝塗られた。');
mc('vocab','I want to (    ) this problem with my classmates.',['solve','wear','borrow','draw'],0,'solve a problem＝問題を解決する。','', 'wear＝着る、borrow＝借りる、draw＝描く。');
mc('vocab','We should (    ) the environment for the future.',['protect','spend','break','return'],0,'protect the environment＝環境を守る。','', 'spend＝使う、break＝壊す、return＝戻る。');
mc('vocab','The museum is (    ) on Mondays.',['closed','sweet','wide','brave'],0,'施設が休館・閉鎖している状態は closed。','', 'sweet＝甘い、wide＝広い、brave＝勇敢な。');
mc('vocab','This road is too (    ) for two large trucks.',['narrow','famous','honest','natural'],0,'トラック2台には道幅が狭い＝narrow。','', 'famous＝有名な、honest＝正直な、natural＝自然の。');
mc('vocab','The city will (    ) a new library next year.',['build','lose','miss','forget'],0,'build a library＝図書館を建設する。','', 'lose＝失う、miss＝逃す、forget＝忘れる。');
mc('vocab','Please (    ) your name at the top of this paper.',['write','catch','choose','rise'],0,'write your name＝名前を書く。','', 'catch＝つかむ、choose＝選ぶ、rise＝上がる。');
mc('vocab','Everyone was (    ) by the wonderful music.',['moved','fixed','sold','sent'],0,'be moved by＝～に感動する。','', 'fixed＝修理された、sold＝売られた、sent＝送られた。');
mc('vocab','Could you (    ) the meaning of this word?',['explain','arrive','receive','remain'],0,'explain the meaning＝意味を説明する。','', 'arrive＝到着する、receive＝受け取る、remain＝残る。');
mc('vocab','Many people (    ) this event every year.',['attend','invent','divide','belong'],0,'attend an event＝催しに参加する。','', 'invent＝発明する、divide＝分ける、belong＝所属する。');
mc('vocab','The students are doing a science (    ).',['experiment','direction','temperature','opinion'],0,'science experiment＝理科の実験。','', 'direction＝方向、temperature＝温度、opinion＝意見。');
mc('vocab','Our (    ) is to reduce plastic waste.',['goal','taste','height','noise'],0,'goal＝目標。reduce は「減らす」。','', 'taste＝味、height＝高さ、noise＝騒音。');
mc('vocab','I was (    ) to hear the surprising news.',['shocked','useful','local','common'],0,'be shocked to hear＝聞いて驚く。','', 'useful＝役立つ、local＝地元の、common＝一般的な。');
mc('vocab','The number of visitors has (    ) since last year.',['increased','thrown','hidden','fallen'],0,'has increased＝増えている。現在完了形の文。','', 'thrown＝投げた、hidden＝隠した、fallen＝落ちた（減少なら文脈が逆）。');
// 文法
mc('grammar','(    ) bag is this? — It is Yuki’s.',['Who','Whose','Where','How'],1,'所有者を尋ねる Whose + 名詞。','', 'Who＝誰、Where＝どこ、How＝どうやって。');
mc('grammar','A new sports center (    ) next year.',['builds','was built','will be built','building'],2,'来年に「建設される」ので未来の受け身 will be + 過去分詞。','', 'builds は能動、was built は過去、building はbe動詞がなく不完全。');
mc('grammar','I have lived in Yokohama (    ) five years.',['since','for','during','from'],1,'期間（five years）には for。起点（2021）には since。');
mc('grammar','My sister enjoys (    ) pictures.',['draw','drawing','drawn','to draw'],1,'enjoy の後は動名詞 -ing。enjoy drawing。');
mc('grammar','This book is not as (    ) as that one.',['more interesting','most interesting','interesting','interest'],2,'as + 形容詞の原級 + as の形。');
mc('grammar','If it rains tomorrow, we (    ) at home.',['stay','stayed','will stay','staying'],2,'条件の If 節は現在形、主節は will + 動詞の原形。');
mc('grammar','I do not know where he (    ).',['live','lives','living','does live'],1,'間接疑問文は「疑問詞＋主語＋動詞」。he lives が正しい。');
mc('grammar','The picture (    ) by my grandfather.',['painted','was painted','has painting','was paint'],1,'by～ があり「描かれた」受け身なので was painted。');
mc('grammar','I have never (    ) this movie.',['see','saw','seen','seeing'],2,'現在完了 have + 過去分詞 seen。');
mc('grammar','She speaks English (    ) than I do.',['good','best','well','better'],3,'than があるので比較級 better。well → better → best。');
mc('grammar','Could you tell me (    ) the station is?',['what','which','where','who'],2,'場所を尋ねるので where。語順は where the station is。');
mc('grammar','It is important for us (    ) water.',['save','saving','to save','saved'],2,'It is + 形容詞 + for 人 + to do の形。');
mc('grammar','The boy (    ) over there is my cousin.',['run','running','ran','runs'],1,'名詞 the boy を後ろから修飾する現在分詞 running。');
mc('grammar','I was (    ) when I heard the story.',['surprise','surprising','surprised','surprises'],2,'人が驚く＝surprised。驚かせる話・物＝surprising。');
mc('grammar','The homework must (    ) by Friday.',['finish','be finished','finished','finishing'],1,'助動詞＋受け身は must be + 過去分詞。');
mc('grammar','Do you have anything (    ) eat?',['at','for','to','by'],2,'anything to eat＝食べるもの。to不定詞が後置修飾。');
mc('grammar','She has (    ) finished her lunch.',['yet','already','ago','before'],1,'肯定文「もう終えた」は already。yet は疑問・否定文で多い。');
mc('grammar','(    ) you ever been to Kyoto?',['Did','Are','Have','Do'],2,'「行ったことがある」は Have you ever been to～?');
mc('grammar','I want a camera (    ) takes clear pictures.',['who','that','where','when'],1,'物 a camera を説明する主格関係代名詞 that。');
mc('grammar','He asked me (    ) I liked science.',['if','that','what','where'],0,'「～かどうか」は if / whether。');
mc('grammar','You should stop (    ) your phone while walking.',['use','used','using','to use'],2,'stop doing＝～するのをやめる。stop to do は「～するために立ち止まる」。');
mc('grammar','This is the (    ) interesting book I have read.',['more','much','most','many'],2,'the most interesting＝最も面白い。最上級。');
// 並べ替え。6語中5語を使う
O('5語を正しく並べよう。1語だけ使わない。',['Do','you','know','her','name'],'knows','疑問文 Do you know her name?。knows は主語 you に合わない。');
O('5語を正しく並べよう。1語だけ使わない。',['I','have','never','seen','snow'],'saw','現在完了 have never seen。saw は過去形。');
O('5語を正しく並べよう。1語だけ使わない。',['Tom','is','taller','than','Ken'],'tall','比較級 taller than。');
O('5語を正しく並べよう。1語だけ使わない。',['They','are','playing','soccer','now'],'played','現在進行形 are playing。');
O('5語を正しく並べよう。1語だけ使わない。',['The','book','was','written','yesterday'],'wrote','受け身 was written。');
O('5語を正しく並べよう。1語だけ使わない。',['How','long','have','you','waited'],'many','How long は期間。現在完了の疑問文。');
O('5語を正しく並べよう。1語だけ使わない。',['He','is','good','at','swimming'],'swim','be good at + 動名詞。');
O('5語を正しく並べよう。1語だけ使わない。',['This','is','the','best','answer'],'better','the best は最上級。');
O('5語を正しく並べよう。1語だけ使わない。',['Can','you','help','me','today'],'helps','Can の後は動詞の原形 help。');
O('5語を正しく並べよう。1語だけ使わない。',['I','want','to','visit','Kyoto'],'visiting','want to + 動詞の原形。');
O('5語を正しく並べよう。1語だけ使わない。',['She','has','already','finished','homework'],'finish','have + 過去分詞 finished。');
O('5語を正しく並べよう。1語だけ使わない。',['We','should','protect','our','planet'],'protected','should + 動詞の原形 protect。');
// 独自の合成音声問題
L('A: When will the school festival start? B: It will start at nine thirty on Saturday.','学校祭はいつ始まりますか？',['Friday at 9:30','Saturday at 9:30','Saturday at 10:30','Sunday at 9:30'],1,'Saturday / nine thirty を聞き取る。');
L('A: What are you going to bring? B: I will bring some drinks, but I cannot bring any food.','持っていくものは？',['Food only','Drinks only','Food and drinks','Nothing'],1,'drinks を持っていき、food は持っていけない。');
L('The museum opens at ten. Students can enter for three hundred yen, and adults pay five hundred yen.','生徒の入館料はいくらですか？',['100円','300円','500円','800円'],1,'students three hundred と adults five hundred を区別。');
L('A: How do you go to the station? B: I usually walk, but today I will take a bus because it is raining.','今日の移動手段は？',['Walking','Bicycle','Bus','Train'],2,'usually と today の違いを聞き取る。');
L('Our club meets on Tuesdays and Thursdays. Next week, Thursday is a holiday, so we will meet only on Tuesday.','来週はいつ活動しますか？',['火曜日だけ','木曜日だけ','両方','活動しない'],0,'通常と来週の予定を区別。');
L('A: Did you finish the book? B: Not yet. I have read eighty pages, and twenty pages are left.','本はあと何ページ？',['20ページ','40ページ','80ページ','100ページ'],0,'twenty pages are left＝20ページ残っている。');
L('We planned to play soccer outside, but the rain was too heavy. So we played a board game inside instead.','結局何をしましたか？',['サッカー','ボードゲーム','映画鑑賞','水泳'],1,'instead の後に実際に行った活動がある。');
L('Please come to the library before four p.m. The library will close thirty minutes earlier than usual today.','今日、図書館に来る時刻の条件は？',['午後4時より前','午後4時半より前','午後5時より前','午前4時より前'],0,'before four p.m.＝午後4時より前。');
// 読解
R('reading','Mina started keeping a small notebook. Every evening, she writes one new English word and a sentence using it. After two months, she found that she could understand more stories.','ミナは毎晩何をしていますか？',['新しい単語と例文を書く','英語の歌を聴く','先生に質問する','物語を日本語に訳す'],0,'Every evening, she writes... が根拠。');
R('reading','Ken wanted to join a science event. It was free, but he had to register by Friday. He sent an email on Thursday and got a confirmation message.','ケンについて正しいものは？',['参加費を支払った','金曜日の後に申し込んだ','締切までに登録した','まだメールを送っていない'],2,'締切は金曜日、メールは木曜日＝間に合っている。');
R('reading','A city library started lending tablets to students. A student may borrow one for seven days. The library asks students to return it before the next Monday if they borrow it on Tuesday.','火曜日に借りた生徒はどうしますか？',['次の日に返す','次の月曜日より前に返す','1か月使う','購入する'],1,'before the next Monday＝次の月曜日より前。');

function examQuestions(year){let k=examKeys[year],res=[];const kana=['ア','イ','ウ','エ','オ','カ'];function add(section,sub,n,ans,pts,max=4,page=4,type='exam'){res.push({id:'e'+year+'_'+section+'_'+sub+'_'+n,cat:section===1?'listening':section===2?'vocab':section===3?'grammar':section===4?'order':section===5?'writing':section===7?'data':'reading',type,section,label:'問'+section+' '+sub+(n?' No.'+n:''),answer:ans,points:pts,max,page,year})}
k.one.forEach((ans,i)=>add(1,i<3?'ア':i<5?'イ':'ウ',i<3?i+1:i<5?i-2:i-4,ans,3,(i===5||i===6)&&ans>4?6:i===6&&year===2026?6:4,i<5?2:3));
k.two.forEach((ans,i)=>add(2,kana[i],null,ans,2,4,4));
k.three.forEach((ans,i)=>add(3,kana[i],null,ans,year===2026?2:3,4,4));
k.four.forEach((ans,i)=>add(4,kana[i],null,ans,year===2026?3:4,6,5,'pair'));
add(5,'',null,k.five,5,0,6,'writing');
k.six.forEach((ans,i)=>add(6,i===0?'ア':'イ',i===0?null:i,k.six[i],5,ans>4?6:4,i===0?7:8));
k.seven.forEach((ans,i)=>add(7,kana[i],null,ans,5,6,year===2026?10:10));
k.eight.forEach((ans,i)=>add(8,kana[i],null,ans,year===2026&&i>1?3:5,ans>4?6:4,12));
return res}
const ST={mode:'drill',cat:'all',year:2026,scope:'all',count:10,missed:false,screen:'home',items:[],idx:0,answer:null,points:0,right:0,wrong:[],results:[],chosen:[],draft:'',self:null};

function button(action,txt,cls='',attr=''){return '<button type="button" class="'+cls+'" data-action="'+action+'" '+attr+'>'+txt+'</button>'}
function optsChip(action,value,label,pressed){return button(action,E(label),'chip','data-value="'+E(value)+'" aria-pressed="'+(pressed?'true':'false')+'"')}
function header(){return '<div class="top"><a href="../" aria-label="ポータルへ戻る">‹ まいにち道具箱</a><span class="pill">神奈川公立高校 英語 / v1.0</span></div>'}
function footer(){return '<div class="foot">本アプリは非公式の学習支援ツールです。練習問題・合成音声は独自作成。<br>実際の過去問は神奈川県教育委員会の公式資料を参照します。<br><a href="https://www.pref.kanagawa.jp/docs/dc4/nyusen/nyusen/gakuryokukensa/mondai.html" target="_blank" rel="noopener">神奈川県の過去問公開ページ</a></div>'}
function renderHome(){let n=ST.mode==='drill'?practice.filter(q=>ST.cat==='all'||q.cat===ST.cat).filter(q=>!ST.missed||wrongDB[q.id]).length:examQuestions(ST.year).filter(inScope).length;let totalWrong=Object.keys(wrongDB).filter(x=>wrongDB[x]).length;return header()+'<div class="hero"><div class="kicker">KANAGAWA HIGH SCHOOL ENTRANCE EXAM</div><div class="logo">英語<em>ドカン！</em></div><div class="subtitle">過去問を攻略。<strong>1問ずつ、サクサク。</strong></div><span class="sticker">50分・100点の入試対策</span></div><div class="card"><div class="tabs">'+button('mode','サク解きドリル<small>独自練習問題</small>','tab','data-value="drill" aria-pressed="'+(ST.mode==='drill')+'"')+button('mode','本物の過去問<small>公式PDFで実戦</small>','tab','data-value="exam" aria-pressed="'+(ST.mode==='exam')+'"')+'</div><hr class="line">'+(ST.mode==='drill'?'<div class="section-label">① 出題する分野</div><div class="choices-grid">'+Object.entries(labels).map(([id,lab])=>optsChip('cat',id,lab+(id==='all'?'':' <small></small>'),ST.cat===id)).join('')+'</div><p class="mini">単語・文法・並べ替え・英作文・長文・資料・音声の7分野。すべて独自作問です。</p><label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:12px 0"><input id="missedBox" data-action="missed" type="checkbox" '+(ST.missed?'checked':'')+' '+(!totalWrong?'disabled':'')+'> 苦手だけ出題（保存済み '+totalWrong+' 問）</label>':'<div class="section-label">① 年度を選ぶ</div><div class="choices-grid">'+[2026,2025,2024].map(y=>optsChip('year',y,y+'年度',ST.year===y)).join('')+'</div><div class="section-label" style="margin-top:14px">② 大問を選ぶ</div><div class="choices-grid">'+scopes.map(([id,label])=>optsChip('scope',id,label,ST.scope===id)).join('')+'</div><div class="exam-box">問題文は公式PDFを見ながら解答します。<strong>解答・採点はアプリ内</strong>。著作権上省略された図版・英文がある場合があります。</div><div class="pdf-links"><a href="'+official[ST.year].pdf+'" target="_blank" rel="noopener">📄 '+ST.year+'年度 問題PDF ↗</a><a href="'+official[ST.year].page+'" target="_blank" rel="noopener">🎧 県のリスニング音源 ↗</a></div>')+'<div class="section-label">'+(ST.mode==='drill'?'②':'③')+' 問題数を選ぶ</div><div class="count-grid">'+optionsCount.map(x=>optsChip('count',x,x,ST.count===x)).join('')+'</div><div class="mini" style="margin-top:8px">対象：'+n+'問　/　出題数：'+(ST.count==='全問'?n:Math.min(Number(ST.count),n))+'問</div>'+button('start',ST.mode==='drill'?'英語ドカン！ 開始':'本物の過去問に挑戦','cta',n?'':'disabled')+'</div><div class="card"><div class="section-label">学習記録</div><div class="stats"><span>これまでの挑戦 <strong>'+history.length+'</strong> 回</span><span>苦手登録 <strong>'+totalWrong+'</strong> 問</span></div><p class="mini">間違えた問題は端末内に記録。通信なしで練習問題を使えます（音声は端末の読み上げ機能を利用）。</p></div>'+footer()}
function inScope(q){let sc=ST.scope;return sc==='all'||(sc==='23'&&[2,3].includes(q.section))||(sc==='678'&&q.section>=6)||String(q.section)===sc}
function startGame(){let a=ST.mode==='drill'?practice.filter(q=>(ST.cat==='all'||q.cat===ST.cat)&&(!ST.missed||wrongDB[q.id])):examQuestions(ST.year).filter(inScope);if(ST.mode==='drill')a=rand(a);let cap=ST.count==='全問'?a.length:Math.min(Number(ST.count),a.length);ST.items=a.slice(0,cap).map(q=>({...q,display:q.type==='mc'?rand(q.choices.map((s,i)=>({s,i}))):q.type==='order'?rand(q.words.map((s,i)=>({s,i}))):null}));ST.screen='play';ST.idx=0;ST.answer=null;ST.points=0;ST.right=0;ST.wrong=[];ST.results=[];ST.chosen=[];ST.draft='';ST.self=null;render()}
function current(){return ST.items[ST.idx]}
function pdfBlock(q){let o=official[ST.year];return '<div class="exam-box">実際の問題文は下の公式PDFで確認してください。答えはこの画面で入力できます。<div class="pdf-links"><a href="'+o.pdf+'#page='+q.page+'" target="_blank" rel="noopener">📖 問題を開く（目安 '+q.page+'ページ） ↗</a><a href="'+o.page+'" target="_blank" rel="noopener">🎧 音源・台本 ↗</a></div></div>'}
function renderPlay(){let q=current(),i=ST.idx,percent=100*i/ST.items.length,isExam=ST.mode==='exam';let h=header()+'<div class="stats" style="margin-top:16px"><div><span class="muted">'+(isExam?ST.year+'年度 過去問':'英語ドカン！ ドリル')+'</span><br><strong>'+E(labels[q.cat])+'</strong></div><div><strong>'+(i+1)+' / '+ST.items.length+'</strong><div class="mini" style="text-align:right">'+(isExam?ST.points+' 点':'正解 '+ST.right+' 問')+'</div></div></div><div class="bar"><div style="width:'+percent+'%"></div></div><div class="card"><div class="prompt-k">'+(isExam?E(q.label):'QUESTION '+(i+1))+'　'+(isExam?'本試験の解答欄':'実戦形式の独自練習問題')+'</div>';
if(isExam){h+=pdfBlock(q)+'<div class="prompt">公式問題を見て、答えを選ぼう。</div>';if(q.type==='writing'){h+='<div class="context">問5：条件を満たす英作文を作りましょう。</div>';h+=renderWriting(q)}else if(q.type==='pair'){h+='<p class="mini">問4は「3番目」と「5番目」の番号が<strong>両方正解</strong>で得点。</p><div class="pairs"><label>3番目に来る語<select id="third"><option value="">選択</option>'+[1,2,3,4,5,6].map(x=>'<option value="'+x+'">'+x+'</option>').join('')+'</select></label><label>5番目に来る語<select id="fifth"><option value="">選択</option>'+[1,2,3,4,5,6].map(x=>'<option value="'+x+'">'+x+'</option>').join('')+'</select></label></div>'+(!ST.answer?button('checkPair','答え合わせ','cta secondary'):'')}else{h+=renderOptions(q)}}
else{if(q.context)h+='<div class="context eng">'+E(q.context)+'</div>';if(q.spoken){h+=button('speak','▶ 英語を聞く　（もう一度タップで再生）','listen')+'<p class="mini">※このドリル専用の合成音声。公式試験の音源ではありません。</p>'}h+='<div class="prompt eng">'+E(q.question)+'</div>';if(q.type==='order')h+=renderOrder(q);else if(q.type==='writing')h+=renderWriting(q);else h+=renderOptions(q)}
if(ST.answer){let correct=ST.answer.ok;h+='<div class="feedback '+(correct?'ok':'ng')+'" aria-live="polite"><div class="verdict">'+(correct?'正解！ ドカン！':'ここで覚えよう！')+'</div><p>'+E(ST.answer.message)+'</p>'+(ST.answer.detail?'<p>'+E(ST.answer.detail)+'</p>':'')+'</div><div class="nav">'+button('next',i===ST.items.length-1?'結果を見る →':'次の問題 →','cta')+'</div>'}else{h+='<div class="nav">'+button('skip','スキップ','skip')+'</div>'}h+='</div>'+footer();return h}
function renderOptions(q){let arr=ST.mode==='exam'?Array.from({length:q.max},(_,i)=>({s:String(i+1),i})):q.display;return '<div class="question-options">'+arr.map((op,j)=>{let sel=ST.answer&&ST.answer.chosen===op.i;let good=ST.answer&&op.i===q.answer;let cl='choice'+(good?' correct':sel?' incorrect':'');return button('pick','<span class="number">'+(j+1)+'</span><span>'+E(op.s)+'</span>',cl,'data-value="'+op.i+'" '+(ST.answer?'disabled':'') )}).join('')+'</div>'}
function renderOrder(q){let selected=new Set(ST.chosen);let h='<div class="section-label">並べた語（タップで取り消し）</div><div class="answer-zone">'+(ST.chosen.length?ST.chosen.map((ind,pos)=>button('undo',E(q.display.find(x=>x.i===ind).s),'word placed','data-value="'+pos+'" '+(ST.answer?'disabled':''))).join(''):'<span class="mini">下の語を左から順番にタップ</span>')+'</div><div class="section-label" style="margin-top:12px">残りの語</div><div class="word-grid">'+q.display.filter(op=>!selected.has(op.i)).map(op=>button('addWord',E(op.s),'word','data-value="'+op.i+'" '+(ST.answer?'disabled':''))).join('')+'</div>';if(!ST.answer&&ST.chosen.length===5)h+=button('checkOrder','この並びで答え合わせ','cta secondary');return h}
function renderWriting(q){let sample=ST.mode==='exam'?q.answer:q.sample;let cond=ST.mode==='exam'?examKeys[ST.year].write:q.check;return '<textarea id="writingInput" class="write eng" aria-label="英文を入力" placeholder="ここに英文を入力" '+(ST.self?'disabled':'')+'>'+E(ST.draft)+'</textarea>'+(!ST.self?button('showSample','模範解答と採点条件を見る','cta secondary'):'<div class="feedback"><div class="section-label">模範解答（他の正答もあります）</div><p class="eng">'+E(sample)+'</p><p>'+E(cond)+'</p><p class="mini">英作文は自由記述のため、自動採点ではありません。条件を見て自分で判定します。</p></div><div class="small-grid">'+button('selfGood','できた！','btn',''+(ST.answer?'disabled':''))+button('selfBad','もう一度練習','btn',''+(ST.answer?'disabled':''))+'</div>')}
function commit(ok,chosen,message,detail=''){if(ST.answer)return;let q=current();ST.answer={ok,chosen,message,detail};ST.results.push({q,ok,chosen,message,detail});if(ok){ST.right++;if(ST.mode==='exam')ST.points+=q.points;delete wrongDB[q.id]}else{ST.wrong.push(q);if(ST.mode==='drill')wrongDB[q.id]=true}store.save('kanagawa_en_wrong_v1',wrongDB);render()}
function selectChoice(idx){if(ST.answer)return;let q=current(),ok=idx===q.answer;let selected=ST.mode==='exam'?'選んだ番号：'+(idx+1):'選んだ答え：'+q.choices[idx];let right=ST.mode==='exam'?'正しい番号は '+q.answer+'。':'正答：'+q.choices[q.answer]+'。';let why=ST.mode==='exam'?'公式正答表に基づく採点です。本文・図版は公式問題PDFで確認してください。':q.explain+(ok?'':q.why?' \n他の選択肢：'+q.why:'');commit(ok,idx,(ok?'':selected+'　')+right,why)}
function checkPair(){if(ST.answer)return;let a=Number($('#third')?.value),b=Number($('#fifth')?.value),q=current();if(!a||!b)return;let ok=q.answer[0]===a&&q.answer[1]===b;commit(ok,[a,b],'3番目：'+q.answer[0]+'　／　5番目：'+q.answer[1]+' （'+q.points+'点）','両方が合っていると得点。実際の並びの理由は問題PDFと照らして確認。')}
function checkOrder(){let q=current();if(ST.chosen.length!==5||ST.answer)return;let got=ST.chosen.map(x=>q.display.find(o=>o.i===x).s);let ok=got.join('|')===q.correct.join('|');commit(ok,got,q.correct.join(' ')+'。',q.explain+'\n不要な語：'+q.words.find(x=>!q.correct.includes(x)))}
function advance(){if(ST.idx>=ST.items.length-1){finish();return}ST.idx++;ST.answer=null;ST.chosen=[];ST.draft='';ST.self=null;render()}
function finish(){ST.screen='result';history.unshift({when:new Date().toISOString(),mode:ST.mode,year:ST.year,score:ST.mode==='exam'?ST.points:ST.right,count:ST.items.length});history=history.slice(0,60);store.save('kanagawa_en_history_v1',history);render()}
function result(){let isExam=ST.mode==='exam',max=ST.items.reduce((s,x)=>s+(x.points||0),0),wrong=ST.results.filter(x=>!x.ok);return header()+'<div class="hero"><span class="kicker">RESULT</span><div class="logo">結果<em>ドカン！</em></div><div class="score-num">'+(isExam?ST.points+' / '+max:ST.right+' / '+ST.items.length)+'</div><p>'+ (isExam?'得点（選択した問題の満点 '+max+' 点）':'正解数')+'</p><span class="sticker">'+(ST.right===ST.items.length?'全問クリア！':'間違えた所が伸びしろ！')+'</span></div><div class="card"><div class="section-label">今回の復習</div>'+(wrong.length?wrong.map((r,i)=>'<div class="review-block"><b>'+E(r.q.label||labels[r.q.cat]+' / '+r.q.question)+'</b><br>'+E(r.message)+'<br>'+E(r.detail||'')+'</div>').join(''):'<p>全部正解です！</p>')+(ST.mode==='drill'&&wrong.length?button('retry','間違えた'+wrong.length+'問を解き直す','cta secondary'):'')+button('home','トップへ戻る','cta')+'</div>'+footer()}
function render(){if(ST.screen==='home')$('#app').innerHTML=renderHome();else if(ST.screen==='play')$('#app').innerHTML=renderPlay();else $('#app').innerHTML=result();window.scrollTo({top:0,behavior:'instant'})}
function speak(){let q=current();if(!q.spoken)return;if(!('speechSynthesis'in window)){alert('この端末では音声読み上げを利用できません');return}speechSynthesis.cancel();let ut=new SpeechSynthesisUtterance(q.spoken);ut.lang='en-US';ut.rate=.86;ut.pitch=1;let voices=speechSynthesis.getVoices(),en=voices.filter(v=>/^en-(US|GB)/.test(v.lang));if(en.length)ut.voice=en.find(v=>/enhanced|premium|samantha|ava|jenny/i.test(v.name))||en[0];speechSynthesis.speak(ut)}
document.addEventListener('click',e=>{let t=e.target.closest('[data-action]');if(!t||t.disabled)return;let a=t.dataset.action,v=t.dataset.value;
if(a==='mode'){ST.mode=v;ST.missed=false}
else if(a==='cat')ST.cat=v;
else if(a==='year')ST.year=Number(v);
else if(a==='scope')ST.scope=v;
else if(a==='count')ST.count=v==='全問'?v:Number(v);
else if(a==='start'){startGame();return}
else if(a==='pick'){selectChoice(Number(v));return}
else if(a==='checkPair'){checkPair();return}
else if(a==='addWord'){if(ST.chosen.length<5&&!ST.answer)ST.chosen.push(Number(v))}
else if(a==='undo'){if(!ST.answer)ST.chosen.splice(Number(v),1)}
else if(a==='checkOrder'){checkOrder();return}
else if(a==='speak'){speak();return}
else if(a==='showSample'){ST.draft=$('#writingInput')?.value||'';ST.self='shown'}
else if(a==='selfGood'||a==='selfBad'){commit(a==='selfGood',ST.draft,'模範解答を確認しました。','英作文は自己採点です。条件と語順を見直しましょう。');return}
else if(a==='next'){advance();return}
else if(a==='skip'){commit(false,null,'スキップしました。',ST.mode==='exam'?'公式問題・正答表で復習してください。':'正解：'+(current().type==='order'?current().correct.join(' '):current().type==='writing'?current().sample:current().choices[current().answer])+'。 '+(current().explain||''));return}
else if(a==='retry'){let arr=ST.wrong.slice();ST.items=rand(arr).map(q=>({...q,display:q.type==='mc'?rand(q.choices.map((s,i)=>({s,i}))):q.type==='order'?rand(q.words.map((s,i)=>({s,i}))):null}));ST.idx=0;ST.right=0;ST.points=0;ST.wrong=[];ST.results=[];ST.answer=null;ST.chosen=[];ST.draft='';ST.self=null;ST.screen='play';render();return}
else if(a==='home'){ST.screen='home';ST.answer=null;ST.self=null}
else return;
render()});
document.addEventListener('change',e=>{if(e.target.id==='missedBox'){ST.missed=e.target.checked;render()}});
render();
</script></body></html>
